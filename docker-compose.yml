# The Kubernetes cluster itself is exactly one service: k3s ships an official
# Docker image bundling the whole control plane + kubelet in a single
# privileged container ("cluster in a box"). This is what makes the whole
# setup portable to any machine with just Docker (+ helm/kubectl on the host)
# - no Colima-specific --kubernetes flag, no separately-installed kind/k3d
# CLI. ARC itself (controller + runner scale sets + ephemeral runner pods) is
# not more compose services - those are Kubernetes-native resources installed
# via Helm into this cluster, see bootstrap.sh.
#
# The second service, `heartbeat`, is the fleet-health reporter: it checks the k3s node + ARC controller and refreshes a secret gist that ExaDev/runner-fallback-action reads to decide self-hosted vs ubuntu-latest. It uses host networking so it can reach k3s's API at 127.0.0.1 (already in k3s's serving cert) with no TLS-SAN or kubeconfig gymnastics - and no launchd / external scheduler, so the whole fleet + its health reporter come up from one `docker compose up`.
#
# Two hosts, two roles, selected via Compose profiles rather than two separate compose files: the primary host (`docker compose --profile primary up -d`) runs `k3s` (server), `heartbeat`, and every org's ARC controller/runner scale set; a second host (`docker compose --profile agent up -d`) runs only `k3s-agent`, joining the primary's cluster as a worker so its own CPU/RAM become schedulable for runner pods too, with no second control plane and no duplicated heartbeat. See the project README's Architecture section for why a genuine multi-node HA control plane isn't attempted here (a 2-node embedded-etcd quorum is worse than 1 node, not better) - this is purely about spreading runner-pod capacity across both machines, not about surviving either one's loss.
services:
  k3s:
    image: "rancher/k3s:${K3S_VERSION:-latest}"
    # Delete any stale kubeconfig before starting, then exec k3s. k3s can't overwrite an existing /output/kubeconfig.yaml through Colima's macOS share (the file ends up owner-read-only with container-root mapped to the Mac user), which would crash-loop "permission denied" on every restart (e.g. a Mac reboot). Removing it first lets k3s recreate it cleanly each start. --tls-san is appended only when K3S_TLS_SAN is set (${VAR:+word} POSIX sh expansion): a second host joining as an agent connects to this server over its own externally-reachable address (e.g. a Tailscale MagicDNS name), which k3s's self-signed cert doesn't include by default - it auto-includes the container's own hostname/IPs and localhost only. A primary with no agent ever joining it can leave K3S_TLS_SAN unset and this stays a no-op. --node-external-ip is the same deal for a completely different reason: with no agent ever joining, k3s auto-detects this container's own interface IP fine, but with two hosts, that auto-detected IP is each container's own internal Docker/Colima bridge address (e.g. 172.20.0.2), which is not reachable from the other physical machine at all - confirmed live, it broke the flannel VXLAN overlay (any pod-to-pod or pod-to-ClusterIP traffic that has to cross nodes, including every pod's own DNS lookup via CoreDNS) and the API server's own proxy to the other node's kubelet (logs/exec), while leaving ordinary job traffic looking fine since a job's own outbound HTTPS never needs the overlay at all. Deliberately --node-external-ip, not --node-ip: --node-ip requires the address to actually be bound to a local interface inside the container (k3s validates this and fatally refuses to start networking otherwise), and a host's Tailscale interface lives on the macOS host, never inside the container's own network namespace - confirmed live, --node-ip crashed k3s's own network policy controller outright ("failed to find interface with specified node ip"). --node-external-ip has no such validation, exactly the flag k3s provides for an externally-reachable address that isn't a local interface. Neither flag has a K3S_-prefixed env var equivalent (confirmed via `k3s server --help`), unlike most other settings here.
    entrypoint: ["/bin/sh", "-c", "rm -f /output/kubeconfig.yaml && exec /bin/k3s server --disable=traefik --write-kubeconfig-mode=6443 ${K3S_TLS_SAN:+--tls-san $K3S_TLS_SAN} ${K3S_NODE_EXTERNAL_IP:+--node-external-ip $K3S_NODE_EXTERNAL_IP}"]
    # Stable node name across container recreations. Without this k3s derives the node name from the container's hostname (its ID), so every recreate (e.g. on an image pull) would register a NEW node and leave the old one stale in etcd. Pinning it keeps `kubectl get nodes` to one entry.
    hostname: k3s-server
    container_name: github-runner-k3s
    privileged: true
    restart: unless-stopped
    profiles: ["primary"]
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - K3S_TOKEN=${K3S_TOKEN:?K3S_TOKEN must be set in .env - an arbitrary shared secret for node-join auth, unrelated to GitHub}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
      - K3S_TLS_SAN=${K3S_TLS_SAN:-}
      - K3S_NODE_EXTERNAL_IP=${K3S_NODE_EXTERNAL_IP:-}
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output
    ports:
      - "6443:6443"
      # 8472/udp: flannel's own VXLAN backend, needed for any cross-node pod-to-pod or pod-to-ClusterIP traffic once a second host joins as an agent - unpublished, that traffic (including every pod's own DNS lookup via CoreDNS) can never reach this container at all. 10250/tcp: kubelet, needed so the API server on the OTHER node (if this host is ever the agent instead) can proxy exec/logs to a pod scheduled here. Harmless to publish on both roles for the same reason K3S_TLS_SAN/K3S_NODE_EXTERNAL_IP are wired symmetrically - this fleet's own primary/agent roles have already swapped once.
      - "8472:8472/udp"
      - "10250:10250"

  k3s-agent:
    image: "rancher/k3s:${K3S_VERSION:-latest}"
    # Custom entrypoint now needed: --node-external-ip has no K3S_-prefixed env var equivalent (see the primary k3s service's own comment on this), so the base image's default CMD (["agent"], confirmed via `docker inspect`) can no longer be relied on alone once this needs to append a CLI flag conditionally.
    entrypoint: ["/bin/sh", "-c", "exec /bin/k3s agent ${K3S_NODE_EXTERNAL_IP:+--node-external-ip $K3S_NODE_EXTERNAL_IP}"]
    hostname: ${K3S_AGENT_NODE_NAME:-k3s-agent}
    container_name: github-runner-k3s-agent
    privileged: true
    restart: unless-stopped
    profiles: ["agent"]
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    # Not `:?required` for K3S_AGENT_SERVER_URL: docker compose validates every service's env interpolation up front regardless of which --profile is active, confirmed live - a required var on this agent-only service broke `docker compose --profile primary up` too, since the primary host's .env never sets it. The Ansible role's own fail-fast check on this host_var is the real enforcement instead.
    environment:
      - K3S_URL=${K3S_AGENT_SERVER_URL:-}
      - K3S_TOKEN=${K3S_TOKEN:?K3S_TOKEN must be set in .env - the same shared secret the primary's own K3S_TOKEN uses}
      - K3S_NODE_NAME=${K3S_AGENT_NODE_NAME:-k3s-agent}
      - K3S_NODE_EXTERNAL_IP=${K3S_NODE_EXTERNAL_IP:-}
    volumes:
      - k3s-agent-data:/var/lib/rancher/k3s
    ports:
      # Same reasoning as the primary k3s service's own ports - see that comment.
      - "8472:8472/udp"
      - "10250:10250"

  heartbeat:
    # Fleet-health reporter. Checks k3s + ARC and refreshes the secret gist.
    # Build context is the repo root so the Dockerfile can COPY scripts/ and
    # heartbeat/.
    build:
      context: .
      dockerfile: heartbeat/Dockerfile
    # Host networking: the container shares the host's network namespace, so
    # kubectl (with the host kubeconfig) reaches k3s's published 127.0.0.1:6443
    # directly - no TLS-SAN change to k3s's cert, no kubeconfig URL rewrite.
    network_mode: host
    restart: unless-stopped
    profiles: ["primary"]
    depends_on:
      - k3s
    # Not `:?required` for HEARTBEAT_GH_TOKEN/HEARTBEAT_GIST_ID: the same cross-profile interpolation problem as k3s-agent's K3S_AGENT_SERVER_URL above - an agent host's .env never sets these, and docker compose validates every service regardless of the active --profile. scripts/heartbeat.sh already has its own `:?required` check on both at runtime, so nothing here actually loses the fail-fast behaviour on the primary host.
    environment:
      - HEARTBEAT_GH_TOKEN=${HEARTBEAT_GH_TOKEN:-}
      - HEARTBEAT_GIST_ID=${HEARTBEAT_GIST_ID:-}
      - HEARTBEAT_WINDOW_SECONDS=${HEARTBEAT_WINDOW_SECONDS:-600}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-180}
    volumes:
      # The host kubeconfig k3s generates; loop.sh uses it as-is (127.0.0.1).
      - ./kubeconfig:/kubeconfig:ro

volumes:
  k3s-data: {}
  k3s-agent-data: {}
