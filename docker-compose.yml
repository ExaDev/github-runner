# The Kubernetes cluster itself is exactly one service: k3s ships an official
# Docker image bundling the whole control plane + kubelet in a single
# privileged container ("cluster in a box"). This is what makes the whole
# setup portable to any machine with just Docker (+ helm/kubectl on the host)
# - no Colima-specific --kubernetes flag, no separately-installed kind/k3d
# CLI. ARC itself (controller + runner scale sets + ephemeral runner pods) is
# not more compose services - those are Kubernetes-native resources installed
# via Helm into this cluster, see bootstrap.sh.
#
# The second service, `heartbeat`, is the fleet-health reporter: it checks the k3s node + ARC controller and refreshes a secret gist that ExaDev/runner-fallback-action reads to decide self-hosted vs ubuntu-latest. It uses host networking so it can reach k3s's API at 127.0.0.1 (already in k3s's serving cert) with no TLS-SAN or kubeconfig gymnastics - and no launchd / external scheduler, so the whole fleet + its health reporter come up from one `docker compose up`.
#
# Two hosts, two roles, selected via Compose profiles rather than two separate compose files: the primary host (`docker compose --profile primary up -d`) runs `k3s` (server), `heartbeat`, and every org's ARC controller/runner scale set; a second host (`docker compose --profile agent up -d`) runs only `k3s-agent`, joining the primary's cluster as a worker so its own CPU/RAM become schedulable for runner pods too, with no second control plane and no duplicated heartbeat. See the project README's Architecture section for why a genuine multi-node HA control plane isn't attempted here (a 2-node embedded-etcd quorum is worse than 1 node, not better) - this is purely about spreading runner-pod capacity across both machines, not about surviving either one's loss.
services:
  k3s:
    # Built locally (see k3s/Dockerfile), not the plain rancher/k3s image: k3s's own built-in --vpn-auth integration (below) needs the tailscale binaries actually present in the image, and the base image has no package manager at all to install them at runtime.
    build:
      context: ./k3s
      args:
        K3S_VERSION: "${K3S_VERSION:-latest}"
    # Starts tailscaled as a background daemon first (k3s's own vpn-auth integration only runs `tailscale up` - it does not start the daemon itself, confirmed live: without this, k3s fails outright with "tailscale up failed: ... it doesn't appear to be running"), waits for its control socket to actually exist, then execs k3s.
    #
    # --vpn-auth is k3s's own documented (if experimental) mechanism for running Tailscale INSIDE the cluster rather than depending on the host's own separate Tailscale client: each node's k3s process joins the tailnet as its own device, using flannel's native "tailscale" backend (not VXLAN at all) for pod traffic, and k3s auto-detects the resulting Tailscale IP for --node-ip with no manual IP configuration needed. This replaces an earlier, considerably hackier approach (--node-external-ip + --flannel-external-ip layered on the HOST's own already-running Tailscale, tunnelled through Docker's own UDP port-publishing) that turned out to need two nested tunnels for the same traffic and was correspondingly fragile.
    #
    # --disable-network-policy: this fleet has no use for Kubernetes NetworkPolicy at all, and kube-router's own enforcement chains sit directly in the FORWARD path every cross-node pod packet takes - removing a whole class of policy-chain interaction we don't need.
    #
    # --tls-san is appended only when K3S_TLS_SAN is set (${VAR:+word} POSIX sh expansion): an agent joins via this primary's own NEW Tailscale-assigned MagicDNS name (see K3S_TLS_SAN's own value in host_vars), which k3s's self-signed cert doesn't include by default.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/run/tailscale /var/lib/tailscale
        tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
        until [ -S /var/run/tailscale/tailscaled.sock ]; do sleep 0.5; done
        rm -f /output/kubeconfig.yaml
        exec /bin/k3s server --disable=traefik --disable-network-policy --write-kubeconfig-mode=6443 \
          --vpn-auth="name=tailscale,joinKey=$K3S_VPN_AUTH_JOIN_KEY" \
          ${K3S_TLS_SAN:+--tls-san $K3S_TLS_SAN}
    # Stable node name across container recreations. Without this k3s derives the node name from the container's hostname (its ID), so every recreate (e.g. on an image pull) would register a NEW node and leave the old one stale in etcd. Pinning it keeps `kubectl get nodes` to one entry. This is also the hostname Tailscale registers the container's own new device under, giving it a stable MagicDNS name too.
    hostname: k3s-server
    container_name: github-runner-k3s
    privileged: true
    restart: unless-stopped
    profiles: ["primary"]
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - K3S_TOKEN=${K3S_TOKEN:?K3S_TOKEN must be set in .env - an arbitrary shared secret for node-join auth, unrelated to GitHub}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
      - K3S_TLS_SAN=${K3S_TLS_SAN:-}
      - K3S_VPN_AUTH_JOIN_KEY=${K3S_VPN_AUTH_JOIN_KEY:?K3S_VPN_AUTH_JOIN_KEY must be set in .env - a reusable, pre-authorized Tailscale auth key (see README's Tailscale section for how it's provisioned)}
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      # Persists this container's own Tailscale device identity/keys across recreations - without this, every recreate would register a brand new device on the tailnet instead of reconnecting as the same one, since the join key is reusable by design.
      - k3s-tailscale-data:/var/lib/tailscale
      - ./kubeconfig:/output
    ports:
      - "6443:6443"
      # No 8472/udp or 10250/tcp published: Tailscale establishes outbound connections and NAT-traverses itself (DERP relay/STUN), so no inbound Docker port-forwarding is needed for cross-node traffic at all - confirmed live, unlike the VXLAN-over-Docker- port-publish approach this replaced.

  k3s-agent:
    build:
      context: ./k3s
      args:
        K3S_VERSION: "${K3S_VERSION:-latest}"
    # Same tailscaled-then-k3s startup as the primary k3s service - see that service's own comment for the full reasoning. --server points at the primary's own new Tailscale MagicDNS name (K3S_AGENT_SERVER_URL), not the host machine's own pre-existing Tailscale identity.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/run/tailscale /var/lib/tailscale
        tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
        until [ -S /var/run/tailscale/tailscaled.sock ]; do sleep 0.5; done
        exec /bin/k3s agent --vpn-auth="name=tailscale,joinKey=$K3S_VPN_AUTH_JOIN_KEY"
    hostname: ${K3S_AGENT_NODE_NAME:-k3s-agent}
    container_name: github-runner-k3s-agent
    privileged: true
    restart: unless-stopped
    profiles: ["agent"]
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    # Not `:?required` for K3S_AGENT_SERVER_URL: docker compose validates every service's env interpolation up front regardless of which --profile is active, confirmed live - a required var on this agent-only service broke `docker compose --profile primary up` too, since the primary host's .env never sets it. The Ansible role's own fail-fast check on this host_var is the real enforcement instead.
    environment:
      - K3S_URL=${K3S_AGENT_SERVER_URL:-}
      - K3S_TOKEN=${K3S_TOKEN:?K3S_TOKEN must be set in .env - the same shared secret the primary's own K3S_TOKEN uses}
      - K3S_NODE_NAME=${K3S_AGENT_NODE_NAME:-k3s-agent}
      - K3S_VPN_AUTH_JOIN_KEY=${K3S_VPN_AUTH_JOIN_KEY:?K3S_VPN_AUTH_JOIN_KEY must be set in .env - the same reusable, pre-authorized Tailscale auth key the primary's own K3S_VPN_AUTH_JOIN_KEY uses}
    volumes:
      - k3s-agent-data:/var/lib/rancher/k3s
      # Same reasoning as the primary k3s service's own tailscale volume.
      - k3s-agent-tailscale-data:/var/lib/tailscale

  heartbeat:
    # Fleet-health reporter. Checks k3s + ARC and refreshes the secret gist.
    # Build context is the repo root so the Dockerfile can COPY scripts/ and
    # heartbeat/.
    build:
      context: .
      dockerfile: heartbeat/Dockerfile
    # Host networking: the container shares the host's network namespace, so
    # kubectl (with the host kubeconfig) reaches k3s's published 127.0.0.1:6443
    # directly - no TLS-SAN change to k3s's cert, no kubeconfig URL rewrite.
    network_mode: host
    restart: unless-stopped
    profiles: ["primary"]
    depends_on:
      - k3s
    # Not `:?required` for HEARTBEAT_GH_TOKEN/HEARTBEAT_GIST_ID: the same cross-profile interpolation problem as k3s-agent's K3S_AGENT_SERVER_URL above - an agent host's .env never sets these, and docker compose validates every service regardless of the active --profile. scripts/heartbeat.sh already has its own `:?required` check on both at runtime, so nothing here actually loses the fail-fast behaviour on the primary host.
    environment:
      - HEARTBEAT_GH_TOKEN=${HEARTBEAT_GH_TOKEN:-}
      - HEARTBEAT_GIST_ID=${HEARTBEAT_GIST_ID:-}
      - HEARTBEAT_WINDOW_SECONDS=${HEARTBEAT_WINDOW_SECONDS:-600}
      - HEARTBEAT_INTERVAL_SECONDS=${HEARTBEAT_INTERVAL_SECONDS:-180}
    volumes:
      # The host kubeconfig k3s generates; loop.sh uses it as-is (127.0.0.1).
      - ./kubeconfig:/kubeconfig:ro

volumes:
  k3s-data: {}
  k3s-agent-data: {}
  k3s-tailscale-data: {}
  k3s-agent-tailscale-data: {}
