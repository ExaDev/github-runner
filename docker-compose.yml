# The Kubernetes cluster itself is exactly this one service: k3s ships an
# official Docker image bundling the whole control plane + kubelet in a
# single privileged container ("cluster in a box"). This is what makes the
# whole setup portable to any machine with just Docker (+ helm/kubectl on
# the host) - no Colima-specific --kubernetes flag, no separately-installed
# kind/k3d CLI. ARC itself (controller + runner scale sets + ephemeral
# runner pods) is not more compose services - those are Kubernetes-native
# resources installed via Helm into this cluster, see bootstrap.sh.
services:
  k3s:
    image: "rancher/k3s:${K3S_VERSION:-latest}"
    command: server --disable=traefik --write-kubeconfig-mode=644
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - K3S_TOKEN=${K3S_TOKEN:?K3S_TOKEN must be set in .env.arc - an arbitrary shared secret for node-join auth, unrelated to GitHub}
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./kubeconfig:/output
    ports:
      - "6443:6443"

volumes:
  k3s-data: {}
