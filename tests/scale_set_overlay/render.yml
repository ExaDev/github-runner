# Renders the github_runner_arc role's scale-set overlay (templates/scale-set-overlay.yaml.j2) for one expanded profile, with the role's defaults and constants, for tests/unit/test_scale_set_overlay.py to read back. Takes profile (an expanded profile from the arc_profiles filter) and overlay_output as extra variables; a role variable such as the eligibility label or github_runner_arc_measured_sizing is overridden with an extra variable of its own name, since the defaults file loaded here outranks play variables. Needs ANSIBLE_COLLECTIONS_PATH to include playbooks/collections, so the template finds this checkout's filters.
- name: Render the scale-set overlay
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/github_runner_arc/defaults/main.yml
    - ../../roles/github_runner_arc/vars/main.yml
  tasks:
    - name: Write the overlay
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/github_runner_arc/templates/scale-set-overlay.yaml.j2') }}"
        dest: "{{ overlay_output }}"
        mode: "0644"
