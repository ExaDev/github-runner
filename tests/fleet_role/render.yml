# Renders the github_runner_arc role's role controller manifests (templates/fleet-role.yaml.j2) with the role's defaults and constants, for tests/unit/test_fleet_role_arc.py. Takes fleet_role_output as an extra variable; a role variable such as the image or the target is overridden with an extra variable of its own name, since the defaults file loaded here outranks play variables.
- name: Render the role controller manifests
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/github_runner_arc/defaults/main.yml
    - ../../roles/github_runner_arc/vars/main.yml
  tasks:
    - name: Write the manifests
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', playbook_dir ~ '/../../roles/github_runner_arc/templates/fleet-role.yaml.j2') }}"
        dest: "{{ fleet_role_output }}"
        mode: "0644"
