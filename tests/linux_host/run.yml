---
# Runs the github_runner_linux_host role as site.yml includes it, for tests/unit/test_linux_host.py. The host's facts are stood in for by the extra variable host_system, and the systemctl, nmcli and iw the role calls are the test's stand-ins on PATH, so no real target, drop-in or radio is ever touched.
- name: Run the Linux host baseline role
  hosts: all
  connection: local
  gather_facts: false
  tasks:
    - name: Stand in for the host's facts
      ansible.builtin.set_fact:
        ansible_facts:
          system: "{{ host_system }}"

    - name: Include the role
      ansible.builtin.include_role:
        name: exadev.github_runner.github_runner_linux_host
