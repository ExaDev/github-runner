---
# Collection metadata for exadev.github_runner. The version stays 0.0.0 in source: the release process stamps the real version at publish time.
namespace: exadev
name: github_runner
version: 1.1.0
readme: README.md
authors:
  - ExaDev
description: Self-hosted GitHub Actions runners on k3s joined over Tailscale, using Actions Runner Controller.
license:
  - MIT
tags:
  - infrastructure
  - github
  - actions
  - runner
  - kubernetes
  - k3s
dependencies:
  kubernetes.core: ">=5.0.0"
  community.docker: ">=4.0.0"
  community.general: ">=9.0.0"
repository: https://github.com/ExaDev/github-runner
issues: https://github.com/ExaDev/github-runner/issues
# Everything that is not collection content: the runner and platform container images, Helm values, local inventory configuration, CI, the standalone bootstrap wrapper, and the Node-based release tooling (semantic-release, commitlint) that stamps this very file at release time. The k3s node's Compose file and image build context ship inside roles/github_runner_cluster/files, so they are collection content.
build_ignore:
  - .github
  - .dockerignore
  - .env*
  - .gitignore
  - .yamllint
  - AGENTS.md
  - CLAUDE.md
  - .ansible
  - .ansible-venv
  - ansible
  - playbooks/collections
  - autoscaler
  - heartbeat
  - pull-secret-renewer
  - scripts
  - Dockerfile
  - bootstrap.sh
  - kubeconfig
  - secrets
  - logs
  - "*.tar.gz"
  - node_modules
  - package.json
  - package-lock.json
  - .releaserc.json
  - commitlint.config.js
