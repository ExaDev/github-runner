---
# Three servers joining through a Headscale server someone else runs. The role reads its policy and fails, printing the JSON to add, until the policy defines the node tag and auto-approves the pod routes:
#   "tagOwners": {"tag:github-runner-node": []},
#   "autoApprovers": {"routes": {"10.42.0.0/16": ["tag:github-runner-node"]}}
# plus a grant between the tag and 10.42.0.0/16 in both directions for pod traffic. The Headscale API key comes from the 1Password item's headscale-api-key field; the role creates the join key itself and the adapter stores it in headscale-join-key. Without 1Password, set github_runner_cluster_headscale_api_key and either supply the join key or set github_runner_cluster_join_key_path for the role to keep one there.
all:
  vars:
    # Secrets from one 1Password item, through the adapter role playbooks/site.yml adds for this source. See examples/ansible-vault and examples/env for the same variables from other sources.
    github_runner_secrets_source: onepassword
    github_runner_secrets_onepassword_vault: Example
    github_runner_secrets_onepassword_item: github-runner
  children:
    github_runner_cluster:
      vars:
        github_runner_cluster_mesh: headscale_existing
        github_runner_cluster_headscale_url: https://headscale.example.com
        # Headscale's dns.base_domain on that server: every node's address is <node name>.<this domain>.
        github_runner_cluster_tailnet_domain: mesh.example.com
      hosts:
        node1:
          ansible_host: 100.64.0.1
          github_runner_cluster_repo_root: /srv/github-runner
        node2:
          ansible_host: 100.64.0.2
          github_runner_cluster_repo_root: /srv/github-runner
        node3:
          ansible_host: 100.64.0.3
          github_runner_cluster_repo_root: /srv/github-runner
