---
# A cluster with a native agent: the first three hosts are Docker nodes (servers, with Tailscale inside their containers), and laptop runs k3s directly under systemd as an agent, with its own Tailscale client as the node's device. See the cluster role's README, Native nodes. Run with: ansible-playbook -i examples/native-agent/inventory.yml exadev.github_runner.site --limit laptop --check   # then without --check
all:
  children:
    github_runner_cluster:
      vars:
        github_runner_cluster_tailnet_domain: example-tailnet.ts.net
        github_runner_secrets_source: onepassword
        github_runner_secrets_onepassword_vault: Example
        github_runner_secrets_onepassword_item: github-runner
      hosts:
        node1:
          ansible_host: node1.example.com
        node2:
          ansible_host: node2.example.com
        node3:
          ansible_host: node3.example.com
        laptop:
          # Reached by its LAN name, not over the tailnet: the host's Tailscale client is logged out of any other tailnet before k3s joins the cluster's, which would cut an SSH session over it.
          ansible_host: laptop.local
          github_runner_cluster_node_mode: native
          # The host is dedicated to the cluster, so the role may log its client out of the tailnet it was in.
          github_runner_cluster_native_tailscale_leave_other_tailnet: true
          # A laptop: do not let it suspend when the lid closes, and do not let its Wi-Fi power-save.
          github_runner_linux_host_keep_awake: true
          github_runner_linux_host_wifi_powersave_off: true
