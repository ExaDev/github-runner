name: build-runner-image

# Builds and pushes the custom ARC runner pod image. The obvious choice, GitHub-hosted ubuntu-latest, can't schedule for this org at all (see issue #10) - runs on the fleet's own dedicated exadev-image-builder scale-set profile instead (containerMode.type: dind, see values/exadev-runners-values-builder.yaml), not the ordinary exadev-runners label ordinary CI jobs use. This does carry a residual bootstrap risk the ubuntu-latest design was originally meant to avoid: if the currently-deployed image were ever broken badly enough to fail a job outright (e.g. its own Docker CLI missing), this workflow couldn't run to fix itself either. Recovering from that needs a manual `docker buildx build --platform linux/arm64,linux/amd64 --push` from a machine with buildx/QEMU support, same as the one-off push that originally unblocked this - see the README's Build/test/smoke-test section.
on:
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build-runner-image.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: exadev-image-builder
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          # Tagged by commit SHA alongside :latest, not :latest alone: ARC's ephemeral-pod-per-job model means a bad push only affects pods scheduled after it (in-flight jobs on already-running pods are unaffected), but without a SHA tag there was no way back to "the image from before this push" short of finding the last good commit and rebuilding it from scratch. Roll back via `helm upgrade`/the values file's own image override, promoting a SHA tag to :latest only once it's been verified.
          tags: |
            ghcr.io/exadev/github-runner:latest
            ghcr.io/exadev/github-runner:${{ github.sha }}
