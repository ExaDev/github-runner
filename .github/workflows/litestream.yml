name: Headscale Litestream

# Runs tests/litestream/run.sh: the headscale_hosted provider with Litestream and a warm standby against an S3-compatible store, a real Tailscale client, promotion of the standby, and the headscale_in_cluster guard. Only on changes that can affect them.
#
# Routes through ExaDev/runner-fallback-action like ci.yml, preferring the exadev-image-builder profile: the test needs a Docker daemon, which only that profile's Docker-in-Docker sidecar provides, and ubuntu-latest has one natively. The work directory sits under runner.temp because the DinD daemon resolves Compose bind mounts on its own filesystem, and only the runner's _work volume is shared with it.

on:
  pull_request:
    paths:
      - roles/github_runner_cluster/tasks/mesh/headscale_*.yml
      - roles/github_runner_cluster/tasks/headscale_promote.yml
      - roles/github_runner_cluster/templates/headscale/**
      - roles/github_runner_cluster/files/headscale/**
      - roles/github_runner_cluster/defaults/main.yml
      - playbooks/promote_headscale_standby.yml
      - tests/litestream/**
      - .github/workflows/litestream.yml
  workflow_dispatch:

concurrency:
  group: litestream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  determine-runner:
    name: Determine runner
    runs-on: exadev-runners
    timeout-minutes: 5
    outputs:
      selected-runner: ${{ steps.fallback.outputs.selected-runner || '["ubuntu-latest"]' }}
    steps:
      - id: fallback
        uses: ExaDev/runner-fallback-action@b774d51ff5360bf53705b2eb34ff019afd4d7f07
        with:
          preferred-labels: exadev-image-builder

  litestream:
    name: Litestream and standby promotion
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 30
    env:
      COMPOSE_VERSION: v5.5.1
    steps:
      - uses: actions/checkout@v7

      - name: Install Docker Compose if the runner lacks it
        # The fleet's runner image ships the Docker CLI and buildx but not the Compose plugin.
        run: |
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then
            docker compose version
            exit 0
          fi
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            aarch64 | arm64) arch=aarch64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "${HOME}/.docker/cli-plugins"
          base="https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-${arch}"
          curl -fsSL -o "${RUNNER_TEMP}/docker-compose" "$base"
          echo "$(curl -fsSL "${base}.sha256" | cut -d' ' -f1)  ${RUNNER_TEMP}/docker-compose" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/docker-compose" "${HOME}/.docker/cli-plugins/docker-compose"
          docker compose version

      - name: Install Ansible
        run: |
          set -euo pipefail
          if ! python3 -m venv "${RUNNER_TEMP}/venv" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-venv
            python3 -m venv "${RUNNER_TEMP}/venv"
          fi
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --prefer-binary ansible-core
          "${RUNNER_TEMP}/venv/bin/ansible-galaxy" collection install -r ansible/requirements.yml -p "${RUNNER_TEMP}/collections"
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"

      - name: Run the test
        env:
          GRTEST_WORK: ${{ runner.temp }}/grtest-ls
          GRTEST_EXTRA_COLLECTIONS: ${{ runner.temp }}/collections
        run: tests/litestream/run.sh

  required-checks:
    name: Headscale Litestream result
    needs: [determine-runner, litestream]
    if: always()
    # The ordinary pool, like determine-runner: this job only reads results.
    runs-on: exadev-runners
    timeout-minutes: 5
    steps:
      - name: Fail if the test failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "The test did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
