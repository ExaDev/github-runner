name: CI

# Lints every shell script, workflow file, YAML file, and Dockerfile in the repo. There is no application test suite here (this repo is fleet infrastructure config, not application code) - these checks are its actual verification surface, matching the README's Build/test/lint section.
#
# Runs on GitHub-hosted runners, which are free for a public repository, so the checks of the fleet's own configuration don't depend on the fleet being up. The fleet's own behaviour is tested by test-arc-runner.yml and test-autoscaler.yml, which target it directly.
#
# required-checks is the single required status check in this repo's ruleset (never the individual job names), so adding or renaming a lint job never needs a ruleset update - matching ExaDev/eslint-config and ExaDev/wire-mesh's own ci.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint every shell script
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          echo "Found ${#scripts[@]} shell script(s)."
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint every workflow file
        run: ./actionlint -color

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint every YAML file
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
          yamllint .

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install hadolint
        # Detect arch rather than assume amd64, so the step also works on an arm64 runner such as this project's own fleet. Downloads into the workspace (no sudo, no system path) - actions-runner pods run the workflow user without write access to /usr/local/bin.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) hadolint_arch=x86_64 ;;
            aarch64|arm64) hadolint_arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o ./hadolint "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-${hadolint_arch}"
          chmod +x ./hadolint
      - name: Lint every Dockerfile
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find . -type f -iname 'Dockerfile*' -not -path './.git/*')
          echo "Found ${#dockerfiles[@]} Dockerfile(s)."
          if [ "${#dockerfiles[@]}" -gt 0 ]; then
            # error threshold, not the default (info): this repo deliberately floats several base images/packages on `latest` rather than pinning (see e.g. ghcr.io/exadev/github-runner:latest, rancher/k3s:${K3S_VERSION:-latest}), so hadolint's warning-level pinning advice (DL3007/DL3008/DL3018) stays visible in the log without failing every run over an already-made, documented tradeoff.
            ./hadolint --failure-threshold error "${dockerfiles[@]}"
          fi

  ansible-syntax-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check every playbook
        # From ansible/ so its ansible.cfg applies, against an example inventory, since this repository carries no fleet's own. Every top-level playbook is checked, so a new one is covered without editing this list.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible
          cd ansible
          for playbook in ../playbooks/*.yml; do
            echo "Syntax-checking ${playbook}"
            ansible-playbook -i ../examples/three-server-tailscale/inventory.yml "${playbook}" --syntax-check
          done
      - name: Build the collection
        # Proves galaxy.yml's build_ignore still ships what the roles need at runtime, such as the k3s node's Compose file and build context under roles/github_runner_cluster/files.
        run: |
          set -euo pipefail
          ansible-galaxy collection build --output-path "${RUNNER_TEMP}/collection"
          tar -tzf "${RUNNER_TEMP}"/collection/*.tar.gz | grep -Fx roles/github_runner_cluster/files/docker-compose.yml
          tar -tzf "${RUNNER_TEMP}"/collection/*.tar.gz | grep -Fx roles/github_runner_cluster/files/k3s/node-entrypoint.sh
      - name: Unit-test the cluster role's server selection
        # Ubuntu's ansible package, installed above, puts ansible-core on the system Python the filter plugin imports from.
        run: python3 -m unittest discover -s tests/unit -v

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ansible-lint
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          python3 -m pip install --user --break-system-packages 'ansible-lint>=25'
          # pip --user puts the console script in ~/.local/bin, which isn't on the runner's PATH by default.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint the collection
        # playbooks/collections/ansible_collections/exadev/github_runner is a symlink back to this checkout's own root, for local FQCN resolution (see ansible/ansible.cfg's comment on roles_path). Excluding it stops ansible-lint's own directory walk from following that symlink back into the tree it is already linting, which otherwise relints the whole collection a second time under a growing path on every recursion.
        run: ansible-lint --profile production --exclude playbooks/collections

  required-checks:
    name: Required Checks
    needs: [shellcheck, actionlint, yamllint, hadolint, ansible-syntax-check, ansible-lint]
    # Always runs, even if a dependency failed or was skipped, so it can report that failure itself rather than being skipped - a required check that's silently absent blocks a PR indefinitely instead of failing it visibly.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
