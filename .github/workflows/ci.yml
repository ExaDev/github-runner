name: CI

# Lints every shell script, workflow file, YAML file, and Dockerfile in the repo. There is no application test suite here (this repo is fleet infrastructure config, not application code) - these checks are its actual verification surface, matching the README's Build/test/lint section.
#
# Dogfoods the fleet: every job after determine-runner routes through ExaDev/runner-fallback-action, preferring exadev-runners and falling back to ubuntu-latest only if the fleet's heartbeat gist reports it unhealthy (or the run is a fork PR / Dependabot - that guard lives inside the action). See the README's Heartbeat section for how the gist is kept fresh, and ExaDev/runner-fallback-action's own README for the routing design.
#
# determine-runner itself is deliberately anchored on exadev-runners directly, not ubuntu-latest as the action's README recommends as the general-purpose default: this is the fleet's own repo, and it should dogfood the fleet fully rather than hedge on it. This does forgo the fallback safety net for this one bootstrap job specifically - if the fleet is entirely down, determine-runner cannot schedule and cannot hand off to ubuntu-latest either - but that trade is the whole point here, not a workaround to revert later.
#
# required-checks is the single required status check in this repo's ruleset (never the individual job names), so adding or renaming a lint job never needs a ruleset update - matching ExaDev/eslint-config and ExaDev/wire-mesh's own ci.yml.
#
# The action is pinned to a commit SHA, not @main - bump deliberately when it changes. (b774d51 = the secret-gist redesign, the current HEAD of main as of the day this workflow was written.)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  determine-runner:
    name: Determine runner
    runs-on: exadev-runners
    timeout-minutes: 5
    outputs:
      selected-runner: ${{ steps.fallback.outputs.selected-runner || '["ubuntu-latest"]' }}
      preferred-available: ${{ steps.fallback.outputs.preferred-available || 'false' }}
    steps:
      - id: fallback
        uses: ExaDev/runner-fallback-action@b774d51ff5360bf53705b2eb34ff019afd4d7f07

  shellcheck:
    name: Shellcheck
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint every shell script
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*')
          echo "Found ${#scripts[@]} shell script(s)."
          if [ "${#scripts[@]}" -gt 0 ]; then
            shellcheck "${scripts[@]}"
          fi

  actionlint:
    name: actionlint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: Lint every workflow file
        run: ./actionlint -color

  yamllint:
    name: YAML lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint every YAML file
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq yamllint
          yamllint .

  hadolint:
    name: hadolint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install hadolint
        # Detect arch rather than assume amd64: exadev-runners pods are arm64 (the M3's own architecture), confirmed by a real CI run against this very workflow - an assumption that turned out wrong the first time it actually ran on the fleet instead of just being read as a comment. Downloads into the workspace (no sudo, no system path) - actions-runner pods run the workflow user without write access to /usr/local/bin.
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) hadolint_arch=x86_64 ;;
            aarch64|arm64) hadolint_arch=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o ./hadolint "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-${hadolint_arch}"
          chmod +x ./hadolint
      - name: Lint every Dockerfile
        run: |
          set -euo pipefail
          mapfile -t dockerfiles < <(find . -type f -iname 'Dockerfile*' -not -path './.git/*')
          echo "Found ${#dockerfiles[@]} Dockerfile(s)."
          if [ "${#dockerfiles[@]}" -gt 0 ]; then
            # error threshold, not the default (info): this repo deliberately floats several base images/packages on `latest` rather than pinning (see e.g. ghcr.io/exadev/github-runner:latest, rancher/k3s:${K3S_VERSION:-latest}), so hadolint's warning-level pinning advice (DL3007/DL3008/DL3018) stays visible in the log without failing every run over an already-made, documented tradeoff.
            ./hadolint --failure-threshold error "${dockerfiles[@]}"
          fi

  ansible-syntax-check:
    name: Ansible syntax check
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check every playbook
        # From ansible/ so its ansible.cfg (inventory, roles_path) applies, the same way an operator runs it. Every top-level playbook is checked, so a new one is covered without editing this list.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ansible
          cd ansible
          for playbook in ../playbooks/*.yml; do
            echo "Syntax-checking ${playbook}"
            ansible-playbook "${playbook}" --syntax-check
          done
      - name: Unit-test the cluster role's server selection
        # Ubuntu's ansible package, installed above, puts ansible-core on the system Python the filter plugin imports from.
        run: python3 -m unittest discover -s tests/unit -v

  ansible-lint:
    name: ansible-lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install ansible-lint
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip
          python3 -m pip install --user --break-system-packages 'ansible-lint>=25'
          # pip --user puts the console script in ~/.local/bin, which isn't on the runner's PATH by default.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint the collection
        # playbooks/collections/ansible_collections/exadev/github_runner is a symlink back to this checkout's own root, for local FQCN resolution (see ansible/ansible.cfg's comment on roles_path). Excluding it stops ansible-lint's own directory walk from following that symlink back into the tree it is already linting, which otherwise relints the whole collection a second time under a growing path on every recursion.
        run: ansible-lint --profile production --exclude playbooks/collections

  required-checks:
    name: Required Checks
    needs: [determine-runner, shellcheck, actionlint, yamllint, hadolint, ansible-syntax-check, ansible-lint]
    # Always runs, even if a dependency failed or was skipped, so it can report that failure itself rather than being skipped - a required check that's silently absent blocks a PR indefinitely instead of failing it visibly.
    if: always()
    # Not ubuntu-latest: confirmed live (ExaDev/github-runner#7) that ExaDev's GitHub-hosted runners currently can't schedule at all (runner_id: 0, never assigned) - a bare ubuntu-latest job here would fail every run regardless of every other job's own result. Routes through the same fallback as everything else instead.
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed:"
            echo '${{ toJSON(needs) }}'
            exit 1
          fi
