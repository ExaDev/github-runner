[defaults]
inventory           = inventory.yml
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
nocows              = True
interpreter_python  = auto_silent

# No vault_password_file: nothing here is ansible-vault-encrypted. Every secret (App private key, GHCR token, heartbeat PAT, K3S_TOKEN) is read live from 1Password at task time instead, by ../roles/github_runner_secrets. Setting vault_password_file to a file that doesn't exist breaks every run, including ones touching no vault-encrypted content at all, so it stays unset unless a real encrypted var is added later.

# No roles_path: playbooks/site.yml names its roles by their collection name (exadev.github_runner.*), and playbooks/collections/ansible_collections/exadev/github_runner links back to this checkout, so Ansible's playbook-adjacent collection search finds the roles and the collection's own filter plugin here without the collection being installed.

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519
pipelining = True
