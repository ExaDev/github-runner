[defaults]
inventory           = inventory.yml
roles_path          = roles
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
nocows              = True
interpreter_python  = auto_silent

# No vault_password_file: nothing here is ansible-vault-encrypted. Every
# secret (App private key, GHCR token, heartbeat PAT, K3S_TOKEN) is read
# live from 1Password via `op read` at task time instead — see
# roles/github_runner_arc/tasks/install_org.yml and defaults/main.yml.
# Setting vault_password_file to a file that doesn't exist breaks every
# run, including ones touching no vault-encrypted content at all, so it
# stays unset unless a real encrypted var is added later.

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519
pipelining = True
