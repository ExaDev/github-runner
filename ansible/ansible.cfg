[defaults]
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
nocows              = True
interpreter_python  = auto_silent

# Settings for running the collection's playbooks from this checkout, as bootstrap.sh and CI do: from ansible/, with an inventory named on the command line (-i). No inventory here: a fleet's inventory, host_vars and Helm values belong in its own repository, which installs the collection (see examples/ for inventories to start from).

# No roles_path: the playbooks name their roles by their collection name (exadev.github_runner.*), and playbooks/collections/ansible_collections/exadev/github_runner links back to this checkout, so Ansible's playbook-adjacent collection search finds the roles and the collection's own filter plugins here without the collection being installed.

[ssh_connection]
pipelining = True
