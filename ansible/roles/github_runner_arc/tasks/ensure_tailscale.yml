---
# Ensures the tailnet's ACL grants the github-runner fleet's own cross-node pod traffic (see k3s-io/k3s#8372 - Tailscale evaluates a subnet-routed packet's actual embedded source IP, so a grant scoped to the node tag alone silently blocks pod-to-pod traffic), and that a reusable, pre-authorized join key exists for k3s's own --vpn-auth integration (see docker-compose.yml). Runs once per playbook invocation (run_once, delegate_to localhost): this is tailnet-wide, shared-account state, not per-host state.
#
# Surgical, never wholesale: this tailnet also carries other, unrelated rules for the account's own personal devices and other projects (confirmed live - the policy already has an autogroup:member/self grant and an unrelated tagged project predating this fleet). Every check below only ever adds a missing entry to the existing policy and writes the whole policy back; it never replaces it outright, and no-ops entirely once the entries already exist.

- name: Fetch the tailnet's current ACL policy
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/acl"
    method: GET
    url_username: "{{ github_runner_arc_secrets.tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
  delegate_to: localhost
  no_log: true
  # A read-only GET, so safe under --check - and without it uri skips in check mode, leaving the next task nothing to compute the desired policy from.
  check_mode: false
  register: github_runner_arc_acl_current

- name: Compute the ACL policy with the github-runner-node grant/tagOwner/autoApprover ensured
  # combine() on tagOwners/autoApprovers is naturally idempotent - re-adding an identical key/value is a no-op. The grant itself has no natural key to combine on, so it's appended only when an identical entry isn't already present (exact-list-equality on `src`, since this task always constructs the same literal list in the same order).
  ansible.builtin.set_fact:
    github_runner_arc_acl_desired: >-
      {{
        github_runner_arc_acl_current.json
        | combine({'tagOwners': (github_runner_arc_acl_current.json.tagOwners | default({}) | combine({'tag:github-runner-node': ['autogroup:admin']}))})
        | combine({'autoApprovers': (github_runner_arc_acl_current.json.autoApprovers | default({}) | combine({'routes': (github_runner_arc_acl_current.json.autoApprovers.routes | default({}) | combine({'10.42.0.0/16': ['tag:github-runner-node']}))}, recursive=True))}, recursive=True)
        | combine({'grants': (github_runner_arc_acl_current.json.grants | default([]) + ([{'src': ['tag:github-runner-node', '10.42.0.0/16'], 'dst': ['tag:github-runner-node', '10.42.0.0/16'], 'ip': ['*']}] if ([{'src': ['tag:github-runner-node', '10.42.0.0/16'], 'dst': ['tag:github-runner-node', '10.42.0.0/16'], 'ip': ['*']}] | difference(github_runner_arc_acl_current.json.grants | default([])) | length > 0) else []))})
      }}
  no_log: true

- name: Push the updated ACL policy if the grant/tagOwner/autoApprover weren't already present
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/acl"
    method: POST
    url_username: "{{ github_runner_arc_secrets.tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body: "{{ github_runner_arc_acl_desired }}"
    status_code: [200]
  delegate_to: localhost
  no_log: true
  when: github_runner_arc_acl_desired != github_runner_arc_acl_current.json

# The API token itself has no equivalent bootstrap: creating one requires the Tailscale admin console (Settings -> Keys -> API access tokens), a one-time manual step with no API to automate it (this is inherent to token-based auth - you need a credential to create a credential). Store it as this item's own tailscale-api-token field once created.
#
# Key rotation on expiry is likewise still a manual trigger: this task only creates a NEW key when tailscale_join_key is genuinely empty, not when an existing one has expired (an expired key is still a non-empty string in 1Password, so this check alone can't detect it). If k3s's own vpn-auth integration starts failing to authenticate on a working fleet, check the key's expiry in the Tailscale admin console first - if it's expired, clear the tailscale-join-key field in 1Password and rerun.
- name: Create a reusable, pre-authorized Tailscale join key if one isn't already known
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/keys"
    method: POST
    url_username: "{{ github_runner_arc_secrets.tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: true
            ephemeral: false
            preauthorized: true
            tags: ["tag:github-runner-node"]
      # 90 days: comfortably under this tailnet's own observed maxKeyDuration (180 days), and short enough that a compromised key doesn't stay valid indefinitely - rotation itself is the manual step documented above.
      expirySeconds: 7776000
      description: "github-runner fleet vpn-auth join key (Ansible-managed)"
    status_code: [200]
  delegate_to: localhost
  no_log: true
  register: github_runner_arc_new_join_key
  # 1Password mode only: with provided secrets there's nowhere to persist a newly created key for the next run, so the key has to be supplied instead (tasks/main.yml fails fast if it isn't).
  when:
    - github_runner_arc_provided_secrets | length == 0
    - github_runner_arc_secrets.tailscale_join_key | default('') | length == 0

- name: Persist the new join key to 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - edit
      - "{{ github_runner_arc_secrets_item }}"
      - --vault
      - "{{ github_runner_arc_secrets_vault }}"
      - "tailscale-join-key[password]={{ github_runner_arc_new_join_key.json.key }}"
  delegate_to: localhost
  no_log: true
  when: github_runner_arc_new_join_key is not skipped

- name: Fold the new join key into this run's own in-memory secrets
  ansible.builtin.set_fact:
    github_runner_arc_secrets: "{{ github_runner_arc_secrets | combine({'tailscale_join_key': github_runner_arc_new_join_key.json.key}) }}"
  no_log: true
  when: github_runner_arc_new_join_key is not skipped

- name: Refresh the cached secrets read to match, so future runs see the new key without re-reading 1Password
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.cache/github-runner-arc/secrets-{{ github_runner_arc_secrets_item }}.json"
    content: "{{ github_runner_arc_secrets | to_json }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when: github_runner_arc_new_join_key is not skipped
