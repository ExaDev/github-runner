---
# Included once per org from tasks/main.yml's loop, with `org` set to that org's entry from github_runner_arc_orgs. Ports bootstrap.sh's install_org() bash function: resolve the installation ID once per org, then delegate namespace/secrets/scale-set-release creation to install_scale_set_profile.yml once per entry in org.scale_set_profiles - see that key's own comment in host_vars/node-a.yml for why a single org can need more than one.

- name: "{{ org.name }}: resolve installation ID"
  ansible.builtin.include_tasks: resolve_installation_id.yml
  when: (org.installation_id | default('')) | length == 0

- name: "{{ org.name }}: set the effective installation ID"
  # Read directly by name, no hostvars indirection: resolve_installation_id.yml sets this via a plain set_fact with no delegate_facts, so - per Ansible's own default - it already attaches to inventory_hostname (node-b, this host), not to the localhost it delegated its own execution to.
  ansible.builtin.set_fact:
    github_runner_arc_installation_id: "{{ github_runner_arc_resolved_installation_id | default(org.installation_id) }}"

- name: "{{ org.name }}: install/upgrade each scale-set profile"
  ansible.builtin.include_tasks: install_scale_set_profile.yml
  loop: "{{ org.scale_set_profiles }}"
  loop_control:
    loop_var: profile
    label: "{{ profile.suffix | default('(default)') }}"

- name: "{{ org.name }}: trigger an immediate autoscaler reconcile"
  ansible.builtin.command: docker compose exec -T autoscaler /app/scripts/autoscaler.sh
  args:
    chdir: "{{ github_runner_arc_repo_root }}"
  changed_when: false
  failed_when: false
  # Every Helm upgrade above reverts maxRunners to its values file's safe floor. This shrinks that safe-floor window to seconds instead of waiting for the autoscaler's own next poll tick. Best-effort, matching bootstrap.sh's identical step: the autoscaler service is exadev-specific today, and the ordinary poll loop catches this regardless if the exec fails for any reason (including the service not existing yet).
