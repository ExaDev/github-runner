---
# Included once per entry in org.scale_set_profiles, with `org` and `profile` already set by install_org.yml's own loop. Each profile gets its own namespace, not a shared one: the chart names some resources (e.g. the ServiceAccount) after runnerScaleSetName rather than the Helm release name, so two releases sharing one runnerScaleSetName collide outright if they land in the same namespace - confirmed live. Namespacing per profile also means each needs its own copy of the org's secrets, since Kubernetes Secrets are namespace-scoped.

- name: "{{ org.name }}{{ profile.suffix }}: create namespace"
  kubernetes.core.k8s:
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "arc-runners-{{ org.name | lower }}{{ profile.suffix }}"

- name: "{{ org.name }}{{ profile.suffix }}: create/update GitHub App secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ org.name | lower }}-github-app"
        namespace: "arc-runners-{{ org.name | lower }}{{ profile.suffix }}"
      stringData:
        github_app_id: "{{ org.app_id | string }}"
        github_app_installation_id: "{{ github_runner_arc_installation_id }}"
        github_app_private_key: "{{ github_runner_arc_secrets.org_private_keys[org.name] }}"
  no_log: true

- name: "{{ org.name }}{{ profile.suffix }}: create/update GHCR pull secret"
  kubernetes.core.k8s:
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/dockerconfigjson
      metadata:
        name: ghcr-pull
        namespace: "arc-runners-{{ org.name | lower }}{{ profile.suffix }}"
      data:
        .dockerconfigjson: >-
          {{ ({'auths': {'ghcr.io': {'username': github_runner_arc_secrets.ghcr_username,
                                      'password': github_runner_arc_secrets.ghcr_token,
                                      'auth': (github_runner_arc_secrets.ghcr_username ~ ':' ~ github_runner_arc_secrets.ghcr_token) | b64encode}}})
             | to_json | b64encode }}
  no_log: true

- name: "{{ org.name }}{{ profile.suffix }}: install/upgrade scale-set release"
  # runnerScaleSetName is deliberately left unset, not forced to the same value across profiles: it defaults to the Helm release name and IS the scale set's own unique registration identity on GitHub's side (not just a label) - confirmed live, forcing two releases to share it made the second one's listener crash-loop trying to register a duplicate. scaleSetLabels is the correct mechanism for pooling: an ADDITIONAL label every profile's runners also carry, alongside their own already-unique default label, letting runs-on: <label> match every profile sharing it without any of them colliding on identity. Most profiles want the org's own shared label (the default below); a profile can set its own runs_on_label instead when it deliberately should NOT pool with the others - e.g. a dedicated image-building profile that ordinary CI jobs have no business landing on.
  kubernetes.core.helm:
    name: "{{ org.name | lower }}-runners{{ profile.suffix }}"
    chart_ref: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    chart_version: "{{ github_runner_arc_scaleset_chart_version | default(omit) }}"
    release_namespace: "arc-runners-{{ org.name | lower }}{{ profile.suffix }}"
    values_files:
      - "{{ github_runner_arc_values_dir }}/{{ profile.values_file }}"
    # --set-equivalent overrides only for containers[], matching bootstrap.sh exactly: a nested `values:` dict would replace it wholesale (Helm does not deep-merge lists), silently dropping the values file's own command/resources for that container.
    set_values:
      - value: "githubConfigUrl=https://github.com/{{ org.name }}"
      - value: "githubConfigSecret={{ org.name | lower }}-github-app"
      - value: "template.spec.imagePullSecrets[0].name=ghcr-pull"
      - value: "template.spec.containers[0].image={{ org.image }}"
      - value: "scaleSetLabels[0]={{ profile.runs_on_label | default(org.name | lower ~ '-runners') }}"
    # nodeSelector is a map, not a list, so a nested `values:` dict merges it safely (no wholesale-replacement risk the comment above warns about for containers[]) - simpler and more robust than building a --set path string with escaped dots for a key like kubernetes.io/hostname.
    values:
      template:
        spec:
          nodeSelector: "{{ profile.node_selector | default({}) }}"
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
