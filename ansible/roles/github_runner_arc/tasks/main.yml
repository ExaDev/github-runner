---
# Ports bootstrap.sh's steps 1-4 (start k3s, wait for it, install the ARC controller, install each org) to Ansible. Safe to rerun, same as the script: every mutating task below uses kubernetes.core.k8s (server-side apply) or helm upgrade --install semantics, never a plain create.
#
# Two node roles, not one: github_runner_arc_node_role selects between "primary" (today's full behaviour - k3s server, heartbeat, the ARC controller, every org's runner scale set) and "agent" (a second host joining the primary's cluster purely as a worker, so its own CPU/RAM become schedulable for runner pods too). See docker-compose.yml's own top comment for why this is additive capacity, not control-plane HA.

- name: Fail if the node role is invalid
  ansible.builtin.fail:
    msg: "github_runner_arc_node_role must be 'primary' or 'agent' (got '{{ github_runner_arc_node_role }}')."
  when: github_runner_arc_node_role not in ['primary', 'agent']

- name: Fail if this host's repo root is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_arc_repo_root is not set on this host. It must be the
      absolute path of the github-runner checkout on this target host
      itself (not the control node) - add it to
      host_vars/{{ inventory_hostname }}.yml.
  when: github_runner_arc_repo_root is not defined

- name: Fail if the secrets item's vault or name is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_arc_secrets_vault and github_runner_arc_secrets_item
      must both be set on this host. Add them to
      host_vars/{{ inventory_hostname }}.yml.
  when: github_runner_arc_secrets_vault | length == 0 or github_runner_arc_secrets_item | length == 0

# Only the primary ever runs the heartbeat service (see docker-compose.yml's own profiles), and scripts/heartbeat.sh has its own `:?required` check on HEARTBEAT_GIST_ID at container startup - so an empty gist id here would otherwise only surface as a crash-looping heartbeat container discovered after the fact. Bootstraps it the same way the README's own manual instructions do (`gh gist create`, using the control node's own authenticated `gh` session), then fails deliberately: the new gist's id needs recording in TWO places a human must do by hand (this host's own host_vars, and exadev/runner-fallback-action's own action.yml default) - creating it silently and continuing would leave the second half of that undone with no signal that it's needed.
- name: Bootstrap the heartbeat gist if this primary doesn't have one yet
  when:
    - github_runner_arc_node_role == "primary"
    - github_runner_arc_heartbeat_gist_id | length == 0
  block:
    - name: Create the heartbeat status gist
      ansible.builtin.command:
        argv:
          - gh
          - gist
          - create
          - --filename
          - arc-healthy-until
          - --desc
          - "ExaDev ARC fleet health heartbeat"
          - "-"
        stdin: "{{ (ansible_date_time.epoch | int + 600) | string }}"
      delegate_to: localhost
      register: github_runner_arc_new_gist

    - name: Fail, printing the new gist's id for the operator to record
      ansible.builtin.fail:
        msg: >-
          Created a new heartbeat gist: {{ github_runner_arc_new_gist.stdout }}.
          Add its id (the hex tail of the URL) to
          github_runner_arc_heartbeat_gist_id in
          host_vars/{{ inventory_hostname }}.yml, AND update
          exadev/runner-fallback-action's own action.yml gist-id default to
          match, then rerun.

# Delegated to the control node, not this host: 1Password access (desktop-app integration, or a signed-in CLI session) belongs to whichever machine an operator is actually running Ansible from, not to every fleet host. No delegate_facts: a plain `register:` result already attaches to inventory_hostname regardless of where the task's execution was delegated to - only `set_fact`'s own fact-namespace assignment is sensitive to delegate_facts (see resolve_installation_id.yml's git history for the one place that mattered, and why delegate_facts: true there was backwards).
#
# Cached on the CONTROL NODE (never in this repo, never on a fleet host) after the first successful read, keyed by the secrets item name - a repeated debugging session running this playbook dozens of times otherwise means dozens of separate 1Password desktop-app approval prompts, one per run, even though the underlying secrets rarely change between runs. `lookup('env', 'HOME')`, not `ansible_facts`: inside a delegated task, ansible_facts still refers to the CURRENT (target) host's own gathered facts, not localhost's - the exact same subtlety already documented for delegate_facts above. Delete the cache file to force a fresh read (e.g. after rotating a secret).
- name: Check for a cached 1Password secrets read
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.cache/github-runner-arc/secrets-{{ github_runner_arc_secrets_item }}.json"
  delegate_to: localhost
  register: github_runner_arc_secrets_cache_file

# The cache above is shared by every host that uses this exact secrets item, but github_runner_arc_orgs is host-specific (an agent host defines none at all). Building org_private_keys from only the TRIGGERING host's own org list means whichever host happens to populate the cache first determines what's in it forever after - confirmed live: an agent-only test run seeded the cache with an empty org_private_keys, silently breaking the primary's own later GitHub App secret creation once it read that same cache back. Aggregating across every host sharing this item makes the cached content correct regardless of which host writes it first.
- name: Compute every org configured anywhere in the fleet that shares this secrets item
  ansible.builtin.set_fact:
    github_runner_arc_all_orgs: >-
      {{
        groups['all']
        | map('extract', hostvars)
        | selectattr('github_runner_arc_secrets_item', 'defined')
        | selectattr('github_runner_arc_secrets_item', 'equalto', github_runner_arc_secrets_item)
        | map(attribute='github_runner_arc_orgs', default=[])
        | list | flatten | unique(attribute='name')
      }}

- name: Read every 1Password secret this host needs in one shell invocation
  ansible.builtin.shell: |
    set -euo pipefail
    secrets=$(op item get '{{ github_runner_arc_secrets_item }}' --vault '{{ github_runner_arc_secrets_vault }}' --format json --reveal | jq -c '{
      k3s_token: (.fields[] | select(.label=="k3s-token") | .value),
      ghcr_username: (.fields[] | select(.label=="ghcr-username") | .value),
      ghcr_token: (.fields[] | select(.label=="ghcr-token") | .value),
      heartbeat_gh_token: (.fields[] | select(.label=="heartbeat-gh-token") | .value),
      tailscale_join_key: (.fields[] | select(.label=="tailscale-join-key") | .value),
      tailscale_api_token: (.fields[] | select(.label=="tailscale-api-token") | .value)
    }')
    org_keys='{}'
    {% for org in github_runner_arc_all_orgs %}
    key_{{ loop.index }}=$(op read '{{ org.private_key_op_reference }}')
    org_keys=$(jq -n --argjson prev "$org_keys" --arg name '{{ org.name }}' --arg key "$key_{{ loop.index }}" '$prev + {($name): $key}')
    {% endfor %}
    jq -n --argjson secrets "$secrets" --argjson org_keys "$org_keys" '$secrets + {org_private_keys: $org_keys}'
  delegate_to: localhost
  changed_when: false
  no_log: true
  register: github_runner_arc_secrets_raw
  when: not github_runner_arc_secrets_cache_file.stat.exists

- name: Cache this read for future runs
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.cache/github-runner-arc/secrets-{{ github_runner_arc_secrets_item }}.json"
    content: "{{ github_runner_arc_secrets_raw.stdout }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when: not github_runner_arc_secrets_cache_file.stat.exists

- name: Parse the combined secrets read (from cache, or the read just above)
  ansible.builtin.set_fact:
    github_runner_arc_secrets: >-
      {{
        (lookup('file', github_runner_arc_secrets_cache_file.stat.path) if github_runner_arc_secrets_cache_file.stat.exists
         else github_runner_arc_secrets_raw.stdout) | from_json
      }}
  no_log: true

- name: Ensure the tailnet's ACL grants cross-node pod traffic and a reusable join key exists
  # run_once, not per-host: this is tailnet-wide, shared-account state (the ACL policy, one reusable join key), not per-host state. Must complete before either branch below templates .env, since both env.j2 and env-agent.j2 read github_runner_arc_secrets.tailscale_join_key.
  ansible.builtin.include_tasks: ensure_tailscale.yml
  run_once: true

- name: Determine the active Docker CLI context
  # community.docker.docker_compose_v2 defaults to unix:///var/run/docker.sock when neither docker_host nor cli_context is given, ignoring whatever context `docker` itself is actually configured to use - confirmed live against node-b, which runs Colima (docker.sock lives under ~/.colima/default/, not /var/run) and failed outright without this. Read the host's own current context rather than hardcoding "colima", since a Docker Desktop host would need "desktop-linux" instead.
  ansible.builtin.command: docker context show
  changed_when: false
  register: github_runner_arc_docker_context

- name: Join as a k3s agent and stop here (nothing else applies to a worker-only node)
  when: github_runner_arc_node_role == "agent"
  block:
    - name: Fail if the primary's server URL is not set
      ansible.builtin.fail:
        msg: >-
          github_runner_arc_agent_server_url is not set on this agent
          host. It must be the primary host's own
          https://<address>:6443 - add it to
          host_vars/{{ inventory_hostname }}.yml.
      when: github_runner_arc_agent_server_url | length == 0

    - name: Template .env for the k3s agent
      ansible.builtin.template:
        src: env-agent.j2
        dest: "{{ github_runner_arc_repo_root }}/.env"
        mode: "0600"
      no_log: true

    - name: Join the primary's k3s cluster as an agent
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_arc_repo_root }}"
        profiles: ["agent"]
        cli_context: "{{ github_runner_arc_docker_context.stdout | trim }}"
        state: present

    - name: End the role here - an agent host runs no org installs or ARC controller of its own
      ansible.builtin.meta: end_role

# Everything below only ever runs on the primary: an agent host already ended the role in the block above.

- name: Skip the rest of the role when no orgs are configured for this primary host
  ansible.builtin.meta: end_role
  when: github_runner_arc_orgs | length == 0

- name: Ensure a dedicated virtualenv has the kubernetes Python client
  # Only needed here, not on an agent host: kubernetes.core.k8s/k8s_info/helm (used below and in install_org.yml) are primary-only - an agent host never talks to the Kubernetes API directly, it only joins the cluster docker-compose already set up above.
  ansible.builtin.pip:
    name: kubernetes
    virtualenv: "{{ github_runner_arc_venv_path }}"
    virtualenv_command: python3 -m venv

- name: Use that virtualenv's Python for every module task on this host from here on
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ github_runner_arc_venv_path }}/bin/python3"

- name: Template .env for docker compose
  ansible.builtin.template:
    src: env.j2
    dest: "{{ github_runner_arc_repo_root }}/.env"
    mode: "0600"
  no_log: true

- name: Start k3s and heartbeat via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ github_runner_arc_repo_root }}"
    profiles: ["primary"]
    cli_context: "{{ github_runner_arc_docker_context.stdout | trim }}"
    state: present

- name: Wait for the k3s node to register (an empty node list is still a successful API response)
  # default([]) on resources, not just a bare .resources access: the very first poll can hit the API before it's actually listening yet (the container has only just started), and that attempt's own result dict has no `resources` key at all - confirmed live on a fresh node-a bootstrap, where the bare access threw "object of type 'dict' has no attribute 'resources'" and aborted the whole `until` loop outright instead of retrying, even though the exact same module call succeeded cleanly moments later once the API was actually up.
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
  register: github_runner_arc_nodes
  until: github_runner_arc_nodes.resources | default([]) | length > 0
  retries: 60
  delay: 2

- name: Wait for every node to report Ready, self-healing a stale agent node-password registration if any node fails to rejoin
  # /etc/rancher/node/password lives inside the k3s-agent container's own writable filesystem, not a persisted volume, so a fresh container (e.g. after docker compose --force-recreate) generates a brand-new random password - but the primary still holds the PREVIOUS container's password for that node name (a kube-system/<node>.node-password.k3s Secret) and rejects the mismatched rejoin. Confirmed live - see README's Non-obvious behaviour section. Only ever touches agent-role hosts by their own known inventory hostname (which is also their registered k8s node name, per env-agent.j2's K3S_AGENT_NODE_NAME): never the primary's own control-plane registration, which fails Ready for entirely different reasons a stale-password wipe wouldn't fix anyway.
  block:
    - name: Wait for every node to report Ready
      # --all, not a --limit-scoped single node: once an agent has joined, this must wait for it too, not just the primary's own control-plane node.
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_arc_kubeconfig_path }}"
      changed_when: false
  rescue:
    - name: Clear every agent host's stale node-password secret
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
        state: absent
        kind: Secret
        namespace: kube-system
        name: "{{ item }}.node-password.k3s"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].github_runner_arc_node_role | default('primary') == 'agent'

    - name: Clear every agent host's stale Node object to match
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"
        state: absent
        kind: Node
        name: "{{ item }}"
      loop: "{{ groups['all'] }}"
      when: hostvars[item].github_runner_arc_node_role | default('primary') == 'agent'

    - name: Retry waiting for every node to report Ready now that any stale registration is cleared
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_arc_kubeconfig_path }}"
      changed_when: false

- name: Install/upgrade the ARC controller (shared by every org on this host)
  kubernetes.core.helm:
    name: arc
    chart_ref: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    chart_version: "{{ github_runner_arc_controller_chart_version | default(omit) }}"
    release_namespace: actions-runner-controller
    create_namespace: true
    values_files:
      - "{{ github_runner_arc_values_dir }}/controller-values.yaml"
    kubeconfig: "{{ github_runner_arc_kubeconfig_path }}"

- name: Install/upgrade each org's runner scale set
  ansible.builtin.include_tasks: install_org.yml
  loop: "{{ github_runner_arc_orgs }}"
  loop_control:
    loop_var: org
    label: "{{ org.name }}"
