---
# Single entrypoint. Run it from ansible/ so that ansible.cfg and the inventory apply, and scope a run to one machine with --limit, e.g.: ansible-playbook ../playbooks/site.yml --limit node-b
- name: ExaDev GitHub Actions runner fleet
  # The cluster group, whose inventory order decides which hosts are k3s servers (see roles/github_runner_cluster/defaults/main.yml). bootstrap.sh sets github_runner_cluster_group to all, since its one-host inventory has no groups.
  hosts: "{{ github_runner_cluster_group | default('github_runner_cluster') }}"
  gather_facts: true

  # A play-level environment: applies even to the implicit Gathering Facts task, before any fact (including ansible_machine or ansible_env) exists yet - referencing either one here fails every run with "'ansible_machine' is undefined", confirmed live against the real fleet. Listing both Homebrew prefixes unconditionally, plus the standard system dirs, avoids needing any fact at all: an absent directory in PATH is silently skipped by the shell, not an error.
  environment:
    PATH: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"

  pre_tasks:
    # macOS only: every current fleet host is a Mac, but nothing else in the role is Mac-specific (k3s runs in Docker), and bootstrap.sh can run this playbook locally on any Docker host. Elsewhere, helm/kubectl/docker come from the host's own package manager - see the README's Getting started section.
    - name: Ensure Homebrew prerequisites are installed (helm, kubectl, docker, docker-compose)
      when: ansible_facts['os_family'] == 'Darwin'
      community.general.homebrew:
        name:
          - helm
          - kubernetes-cli
          - docker
          - docker-compose
        state: present

  roles:
    - exadev.github_runner.github_runner_secrets
    # Only the hosts that go on to install ARC or the fleet-health platform wait for the cluster's nodes to be Ready: they are the ones that talk to the Kubernetes API, and waiting needs the kubernetes Python client the others never install.
    - role: exadev.github_runner.github_runner_cluster
      vars:
        github_runner_cluster_wait_for_nodes: "{{ github_runner_arc_orgs | length > 0 or github_runner_arc_heartbeat_gist_id | length > 0 }}"
    - exadev.github_runner.github_runner_arc
