---
# The role's variables, checked when the role runs. defaults/main.yml holds each default and the reasoning behind it.
argument_specs:
  main:
    short_description: Keeps a Mac awake on AC power and runs its own Tailscale client as the tailscaled system daemon.
    description:
      - Runs on macOS hosts only and does nothing on any other. Its tasks that change the host use become (sudo), so run the play with passwordless sudo for the connecting user or with --ask-become-pass.
    options:
      github_runner_macos_host_sudoers_nopasswd:
        type: bool
        default: false
        description: Whether the role gives the connecting user passwordless sudo, by writing /etc/sudoers.d/<user>. Off by default, and not for a host whose sudo comes from another tool.
      github_runner_macos_host_sudoers_user:
        type: str
        default: ""
        description: The user the passwordless sudo is for, a lower-case login name. Empty is the user Ansible connects as.
      github_runner_macos_host_sudoers_dir:
        type: path
        default: /etc/sudoers.d
        description: The directory macOS reads sudoers drop-ins from. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_macos_host_power:
        type: bool
        default: true
        description: Whether the role applies the AC power settings below.
      github_runner_macos_host_power_ac_sleep:
        type: int
        default: 0
        description: Minutes of inactivity before the system sleeps on AC power; 0 never.
      github_runner_macos_host_power_ac_displaysleep:
        type: int
        default: 0
        description: Minutes of inactivity before the display sleeps on AC power; 0 never.
      github_runner_macos_host_power_ac_disksleep:
        type: int
        default: 0
        description: Minutes of inactivity before the disks spin down on AC power; 0 never.
      github_runner_macos_host_power_ac_womp:
        type: int
        default: 1
        choices: [0, 1]
        description: Wake for network access on AC power, 1 on and 0 off.
      github_runner_macos_host_power_ac_standby:
        type: int
        default: 1
        choices: [0, 1]
        description: Standby (writing the memory image to disk after a long sleep) on AC power, 1 on and 0 off.
      github_runner_macos_host_power_ac_powernap:
        type: int
        default: 1
        choices: [0, 1]
        description: Power Nap on AC power, 1 on and 0 off.
      github_runner_macos_host_power_ac_tcpkeepalive:
        type: int
        default: 1
        choices: [0, 1]
        description: Keeping TCP connections alive during sleep on AC power, 1 on and 0 off.
      github_runner_macos_host_tailscale:
        type: bool
        default: true
        description: Whether the role installs the host's Tailscale client and its system daemon.
      github_runner_macos_host_homebrew_prefix:
        type: str
        default: ""
        description: The Homebrew prefix. Empty takes /opt/homebrew on Apple silicon and /usr/local on Intel, from the host's machine fact.
      github_runner_macos_host_tailscale_plist:
        type: path
        default: /Library/LaunchDaemons/com.tailscale.tailscaled.plist
        description: The launchd definition tailscaled install-system-daemon writes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_macos_host_tailscale_auth_key:
        type: str
        default: ""
        no_log: true
        description: A Tailscale auth key for tailscale up, empty by default. Empty, the role never joins or re-authenticates a tailnet.
      github_runner_macos_host_tailscale_up_args:
        type: list
        elements: str
        default: []
        description: Further arguments for tailscale up, used only when the auth key is set.
      github_runner_macos_host_path:
        type: str
        default: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
        description: The PATH the Homebrew tasks run with.
