---
# The host's own Tailscale client, as the tailscaled system daemon: a launchd daemon that starts at boot, before anyone logs in. Separate from the Tailscale client each node's k3s container runs on the cluster's tailnet, which this never touches.

- name: Work out the Homebrew prefix
  ansible.builtin.set_fact:
    github_runner_macos_host_effective_prefix: >-
      {{ github_runner_macos_host_homebrew_prefix
      if github_runner_macos_host_homebrew_prefix | length > 0
      else ('/opt/homebrew' if ansible_facts['machine'] == 'arm64' else '/usr/local') }}

- name: Work out where the formula's binaries are
  # The keg's own bin directory through Homebrew's stable opt path, not the prefix's bin directory: Homebrew links the formula there only when nothing else holds the names (the standalone app's wrapper script holds tailscale on a Mac that has the app), and the role needs the formula's binaries whether or not it is linked.
  ansible.builtin.set_fact:
    github_runner_macos_host_tailscale_formula_bin: "{{ github_runner_macos_host_effective_prefix }}/opt/tailscale/bin"

- name: Look for the Tailscale system daemon's launchd definition
  ansible.builtin.stat:
    path: "{{ github_runner_macos_host_tailscale_plist }}"
  register: github_runner_macos_host_tailscale_daemon

# A host that already has the definition, installed by this role earlier or by hand, is left alone: nothing below runs, so a hand-built daemon is never replaced by the formula's.
- name: Install the daemon
  when: not github_runner_macos_host_tailscale_daemon.stat.exists
  block:
    - name: Install the Tailscale Homebrew formula
      ansible.builtin.include_tasks: tailscale_formula.yml
      vars:
        github_runner_macos_host_tailscale_formula_latest: false

    - name: Install and start the tailscaled system daemon
      # Copies tailscaled to /usr/local/bin, writes the launchd definition and starts it, which takes root. Never joins a tailnet.
      become: true
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_tailscale_formula_bin }}/tailscaled", install-system-daemon]
        creates: "{{ github_runner_macos_host_tailscale_plist }}"
      when: not ansible_check_mode

    - name: Report the daemon a real run would install
      # Under --check the task above does not run, so that no privilege is needed to review a run; the definition is known to be absent, so this reports the same change instead.
      ansible.builtin.debug:
        msg: "tailscaled install-system-daemon, which writes {{ github_runner_macos_host_tailscale_plist }}"
      when: ansible_check_mode
      changed_when: true

# Keeping what the host has current, after the install above and before any join: replacing the daemon restarts it, and the login read below waits for it to settle.
- name: Keep the host's Tailscale software current
  ansible.builtin.include_tasks: tailscale_update.yml
  when: github_runner_macos_host_tailscale_update | bool

# Joining needs an auth key, a secret only the tailnet's owner can create, so it happens only when one is given. The login state is read from the daemon, so a host that is already logged in, and a failed join, are both handled by rerunning.
- name: Find the Tailscale command line the role installed
  # The formula's, which talks to the tailscaled daemon: the prefix's tailscale can be the standalone app's wrapper, which talks to the app.
  ansible.builtin.stat:
    path: "{{ github_runner_macos_host_tailscale_formula_bin }}/tailscale"
  register: github_runner_macos_host_tailscale_cli
  when: github_runner_macos_host_tailscale_auth_key | length > 0

- name: Join the tailnet
  when:
    - github_runner_macos_host_tailscale_auth_key | length > 0
    # Under --check on a host that has none yet, the daemon is not installed, so there is nothing to read.
    - github_runner_macos_host_tailscale_cli.stat.exists
    - not ansible_check_mode or github_runner_macos_host_tailscale_daemon.stat.exists
  block:
    - name: Read the daemon's login state
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_tailscale_formula_bin }}/tailscale", status, --json, --peers=false]
      register: github_runner_macos_host_tailscale_status
      changed_when: false
      check_mode: false
      # The daemon takes a moment to answer on its socket after it is started, and to settle out of NoState into NeedsLogin or the state of an earlier login.
      until: github_runner_macos_host_tailscale_status.rc == 0 and (github_runner_macos_host_tailscale_status.stdout | from_json).BackendState != 'NoState'
      retries: 10
      delay: 2

    - name: Log in with the auth key
      become: true
      ansible.builtin.command:
        argv: >-
          {{ [github_runner_macos_host_tailscale_formula_bin ~ '/tailscale', 'up', '--auth-key=file:/dev/stdin']
          + github_runner_macos_host_tailscale_up_args }}
        # The key is read from standard input, so it is in no process listing.
        stdin: "{{ github_runner_macos_host_tailscale_auth_key }}"
        stdin_add_newline: false
      no_log: true
      changed_when: true
      when:
        - (github_runner_macos_host_tailscale_status.stdout | from_json).BackendState == 'NeedsLogin'
        - not ansible_check_mode

    - name: Report the login a real run would make
      # The key is not shown.
      ansible.builtin.debug:
        msg: "tailscale up with the auth key, since the daemon needs a login"
      when:
        - (github_runner_macos_host_tailscale_status.stdout | from_json).BackendState == 'NeedsLogin'
        - ansible_check_mode
      changed_when: true
