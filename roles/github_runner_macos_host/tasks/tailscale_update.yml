---
# Keeps the Tailscale software the host already has current, and installs nothing: the Homebrew formula (the formula and no other), the system daemon that formula installed, and the standalone app when it is installed as the Homebrew cask. The daemon is not the formula: tailscaled install-system-daemon copies the formula's tailscaled to the daemon path (or, where that path is already a link to the formula, starts it once), and launchd keeps running whatever was started, so upgrading the formula alone leaves the old release running. tailscaled install-system-daemon removes the installed daemon and its launchd definition first and then installs and starts the new ones (cmd/tailscaled/install_darwin.go in https://github.com/tailscale/tailscale), so running it again is the refresh, and the login state lives in the daemon's own state directory, which it leaves alone. Under --check nothing that changes the host runs: Homebrew's index is not refreshed, so the answer is the one the index it already has gives, and the refresh is reported. This never joins or logs in to a tailnet.

- name: Look for Homebrew
  # A host with the daemon and no Homebrew built it by hand.
  ansible.builtin.stat:
    path: "{{ github_runner_macos_host_effective_prefix }}/bin/brew"
    get_checksum: false
  register: github_runner_macos_host_tailscale_brew

- name: Look for the formula's tailscaled
  ansible.builtin.stat:
    path: "{{ github_runner_macos_host_effective_prefix }}/bin/tailscaled"
    get_checksum: false
  register: github_runner_macos_host_tailscale_formula

- name: Read whether the standalone app is installed as the Homebrew cask
  # brew list exits non-zero for a cask that is not installed. Only read here: the cask module below would install an absent cask.
  ansible.builtin.command:
    argv: ["{{ github_runner_macos_host_effective_prefix }}/bin/brew", list, --cask, "{{ github_runner_macos_host_tailscale_app_cask }}"]
  environment:
    PATH: "{{ github_runner_macos_host_path }}"
  register: github_runner_macos_host_tailscale_app
  changed_when: false
  failed_when: false
  check_mode: false
  when: github_runner_macos_host_tailscale_brew.stat.exists

- name: Work out what there is to keep current
  ansible.builtin.set_fact:
    # The formula's daemon: the definition existed before this run (otherwise the install above just put the latest release there), and the formula is installed. A daemon built by hand has no formula and is never replaced by the formula's.
    github_runner_macos_host_tailscale_formula_managed: >-
      {{ github_runner_macos_host_tailscale_brew.stat.exists
      and github_runner_macos_host_tailscale_formula.stat.exists
      and github_runner_macos_host_tailscale_daemon.stat.exists }}
    github_runner_macos_host_tailscale_app_installed: >-
      {{ github_runner_macos_host_tailscale_brew.stat.exists
      and github_runner_macos_host_tailscale_app.rc == 0 }}

- name: Say that there is nothing to keep current
  ansible.builtin.debug:
    msg: >-
      Tailscale is not updated on {{ inventory_hostname }}: it has neither the Homebrew formula with its system daemon nor the standalone
      app installed as the Homebrew cask {{ github_runner_macos_host_tailscale_app_cask }}.
  when:
    - github_runner_macos_host_tailscale_daemon.stat.exists
    - not github_runner_macos_host_tailscale_formula_managed | bool
    - not github_runner_macos_host_tailscale_app_installed | bool

- name: Refresh Homebrew's index
  # So that latest means the current release. Not a change of the host worth reporting, and not run under --check.
  ansible.builtin.command:
    argv: ["{{ github_runner_macos_host_effective_prefix }}/bin/brew", update, --quiet]
  environment:
    PATH: "{{ github_runner_macos_host_path }}"
  changed_when: false
  when:
    - github_runner_macos_host_tailscale_formula_managed | bool or github_runner_macos_host_tailscale_app_installed | bool
    - not ansible_check_mode

- name: Keep the formula's daemon current
  when: github_runner_macos_host_tailscale_formula_managed | bool
  block:
    - name: Bring the Tailscale formula to its latest release
      # Only the tailscale formula is named, so no other formula is upgraded.
      community.general.homebrew:
        name: tailscale
        state: latest
        path: "{{ github_runner_macos_host_effective_prefix }}/bin"
      environment:
        PATH: "{{ github_runner_macos_host_path }}"
      register: github_runner_macos_host_tailscale_formula_upgrade

    - name: Read the formula's release
      # The first line of tailscaled --version is the release alone.
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_effective_prefix }}/bin/tailscaled", --version]
      register: github_runner_macos_host_tailscale_formula_version
      changed_when: false
      check_mode: false

    - name: Read the installed daemon's release
      # A daemon binary that is missing reads as no release, which differs from the formula's, so the refresh puts it back.
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_tailscale_daemon_binary }}", --version]
      register: github_runner_macos_host_tailscale_daemon_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the running daemon's release
      # Where the daemon path is a link to the formula, the installed binary is the new release as soon as the formula is, and the process is still the old one. A daemon that does not answer reads as no release, and is compared by its binary alone.
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_effective_prefix }}/bin/tailscale", status, --json, --peers=false]
      register: github_runner_macos_host_tailscale_running
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Work out whether the daemon has to be replaced
      ansible.builtin.set_fact:
        github_runner_macos_host_tailscale_refresh_needed: >-
          {{ github_runner_macos_host_tailscale_formula_upgrade is changed
          or (github_runner_macos_host_tailscale_daemon_version.stdout_lines | first | default('') | trim) != (github_runner_macos_host_tailscale_formula_version.stdout_lines | first | trim)
          or (github_runner_macos_host_tailscale_running_version | length > 0
          and github_runner_macos_host_tailscale_running_version != (github_runner_macos_host_tailscale_formula_version.stdout_lines | first | trim)) }}
      vars:
        # The status JSON's Version is the long form, such as 1.2.3-tabcdef-gabcdef: the release is what precedes the first hyphen.
        github_runner_macos_host_tailscale_running_version: >-
          {{ ((github_runner_macos_host_tailscale_running.stdout | from_json).Version | default('') | string).split('-')[0]
          if github_runner_macos_host_tailscale_running.rc == 0 else '' }}

    - name: Replace the tailscaled system daemon with the formula's release
      # Removes the installed daemon and its launchd definition and installs and starts the new ones, which takes root. Never joins a tailnet, and the daemon keeps its login.
      become: true
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_host_effective_prefix }}/bin/tailscaled", install-system-daemon]
      changed_when: true
      when:
        - github_runner_macos_host_tailscale_refresh_needed | bool
        - not ansible_check_mode

    - name: Report the daemon a real run would replace
      ansible.builtin.debug:
        msg: "tailscaled install-system-daemon, to run the formula's release {{ github_runner_macos_host_tailscale_formula_version.stdout_lines | first | trim }} (installed {{ github_runner_macos_host_tailscale_daemon_version.stdout_lines | first | default('none', true) | trim }})"
      changed_when: true
      when:
        - github_runner_macos_host_tailscale_refresh_needed | bool
        - ansible_check_mode

- name: Bring the standalone app to its latest release
  # The app updates itself, so Homebrew does not list the cask as outdated unless asked to be greedy. Upgrading it runs its installer, which uses sudo. Only an installed cask is named here, because this module installs one that is absent.
  community.general.homebrew_cask:
    name: "{{ github_runner_macos_host_tailscale_app_cask }}"
    state: latest
    greedy: true
    path: "{{ github_runner_macos_host_effective_prefix }}/bin"
  environment:
    PATH: "{{ github_runner_macos_host_path }}"
  when: github_runner_macos_host_tailscale_app_installed | bool
