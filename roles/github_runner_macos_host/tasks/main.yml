---
# macOS hosts only. Every part are skipped on any other host, so the role can be applied to a mixed inventory. The tasks that change the host use become (sudo); everything the role only reads runs as the connecting user.

- name: Read which operating system, machine and connecting user the host has
  # Only the platform and user subsets, the cheapest that hold them, and only when the caller did not gather it: a play with gather_facts: false leaves ansible_facts without them. Read-only, so it runs under --check too.
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform
      - user
  when: "'system' not in ansible_facts or 'machine' not in ansible_facts or 'user_id' not in ansible_facts"

- name: Give the connecting user passwordless sudo
  ansible.builtin.include_tasks: sudoers.yml
  when:
    - ansible_facts['system'] == 'Darwin'
    - github_runner_macos_host_sudoers_nopasswd | bool

- name: Keep the Mac awake on AC power
  ansible.builtin.include_tasks: power.yml
  when:
    - ansible_facts['system'] == 'Darwin'
    - github_runner_macos_host_power | bool

- name: Run the host's own Tailscale client as the tailscaled system daemon
  ansible.builtin.include_tasks: tailscale.yml
  when:
    - ansible_facts['system'] == 'Darwin'
    - github_runner_macos_host_tailscale | bool
