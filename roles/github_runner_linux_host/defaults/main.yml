---
# The host-level baseline of a Linux host that carries a k3s node: nothing here touches the node itself, or the Tailscale client. Every variable is checked against meta/argument_specs.yml when the role runs. Every step but the last, the Tailscale update, is off by default, each behind a variable of its own, because each changes how the host behaves for whoever else uses it: a fleet turns them on per host, for a machine that is dedicated to the cluster.

# Whether the host is kept from suspending: sleep.target, suspend.target, hibernate.target and hybrid-sleep.target are masked, so nothing can put it to sleep (a desktop's idle timer, a power button, `systemctl suspend`), and systemd-logind is told to ignore the lid switch, which a laptop would otherwise suspend on whenever its lid closes, with or without an external monitor or power. A host that sleeps drops off the network, so its node leaves the cluster and its runner pods stop.
github_runner_linux_host_keep_awake: false
# The targets masked, which are every way systemd suspends or hibernates the host. A constant, not a setting; a variable only so the tests can narrow it.
github_runner_linux_host_sleep_targets:
  - sleep.target
  - suspend.target
  - hibernate.target
  - hybrid-sleep.target
# The logind settings written to the drop-in, all three ignore: the lid switch on battery, on external power and docked. Constants, not settings.
github_runner_linux_host_lid_switch_settings:
  - HandleLidSwitch
  - HandleLidSwitchExternalPower
  - HandleLidSwitchDocked
# Not settings: where the logind drop-in goes, which systemd-logind reads on top of /etc/systemd/logind.conf. Variables only so the tests can point it at a stand-in.
github_runner_linux_host_logind_dropin: /etc/systemd/logind.conf.d/90-github-runner-keep-awake.conf

# Whether the host's Wi-Fi is kept from power saving. A Wi-Fi radio in power-save mode sleeps between beacons and drops or delays packets, which on a node of the cluster shows as the node flapping NotReady; it matters only for a host that is on Wi-Fi, and does nothing to a host without a Wi-Fi device. On a host whose Wi-Fi NetworkManager manages, NetworkManager is told not to (wifi.powersave = 2, disable) for every connection that does not set its own; on a host without NetworkManager that runs systemd-networkd, a udev rule and a systemd unit run `iw dev <interface> set power_save off` for each Wi-Fi interface when it appears, and iw is installed. Both apply to the radio now. A host where neither stack manages a Wi-Fi device fails.
github_runner_linux_host_wifi_powersave_off: false
# Not settings: where the NetworkManager drop-in goes. The name sorts after Ubuntu's default-wifi-powersave-on.conf (wifi.powersave = 3), because NetworkManager reads its configuration files in alphabetical order and the last one to set a value wins. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_networkmanager_dropin: /etc/NetworkManager/conf.d/zz-github-runner-wifi-powersave.conf
# Not settings: where the sysfs network class is read for the host's Wi-Fi devices, and where the udev rule and the systemd unit template of the systemd-networkd path go. The unit's name must end in @.service, since the rule instantiates it for each interface. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_sysfs_net_dir: /sys/class/net
github_runner_linux_host_wifi_udev_rule: /etc/udev/rules.d/90-github-runner-wifi-powersave.rules
github_runner_linux_host_wifi_powersave_unit: /etc/systemd/system/github-runner-wifi-powersave@.service

# What k3s needs of the kernel (https://docs.k3s.io/installation/requirements and the sysctls kube-proxy and the CNI plugins rely on). true loads the kernel modules now and at boot (a modules-load.d file), and sets the sysctls now and at boot (a sysctl.d file). k3s loads the modules and sets some of the sysctls itself when it starts, but the bridge ones only exist once br_netfilter is loaded, and a host that sets them before k3s starts does not depend on that.
github_runner_linux_host_k3s_prerequisites: false
# The kernel modules loaded. Constants, not settings; variables only so the tests can narrow them. br_netfilter has to be loaded before the bridge sysctls below exist.
github_runner_linux_host_kernel_modules:
  - overlay
  - br_netfilter
# The sysctls set: forwarding, which pod traffic between interfaces needs, and the bridge hooks that make bridged pod traffic pass through iptables, which services' NAT needs. Constants, not settings.
github_runner_linux_host_sysctl_settings:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
# Not settings: where the modules-load.d file, the sysctl.d file and the module directory the role reads loaded modules from are. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_modules_load_file: /etc/modules-load.d/github-runner-k3s.conf
github_runner_linux_host_sysctl_file: /etc/sysctl.d/90-github-runner-k3s.conf
github_runner_linux_host_sys_module_dir: /sys/module

# Whether the host carries the AppArmor profile that lets the processes of one container signal and trace each other under a stacked label, in place of the one containerd generates. Ubuntu 26.04 LTS (kernel 7.0, AppArmor 5) sets kernel.apparmor_restrict_unprivileged_unconfined=1, so with runc unconfined and without CAP_MAC_OVERRIDE the kernel stacks `//&unconfined` onto the label of every container containerd starts (`cri-containerd.apparmor.d//&unconfined`), and the profile k3s's containerd generates allows signals and ptrace only for the plain label: a container's signals to its own processes are denied, a .NET runtime that aborts is denied its SIGABRT as well, and glibc ends in a general protection fault (containerd/containerd issue 14485; PR 14487 adds the two rules this profile adds, and is not merged). containerd loads its own profile only when none of that name is loaded, so the file the role writes to /etc/apparmor.d, which apparmor.service loads at boot before k3s starts, takes its place and survives a reboot. The role loads the profile now when the file changed or the profile is not loaded. Off by default because it replaces a security profile and is needed only where the kernel stacks the label: a Ubuntu 26.04 native k3s node. A host without AppArmor is left alone, with a message. The profile is tied to the containerd of the k3s on the host: the role fails when the host's k3s ships another one than github_runner_linux_host_containerd_apparmor_containerd_version.
github_runner_linux_host_containerd_apparmor_stacking_fix: false
# Not a setting: the containerd version (the k3s-io/containerd tag) the profile's template was taken from, which is the containerd of k3s v1.34.1+k3s1 (its release notes list it). Change it only together with templates/cri-containerd.apparmor.d.j2, after reading the new containerd's contrib/apparmor/template.go and whether it already holds the stacked-peer rules (PR 14487): when it does, the override is no longer needed and the step is turned off instead.
github_runner_linux_host_containerd_apparmor_containerd_version: v2.1.4-k3s2
# Not settings: the profile's name, which is the one containerd gives its CRI containers, and where its file goes (apparmor.service loads every file of /etc/apparmor.d at boot). Variables only so the tests can point the file at a stand-in.
github_runner_linux_host_containerd_apparmor_profile_name: cri-containerd.apparmor.d
github_runner_linux_host_containerd_apparmor_profile_file: /etc/apparmor.d/cri-containerd.apparmor.d
# Not settings: the files the kernel says whether AppArmor is enabled in and which profiles are loaded in. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_apparmor_enabled_file: /sys/module/apparmor/parameters/enabled
github_runner_linux_host_apparmor_profiles_file: /sys/kernel/security/apparmor/profiles
# Not settings: the k3s binary the cluster role installs (github_runner_cluster_native_bin_dir, read from the host's variables with that role's default) and the data directory k3s unpacks itself into. k3s extracts the binary that carries containerd to <data dir>/data/<hash>/bin/k3s when it first starts at a release and points <data dir>/data/current at it, which is where the role reads the containerd version from. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_k3s_binary: "{{ github_runner_cluster_native_bin_dir | default('/usr/local/bin') }}/k3s"
github_runner_linux_host_k3s_data_dir: /var/lib/rancher/k3s

# Whether the battery is kept from charging past github_runner_linux_host_battery_charge_limit_percent, which wears a lithium cell less than sitting at full charge on mains power all day does. The role writes the limit to the battery's charge_control_end_threshold now, and installs a systemd oneshot unit that writes it at every boot, after udev has coldplugged the devices. A host whose battery has no such file (no battery, or firmware that does not offer the limit) is skipped, and says so.
github_runner_linux_host_battery_charge_limit: false
# The percentage the charge stops at, 1 to 100.
github_runner_linux_host_battery_charge_limit_percent: 80
# The battery's name under the power supply directory.
github_runner_linux_host_battery_device: BAT0
# Not settings: where the power supply class is in sysfs, and where the unit that writes the limit at boot goes. Variables only so the tests can point them at a stand-in.
github_runner_linux_host_power_supply_dir: /sys/class/power_supply
github_runner_linux_host_battery_unit: /etc/systemd/system/github-runner-battery-charge-limit.service

# Whether the host runs without a desktop: the default target is set to multi-user.target, and the display manager is stopped and disabled. A desktop session has an idle-suspend of its own, independent of logind and of the lid, and holds memory a node can use; stopping the display manager ends the desktop session.
github_runner_linux_host_headless: false
# Not a setting: the target the host boots to. A variable only so the tests can narrow it.
github_runner_linux_host_default_target: multi-user.target
# The display manager's unit, when the host is to name it. Empty (the default) works it out from the host: each unit of github_runner_linux_host_display_manager_candidates is read in order, an alias reading as the unit it resolves to, and the first that is loaded and active is stopped and disabled, or failing that the first that is loaded and enabled is disabled. A host with none has nothing to stop. A unit set here is used as it is, and the candidates are not read.
github_runner_linux_host_display_manager_unit: ""
# The units tried in order when github_runner_linux_host_display_manager_unit is empty. display-manager.service is first because it is an alias of whichever display manager is enabled, but a release can have the alias unloaded while the display manager itself runs (Ubuntu 26.04 LTS has gdm.service loaded and display-manager.service not), so the display managers' own units follow.
github_runner_linux_host_display_manager_candidates:
  - display-manager.service
  - gdm.service
  - gdm3.service
  - lightdm.service
  - sddm.service

# Whether the units in github_runner_linux_host_unneeded_services are disabled and stopped, those that are enabled or running. A dedicated node needs none of them, and each is a daemon and an attack surface that runs for nothing. avahi-daemon (the .local name a laptop is reached by) and NetworkManager are not in the list, and a service the host does not have is left alone.
github_runner_linux_host_disable_unneeded_services: false
# The units disabled. The socket and path units come first, so that they stop before the service they would start again.
github_runner_linux_host_unneeded_services:
  - cups.socket
  - cups.path
  - cups.service
  - cups-browsed.service
  - bluetooth.service
  - ModemManager.service

# Whether unattended-upgrades is installed and set to install security updates every day without ever rebooting the host: a node must not reboot itself, so Automatic-Reboot is false, and a reboot (when /var/run/reboot-required says one is due) is for github_runner_linux_host_upgrade below, or for whoever has drained the node. Debian and Ubuntu only.
github_runner_linux_host_unattended_upgrades: false
# Not a setting: where the apt configuration the role writes goes. Its name sorts after Ubuntu's 20auto-upgrades and 50unattended-upgrades, so its values win. A variable only so the tests can point it at a stand-in.
github_runner_linux_host_unattended_upgrades_file: /etc/apt/apt.conf.d/52github-runner-unattended-upgrades

# An upgrade on demand, never part of every run, so a fleet leaves it false in host_vars and sets it with -e for the run that does it: apt-get update, dist-upgrade, a reboot when /var/run/reboot-required says one is due, and then autoremove --purge, which removes the kernels the upgrade superseded once the new one is running. Debian and Ubuntu only. Under --check it simulates both apt-get steps, and says whether it would reboot.
github_runner_linux_host_upgrade: false
# Whether the upgrade reboots the host when one is due. false installs the upgrade and says a reboot is due.
github_runner_linux_host_upgrade_reboot: true
# The units whose being active means the host is a running node of the cluster. The upgrade refuses to reboot a host while any is active, unless github_runner_linux_host_upgrade_reboot_running_node is true: draining the node first is the operator's. A Docker node would list docker.service.
github_runner_linux_host_node_services:
  - k3s-agent.service
  - k3s.service
# Whether the upgrade may reboot a host whose node service is active. The reboot takes the node off the cluster until it comes back, and fails the jobs its runner pods are running.
github_runner_linux_host_upgrade_reboot_running_node: false
# How long the reboot waits for the host to come back, in seconds; ansible.builtin.reboot's own default.
github_runner_linux_host_reboot_timeout: 600
# Not a setting: the file Debian and Ubuntu create when an upgrade needs a reboot. A variable only so the tests can point it at a stand-in.
github_runner_linux_host_reboot_required_file: /var/run/reboot-required

# Whether the host's Tailscale client is kept current, the one step that is on by default because it installs nothing and changes only what the host already runs: when the package tailscale is installed (from Tailscale's apt repository, https://tailscale.com/kb/1031/install-linux) and apt has a newer release of it, only that package is upgraded (apt-get install --only-upgrade tailscale, never a blanket upgrade), and the tailscaled service is enabled and started if it is not. A host without the package, and one that is not Debian or Ubuntu, is skipped with a message, and the role never installs the package, joins a tailnet or logs in. A native node of the cluster is skipped too, because the cluster role installs the release it pins there (github_runner_cluster_tailscale_version) and would put it back on the same run. The upgrade restarts a running tailscaled, which keeps its login and drops the host's tailnet connections for a moment. Under --check each change is reported and none is made.
github_runner_linux_host_tailscale_update: true
