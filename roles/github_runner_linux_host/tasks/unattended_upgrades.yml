---
# Installs unattended-upgrades and sets it to install updates from the distribution's security pocket every day, and never to reboot the host. Debian and Ubuntu only. Idempotent, and under --check each change is reported and none is made.

- name: Fail unless the host is a Debian or Ubuntu host
  ansible.builtin.fail:
    msg: >-
      github_runner_linux_host_unattended_upgrades needs apt, and {{ inventory_hostname }} is a {{ ansible_facts['os_family'] }} host.
      Nothing was changed.
  when: ansible_facts['os_family'] != 'Debian'

- name: Read whether unattended-upgrades is installed
  ansible.builtin.command:
    argv: [dpkg-query, "--showformat=${db:Status-Abbrev}", --show, unattended-upgrades]
  register: github_runner_linux_host_unattended_package
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install unattended-upgrades
  become: true
  ansible.builtin.command:
    argv: [apt-get, install, --yes, --no-install-recommends, unattended-upgrades]
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when:
    - github_runner_linux_host_unattended_package.stdout | trim != 'ii'
    - not ansible_check_mode

- name: Report the package install a real run would make
  ansible.builtin.debug:
    msg: "apt-get install unattended-upgrades"
  changed_when: true
  when:
    - github_runner_linux_host_unattended_package.stdout | trim != 'ii'
    - ansible_check_mode

- name: Write the unattended-upgrades configuration
  become: true
  ansible.builtin.template:
    src: unattended-upgrades.conf.j2
    dest: "{{ github_runner_linux_host_unattended_upgrades_file }}"
    mode: "0644"
