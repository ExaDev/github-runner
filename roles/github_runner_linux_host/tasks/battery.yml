---
# Limits the battery's charge to github_runner_linux_host_battery_charge_limit_percent: writes the limit to charge_control_end_threshold now, and installs a systemd oneshot unit that writes it at every boot, since the attribute does not survive a reboot. A host whose battery has no such file is skipped, and says so. Idempotent, and under --check each change is reported and none is made.

- name: Fail if the charge limit is not a percentage
  ansible.builtin.fail:
    msg: >-
      github_runner_linux_host_battery_charge_limit_percent is '{{ github_runner_linux_host_battery_charge_limit_percent }}';
      it must be a whole number from 1 to 100. Nothing was changed.
  when: github_runner_linux_host_battery_charge_limit_percent | int < 1 or github_runner_linux_host_battery_charge_limit_percent | int > 100

- name: Look for the battery's charge limit attribute
  vars:
    github_runner_linux_host_battery_attribute: "{{ github_runner_linux_host_power_supply_dir }}/{{ github_runner_linux_host_battery_device }}/charge_control_end_threshold"
  ansible.builtin.stat:
    path: "{{ github_runner_linux_host_battery_attribute }}"
  register: github_runner_linux_host_battery

- name: Say that the host's battery cannot be limited
  ansible.builtin.debug:
    msg: >-
      {{ github_runner_linux_host_power_supply_dir }}/{{ github_runner_linux_host_battery_device }}/charge_control_end_threshold does not exist
      on {{ inventory_hostname }} (no battery, or firmware that does not offer a charge limit), so its charge is left alone.
  when: not github_runner_linux_host_battery.stat.exists

- name: Limit the battery's charge
  when: github_runner_linux_host_battery.stat.exists
  vars:
    github_runner_linux_host_battery_attribute: "{{ github_runner_linux_host_power_supply_dir }}/{{ github_runner_linux_host_battery_device }}/charge_control_end_threshold"
  block:
    - name: Read the limit now
      ansible.builtin.command:
        argv: [cat, "{{ github_runner_linux_host_battery_attribute }}"]
      register: github_runner_linux_host_battery_now
      changed_when: false
      check_mode: false

    - name: Write the limit
      # tee, not a file module: sysfs takes a write to the attribute, not a rename over it.
      become: true
      ansible.builtin.command:
        argv: [tee, "{{ github_runner_linux_host_battery_attribute }}"]
        stdin: "{{ github_runner_linux_host_battery_charge_limit_percent }}"
      register: github_runner_linux_host_battery_written
      changed_when: true
      when:
        - github_runner_linux_host_battery_now.stdout | trim != github_runner_linux_host_battery_charge_limit_percent | string
        - not ansible_check_mode

    - name: Report the limit a real run would write
      ansible.builtin.debug:
        msg: "write {{ github_runner_linux_host_battery_charge_limit_percent }} to {{ github_runner_linux_host_battery_attribute }} (it is {{ github_runner_linux_host_battery_now.stdout | trim }})"
      changed_when: true
      when:
        - github_runner_linux_host_battery_now.stdout | trim != github_runner_linux_host_battery_charge_limit_percent | string
        - ansible_check_mode

    - name: Write the unit that writes the limit at boot
      become: true
      ansible.builtin.template:
        src: battery-charge-limit.service.j2
        dest: "{{ github_runner_linux_host_battery_unit }}"
        mode: "0644"
      register: github_runner_linux_host_battery_unit_file

    - name: Reload systemd when the unit changed
      become: true
      ansible.builtin.command:
        argv: [systemctl, daemon-reload]
      changed_when: true
      when:
        - github_runner_linux_host_battery_unit_file is changed
        - not ansible_check_mode

    - name: Read whether the unit is enabled
      ansible.builtin.command:
        argv: [systemctl, is-enabled, "{{ github_runner_linux_host_battery_unit | basename }}"]
      register: github_runner_linux_host_battery_enabled
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Enable the unit
      # Not started: the limit was written above, for this boot, and the unit is the boot-time write.
      become: true
      ansible.builtin.command:
        argv: [systemctl, enable, "{{ github_runner_linux_host_battery_unit | basename }}"]
      changed_when: true
      when:
        - github_runner_linux_host_battery_enabled.stdout | trim != 'enabled'
        - not ansible_check_mode

    - name: Report the unit a real run would enable
      ansible.builtin.debug:
        msg: "systemctl enable {{ github_runner_linux_host_battery_unit | basename }}"
      changed_when: true
      when:
        - github_runner_linux_host_battery_enabled.stdout | trim != 'enabled'
        - ansible_check_mode
