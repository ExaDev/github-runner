---
# Tells NetworkManager not to power-save Wi-Fi, as a drop-in that sets the default for every connection that does not set its own (which NetworkManager applies each time it activates a connection), and switches power save off on the radio now. Included with github_runner_linux_host_wifi_devices set to the Wi-Fi devices NetworkManager manages. Idempotent, and under --check the change is reported and not made.

- name: Create the directory of the NetworkManager drop-in
  become: true
  ansible.builtin.file:
    path: "{{ github_runner_linux_host_networkmanager_dropin | dirname }}"
    state: directory
    mode: "0755"

- name: Write the drop-in
  become: true
  ansible.builtin.copy:
    content: |
      # Managed by the exadev.github_runner collection's github_runner_linux_host role. Do not edit by hand.
      # 2 is NM_SETTING_WIRELESS_POWERSAVE_DISABLE. The name sorts after default-wifi-powersave-on.conf, which sets 3.
      [connection]
      wifi.powersave = 2
    dest: "{{ github_runner_linux_host_networkmanager_dropin }}"
    mode: "0644"
  register: github_runner_linux_host_networkmanager

- name: Make NetworkManager read the drop-in
  become: true
  ansible.builtin.command:
    argv: [nmcli, general, reload, conf]
  changed_when: true
  when:
    - github_runner_linux_host_networkmanager is changed
    - not ansible_check_mode

- name: Switch power save off on the radio now
  # `nmcli device reapply` and the reload above leave a running radio as it is: NetworkManager sets power save when it activates a connection. A host without iw is reported below.
  ansible.builtin.include_tasks: wifi_powersave_radio.yml

- name: Say that the radio could not be read, so the setting applies when NetworkManager next activates the connection
  ansible.builtin.debug:
    msg: "iw cannot read {{ item.item }}'s power save ({{ item.msg | default(item.stderr) | default('no output') | trim }}); the drop-in applies when NetworkManager next activates its connection, or after a reboot."
  loop: "{{ github_runner_linux_host_power_save.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
