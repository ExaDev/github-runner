---
# Linux hosts only. Every step but the last, the Tailscale update, is off by default, each behind a variable of its own, and every one is skipped on any other host, so the role can be applied to a mixed inventory. The tasks that change the host use become (sudo); everything the role only reads runs as the connecting user.

- name: Read which operating system the host has
  # Only the platform subset, the cheapest that holds it, and only when the caller did not gather it: a play with gather_facts: false leaves ansible_facts without it. Read-only, so it runs under --check too.
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform
      - distribution
  when: "'system' not in ansible_facts or 'os_family' not in ansible_facts"

- name: Keep the host from suspending
  ansible.builtin.include_tasks: keep_awake.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_keep_awake | bool

- name: Keep the host's Wi-Fi from power saving
  ansible.builtin.include_tasks: wifi_powersave.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_wifi_powersave_off | bool

- name: Make the host ready for k3s
  ansible.builtin.include_tasks: k3s_prerequisites.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_k3s_prerequisites | bool

- name: Let a container's processes signal each other under a stacked AppArmor label
  ansible.builtin.include_tasks: containerd_apparmor.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_containerd_apparmor_stacking_fix | bool

- name: Limit the battery's charge
  ansible.builtin.include_tasks: battery.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_battery_charge_limit | bool

- name: Run the host without a desktop
  ansible.builtin.include_tasks: headless.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_headless | bool

- name: Disable the services a dedicated node does not need
  ansible.builtin.include_tasks: services.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_disable_unneeded_services | bool

- name: Set up security updates that never reboot the host
  ansible.builtin.include_tasks: unattended_upgrades.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_unattended_upgrades | bool

- name: Upgrade the packages, and reboot if the upgrade needs it
  ansible.builtin.include_tasks: upgrade.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_upgrade | bool

- name: Keep the host's Tailscale client current
  ansible.builtin.include_tasks: tailscale_update.yml
  when:
    - ansible_facts['system'] == 'Linux'
    - github_runner_linux_host_tailscale_update | bool
