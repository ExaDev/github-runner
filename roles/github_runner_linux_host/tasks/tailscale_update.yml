---
# Keeps the Tailscale client the host already has current, and installs nothing: when the package tailscale is installed and apt has a newer release of it, only that package is upgraded (apt-get install --only-upgrade tailscale, never a blanket upgrade), and the tailscaled service is enabled and running. Tailscale's own packages enable and start the service and restart a running one on upgrade, keeping its login (https://tailscale.com/kb/1031/install-linux), and the vendor's apt repository is the one that carries newer releases. Debian and Ubuntu only, since the package is apt's; any other host, and a host without the package, is skipped with a message and the run does not fail. This never joins or logs in to a tailnet. Under --check each change is reported and none is made.

- name: Say that a host without apt is skipped
  ansible.builtin.debug:
    msg: "Tailscale is not updated on {{ inventory_hostname }}: it is a {{ ansible_facts['os_family'] }} host, and the package is apt's."
  when: ansible_facts['os_family'] != 'Debian'

- name: Keep the Tailscale package current
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Read whether the Tailscale package is installed
      ansible.builtin.command:
        argv: [dpkg-query, "--showformat=${db:Status-Abbrev}", --show, tailscale]
      register: github_runner_linux_host_tailscale_package
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Work out whether the cluster role holds the package at a release of its own
      # A native node's cluster role installs the pinned release and brings a host back to it with --allow-downgrades on every run, so a newer release put here would be replaced by the pin on the same run, and the client restarted both times. Both variables are the cluster role's: the first is read from the host's variables, and the second is that role's default when the host does not set it.
      ansible.builtin.set_fact:
        github_runner_linux_host_tailscale_pinned: "{{ (github_runner_cluster_node_mode | default('compose')) == 'native' and (github_runner_cluster_native_tailscale_install | default(true) | bool) }}"

    - name: Say that there is no Tailscale package to keep current
      ansible.builtin.debug:
        msg: "Tailscale is not updated on {{ inventory_hostname }}: the package tailscale is not installed, and this never installs it."
      when: github_runner_linux_host_tailscale_package.stdout | trim != 'ii'

    - name: Say that the cluster role holds the package
      ansible.builtin.debug:
        msg: >-
          Tailscale is not updated on {{ inventory_hostname }}: it is a native node of the cluster, whose cluster role installs the release it
          pins (github_runner_cluster_tailscale_version), so the pin decides the release.
      when:
        - github_runner_linux_host_tailscale_package.stdout | trim == 'ii'
        - github_runner_linux_host_tailscale_pinned | bool

    - name: Keep the installed package current
      when:
        - github_runner_linux_host_tailscale_package.stdout | trim == 'ii'
        - not github_runner_linux_host_tailscale_pinned | bool
      block:
        - name: Refresh the package index
          # So that the newest release the repository carries is the candidate. Not a change of the host worth reporting, and not run under --check.
          become: true
          ansible.builtin.command:
            argv: [apt-get, update]
          environment:
            DEBIAN_FRONTEND: noninteractive
          changed_when: false
          when: not ansible_check_mode

        - name: Read the installed and the newest release of the package
          ansible.builtin.command:
            argv: [apt-cache, policy, tailscale]
          register: github_runner_linux_host_tailscale_policy
          changed_when: false
          check_mode: false

        - name: Read the installed and the newest release out of that
          ansible.builtin.set_fact:
            github_runner_linux_host_tailscale_installed: "{{ github_runner_linux_host_tailscale_policy.stdout | regex_search('Installed: (\\S+)', '\\1') | first | default('(none)') }}"
            github_runner_linux_host_tailscale_candidate: "{{ github_runner_linux_host_tailscale_policy.stdout | regex_search('Candidate: (\\S+)', '\\1') | first | default('(none)') }}"

        - name: Work out whether the newest release is newer than the installed one
          # (none) is what apt-cache policy prints as the candidate when no repository carries the package. dpkg orders the versions, since a candidate older than the installed release (a package installed from a file) is not an upgrade.
          ansible.builtin.command:
            argv: [dpkg, --compare-versions, "{{ github_runner_linux_host_tailscale_candidate }}", gt, "{{ github_runner_linux_host_tailscale_installed }}"]
          register: github_runner_linux_host_tailscale_newer
          changed_when: false
          failed_when: github_runner_linux_host_tailscale_newer.rc not in [0, 1]
          check_mode: false
          when: github_runner_linux_host_tailscale_candidate != '(none)'

        - name: Work out the upgrade
          ansible.builtin.set_fact:
            github_runner_linux_host_tailscale_upgrade_needed: "{{ github_runner_linux_host_tailscale_newer is not skipped and github_runner_linux_host_tailscale_newer.rc == 0 }}"

        - name: Upgrade the Tailscale package
          # Only the one package is named, and --only-upgrade never installs it. The package's scripts restart a running tailscaled, which keeps its login.
          become: true
          ansible.builtin.command:
            argv: [apt-get, install, --yes, --no-install-recommends, --only-upgrade, tailscale]
          environment:
            DEBIAN_FRONTEND: noninteractive
          changed_when: true
          when:
            - github_runner_linux_host_tailscale_upgrade_needed | bool
            - not ansible_check_mode

        - name: Report the package upgrade a real run would make
          ansible.builtin.debug:
            msg: "apt-get install --only-upgrade tailscale, from {{ github_runner_linux_host_tailscale_installed }} to {{ github_runner_linux_host_tailscale_candidate }}"
          changed_when: true
          when:
            - github_runner_linux_host_tailscale_upgrade_needed | bool
            - ansible_check_mode

        - name: Read whether the Tailscale service is enabled and running
          # One read each; either missing needs the service enabled and started.
          ansible.builtin.command:
            argv: [systemctl, "{{ item }}", tailscaled]
          loop: [is-enabled, is-active]
          register: github_runner_linux_host_tailscaled_state
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Enable and start the Tailscale service
          become: true
          ansible.builtin.command:
            argv: [systemctl, enable, --now, tailscaled]
          changed_when: true
          when:
            - github_runner_linux_host_tailscaled_state.results | map(attribute='rc') | select('ne', 0) | list | length > 0
            - not ansible_check_mode

        - name: Report the service change a real run would make
          ansible.builtin.debug:
            msg: "systemctl enable --now tailscaled"
          changed_when: true
          when:
            - github_runner_linux_host_tailscaled_state.results | map(attribute='rc') | select('ne', 0) | list | length > 0
            - ansible_check_mode
