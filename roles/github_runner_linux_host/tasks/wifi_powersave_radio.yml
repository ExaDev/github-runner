---
# Switches power save off on the radio of each device in github_runner_linux_host_wifi_devices that has it on, so the setting holds now and not only from the next time the host's network stack brings the device up. Needs iw. Registers github_runner_linux_host_power_save for the includer, which decides what a device iw cannot read means. Idempotent, and under --check the change is reported and not made.

- name: Read whether each Wi-Fi device is power saving now
  # iw reads and sets it on the radio itself, with no change to the link, so an SSH session over it survives.
  ansible.builtin.command:
    argv: [iw, dev, "{{ item }}", get, power_save]
  loop: "{{ github_runner_linux_host_wifi_devices }}"
  register: github_runner_linux_host_power_save
  changed_when: false
  failed_when: false
  check_mode: false

- name: Switch power save off on each Wi-Fi device that has it on
  become: true
  ansible.builtin.command:
    argv: [iw, dev, "{{ item.item }}", set, power_save, "off"]
  loop: "{{ github_runner_linux_host_power_save.results | selectattr('rc', 'equalto', 0) | selectattr('stdout', 'search', 'Power save: on') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: not ansible_check_mode

- name: Report the devices a real run would switch power save off on
  ansible.builtin.debug:
    msg: "iw dev {{ item.item }} set power_save off"
  loop: "{{ github_runner_linux_host_power_save.results | selectattr('rc', 'equalto', 0) | selectattr('stdout', 'search', 'Power save: on') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true
  when: ansible_check_mode
