---
# Keeps Wi-Fi from power saving on a host whose network stack is systemd-networkd (Ubuntu Server's netplan renderer), where nothing configures it: neither systemd.network, systemd.link nor netplan has a power save setting, and the kernel's per-interface preference is set with iw. So a udev rule has systemd start a oneshot unit, github-runner-wifi-powersave@<interface>.service, each time a Wi-Fi interface appears, which runs `iw dev <interface> set power_save off`; the unit is ordered after udev has finished with the interface, so it runs on the interface's name after any rename, and being a unit it has a status and a journal. The rule matches every Wi-Fi interface, so a device that appears later is covered without the role running again. The preference stays set across a reconnect (the driver keeps it, which brcmfmac stores in its own state and applies each time it brings the firmware up) and is lost only when the interface goes away, when the unit runs again as the interface comes back. The radio is also switched off now, since the unit has not run for an interface that is already up. Included with github_runner_linux_host_wifi_devices set to the host's Wi-Fi interfaces. Installs iw, with apt. Idempotent, and under --check each change is reported and none is made.

- name: Fail unless the host is a Debian or Ubuntu host
  ansible.builtin.fail:
    msg: >-
      github_runner_linux_host_wifi_powersave_off needs iw on a host without NetworkManager, installed with apt, and {{ inventory_hostname }} is a {{ ansible_facts['os_family'] }} host.
      Nothing was changed.
  when: ansible_facts['os_family'] != 'Debian'

- name: Read whether iw is installed
  ansible.builtin.command:
    argv: [dpkg-query, "--showformat=${db:Status-Abbrev}", --show, iw]
  register: github_runner_linux_host_iw_package
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install iw
  become: true
  ansible.builtin.command:
    argv: [apt-get, install, --yes, --no-install-recommends, iw]
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: true
  when:
    - github_runner_linux_host_iw_package.stdout | trim != 'ii'
    - not ansible_check_mode

- name: Report the package install a real run would make
  ansible.builtin.debug:
    msg: "apt-get install iw"
  changed_when: true
  when:
    - github_runner_linux_host_iw_package.stdout | trim != 'ii'
    - ansible_check_mode

- name: Write the unit that switches power save off on an interface
  become: true
  ansible.builtin.template:
    src: wifi-powersave.service.j2
    dest: "{{ github_runner_linux_host_wifi_powersave_unit }}"
    mode: "0644"
  register: github_runner_linux_host_wifi_unit

- name: Make systemd read the unit
  become: true
  ansible.builtin.command:
    argv: [systemctl, daemon-reload]
  changed_when: true
  when:
    - github_runner_linux_host_wifi_unit is changed
    - not ansible_check_mode

- name: Write the udev rule that starts the unit for each Wi-Fi interface
  become: true
  ansible.builtin.template:
    src: wifi-powersave.rules.j2
    dest: "{{ github_runner_linux_host_wifi_udev_rule }}"
    mode: "0644"
  register: github_runner_linux_host_wifi_rule

- name: Make udev read the rule
  become: true
  ansible.builtin.command:
    argv: [udevadm, control, --reload]
  changed_when: true
  when:
    - github_runner_linux_host_wifi_rule is changed
    - not ansible_check_mode

- name: Switch power save off on the radio now
  # Under --check with iw not yet installed there is nothing to read the radio with: the install above is what a real run would make first.
  ansible.builtin.include_tasks: wifi_powersave_radio.yml
  when: github_runner_linux_host_iw_package.stdout | trim == 'ii' or not ansible_check_mode

- name: Fail if iw cannot read a Wi-Fi device
  ansible.builtin.fail:
    msg: >-
      iw cannot read {{ item.item }}'s power save on {{ inventory_hostname }}
      ({{ item.msg | default(item.stderr) | default('no output') | trim }}). The unit and the rule are in place, but the radio was not changed.
  loop: "{{ github_runner_linux_host_power_save.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  when: github_runner_linux_host_iw_package.stdout | trim == 'ii' or not ansible_check_mode
