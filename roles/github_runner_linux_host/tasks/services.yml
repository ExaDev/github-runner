---
# Disables the units in github_runner_linux_host_unneeded_services that are enabled, and stops those that are running. A unit the host does not have reads as neither, and is left alone. Idempotent, and under --check each change is reported and none is made.

- name: Read whether each unit is enabled
  ansible.builtin.command:
    argv: [systemctl, is-enabled, "{{ item }}"]
  loop: "{{ github_runner_linux_host_unneeded_services }}"
  register: github_runner_linux_host_service_enabled
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read whether each unit is running
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop: "{{ github_runner_linux_host_unneeded_services }}"
  register: github_runner_linux_host_service_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out which units to disable and which to stop
  ansible.builtin.set_fact:
    github_runner_linux_host_services_to_disable: "{{ github_runner_linux_host_service_enabled.results | selectattr('stdout', 'eq', 'enabled') | map(attribute='item') | list }}"
    github_runner_linux_host_services_to_stop: "{{ github_runner_linux_host_service_active.results | selectattr('stdout', 'eq', 'active') | map(attribute='item') | list }}"

- name: Disable the units that are enabled
  become: true
  ansible.builtin.command:
    argv: [systemctl, disable, "{{ item }}"]
  loop: "{{ github_runner_linux_host_services_to_disable }}"
  changed_when: true
  when: not ansible_check_mode

- name: Stop the units that are running
  become: true
  ansible.builtin.command:
    argv: [systemctl, stop, "{{ item }}"]
  loop: "{{ github_runner_linux_host_services_to_stop }}"
  changed_when: true
  when: not ansible_check_mode

- name: Report the units a real run would disable
  ansible.builtin.debug:
    msg: "systemctl disable {{ item }}"
  loop: "{{ github_runner_linux_host_services_to_disable }}"
  changed_when: true
  when: ansible_check_mode

- name: Report the units a real run would stop
  ansible.builtin.debug:
    msg: "systemctl stop {{ item }}"
  loop: "{{ github_runner_linux_host_services_to_stop }}"
  changed_when: true
  when: ansible_check_mode
