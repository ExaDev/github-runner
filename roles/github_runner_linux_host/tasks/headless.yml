---
# Makes the host boot without a desktop: sets the default target to multi-user.target, and stops and disables the display manager. A desktop session has an idle suspend of its own, independent of logind and of the lid, so it can suspend a host that keep_awake has made ignore its lid. Stopping the display manager ends the desktop session.
#
# Which unit the display manager is gets worked out from the host, since the alias display-manager.service is not a reliable name for it: disabling the alias removes its link, after which it is not loaded and cannot be stopped (systemctl stop exits 5), and a release can load only the display manager's own unit (gdm.service). So github_runner_linux_host_display_manager_unit, when set, names the unit and is used as it is; otherwise each of github_runner_linux_host_display_manager_candidates is read in order (an alias reads as the unit it resolves to) and the first that is loaded and active is the display manager, or failing that the first that is loaded and enabled, which is a display manager an earlier run stopped and left enabled. A host with none has nothing to stop or disable, and the role says so. The display manager is stopped before it is disabled, so a name that is an alias is still loaded when it is stopped. Idempotent, and under --check each change is reported and none is made.

- name: Read the default target
  ansible.builtin.command:
    argv: [systemctl, get-default]
  register: github_runner_linux_host_default_target_read
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the state of each unit the display manager may be
  # systemctl show exits 0 for a unit that does not exist and says so in LoadState, so a failure here is a real one.
  ansible.builtin.command:
    argv: [systemctl, show, "--property=Id,LoadState,ActiveState,UnitFileState", "{{ item }}"]
  loop: "{{ [github_runner_linux_host_display_manager_unit] if github_runner_linux_host_display_manager_unit | length > 0 else github_runner_linux_host_display_manager_candidates }}"
  register: github_runner_linux_host_display_manager_read
  changed_when: false
  check_mode: false

- name: Work out what the host needs
  vars:
    # Each unit's Key=value lines read as YAML, in the order of the candidates.
    loaded: "{{ github_runner_linux_host_display_manager_read.results | map(attribute='stdout') | map('replace', '=', ': ') | map('from_yaml') | selectattr('LoadState', 'eq', 'loaded') | list }}"
    chosen: "{{ ((loaded | selectattr('ActiveState', 'in', ['active', 'activating']) | list) + (loaded | selectattr('UnitFileState', 'in', ['enabled', 'alias']) | list)) | first | default({}) }}"
  ansible.builtin.set_fact:
    github_runner_linux_host_needs_target: "{{ github_runner_linux_host_default_target_read.stdout | trim != github_runner_linux_host_default_target }}"
    github_runner_linux_host_display_manager_found: "{{ chosen | length > 0 }}"
    github_runner_linux_host_display_manager_name: "{{ github_runner_linux_host_display_manager_unit if github_runner_linux_host_display_manager_unit | length > 0 else chosen.Id | default('') }}"
    github_runner_linux_host_needs_dm_stopped: "{{ chosen.ActiveState | default('') in ['active', 'activating'] }}"
    github_runner_linux_host_needs_dm_disabled: "{{ chosen.UnitFileState | default('') in ['enabled', 'alias'] }}"

- name: Boot to the multi-user target
  become: true
  ansible.builtin.command:
    argv: [systemctl, set-default, "{{ github_runner_linux_host_default_target }}"]
  changed_when: true
  when:
    - github_runner_linux_host_needs_target | bool
    - not ansible_check_mode

- name: Stop the display manager
  become: true
  ansible.builtin.command:
    argv: [systemctl, stop, "{{ github_runner_linux_host_display_manager_name }}"]
  changed_when: true
  when:
    - github_runner_linux_host_needs_dm_stopped | bool
    - not ansible_check_mode

- name: Disable the display manager
  become: true
  ansible.builtin.command:
    argv: [systemctl, disable, "{{ github_runner_linux_host_display_manager_name }}"]
  changed_when: true
  when:
    - github_runner_linux_host_needs_dm_disabled | bool
    - not ansible_check_mode

- name: Report that the host has no display manager to stop or disable
  ansible.builtin.debug:
    msg: "No display manager is active or enabled among {{ [github_runner_linux_host_display_manager_unit] if github_runner_linux_host_display_manager_unit | length > 0 else github_runner_linux_host_display_manager_candidates }}: nothing to stop or disable"
  when: not github_runner_linux_host_display_manager_found | bool

- name: Report what a real run would do
  ansible.builtin.debug:
    msg: "{{ item.msg }}"
  loop:
    - {when: "{{ github_runner_linux_host_needs_target }}", msg: "systemctl set-default {{ github_runner_linux_host_default_target }}"}
    - {when: "{{ github_runner_linux_host_needs_dm_stopped }}", msg: "systemctl stop {{ github_runner_linux_host_display_manager_name }}"}
    - {when: "{{ github_runner_linux_host_needs_dm_disabled }}", msg: "systemctl disable {{ github_runner_linux_host_display_manager_name }}"}
  loop_control:
    label: "{{ item.msg }}"
  changed_when: true
  when:
    - ansible_check_mode
    - item.when | bool
