---
# An upgrade on demand, never part of every run: apt-get update, dist-upgrade, a reboot when the upgrade needs one, and then autoremove --purge. The autoremove comes after the reboot, because it can only remove the kernels the upgrade superseded once the new one is the running kernel. Debian and Ubuntu only. The reboot is the dangerous part, so it is guarded: a host whose node service is active is a running node of the cluster, and is never rebooted unless github_runner_linux_host_upgrade_reboot_running_node says so (draining it first is the operator's to do, and this only refuses). Under --check both apt-get steps run with --simulate, the update step is not run, and the reboot is reported and not made.

- name: Fail unless the host is a Debian or Ubuntu host
  ansible.builtin.fail:
    msg: >-
      github_runner_linux_host_upgrade needs apt, and {{ inventory_hostname }} is a {{ ansible_facts['os_family'] }} host.
      Nothing was changed.
  when: ansible_facts['os_family'] != 'Debian'

- name: Refresh the package index
  become: true
  ansible.builtin.command:
    argv: [apt-get, update]
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false
  when: not ansible_check_mode

- name: Upgrade the packages
  # --simulate under --check reads the same dependency resolution and changes nothing, so the report is what the upgrade would do. apt-get says "0 upgraded, 0 newly installed, 0 to remove" when there is nothing to do.
  become: true
  ansible.builtin.command:
    argv: "{{ ['apt-get', '--yes'] + (['--simulate'] if ansible_check_mode else []) + ['dist-upgrade'] }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: github_runner_linux_host_dist_upgrade
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in github_runner_linux_host_dist_upgrade.stdout"
  check_mode: false

- name: Read whether the upgrade needs a reboot
  ansible.builtin.stat:
    path: "{{ github_runner_linux_host_reboot_required_file }}"
  register: github_runner_linux_host_reboot_required

- name: Read whether the host is a running node of the cluster
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ item }}"]
  loop: "{{ github_runner_linux_host_node_services }}"
  register: github_runner_linux_host_node_state
  changed_when: false
  failed_when: false
  check_mode: false
  when: github_runner_linux_host_reboot_required.stat.exists

- name: Work out whether to reboot
  ansible.builtin.set_fact:
    github_runner_linux_host_reboot_due: "{{ github_runner_linux_host_reboot_required.stat.exists }}"
    github_runner_linux_host_running_node: "{{ github_runner_linux_host_node_state.results | default([]) | selectattr('stdout', 'defined') | selectattr('stdout', 'eq', 'active') | map(attribute='item') | list }}"

- name: Say that a reboot is due and not made
  ansible.builtin.debug:
    msg: >-
      {{ github_runner_linux_host_reboot_required_file }} exists on {{ inventory_hostname }}, so the upgrade needs a reboot, and
      github_runner_linux_host_upgrade_reboot is false: the host was not rebooted.
  when:
    - github_runner_linux_host_reboot_due | bool
    - not github_runner_linux_host_upgrade_reboot | bool

- name: Refuse to reboot a running node of the cluster
  ansible.builtin.fail:
    msg: >-
      The upgrade needs a reboot ({{ github_runner_linux_host_reboot_required_file }} exists), and {{ inventory_hostname }} is a running node of
      the cluster ({{ github_runner_linux_host_running_node | join(', ') }} active): rebooting it takes the node off the cluster and fails the jobs
      its runner pods are running. The packages are upgraded and nothing was rebooted. Drain the node and stop its service and run again, or set
      github_runner_linux_host_upgrade_reboot_running_node: true for that run.
  when:
    - github_runner_linux_host_reboot_due | bool
    - github_runner_linux_host_upgrade_reboot | bool
    - github_runner_linux_host_running_node | length > 0
    - not github_runner_linux_host_upgrade_reboot_running_node | bool

- name: Report the reboot a real run would make
  ansible.builtin.debug:
    msg: "reboot {{ inventory_hostname }}: {{ github_runner_linux_host_reboot_required_file }} exists"
  changed_when: true
  when:
    - github_runner_linux_host_reboot_due | bool
    - github_runner_linux_host_upgrade_reboot | bool
    - ansible_check_mode

- name: Reboot the host and check it came back
  when:
    - github_runner_linux_host_reboot_due | bool
    - github_runner_linux_host_upgrade_reboot | bool
    - not ansible_check_mode
  block:
    - name: Read the running kernel
      ansible.builtin.command:
        argv: [uname, -r]
      register: github_runner_linux_host_kernel_before
      changed_when: false
      check_mode: false

    - name: Reboot
      become: true
      ansible.builtin.reboot:
        reboot_timeout: "{{ github_runner_linux_host_reboot_timeout | int }}"
        msg: "Reboot initiated by Ansible, for the upgrade"
        # The host is back when the boot is a new one and it has reached multi-user.target.
        test_command: systemctl is-active multi-user.target

    - name: Read the running kernel again
      ansible.builtin.command:
        argv: [uname, -r]
      register: github_runner_linux_host_kernel_after
      changed_when: false

    - name: Read whether the reboot is still due
      ansible.builtin.stat:
        path: "{{ github_runner_linux_host_reboot_required_file }}"
      register: github_runner_linux_host_reboot_after

    - name: Fail if the host is still waiting for a reboot
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} was rebooted and {{ github_runner_linux_host_reboot_required_file }} still exists (the kernel is
          {{ github_runner_linux_host_kernel_before.stdout | trim }} before and {{ github_runner_linux_host_kernel_after.stdout | trim }} after).
      when: github_runner_linux_host_reboot_after.stat.exists

- name: Remove the packages and kernels the upgrade left unused
  # After the reboot, when the superseded kernel is no longer the running one. --purge removes their configuration too.
  become: true
  ansible.builtin.command:
    argv: "{{ ['apt-get', '--yes'] + (['--simulate'] if ansible_check_mode else []) + ['autoremove', '--purge'] }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: github_runner_linux_host_autoremove
  changed_when: "'0 upgraded, 0 newly installed, 0 to remove' not in github_runner_linux_host_autoremove.stdout"
  check_mode: false
