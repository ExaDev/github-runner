---
# Keeps Wi-Fi from power saving, through whichever network stack manages the host's Wi-Fi device: NetworkManager (wifi_powersave_networkmanager.yml) when it manages one, else systemd-networkd (wifi_powersave_networkd.yml) when it is running and the kernel has a Wi-Fi device. Does nothing on a host that has no Wi-Fi device and a stack that answers, and fails on a host where neither stack manages a Wi-Fi device (the setting is explicitly asked for). Idempotent, and under --check the change is reported and not made.

- name: Read the host's Wi-Fi devices from NetworkManager
  # The devices NetworkManager lists with their type and state, one per line. A device it lists as unmanaged is not its to configure, and a host without NetworkManager has no nmcli, which is reported below.
  ansible.builtin.command:
    argv: [nmcli, --terse, --fields, "DEVICE,TYPE,STATE", device, status]
  register: github_runner_linux_host_devices
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the host's Wi-Fi devices from the kernel
  # cfg80211 links every wireless network device to its phy as phy80211, whichever driver it has and whatever name it was given. A glob, not find: each /sys/class/net/<name> is a symlink to a device directory whose subsystem link points back at /sys/class/net, so find -L reports a file system loop and exits 1 after printing its matches, and no find option makes its exit status mean "nothing wrong". An unmatched glob stays literal, which the -e test skips, so a host with no Wi-Fi device prints nothing and exits 0.
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - 'for phy in "$1"/*/phy80211; do [ -e "$phy" ] || continue; device=${phy%/phy80211}; printf "%s\n" "${device##*/}"; done'
      - sh
      - "{{ github_runner_linux_host_sysfs_net_dir }}"
  register: github_runner_linux_host_kernel_devices
  changed_when: false
  check_mode: false

- name: Read whether systemd-networkd is running
  ansible.builtin.command:
    argv: [systemctl, is-active, systemd-networkd.service]
  register: github_runner_linux_host_networkd
  changed_when: false
  failed_when: false
  check_mode: false

- name: Work out which stack manages the Wi-Fi
  ansible.builtin.set_fact:
    github_runner_linux_host_networkmanager_wifi_devices: "{{ github_runner_linux_host_devices.stdout_lines | map('split', ':') | selectattr('1', 'equalto', 'wifi') | rejectattr('2', 'equalto', 'unmanaged') | map('first') | list }}"
    github_runner_linux_host_kernel_wifi_devices: "{{ github_runner_linux_host_kernel_devices.stdout_lines }}"
    github_runner_linux_host_networkd_running: "{{ github_runner_linux_host_networkd.stdout | trim == 'active' }}"
    github_runner_linux_host_networkmanager_answered: "{{ github_runner_linux_host_devices.rc | default(1) == 0 }}"

- name: Choose the stack
  ansible.builtin.set_fact:
    github_runner_linux_host_wifi_stack: >-
      {{ 'networkmanager' if github_runner_linux_host_networkmanager_wifi_devices | length > 0
      else 'networkd' if github_runner_linux_host_kernel_wifi_devices | length > 0 and github_runner_linux_host_networkd_running
      else 'none' }}

- name: Fail if no network stack manages a Wi-Fi device
  ansible.builtin.fail:
    msg: >-
      github_runner_linux_host_wifi_powersave_off is true, but neither NetworkManager nor systemd-networkd manages a Wi-Fi device on {{ inventory_hostname }}
      (nmcli: {{ 'answered, no managed Wi-Fi device' if github_runner_linux_host_networkmanager_answered else github_runner_linux_host_devices.stderr | default(github_runner_linux_host_devices.msg, true) | default('no output', true) | trim }};
      systemd-networkd: {{ github_runner_linux_host_networkd.stdout | trim | default('unknown', true) }};
      Wi-Fi devices the kernel has: {{ github_runner_linux_host_kernel_wifi_devices | join(', ') | default('none', true) }}).
      Nothing was changed.
  when:
    - github_runner_linux_host_wifi_stack == 'none'
    - >-
      github_runner_linux_host_kernel_wifi_devices | length > 0
      or not (github_runner_linux_host_networkmanager_answered or github_runner_linux_host_networkd_running)

- name: Tell NetworkManager not to power-save Wi-Fi
  vars:
    github_runner_linux_host_wifi_devices: "{{ github_runner_linux_host_networkmanager_wifi_devices }}"
  ansible.builtin.include_tasks: wifi_powersave_networkmanager.yml
  when: github_runner_linux_host_wifi_stack == 'networkmanager'

- name: Keep Wi-Fi from power saving under systemd-networkd
  vars:
    github_runner_linux_host_wifi_devices: "{{ github_runner_linux_host_kernel_wifi_devices }}"
  ansible.builtin.include_tasks: wifi_powersave_networkd.yml
  when: github_runner_linux_host_wifi_stack == 'networkd'
