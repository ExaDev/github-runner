---
# The role's variables, checked when the role runs. defaults/main.yml holds each default and the reasoning behind it.
argument_specs:
  main:
    short_description: 'Prepares a Linux host that carries a k3s node: keeps it awake, headless and up to date, and ready for k3s.'
    description:
      - Runs on Linux hosts only and does nothing on any other. Every step is off by default and behind a variable of its own. Its tasks that change the host use become (sudo), so run the play with passwordless sudo for the connecting user or with --ask-become-pass.
    options:
      github_runner_linux_host_keep_awake:
        type: bool
        default: false
        description: Whether the host is kept from suspending, by masking the sleep targets and having systemd-logind ignore the lid switch.
      github_runner_linux_host_sleep_targets:
        type: list
        elements: str
        default:
          - sleep.target
          - suspend.target
          - hibernate.target
          - hybrid-sleep.target
        description: The targets masked. Not a setting, and a variable only so the tests can narrow it.
      github_runner_linux_host_lid_switch_settings:
        type: list
        elements: str
        default:
          - HandleLidSwitch
          - HandleLidSwitchExternalPower
          - HandleLidSwitchDocked
        description: The logind settings set to ignore. Not a setting, and a variable only so the tests can narrow it.
      github_runner_linux_host_logind_dropin:
        type: path
        default: /etc/systemd/logind.conf.d/90-github-runner-keep-awake.conf
        description: Where the logind drop-in goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_wifi_powersave_off:
        type: bool
        default: false
        description: Whether NetworkManager is told not to power-save Wi-Fi (wifi.powersave = 2), as the default for every connection and on the radio now.
      github_runner_linux_host_networkmanager_dropin:
        type: path
        default: /etc/NetworkManager/conf.d/zz-github-runner-wifi-powersave.conf
        description: Where the NetworkManager drop-in goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_k3s_prerequisites:
        type: bool
        default: false
        description: Whether the kernel modules and sysctls k3s needs are loaded and set now and at boot.
      github_runner_linux_host_kernel_modules:
        type: list
        default:
          - overlay
          - br_netfilter
        elements: str
        description: The kernel modules loaded. Not a setting, and a variable only so the tests can narrow it.
      github_runner_linux_host_sysctl_settings:
        type: dict
        default:
          net.ipv4.ip_forward: 1
          net.bridge.bridge-nf-call-iptables: 1
          net.bridge.bridge-nf-call-ip6tables: 1
        description: The sysctls set, by name. Not a setting, and a variable only so the tests can narrow it.
      github_runner_linux_host_modules_load_file:
        type: path
        default: /etc/modules-load.d/github-runner-k3s.conf
        description: Where the file that loads the modules at boot goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_sysctl_file:
        type: path
        default: /etc/sysctl.d/90-github-runner-k3s.conf
        description: Where the file that sets the sysctls at boot goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_sys_module_dir:
        type: path
        default: /sys/module
        description: Where the kernel lists the modules it has loaded. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_battery_charge_limit:
        type: bool
        default: false
        description: Whether the battery's charge is limited, now and at every boot.
      github_runner_linux_host_battery_charge_limit_percent:
        type: int
        default: 80
        description: The percentage the charge stops at, from 1 to 100.
      github_runner_linux_host_battery_device:
        type: str
        default: BAT0
        description: The battery's name under the power supply directory.
      github_runner_linux_host_power_supply_dir:
        type: path
        default: /sys/class/power_supply
        description: Where the power supply class is in sysfs. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_battery_unit:
        type: path
        default: /etc/systemd/system/github-runner-battery-charge-limit.service
        description: Where the unit that writes the limit at boot goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_headless:
        type: bool
        default: false
        description: Whether the host boots to multi-user.target and has its display manager disabled and stopped.
      github_runner_linux_host_default_target:
        type: str
        default: multi-user.target
        description: The target the host boots to when headless. Not a setting, and a variable only so the tests can narrow it.
      github_runner_linux_host_display_manager_unit:
        type: str
        default: ''
        description: The display manager's unit, used as it is when set. Empty works it out from the host, from github_runner_linux_host_display_manager_candidates.
      github_runner_linux_host_display_manager_candidates:
        type: list
        elements: str
        default:
          - display-manager.service
          - gdm.service
          - gdm3.service
          - lightdm.service
          - sddm.service
        description: The units tried in order when github_runner_linux_host_display_manager_unit is empty. An alias reads as the unit it resolves to. The first that is loaded and active is the display manager, or failing that the first that is loaded and enabled; the role stops and disables it, and does nothing when none is.
      github_runner_linux_host_disable_unneeded_services:
        type: bool
        default: false
        description: Whether the units in github_runner_linux_host_unneeded_services that are enabled are disabled and those that are running are stopped.
      github_runner_linux_host_unneeded_services:
        type: list
        default:
          - cups.socket
          - cups.path
          - cups.service
          - cups-browsed.service
          - bluetooth.service
          - ModemManager.service
        elements: str
        description: The units disabled and stopped, sockets and paths before the services they start.
      github_runner_linux_host_unattended_upgrades:
        type: bool
        default: false
        description: Whether unattended-upgrades is installed and set to install security updates daily and never to reboot the host. Debian and Ubuntu only.
      github_runner_linux_host_unattended_upgrades_file:
        type: path
        default: /etc/apt/apt.conf.d/52github-runner-unattended-upgrades
        description: Where the apt configuration the role writes goes. Not a setting, and a variable only so the tests can point it at a stand-in.
      github_runner_linux_host_upgrade:
        type: bool
        default: false
        description: Whether the run upgrades the packages (apt-get update, dist-upgrade, a reboot when one is due, autoremove --purge). Set it for the run that does it, not in host_vars. Debian and Ubuntu only.
      github_runner_linux_host_upgrade_reboot:
        type: bool
        default: true
        description: Whether the upgrade reboots the host when /var/run/reboot-required says one is due.
      github_runner_linux_host_node_services:
        type: list
        default:
          - k3s-agent.service
          - k3s.service
        elements: str
        description: The units whose being active means the host is a running node of the cluster, which the upgrade refuses to reboot.
      github_runner_linux_host_upgrade_reboot_running_node:
        type: bool
        default: false
        description: Whether the upgrade may reboot a host whose node service is active.
      github_runner_linux_host_reboot_timeout:
        type: int
        default: 600
        description: How long the reboot waits for the host to come back, in seconds.
      github_runner_linux_host_reboot_required_file:
        type: path
        default: /var/run/reboot-required
        description: The file that says an upgrade needs a reboot. Not a setting, and a variable only so the tests can point it at a stand-in.
