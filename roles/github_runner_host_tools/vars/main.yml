---
# Not settings, so not defaults: what the role knows about the shells it supports. Each shell's startup files, in the order the role looks in them for a line it would add, and the one it writes to when none has the line. zsh's .zshenv is read by every zsh, including the non-interactive one an SSH command starts, and bash's .bashrc is read by the non-interactive shell sshd starts, so a command run over SSH finds the tools too.
github_runner_host_tools_shell_files:
  zsh:
    read: [.zshenv, .zshrc, .zprofile]
    write: .zshenv
  bash:
    read: [.bashrc, .bash_profile, .profile]
    write: .bashrc

# The packages Homebrew's documented requirements name for Debian and Ubuntu (https://docs.brew.sh/Homebrew-on-Linux#requirements).
github_runner_host_tools_apt_prerequisites:
  - build-essential
  - procps
  - curl
  - file
  - git

# Where pnpm reads its global config.yaml on each operating system, relative to the user's home (https://pnpm.io/cli/config). pnpm looks in $XDG_CONFIG_HOME/pnpm first when that is set, which a role that runs over a non-interactive SSH session cannot know, so the role writes the platform's own location.
github_runner_host_tools_pnpm_config_files:
  Darwin: Library/Preferences/pnpm/config.yaml
  Linux: .config/pnpm/config.yaml

# The marker lines of the block the role manages in ~/.npmrc, with {mark} where BEGIN and END go. A block with these markers is the role's own, and everything outside it is the user's.
github_runner_host_tools_npmrc_marker: "# {mark} ANSIBLE MANAGED BLOCK github_runner_host_tools npm"
