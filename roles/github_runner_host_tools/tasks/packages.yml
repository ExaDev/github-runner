---
# Keeps Homebrew and mise at their latest release. brew update brings Homebrew itself (and its formula index) up to date, and runs as part of the same community.general.homebrew call that upgrades mise, so mise is upgraded against the freshest index. Only mise is ever named: a formula that is installed for another reason (a container runtime, a daemon) is never upgraded, because an upgrade restarts a service that is running. Under --check, brew update is reported as a change and nothing runs.

- name: Look for the brew binary again
  # Under --check on a host that has none yet, the installer did not run, so there is nothing to call.
  ansible.builtin.stat:
    path: "{{ github_runner_host_tools_effective_prefix }}/bin/brew"
    get_checksum: false
  register: github_runner_host_tools_brew_present

- name: Update Homebrew and bring mise to its latest release
  community.general.homebrew:
    name: mise
    state: latest
    update_homebrew: true
    path: "{{ github_runner_host_tools_effective_prefix }}/bin"
  environment:
    PATH: "{{ github_runner_host_tools_path }}"
  when:
    - github_runner_host_tools_mise | bool
    - github_runner_host_tools_brew_present.stat.exists or not ansible_check_mode

- name: Update Homebrew
  # Without mise there is no package to name, and the call updates Homebrew and nothing else.
  community.general.homebrew:
    update_homebrew: true
    path: "{{ github_runner_host_tools_effective_prefix }}/bin"
  environment:
    PATH: "{{ github_runner_host_tools_path }}"
  when:
    - not github_runner_host_tools_mise | bool
    - github_runner_host_tools_brew_present.stat.exists or not ansible_check_mode

- name: Report the update a real run would make
  ansible.builtin.debug:
    msg: "brew update{{ ', and brew install or upgrade of mise' if github_runner_host_tools_mise | bool else '' }}, once Homebrew is installed"
  changed_when: true
  when:
    - not github_runner_host_tools_brew_present.stat.exists
    - ansible_check_mode
