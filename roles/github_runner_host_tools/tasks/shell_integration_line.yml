---
# One line of shell integration (github_runner_host_tools_integration: its name, the pattern that finds an equivalent line, the line itself and whether a non-interactive shell must read it), added to the shell's startup file unless a startup file of the shell has an equivalent already. A line a non-interactive shell must read goes at the top of the file: a non-interactive bash, which is what sshd starts for a command, reads ~/.bashrc only as far as the interactive guard that distributions put near its top (Debian's and Ubuntu's skeleton .bashrc returns there), so a block appended at the end of the file is never read by it.

- name: Work out where the shell's startup files are
  ansible.builtin.set_fact:
    github_runner_host_tools_startup_files: "{{ github_runner_host_tools_shell_files[github_runner_host_tools_shell]['read'] | map('regex_replace', '^', ansible_facts['user_dir'] ~ '/') | list }}"
    github_runner_host_tools_startup_target: "{{ ansible_facts['user_dir'] }}/{{ github_runner_host_tools_shell_files[github_runner_host_tools_shell]['write'] }}"
    github_runner_host_tools_marker: "{{ github_runner_host_tools_shell_marker_stem }}{{ github_runner_host_tools_integration['name'] }}"

- name: Look for an equivalent line in the startup files
  # grep exits 0 for a match, 1 for none and 2 when it could not read a file, which a startup file that does not exist is; with -q a match is 0 whatever else went wrong. Read-only, so it runs under --check too.
  ansible.builtin.command:
    argv: "{{ ['grep', '-E', '-q', '-s', '-e', github_runner_host_tools_integration['pattern'], '--'] + github_runner_host_tools_startup_files }}"
  register: github_runner_host_tools_equivalent
  changed_when: false
  failed_when: github_runner_host_tools_equivalent.rc not in [0, 1, 2]
  check_mode: false

- name: Look for the role's own block in the file it writes
  # A block the role wrote earlier is the equivalent line the search above found, and it is kept up to date (a different prefix, say) rather than left behind.
  ansible.builtin.command:
    argv: [grep, -F, -q, -s, -e, "{{ github_runner_host_tools_marker | replace('{mark}', 'BEGIN') }}", --, "{{ github_runner_host_tools_startup_target }}"]
  register: github_runner_host_tools_own_block
  changed_when: false
  failed_when: github_runner_host_tools_own_block.rc not in [0, 1, 2]
  check_mode: false

- name: Read the startup file to see where the role's block is
  # Only for a line a non-interactive shell must read and a block the role wrote earlier: it may sit below the guard, where an earlier version of the role appended it. no_log keeps the file out of the output and the log, because a startup file can hold secrets, and the filter below returns a boolean only.
  ansible.builtin.slurp:
    src: "{{ github_runner_host_tools_startup_target }}"
  register: github_runner_host_tools_startup_content
  no_log: true
  check_mode: false
  when: github_runner_host_tools_integration['non_interactive'] and github_runner_host_tools_own_block.rc == 0

- name: Take the role's block out of where a non-interactive shell does not read
  # blockinfile rewrites an existing block where it stands and inserts at the top only a block that is missing, so a block below the guard is removed here and written again at the top by the next task. Once it is at the top this task is skipped, which keeps a second run unchanged.
  ansible.builtin.blockinfile:
    path: "{{ github_runner_host_tools_startup_target }}"
    marker: "{{ github_runner_host_tools_marker }}"
    state: absent
  when:
    - github_runner_host_tools_integration['non_interactive']
    - github_runner_host_tools_own_block.rc == 0
    - not (github_runner_host_tools_startup_content.content | b64decode | exadev.github_runner.host_tools_block_leads(github_runner_host_tools_marker, github_runner_host_tools_shell_marker_stem))

- name: Add the line to the startup file  # noqa: risky-file-permissions
  # No mode is passed on purpose, so an existing file keeps the mode it has (blockinfile always edits the target of a symlink, so a startup file that is a link stays one), and a file that does not exist yet gets the user's umask. A line a non-interactive shell must read is inserted before the file's first line, and a block already there is updated where it stands.
  ansible.builtin.blockinfile:
    path: "{{ github_runner_host_tools_startup_target }}"
    marker: "{{ github_runner_host_tools_marker }}"
    block: "{{ github_runner_host_tools_integration['line'] }}"
    insertbefore: "{{ 'BOF' if github_runner_host_tools_integration['non_interactive'] else omit }}"
    create: true
  when: github_runner_host_tools_equivalent.rc != 0 or github_runner_host_tools_own_block.rc == 0
