---
# Mints a short-lived runner token on the controller, so that no GitHub credential reaches the host or the launch daemon. `github_runner_macos_actions_runner_token_kind` is `registration` or `remove`, and the token is left in `github_runner_macos_actions_runner_runner_token`.
- name: Mint a runner token through the GitHub App
  delegate_to: localhost
  check_mode: false
  no_log: true
  block:
    - name: Create a temporary App key file
      ansible.builtin.tempfile:
        state: file
        suffix: ".pem"
      register: github_runner_macos_actions_runner_key_file

    - name: Write the GitHub App key
      ansible.builtin.copy:
        content: "{{ github_runner_macos_actions_runner_private_key }}"
        dest: "{{ github_runner_macos_actions_runner_key_file.path }}"
        mode: "0600"

    - name: Sign the GitHub App JWT
      ansible.builtin.script:
        cmd: "{{ role_path }}/../github_runner_arc/files/generate_app_jwt.py {{ github_runner_macos_actions_runner_app_id | quote }} {{ github_runner_macos_actions_runner_key_file.path | quote }}"
        executable: python3
      changed_when: false
      register: github_runner_macos_actions_runner_jwt

    - name: Mint a self-hosted runner installation token
      ansible.builtin.uri:
        url: "https://api.github.com/app/installations/{{ github_runner_macos_actions_runner_installation_id }}/access_tokens"
        method: POST
        headers:
          Authorization: "Bearer {{ github_runner_macos_actions_runner_jwt.stdout | trim }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          permissions:
            administration: write
            metadata: read
        status_code: 201
      register: github_runner_macos_actions_runner_installation_token

    - name: Request a runner token of the requested kind
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_runner_macos_actions_runner_organization }}/{{ github_runner_macos_actions_runner_repository }}/actions/runners/{{ github_runner_macos_actions_runner_token_kind }}-token"
        method: POST
        headers:
          Authorization: "Bearer {{ github_runner_macos_actions_runner_installation_token.json.token }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: 201
      register: github_runner_macos_actions_runner_runner_token
  always:
    - name: Remove the temporary App key file
      ansible.builtin.file:
        path: "{{ github_runner_macos_actions_runner_key_file.path }}"
        state: absent
      when: github_runner_macos_actions_runner_key_file.path is defined
