---
- name: Read the host platform and connecting user
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform
      - user
  when: "'system' not in ansible_facts or 'user_id' not in ansible_facts"

- name: End the role on a non-macOS host
  ansible.builtin.meta: end_role
  when: ansible_facts['system'] != 'Darwin'

- name: Require an Apple Silicon host
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'arm64'
    fail_msg: The pinned runner package is for osx-arm64, but this host reports {{ ansible_facts['architecture'] }}.
    quiet: true
  when: github_runner_macos_actions_runner_enabled | bool

- name: Check whether a disabled macOS runner is still registered
  ansible.builtin.stat:
    path: "{{ github_runner_macos_actions_runner_root }}/.runner"
  register: github_runner_macos_actions_runner_leftover_registration
  when: not (github_runner_macos_actions_runner_enabled | bool)

- name: Read the macOS runner App key from 1Password
  delegate_to: localhost
  ansible.builtin.command:
    argv: [op, read, "{{ github_runner_macos_actions_runner_private_key_op_reference }}"]
  register: github_runner_macos_actions_runner_op_key
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - (github_runner_macos_actions_runner_enabled | bool) or (github_runner_macos_actions_runner_leftover_registration.stat.exists | default(false))
    - github_runner_macos_actions_runner_private_key | length == 0
    - github_runner_macos_actions_runner_private_key_op_reference | length > 0

- name: Set the macOS runner App key
  ansible.builtin.set_fact:
    github_runner_macos_actions_runner_private_key: "{{ github_runner_macos_actions_runner_op_key.stdout }}"
  no_log: true
  when: github_runner_macos_actions_runner_op_key is not skipped

- name: Require the macOS runner settings
  ansible.builtin.assert:
    that:
      - github_runner_macos_actions_runner_organization | length > 0
      - github_runner_macos_actions_runner_repository | length > 0
      - github_runner_macos_actions_runner_app_id | string | regex_search('^[0-9]+$') is not none
      - github_runner_macos_actions_runner_installation_id | string | regex_search('^[0-9]+$') is not none
      - github_runner_macos_actions_runner_private_key | length > 0
      - github_runner_macos_actions_runner_label | regex_search('^[A-Za-z0-9_.-]+$') is not none
    quiet: true
  when: (github_runner_macos_actions_runner_enabled | bool) or (github_runner_macos_actions_runner_leftover_registration.stat.exists | default(false))
  no_log: true

- name: Stop a disabled macOS runner
  become: true
  ansible.builtin.command:
    argv: [launchctl, bootout, "system/{{ github_runner_macos_actions_runner_launchd_label }}"]
  failed_when: false
  changed_when: false
  when: not (github_runner_macos_actions_runner_enabled | bool)

- name: Mint a runner removal token
  ansible.builtin.include_tasks: runner_token.yml
  vars:
    github_runner_macos_actions_runner_token_kind: remove
  when:
    - not (github_runner_macos_actions_runner_enabled | bool)
    - not ansible_check_mode
    - github_runner_macos_actions_runner_leftover_registration.stat.exists

- name: Remove a disabled macOS runner's registration from GitHub
  become: true
  become_user: "{{ github_runner_macos_actions_runner_user }}"
  ansible.builtin.command:
    argv:
      - "{{ github_runner_macos_actions_runner_root }}/config.sh"
      - remove
      - --unattended
  environment:
    ACTIONS_RUNNER_INPUT_TOKEN: "{{ github_runner_macos_actions_runner_runner_token.json.token }}"
  no_log: true
  changed_when: true
  when:
    - not (github_runner_macos_actions_runner_enabled | bool)
    - not ansible_check_mode
    - github_runner_macos_actions_runner_leftover_registration.stat.exists

- name: Remove the disabled runner launch daemon
  become: true
  ansible.builtin.file:
    path: "{{ github_runner_macos_actions_runner_plist }}"
    state: absent
  when: not (github_runner_macos_actions_runner_enabled | bool)

- name: Configure the enabled macOS runner
  when: github_runner_macos_actions_runner_enabled | bool
  block:
    - name: Read the runner account
      ansible.builtin.command:
        argv: [dscl, ., -read, "/Users/{{ github_runner_macos_actions_runner_user }}", UniqueID]
      register: github_runner_macos_actions_runner_account
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create the unprivileged runner account
      become: true
      ansible.builtin.command:
        argv:
          - sysadminctl
          - -addUser
          - "{{ github_runner_macos_actions_runner_user }}"
          - -fullName
          - GitHub Actions Runner
          - -UID
          - "{{ github_runner_macos_actions_runner_uid }}"
          - -shell
          - /usr/bin/false
          - -home
          - "{{ github_runner_macos_actions_runner_root }}"
          - -roleAccount
      changed_when: true
      when: github_runner_macos_actions_runner_account.rc != 0

    - name: Read the runner account after creation
      ansible.builtin.command:
        argv: [dscl, ., -read, "/Users/{{ github_runner_macos_actions_runner_user }}", UniqueID]
      register: github_runner_macos_actions_runner_verified_account
      changed_when: false
      when: not ansible_check_mode

    - name: Require the runner account's expected identity
      ansible.builtin.assert:
        that:
          - "github_runner_macos_actions_runner_verified_account.stdout is regex('UniqueID: ' ~ (github_runner_macos_actions_runner_uid | string) ~ '$')"
        quiet: true
      when: not ansible_check_mode

    - name: Create the runner directory
      become: true
      ansible.builtin.file:
        path: "{{ github_runner_macos_actions_runner_root }}"
        state: directory
        owner: "{{ github_runner_macos_actions_runner_user }}"
        mode: "0750"

    - name: Check the installed runner version
      become: true
      become_user: "{{ github_runner_macos_actions_runner_user }}"
      ansible.builtin.command:
        argv: ["{{ github_runner_macos_actions_runner_root }}/bin/Runner.Listener", --version]
      register: github_runner_macos_actions_runner_installed_version
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode or github_runner_macos_actions_runner_account.rc == 0

    - name: Download the pinned Apple Silicon runner package
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ github_runner_macos_actions_runner_version }}/actions-runner-osx-arm64-{{ github_runner_macos_actions_runner_version }}.tar.gz"
        dest: "{{ github_runner_macos_actions_runner_root }}-{{ github_runner_macos_actions_runner_version }}.tar.gz"
        checksum: "sha256:{{ github_runner_macos_actions_runner_sha256 }}"
        mode: "0644"
      when:
        - not ansible_check_mode
        - github_runner_macos_actions_runner_installed_version.stdout | default('') | trim != github_runner_macos_actions_runner_version

    - name: Stop the runner before replacing its installation
      become: true
      ansible.builtin.command:
        argv: [launchctl, bootout, "system/{{ github_runner_macos_actions_runner_launchd_label }}"]
      failed_when: false
      changed_when: false
      when: github_runner_macos_actions_runner_installed_version.stdout | default('') | trim != github_runner_macos_actions_runner_version

    - name: Remove the prior runner installation
      become: true
      ansible.builtin.file:
        path: "{{ github_runner_macos_actions_runner_root }}"
        state: absent
      when: github_runner_macos_actions_runner_installed_version.stdout | default('') | trim != github_runner_macos_actions_runner_version

    - name: Recreate the runner directory
      become: true
      ansible.builtin.file:
        path: "{{ github_runner_macos_actions_runner_root }}"
        state: directory
        owner: "{{ github_runner_macos_actions_runner_user }}"
        mode: "0750"
      when: github_runner_macos_actions_runner_installed_version.stdout | default('') | trim != github_runner_macos_actions_runner_version

    - name: Install the pinned Apple Silicon runner package
      become: true
      ansible.builtin.unarchive:
        src: "{{ github_runner_macos_actions_runner_root }}-{{ github_runner_macos_actions_runner_version }}.tar.gz"
        dest: "{{ github_runner_macos_actions_runner_root }}"
        remote_src: true
        owner: "{{ github_runner_macos_actions_runner_user }}"
      when:
        - not ansible_check_mode
        - github_runner_macos_actions_runner_installed_version.stdout | default('') | trim != github_runner_macos_actions_runner_version
      # An upgrade boots the service out before the wipe, and an unchanged launch daemon would never bring it back.
      notify: Restart macOS Actions runner

    - name: Check whether the runner is registered
      ansible.builtin.stat:
        path: "{{ github_runner_macos_actions_runner_root }}/.runner"
      register: github_runner_macos_actions_runner_registration

    - name: Mint a runner registration token
      ansible.builtin.include_tasks: runner_token.yml
      vars:
        github_runner_macos_actions_runner_token_kind: registration
      when: not github_runner_macos_actions_runner_registration.stat.exists

    - name: Configure the macOS runner
      become: true
      become_user: "{{ github_runner_macos_actions_runner_user }}"
      ansible.builtin.command:
        argv:
          - "{{ github_runner_macos_actions_runner_root }}/config.sh"
          - --unattended
          - --url
          - "https://github.com/{{ github_runner_macos_actions_runner_organization }}/{{ github_runner_macos_actions_runner_repository }}"
          - --name
          - "{{ github_runner_macos_actions_runner_name }}"
          - --labels
          - "{{ github_runner_macos_actions_runner_label }}"
          - --work
          - "{{ github_runner_macos_actions_runner_work_dir }}"
          - --replace
      environment:
        ACTIONS_RUNNER_INPUT_TOKEN: "{{ github_runner_macos_actions_runner_runner_token.json.token }}"
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode
        - not github_runner_macos_actions_runner_registration.stat.exists
      # A service already loaded against an unregistered installation keeps failing until it is restarted.
      notify: Restart macOS Actions runner

    - name: Install the runner launch daemon
      become: true
      ansible.builtin.template:
        src: runner.plist.j2
        dest: "{{ github_runner_macos_actions_runner_plist }}"
        owner: root
        group: wheel
        mode: "0644"
        validate: plutil -lint %s
      notify: Restart macOS Actions runner
