---
- name: Read the host platform and connecting user
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - platform
      - user
  when: "'system' not in ansible_facts or 'user_id' not in ansible_facts"

- name: End the role on a non-macOS host
  ansible.builtin.meta: end_role
  when: ansible_facts['system'] != 'Darwin'

- name: Inspect the runner directory before making changes
  become: true
  ansible.builtin.stat:
    path: "{{ github_runner_macos_actions_runner_root }}"
    follow: false
  register: github_runner_macos_actions_runner_directory

- name: Inspect the runner registration before making changes
  become: true
  ansible.builtin.stat:
    path: "{{ github_runner_macos_actions_runner_root }}/.runner"
    follow: false
  register: github_runner_macos_actions_runner_registration

- name: Inspect the launchd service before making changes
  become: true
  ansible.builtin.command:
    argv: [launchctl, print, "system/{{ github_runner_macos_actions_runner_launchd_label }}"]
  register: github_runner_macos_actions_runner_service
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse unknown launchd service state
  ansible.builtin.assert:
    that:
      - github_runner_macos_actions_runner_service.rc in [0, 113]
    fail_msg: Cannot establish whether the macOS runner service exists; leaving it untouched.

- name: Refuse disabling an existing runner
  ansible.builtin.assert:
    that:
      - not github_runner_macos_actions_runner_directory.stat.exists
      - not github_runner_macos_actions_runner_registration.stat.exists
      - github_runner_macos_actions_runner_service.rc == 113
    fail_msg: Disabling an existing macOS runner is unsupported until a race-free mechanism exists.
  when: not (github_runner_macos_actions_runner_enabled | bool)

- name: End the role when disabled and absent
  ansible.builtin.meta: end_role
  when: not (github_runner_macos_actions_runner_enabled | bool)

- name: Refuse an existing runner registration
  ansible.builtin.assert:
    that:
      - not github_runner_macos_actions_runner_registration.stat.exists
    fail_msg: An existing macOS runner registration cannot be safely replaced; leaving it untouched.

- name: Refuse an existing launchd service
  ansible.builtin.assert:
    that:
      - github_runner_macos_actions_runner_service.rc == 113
    fail_msg: An existing macOS runner service cannot be safely replaced.

- name: Refuse any existing runner path
  ansible.builtin.assert:
    that:
      - not github_runner_macos_actions_runner_directory.stat.exists
    fail_msg: The runner path already exists; leaving it untouched.

- name: Read the macOS runner App key from 1Password
  delegate_to: localhost
  ansible.builtin.command:
    argv: [op, read, "{{ github_runner_macos_actions_runner_private_key_op_reference }}"]
  register: github_runner_macos_actions_runner_op_key
  changed_when: false
  check_mode: false
  no_log: true
  when:
    - github_runner_macos_actions_runner_enabled | bool
    - github_runner_macos_actions_runner_private_key | length == 0
    - github_runner_macos_actions_runner_private_key_op_reference | length > 0

- name: Set the macOS runner App key
  ansible.builtin.set_fact:
    github_runner_macos_actions_runner_private_key: "{{ github_runner_macos_actions_runner_op_key.stdout }}"
  no_log: true
  when: github_runner_macos_actions_runner_op_key is not skipped

- name: Require the macOS runner settings
  ansible.builtin.assert:
    that:
      - github_runner_macos_actions_runner_organization | length > 0
      - github_runner_macos_actions_runner_repository | length > 0
      - github_runner_macos_actions_runner_app_id | string | regex_search('^[0-9]+$') is not none
      - github_runner_macos_actions_runner_installation_id | string | regex_search('^[0-9]+$') is not none
      - github_runner_macos_actions_runner_private_key | length > 0
      - github_runner_macos_actions_runner_label | regex_search('^[A-Za-z0-9_.-]+$') is not none
    quiet: true
  when: github_runner_macos_actions_runner_enabled | bool
  no_log: true

- name: Configure the enabled macOS runner
  when: github_runner_macos_actions_runner_enabled | bool
  block:
    - name: Read the runner account
      ansible.builtin.command:
        argv: [dscl, ., -read, "/Users/{{ github_runner_macos_actions_runner_user }}", UniqueID]
      register: github_runner_macos_actions_runner_account
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Create the unprivileged runner account
      become: true
      ansible.builtin.command:
        argv:
          - sysadminctl
          - -addUser
          - "{{ github_runner_macos_actions_runner_user }}"
          - -fullName
          - GitHub Actions Runner
          - -UID
          - "{{ github_runner_macos_actions_runner_uid }}"
          - -shell
          - /usr/bin/false
          - -home
          - "{{ github_runner_macos_actions_runner_root }}"
          - -roleAccount
      changed_when: true
      when: github_runner_macos_actions_runner_account.rc != 0

    - name: Read the runner account after creation
      ansible.builtin.command:
        argv: [dscl, ., -read, "/Users/{{ github_runner_macos_actions_runner_user }}", UniqueID]
      register: github_runner_macos_actions_runner_verified_account
      changed_when: false
      when: not ansible_check_mode

    - name: Require the runner account's expected identity
      ansible.builtin.assert:
        that:
          - "github_runner_macos_actions_runner_verified_account.stdout is regex('UniqueID: ' ~ (github_runner_macos_actions_runner_uid | string) ~ '$')"
        quiet: true
      when: not ansible_check_mode

    - name: Create the runner parent directory
      become: true
      ansible.builtin.file:
        path: "{{ github_runner_macos_actions_runner_root | dirname }}"
        state: directory
        mode: "0755"

    - name: Stage and publish the first runner installation
      when: not ansible_check_mode
      block:
        - name: Create a private staging directory
          become: true
          ansible.builtin.tempfile:
            state: directory
            path: "{{ github_runner_macos_actions_runner_root | dirname }}"
            prefix: .github-runner-stage-
          register: github_runner_macos_actions_runner_stage

        - name: Download the pinned Apple Silicon runner package
          become: true
          ansible.builtin.get_url:
            url: "https://github.com/actions/runner/releases/download/v{{ github_runner_macos_actions_runner_version }}/actions-runner-osx-arm64-{{ github_runner_macos_actions_runner_version }}.tar.gz"
            dest: "{{ github_runner_macos_actions_runner_stage.path }}/runner.tar.gz"
            checksum: "sha256:{{ github_runner_macos_actions_runner_sha256 }}"
            mode: "0600"

        - name: Create the staged runner directory
          become: true
          ansible.builtin.file:
            path: "{{ github_runner_macos_actions_runner_stage.path }}/runner"
            state: directory
            owner: "{{ github_runner_macos_actions_runner_user }}"
            mode: "0750"

        - name: Install the pinned Apple Silicon runner package
          become: true
          ansible.builtin.unarchive:
            src: "{{ github_runner_macos_actions_runner_stage.path }}/runner.tar.gz"
            dest: "{{ github_runner_macos_actions_runner_stage.path }}/runner"
            remote_src: true
            owner: "{{ github_runner_macos_actions_runner_user }}"

        - name: Atomically publish the runner without replacing a path
          become: true
          ansible.builtin.script:
            cmd: "{{ role_path }}/files/promote.py {{ (github_runner_macos_actions_runner_stage.path ~ '/runner') | quote }} {{ github_runner_macos_actions_runner_root | quote }}"
            executable: /usr/bin/python3
          changed_when: true
      always:
        - name: Remove the private staging directory
          become: true
          ansible.builtin.file:
            path: "{{ github_runner_macos_actions_runner_stage.path }}"
            state: absent
          when: github_runner_macos_actions_runner_stage.path is defined

    - name: Register the runner through the GitHub App
      delegate_to: localhost
      check_mode: false
      no_log: true
      when: not github_runner_macos_actions_runner_registration.stat.exists
      block:
        - name: Create a temporary App key file
          ansible.builtin.tempfile:
            state: file
            suffix: ".pem"
          register: github_runner_macos_actions_runner_key_file

        - name: Write the GitHub App key
          ansible.builtin.copy:
            content: "{{ github_runner_macos_actions_runner_private_key }}"
            dest: "{{ github_runner_macos_actions_runner_key_file.path }}"
            mode: "0600"

        - name: Sign the GitHub App JWT
          ansible.builtin.script:
            cmd: "{{ role_path }}/../github_runner_arc/files/generate_app_jwt.py {{ github_runner_macos_actions_runner_app_id | quote }} {{ github_runner_macos_actions_runner_key_file.path | quote }}"
            executable: python3
          changed_when: false
          register: github_runner_macos_actions_runner_jwt

        - name: Mint a self-hosted runner installation token
          ansible.builtin.uri:
            url: "https://api.github.com/app/installations/{{ github_runner_macos_actions_runner_installation_id }}/access_tokens"
            method: POST
            headers:
              Authorization: "Bearer {{ github_runner_macos_actions_runner_jwt.stdout | trim }}"
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            body_format: json
            body:
              permissions:
                administration: write
                metadata: read
            status_code: 201
          register: github_runner_macos_actions_runner_installation_token

        - name: Request a runner registration token
          when: not ansible_check_mode
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ github_runner_macos_actions_runner_organization }}/{{ github_runner_macos_actions_runner_repository }}/actions/runners/registration-token"
            method: POST
            headers:
              Authorization: "Bearer {{ github_runner_macos_actions_runner_installation_token.json.token }}"
              Accept: application/vnd.github+json
              X-GitHub-Api-Version: "2022-11-28"
            status_code: 201
          register: github_runner_macos_actions_runner_registration_token
      always:
        - name: Remove the temporary App key file
          ansible.builtin.file:
            path: "{{ github_runner_macos_actions_runner_key_file.path }}"
            state: absent
          when: github_runner_macos_actions_runner_key_file.path is defined

    - name: Configure the macOS runner
      become: true
      become_user: "{{ github_runner_macos_actions_runner_user }}"
      ansible.builtin.command:
        argv:
          - "{{ github_runner_macos_actions_runner_root }}/config.sh"
          - --unattended
          - --url
          - "https://github.com/{{ github_runner_macos_actions_runner_organization }}/{{ github_runner_macos_actions_runner_repository }}"
          - --name
          - "{{ github_runner_macos_actions_runner_name }}"
          - --labels
          - "{{ github_runner_macos_actions_runner_label }}"
          - --work
          - "{{ github_runner_macos_actions_runner_work_dir }}"
      environment:
        ACTIONS_RUNNER_INPUT_TOKEN: "{{ github_runner_macos_actions_runner_registration_token.json.token }}"
      no_log: true
      changed_when: true
      when:
        - not ansible_check_mode
        - not github_runner_macos_actions_runner_registration.stat.exists

    - name: Install the runner launch daemon
      become: true
      ansible.builtin.template:
        src: runner.plist.j2
        dest: "{{ github_runner_macos_actions_runner_plist }}"
        owner: root
        group: wheel
        mode: "0644"
        validate: plutil -lint %s
      notify: Restart macOS Actions runner
