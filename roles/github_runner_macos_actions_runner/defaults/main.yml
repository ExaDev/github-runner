---
# A persistent macOS runner is deliberately separate from ARC: runner pods require Linux containers, while Xcode and macOS archive jobs must run on the host OS. Restrict it to one repository whose workflows are equally trusted, because a persistent native runner is not a disposable cross-repository execution environment. The registration credential is minted only while Ansible configures it; launchd runs the already-registered process without any GitHub credential.
github_runner_macos_actions_runner_enabled: false
github_runner_macos_actions_runner_organization: ""
github_runner_macos_actions_runner_repository: ""
github_runner_macos_actions_runner_app_id: ""
github_runner_macos_actions_runner_installation_id: ""
github_runner_macos_actions_runner_private_key: ""
github_runner_macos_actions_runner_private_key_op_reference: ""
github_runner_macos_actions_runner_label: exadev-macos
github_runner_macos_actions_runner_name: "{{ inventory_hostname }}-macos"
# macOS role accounts require a leading underscore and a UID in 450-499; they do not need an interactive password.
github_runner_macos_actions_runner_user: _github-runner
github_runner_macos_actions_runner_uid: 498
github_runner_macos_actions_runner_version: "2.338.2"
github_runner_macos_actions_runner_sha256: 25a065af409ffa317ab4d5a3b614dd15fc9c40f2172bc1b35a1b1258e919a388
# Repository identity is part of the directory. Changing the repository therefore creates a new unregistered runner rather than leaving a runner enrolled in the old scope.
github_runner_macos_actions_runner_root: "/var/lib/github-actions-runner/{{ github_runner_macos_actions_runner_organization }}-{{ github_runner_macos_actions_runner_repository }}"
github_runner_macos_actions_runner_work_dir: "{{ github_runner_macos_actions_runner_root }}/_work"
github_runner_macos_actions_runner_plist: "/Library/LaunchDaemons/io.exadev.github-actions-runner.{{ github_runner_macos_actions_runner_name }}.plist"
github_runner_macos_actions_runner_launchd_label: "io.exadev.github-actions-runner.{{ github_runner_macos_actions_runner_name }}"
github_runner_macos_actions_runner_path: /opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin
