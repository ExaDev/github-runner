---
- name: Restart macOS Actions runner
  become: true
  block:
    - name: Stop the previous runner launch daemon
      ansible.builtin.command:
        argv: [launchctl, bootout, "system/{{ github_runner_macos_actions_runner_launchd_label }}"]
      failed_when: false
      changed_when: false
    - name: Start the runner launch daemon
      ansible.builtin.command:
        argv: [launchctl, bootstrap, system, "{{ github_runner_macos_actions_runner_plist }}"]
      changed_when: true
