---
# Resolves every secret the cluster and ARC roles need, from 1Password or from github_runner_secrets_provided, and hands each role only its own fields: github_runner_cluster_k3s_token, github_runner_cluster_tailscale_join_key, github_runner_cluster_tailscale_api_token, github_runner_cluster_headscale_api_key and github_runner_cluster_headscale_join_key for the cluster role; github_runner_arc_ghcr_username, github_runner_arc_ghcr_token, github_runner_arc_heartbeat_gh_token and each org's private_key in github_runner_arc_orgs for the ARC role. Either role can be used without this one by setting those variables directly.

- name: Fail if no secrets source is set
  ansible.builtin.fail:
    msg: >-
      Either github_runner_secrets_vault and github_runner_secrets_item
      (read from 1Password) or github_runner_secrets_provided must be set
      on this host. Add the former to host_vars/{{ inventory_hostname }}.yml.
  when:
    - github_runner_secrets_provided | length == 0
    - github_runner_secrets_vault | length == 0 or github_runner_secrets_item | length == 0

# Delegated to the control node, not this host: 1Password access (desktop-app integration, or a signed-in CLI session) belongs to whichever machine an operator is actually running Ansible from, not to every fleet host. No delegate_facts: a plain `register:` result already attaches to inventory_hostname regardless of where the task's execution was delegated to; only `set_fact`'s own fact-namespace assignment is sensitive to delegate_facts (see the ARC role's resolve_installation_id.yml for the one place that mattered, and why delegate_facts: true there was backwards).
- name: Check for a cached 1Password secrets read
  ansible.builtin.stat:
    path: "{{ github_runner_secrets_cache_path }}"
  delegate_to: localhost
  register: github_runner_secrets_cache_file
  when: github_runner_secrets_provided | length == 0

# The cache above is shared by every host that uses this exact secrets item, but github_runner_arc_orgs is host-specific (an agent host defines none at all). Building org_private_keys from only the TRIGGERING host's own org list means whichever host happens to populate the cache first determines what's in it forever after: an agent-only run once seeded the cache with an empty org_private_keys, silently breaking a later GitHub App secret creation once another host read that same cache back. Aggregating across every host sharing this item makes the cached content correct regardless of which host writes it first.
- name: Compute every org configured anywhere in the fleet that shares this secrets item
  ansible.builtin.set_fact:
    github_runner_secrets_all_orgs: >-
      {{
        groups['all']
        | map('extract', hostvars)
        | selectattr('github_runner_secrets_item', 'defined')
        | selectattr('github_runner_secrets_item', 'equalto', github_runner_secrets_item)
        | map(attribute='github_runner_arc_orgs', default=[])
        | list | flatten | selectattr('private_key_op_reference', 'defined') | unique(attribute='name')
      }}

- name: Read every 1Password secret this host needs in one shell invocation
  ansible.builtin.shell: |
    set -euo pipefail
    secrets=$(op item get '{{ github_runner_secrets_item }}' --vault '{{ github_runner_secrets_vault }}' --format json --reveal | jq -c '{
      k3s_token: (.fields[] | select(.label=="k3s-token") | .value),
      ghcr_username: (.fields[] | select(.label=="ghcr-username") | .value),
      ghcr_token: (.fields[] | select(.label=="ghcr-token") | .value),
      heartbeat_gh_token: (.fields[] | select(.label=="heartbeat-gh-token") | .value),
      tailscale_join_key: (.fields[] | select(.label=="tailscale-join-key") | .value),
      tailscale_api_token: (.fields[] | select(.label=="tailscale-api-token") | .value),
      headscale_api_key: ([.fields[] | select(.label=="headscale-api-key") | .value] | first // ""),
      headscale_join_key: ([.fields[] | select(.label=="headscale-join-key") | .value] | first // "")
    }')
    org_keys='{}'
    {% for org in github_runner_secrets_all_orgs %}
    key_{{ loop.index }}=$(op read '{{ org.private_key_op_reference }}')
    org_keys=$(jq -n --argjson prev "$org_keys" --arg name '{{ org.name }}' --arg key "$key_{{ loop.index }}" '$prev + {($name): $key}')
    {% endfor %}
    jq -n --argjson secrets "$secrets" --argjson org_keys "$org_keys" '$secrets + {org_private_keys: $org_keys}'
  delegate_to: localhost
  changed_when: false
  no_log: true
  # Read-only; everything after it needs the secrets, including under --check.
  check_mode: false
  register: github_runner_secrets_raw
  when:
    - github_runner_secrets_provided | length == 0
    - not github_runner_secrets_cache_file.stat.exists

- name: Cache this read for future runs
  ansible.builtin.copy:
    dest: "{{ github_runner_secrets_cache_path }}"
    content: "{{ github_runner_secrets_raw.stdout }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
  when:
    - github_runner_secrets_provided | length == 0
    - not github_runner_secrets_cache_file.stat.exists

- name: Use the provided secrets, or parse the 1Password read (from cache, or the read just above)
  ansible.builtin.set_fact:
    github_runner_secrets_values: >-
      {{
        github_runner_secrets_provided if github_runner_secrets_provided | length > 0
        else ((lookup('file', github_runner_secrets_cache_file.stat.path) if github_runner_secrets_cache_file.stat.exists
               else github_runner_secrets_raw.stdout) | from_json)
      }}
  no_log: true

# Only in 1Password mode does this role keep a Tailscale or Headscale join key the cluster role creates: it turns on github_runner_cluster_join_key_listener, and its handler (tasks/persist_join_key.yml) writes the new key back to the item. With provided secrets there is nowhere to keep it, so the cluster role then creates one only if github_runner_cluster_join_key_path is set.
#
# The Headscale fields are optional on the item (unlike the Tailscale ones, read above with a bare select that yields nothing when a field is absent), and an empty one leaves any value already set for the cluster role (e.g. in inventory) in place.
- name: Hand the cluster role its own secrets  # noqa: var-naming[no-role-prefix] - these facts are the other role's own inputs, so they carry its prefix
  ansible.builtin.set_fact:
    github_runner_cluster_k3s_token: "{{ github_runner_secrets_values.k3s_token }}"
    github_runner_cluster_tailscale_join_key: "{{ github_runner_secrets_values.tailscale_join_key | default('') }}"
    github_runner_cluster_tailscale_api_token: "{{ github_runner_secrets_values.tailscale_api_token | default('') }}"
    github_runner_cluster_join_key_listener: "{{ github_runner_secrets_provided | length == 0 }}"
    github_runner_cluster_headscale_api_key: "{{ github_runner_secrets_values.headscale_api_key | default('', true) or github_runner_cluster_headscale_api_key | default('') }}"
    github_runner_cluster_headscale_join_key: "{{ github_runner_secrets_values.headscale_join_key | default('', true) or github_runner_cluster_headscale_join_key | default('') }}"
  no_log: true

- name: Hand the ARC role its own secrets  # noqa: var-naming[no-role-prefix] - these facts are the other role's own inputs, so they carry its prefix
  ansible.builtin.set_fact:
    github_runner_arc_ghcr_username: "{{ github_runner_secrets_values.ghcr_username }}"
    github_runner_arc_ghcr_token: "{{ github_runner_secrets_values.ghcr_token }}"
    github_runner_arc_heartbeat_gh_token: "{{ github_runner_secrets_values.heartbeat_gh_token }}"
  no_log: true

- name: Give each of this host's orgs that names its App key by 1Password reference the key itself  # noqa: var-naming[no-role-prefix] - the ARC role's own input
  ansible.builtin.set_fact:
    github_runner_arc_orgs: "{{ github_runner_arc_orgs | exadev.github_runner.onepassword_fill_org_keys(github_runner_secrets_values.org_private_keys) }}"
  no_log: true
  when: github_runner_arc_orgs | default([]) | selectattr('private_key_op_reference', 'defined') | list | length > 0
