---
# Included by the cluster role's tasks/mesh/headscale_existing.yml, with github_runner_secrets_new_headscale_join_key set, right after it creates a new Headscale join key in 1Password mode. Writes the key back to the item's headscale-join-key field (creating the field if the item has none) and refreshes the control node's cache to match, so future runs see it without re-reading 1Password.

- name: Persist the new Headscale join key to 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - edit
      - "{{ github_runner_secrets_item }}"
      - --vault
      - "{{ github_runner_secrets_vault }}"
      - "headscale-join-key[password]={{ github_runner_secrets_new_headscale_join_key }}"
  delegate_to: localhost
  changed_when: true
  no_log: true

- name: Fold the new Headscale join key into this run's own in-memory secrets
  ansible.builtin.set_fact:
    github_runner_secrets_values: "{{ github_runner_secrets_values | combine({'headscale_join_key': github_runner_secrets_new_headscale_join_key}) }}"
  no_log: true

- name: Refresh the cached secrets read to match, so future runs see the new key without re-reading 1Password
  ansible.builtin.copy:
    dest: "{{ github_runner_secrets_cache_path }}"
    content: "{{ github_runner_secrets_values | to_json }}"
    mode: "0600"
  delegate_to: localhost
  no_log: true
