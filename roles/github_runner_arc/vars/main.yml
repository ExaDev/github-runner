---
# Fixed names the role uses, and values it derives from its settings, not settings themselves: changing a name would orphan what an earlier run wrote under the old one.

# The username GitHub documents for authenticating to its registries with a token that belongs to no user, such as an App installation token.
github_runner_arc_app_pull_token_username: x-access-token

# Annotation on an App-sourced pull Secret recording when its token expires, written by the role and by the renewal job, so `kubectl get secret -o yaml` shows how fresh the credential is.
github_runner_arc_pull_token_expiry_annotation: github-runner.exadev/pull-token-expires-at

# Server-side apply field manager the renewal job writes the pull Secret with.
github_runner_arc_pull_secret_field_manager: github-runner-pull-secret-renewer

# Annotation the node recovery watcher writes alongside the out-of-service taint it applies, recording when it applied it. The watcher removes only a taint carrying this annotation, so an operator's own out-of-service taint is left alone.
github_runner_arc_node_recovery_annotation: github-runner.exadev/out-of-service-applied-at

# Whether the runner pods and the platform's Deployments reference a pull Secret at all. With github_runner_arc_image_pull_secret_source none every image they run is public, so the role writes, checks and references none, and removes one an earlier run wrote.
github_runner_arc_pull_secret_in_use: "{{ github_runner_arc_image_pull_secret_source != 'none' }}"

# The values install_scale_set_profile.yml passes to Helm with --set for a profile, with `org` and `profile` set: the org's URL and App Secret, the pull Secret (only while one is in use), the runner image, and the profile's scaleSetLabels one index at a time. --set rather than values for containers[] and the label list, since Helm replaces lists wholesale, so a values mapping naming containers would drop the values file's own command and resources for that container.
github_runner_arc_scale_set_set_values: >-
  {{
    [{'value': 'githubConfigUrl=https://github.com/' ~ org.name}, {'value': 'githubConfigSecret=' ~ profile.app_secret}]
    + ([{'value': 'template.spec.imagePullSecrets[0].name=' ~ github_runner_arc_image_pull_secret_name}] if github_runner_arc_pull_secret_in_use | bool else [])
    + [{'value': 'template.spec.containers[0].image=' ~ org.image}]
    + range(profile.scale_set_labels | length) | zip(profile.scale_set_labels) | map('join', ']=') | map('regex_replace', '^', 'scaleSetLabels[')
      | map('community.general.dict_kv', 'value') | list
  }}

# The registry cache's derived description (plugins/filter/arc.py's arc_registry_cache): each registry's port and address, the hosts.toml files and the BuildKit configuration runner pods mount. Empty when the cache is off.
github_runner_arc_registry_cache: >-
  {{
    github_runner_arc_registry_cache_registries | exadev.github_runner.arc_registry_cache(
      github_runner_arc_registry_cache_namespace, github_runner_arc_registry_cache_service_name,
      github_runner_arc_registry_cache_cluster_domain, github_runner_arc_registry_cache_base_port | int)
    if github_runner_arc_registry_cache_enabled | bool else {'errors': [], 'registries': [], 'hosts': {}, 'buildkitd': ''}
  }}

# The registry cache's ConfigMap in each runner namespace whose pods use it, the PersistentVolumeClaim its persistent storage uses, and where BUILDX_CONFIG points on a runner container that uses it: a writable directory holding buildkitd.default.toml.
github_runner_arc_registry_cache_configmap: registry-cache
github_runner_arc_registry_cache_claim: registry-cache
github_runner_arc_registry_cache_buildx_config_dir: /etc/github-runner/buildx

# Where a profile's job-started hook ConfigMap is mounted on the runner container, and its name in the profile's namespace. ACTIONS_RUNNER_HOOK_JOB_STARTED names job-started.sh in this directory, and the capability scripts it runs are in job-started.d beneath it.
github_runner_arc_job_started_hooks_dir: /etc/github-runner/hooks
github_runner_arc_job_started_configmap: github-runner-job-started

# The labels the role puts on every Role and RoleBinding it creates for the node cache pruner (templates/node-cache-pruner.yaml.j2) and finds them by (tasks/install_node_cache_pruner.yml). An object is the role's own only if it carries all three, so another software's object sharing one of them is never touched.
github_runner_arc_node_cache_pruner_labels:
  app.kubernetes.io/name: node-cache-pruner
  app.kubernetes.io/part-of: github-runner
  app.kubernetes.io/managed-by: exadev.github_runner

# The pattern a numeric node cache setting must match and the largest value each may have, the same constants as scripts/node-cache-pruner.sh (which derives them from its arithmetic, in the comment there) so that the role refuses what the pruner would refuse and a value the pruner would crash on never reaches the DaemonSet. tests/unit/test_node_cache_pruner_role.py checks that the two agree.
github_runner_arc_node_cache_positive_integer_pattern: '^[1-9][0-9]*$'
github_runner_arc_node_cache_max_limit_gib: 1073741824
github_runner_arc_node_cache_max_hard_limit_factor: 1024
github_runner_arc_node_cache_max_prune_seconds: 86400
