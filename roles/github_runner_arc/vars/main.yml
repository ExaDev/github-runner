---
# Fixed names the role uses, not settings: changing one would orphan what an earlier run wrote under the old one.

# The username GitHub documents for authenticating to its registries with a token that belongs to no user, such as an App installation token.
github_runner_arc_app_pull_token_username: x-access-token

# Annotation on an App-sourced pull Secret recording when its token expires, written by the role and by the renewal job, so `kubectl get secret -o yaml` shows how fresh the credential is.
github_runner_arc_pull_token_expiry_annotation: github-runner.exadev/pull-token-expires-at

# Server-side apply field manager the renewal job writes the pull Secret with.
github_runner_arc_pull_secret_field_manager: github-runner-pull-secret-renewer

# Annotation the node recovery watcher writes alongside the out-of-service taint it applies, recording when it applied it. The watcher removes only a taint carrying this annotation, so an operator's own out-of-service taint is left alone.
github_runner_arc_node_recovery_annotation: github-runner.exadev/out-of-service-applied-at
