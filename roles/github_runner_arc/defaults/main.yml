---
# ARC (Actions Runner Controller) in an existing Kubernetes cluster: the controller, each org's runner scale sets, and the fleet-health platform (heartbeat and autoscaler). Each part is gated on this host's own github_runner_arc_orgs or github_runner_arc_heartbeat_gist_id, so any host that can reach the cluster's API can be the one Ansible installs from: a k3s server host brought up by github_runner_cluster, or localhost with a kubeconfig (playbooks/arc.yml). On a host github_runner_cluster made an agent, this role installs nothing.

# Orgs whose runner scale sets this host installs. Each entry: name, app_id (needed only when the role writes the App Secret; otherwise read from the existing Secret, and checked against it when set), image, private_key (the App's PEM private key, from any source Ansible reads) or private_key_op_reference (an op:// reference the 1Password adapter resolves into private_key), optionally installation_id (resolved from the App when empty), optionally app_secret_name (the App Secret's name in each of the org's namespaces, default <org>-github-app), and scale_set_profiles, a list of {suffix, namespace?, release_name?, values_file?, max_runners?, node_selector?, runs_on_label?, scale_set_labels?, autoscale?, sizing?}. sizing takes uniform node figures, or measured: true to read each eligible node's free capacity from the cluster at install time. Each profile becomes one namespace (namespace, default arc-runners-<org><suffix>), two Secrets in it, and one Helm release (release_name, default <org>-runners<suffix>); setting both overrides lets the role take over scale sets an existing install created under its own names. See the README for every profile key.
github_runner_arc_orgs: []

# Directory on the control node that a relative scale_set_profiles[].values_file is read from. Values files are Jinja templates rendered on the control node, so the target host needs no checkout. A profile with no values_file uses the role's own templates/runner-scale-set-values.yaml.j2.
github_runner_arc_values_dir: ""

# Kubeconfig path on the host the role runs against. Empty means the Kubernetes modules' own default (KUBECONFIG, then ~/.kube/config); a host brought up by github_runner_cluster uses the kubeconfig that role writes.
github_runner_arc_kubeconfig_path: "{{ github_runner_cluster_kubeconfig_path | default('') }}"

# Helm chart version pins, left undefined so the tasks omit --version and Helm installs the latest chart. Set github_runner_arc_controller_chart_version and/or github_runner_arc_scaleset_chart_version (e.g. "0.14.2") to hold a chart back.

# The ARC controller's Helm release name and namespace. The stale-listener check, the heartbeat's RBAC and the heartbeat itself look for the controller here too, so a cluster whose controller was installed under other names sets both to those names rather than getting a second controller.
github_runner_arc_controller_release_name: "arc"
github_runner_arc_controller_namespace: "actions-runner-controller"

# ARC controller. Replicas above 1 turn on the chart's leader election and spread the pods across nodes with a preferred pod anti-affinity. Extra values are merged over the role's own controller values.
github_runner_arc_controller_replicas: 1
github_runner_arc_controller_extra_values: {}

# Prometheus metrics for the controller and every listener. The 0.14 chart enables both together, so this is one switch. Listener probes (below) need it on.
github_runner_arc_metrics_enabled: false
github_runner_arc_controller_metrics_addr: ":8080"
github_runner_arc_listener_metrics_addr: ":8080"
github_runner_arc_listener_metrics_endpoint: "/metrics"

# Readiness and liveness probes on each listener's metrics endpoint. The chart's listener container has no probe, so without these a listener that starts and then fails its GitHub authentication still counts as ready during a rollout. The listener image has no shell, so an HTTP probe is the only kind that works.
github_runner_arc_listener_probes_enabled: false
github_runner_arc_listener_probe_port: 8080

# Node eligibility by label. When the key is set, the controller, every listener and every runner pod get a nodeSelector for key=value, and the role labels each node named in github_runner_arc_labelled_nodes with it (nodes labelled some other way need not be listed). A label rather than a taint keeps the cluster's other workloads unaffected. A profile's own node_selector is merged over this.
github_runner_arc_node_label_key: ""
github_runner_arc_node_label_value: "true"
github_runner_arc_labelled_nodes: []

# Secrets, as plain variables from any source Ansible reads: github_runner_arc_ghcr_username and github_runner_arc_ghcr_token (a registry pull credential for the runner and platform images, needed only when github_runner_arc_image_pull_secret_source is static) and github_runner_arc_heartbeat_gh_token (a PAT with gist scope), plus each org's private_key above. No defaults.

# false means the role does not write the App Secrets or heartbeat-gh-token itself (and needs no private_key or installation_id), and instead checks before changing anything that each profile's namespace already holds its App Secret (and that the platform namespace holds heartbeat-gh-token).
github_runner_arc_manage_secrets: true

# Whether the role writes the image pull Secret named below into each namespace, from the credential github_runner_arc_image_pull_secret_source chooses. false uses a pull Secret something else creates and keeps current: the role then needs no pull credential, skips the image pull check, and only checks the Secret exists before changing anything. Follows github_runner_arc_manage_secrets unless set.
github_runner_arc_manage_image_pull_secret: "{{ github_runner_arc_manage_secrets }}"

# Registry the pull Secret authenticates to, and its name in each namespace, whether the role writes it or uses an existing one.
github_runner_arc_image_pull_registry: "ghcr.io"
github_runner_arc_image_pull_secret_name: "ghcr-pull"

# Where a pull Secret the role writes gets its credential. static: github_runner_arc_ghcr_username and github_runner_arc_ghcr_token. app: an installation token the role mints from each org's GitHub App (the App Secret it writes, or the existing one when github_runner_arc_manage_secrets is false), restricted to packages: read, with x-access-token as the username. The App must have the packages: read permission, approved on its installation. An installation token lasts an hour, so with app the role also installs a CronJob in each runner namespace that mints a fresh token, proves it can read the org's image and patches the Secret (see tasks/install_pull_secret_renewal.yml); with static it removes any such CronJob. With app the platform's Deployments pull without a Secret, since no one org's App can read another's packages.
github_runner_arc_image_pull_secret_source: static

# How often the renewal CronJob replaces an App-sourced pull token. Well inside the token's one-hour lifetime, so that two missed runs still leave a valid token.
github_runner_arc_image_pull_secret_renewal_schedule: "*/15 * * * *"

# Image the renewal CronJob runs. Pulled without a pull Secret, so it must be public.
github_runner_arc_image_pull_secret_renewer_image: "ghcr.io/exadev/github-runner-pull-secret-renewer:1.2.1"

# Before writing the pull Secret, prove the credential can read each image this host installs from that registry (with an App token, each org's own image, in the role and in every renewal): exchange it for a registry bearer token and fetch the image's manifest. A token that authenticates but lacks package access is otherwise only found later, as pods stuck in ImagePullBackOff. Uses the registry's /token endpoint, as GHCR provides.
github_runner_arc_verify_image_pull: true

# Fleet-health platform. Set github_runner_arc_heartbeat_gist_id on one host to install it from there.
github_runner_arc_heartbeat_gist_id: ""
github_runner_arc_heartbeat_window_seconds: 600
github_runner_arc_heartbeat_interval_seconds: 180
# When no host in the inventory has a gist id, create one with the control node's `gh` session and stop so the operator can record it. false skips that, and the platform is simply not installed.
github_runner_arc_heartbeat_bootstrap_gist: true
github_runner_arc_heartbeat_gist_description: "GitHub Actions runner fleet health heartbeat"
# Anything else that must be told the new gist's id (for example a fallback action's gist-id default), named in the bootstrap failure message. Empty names nothing.
github_runner_arc_heartbeat_gist_consumer: ""

# Namespace and images for the platform's own Deployments (see install_platform.yml).
github_runner_arc_platform_namespace: "github-runner-platform"
github_runner_arc_heartbeat_image: "ghcr.io/exadev/github-runner-heartbeat:1.2.1"
github_runner_arc_autoscaler_image: "ghcr.io/exadev/github-runner-autoscaler:1.2.1"

# Usage-driven autoscaler for the one scale-set profile that sets autoscale: true (see scripts/autoscaler.sh and the README's Autoscaler section). It is installed only when such a profile exists and this host installs the platform. The memory budget, ceiling and floor have no defaults because they depend on the pool: the budget is the memory runner pods may use across every node, the ceiling caps maxRunners (the autoscaled profile's sizing, when set, supplies it instead), and the floor must equal the maxRunners in that profile's values, which every Helm upgrade reverts to.
github_runner_arc_autoscaler_dry_run: true
github_runner_arc_autoscaler_poll_seconds: 45
github_runner_arc_autoscaler_raise_confirm_polls: 2
github_runner_arc_autoscaler_mem_available_pressure_pct: 15

# GitHub App creation through the manifest flow (tasks/app_setup.yml, run by playbooks/github_app_setup.yml). The App needs only organisation self-hosted runner write access; add packages: read to the permissions if its installation token should also pull private packages.
github_runner_arc_app_setup_org: ""
github_runner_arc_app_setup_name: ""
github_runner_arc_app_setup_description: "Registers self-hosted GitHub Actions runners through Actions Runner Controller."
# The App's homepage and the page GitHub redirects to with the one-time code. Empty means the organisation's GitHub page.
github_runner_arc_app_setup_homepage_url: ""
github_runner_arc_app_setup_permissions:
  organization_self_hosted_runners: write
github_runner_arc_app_manifest_code: ""
github_runner_arc_app_private_key_path: ""
# How long phase 2 waits for the App to be installed: retries times delay seconds.
github_runner_arc_app_setup_install_retries: 40
github_runner_arc_app_setup_install_delay: 15
# The phase 2 command the manifest form and phase 1's instructions tell the person to run, without the code and key path, which the role appends. Its default runs this collection's playbook from a checkout; a playbook that wraps the flow names itself here, with whatever arguments it needs.
github_runner_arc_app_setup_command: >-
  ansible-playbook playbooks/github_app_setup.yml -e github_runner_arc_app_setup_org={{ github_runner_arc_app_setup_org }}
  -e '{"github_runner_arc_app_setup_name": "{{ github_runner_arc_app_setup_name }}"}'
# Whether phase 2 writes the App Secret (github_app_id, github_app_installation_id and github_app_private_key) into the cluster once the App is installed, through github_runner_arc_kubeconfig_path, creating the namespaces it needs. The cluster is reached, and the namespaces created, before the one-time code is used, so a broken cluster path costs only a rerun. false leaves the key in its file for the operator to store.
github_runner_arc_app_setup_write_secret: false
# The namespaces the App Secret is written into. Empty means those of the organisation's scale-set profiles in github_runner_arc_orgs.
github_runner_arc_app_setup_secret_namespaces: []
# The App Secret's name. Empty means the organisation's app_secret_name in github_runner_arc_orgs, or <org>-github-app, as the role's install uses.
github_runner_arc_app_setup_secret_name: ""
# Whether to keep the private key file once the App Secret holds the key. false removes it, so the key is on disk only until the Secret is written; a run that stops earlier, for example because nobody installed the App within the wait, leaves the file so the App can still be finished without a new code.
github_runner_arc_app_setup_keep_private_key: false
