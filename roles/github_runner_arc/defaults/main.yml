---
# ARC (Actions Runner Controller) on an existing k3s cluster: the controller, each org's runner scale sets, and the fleet-health platform (heartbeat/autoscaler). None of it is tied to a node role: each part is gated purely on whether THIS host's own github_runner_arc_orgs or github_runner_arc_heartbeat_gist_id is set, so any server host can be the one Ansible installs against. On a host the github_runner_cluster role made an agent, this role installs nothing.

# Set github_runner_arc_orgs in a host's own host_vars to install one or more orgs' runner scale sets FROM that host (server hosts only; any server host works, not just a specific designated one). Each entry becomes one namespace per scale-set profile, two Kubernetes Secrets per namespace, and one Helm release per profile. Empty (the default) means the role no-ops that part entirely on that host. See ansible/host_vars/node-a.yml for a real, working example.
github_runner_arc_orgs: []

# Set github_runner_arc_heartbeat_gist_id in a host's own host_vars to install the fleet-health platform FROM that host (server hosts only; any server host works, same as github_runner_arc_orgs above). Empty (the default) means install_platform.yml no-ops entirely on that host.
github_runner_arc_heartbeat_gist_id: ""
github_runner_arc_heartbeat_window_seconds: 600
github_runner_arc_heartbeat_interval_seconds: 180

# Secrets, normally set by the github_runner_secrets role: github_runner_arc_ghcr_username and github_runner_arc_ghcr_token (a GHCR pull token for the runner and platform images), github_runner_arc_heartbeat_gh_token (a PAT with gist scope), and github_runner_arc_org_private_keys ({<org name>: <PEM content>}, one per entry in github_runner_arc_orgs). No defaults: a host that installs an org or the platform needs them.

# Namespace and image refs for the fleet-health platform's own Deployments (see install_platform.yml). Built and pushed the same manual multi-arch way as the main runner image - see the README's Build/test section.
github_runner_arc_platform_namespace: "github-runner-platform"
github_runner_arc_heartbeat_image: "ghcr.io/exadev/github-runner-heartbeat:latest"
github_runner_arc_autoscaler_image: "ghcr.io/exadev/github-runner-autoscaler:latest"

# Usage-driven autoscaler tunables - see scripts/autoscaler.sh and the README's Autoscaler section for the full algorithm. AUTOSCALER_SWAP_PRESSURE_PCT has no equivalent here: swap pressure is dropped as a signal now that the autoscaler pod can be scheduled on any node (no cluster-wide swap metric exists via kubectl top nodes/metrics-server) - see scripts/autoscaler.sh's own comment.
github_runner_arc_autoscaler_dry_run: true
github_runner_arc_autoscaler_poll_seconds: 45
# 24Gi: node-b's ~20.9Gi usable plus node-a's ~3.8Gi usable (see values/exadev-runners-values.yaml's own derivation), rounded down slightly for margin - the autoscaler manages one AutoscalingRunnerSet spanning the whole unpinned pool, not just one node.
github_runner_arc_autoscaler_usable_budget_gi: 24
# 7: floor(20.9/3) + floor(3.8/3) at the values file's own 3Gi Guaranteed-QoS pod size - the real bin-packing-safe ceiling across the pool, not an arbitrary cap.
github_runner_arc_autoscaler_max_ceiling: 7
# Matches values/exadev-runners-values.yaml's own static maxRunners - the same proven-safe floor, enforced by two mechanisms (Helm's persisted value, the autoscaler's own fail-safe patch target).
github_runner_arc_autoscaler_floor: 3
github_runner_arc_autoscaler_raise_confirm_polls: 2
github_runner_arc_autoscaler_mem_available_pressure_pct: 15

# The values/ Helm values files (the single source of truth for both the ARC controller and every org's runner scale set) are read in place from the checkout on the target host, and the kubeconfig is the one the cluster's own k3s container writes there, so both default to paths under the github_runner_cluster role's repo root.
github_runner_arc_values_dir: "{{ github_runner_cluster_repo_root }}/values"
github_runner_arc_kubeconfig_path: "{{ github_runner_cluster_kubeconfig_path }}"

# Helm chart version pins, left undefined (not set to "") so that `| default(omit)` in tasks/main.yml and tasks/install_scale_set_profile.yml drops the --version flag entirely rather than passing an empty string. To hold a chart back, set github_runner_arc_controller_chart_version and/or github_runner_arc_scaleset_chart_version (e.g. "0.12.1") in a host's group_vars or host_vars.
