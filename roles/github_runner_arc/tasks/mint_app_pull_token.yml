---
# Included once per org from main.yml when github_runner_arc_image_pull_secret_source is app, before anything in the cluster changes. Mints an installation token from the org's GitHub App, restricted to packages: read, and proves it can read the org's image, so that install_scale_set_profile.yml writes a pull Secret that is known to work and a refused permission fails the run here rather than as pods in ImagePullBackOff. The renewal CronJob (install_pull_secret_renewal.yml) repeats the same steps in the cluster before the token's hour runs out.
#
# The App's credentials come from the org's own entry when the role writes the App Secret, or from that Secret in the org's first namespace when something else does. Signing and minting run on the control node, and like the installation id lookup they run under --check too: they change nothing in the cluster, and the check is only meaningful if the credential is real.

- name: Resolve the installation ID of {{ org.name }}
  ansible.builtin.include_tasks: resolve_installation_id.yml
  when: github_runner_arc_manage_secrets | bool and (org.installation_id | default('') | string) | length == 0 and org.name not in (github_runner_arc_installation_ids | default({}))

- name: Read the App Secret of {{ org.name }}
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ github_runner_arc_org_first_profile.namespace }}"
    name: "{{ github_runner_arc_org_first_profile.app_secret }}"
  register: github_runner_arc_mint_app_secret
  no_log: true
  when: not (github_runner_arc_manage_secrets | bool)

- name: Take the App's credentials for {{ org.name }}
  ansible.builtin.set_fact:
    github_runner_arc_mint_app: >-
      {{
        {'id': org.app_id | string,
         'installation_id': (org.installation_id | default('') | string) or github_runner_arc_installation_ids[org.name],
         'private_key': org.private_key}
        if github_runner_arc_manage_secrets | bool else
        {'id': github_runner_arc_mint_app_secret.resources[0].data.github_app_id | b64decode,
         'installation_id': github_runner_arc_mint_app_secret.resources[0].data.github_app_installation_id | b64decode,
         'private_key': github_runner_arc_mint_app_secret.resources[0].data.github_app_private_key | b64decode}
      }}
  no_log: true

- name: Mint a packages read token from the App of {{ org.name }}
  delegate_to: localhost
  check_mode: false
  block:
    - name: Create a temporary file for the private key of {{ org.name }}
      ansible.builtin.tempfile:
        state: file
        suffix: ".pem"
      register: github_runner_arc_mint_private_key_tempfile

    - name: Write the private key to the temporary file for {{ org.name }}
      ansible.builtin.copy:
        content: "{{ github_runner_arc_mint_app.private_key }}"
        dest: "{{ github_runner_arc_mint_private_key_tempfile.path }}"
        mode: "0600"
      no_log: true

    - name: Sign an App JWT for {{ org.name }}
      ansible.builtin.script:
        cmd: "generate_app_jwt.py {{ github_runner_arc_mint_app.id | quote }} {{ github_runner_arc_mint_private_key_tempfile.path | quote }}"
        executable: python3
      changed_when: false
      no_log: true
      register: github_runner_arc_mint_jwt

    # Restricted to packages: read, whatever else the App may do. GitHub answers 422 when the App or this installation lacks the permission, which the next task reports.
    - name: Mint the installation token for {{ org.name }}
      ansible.builtin.uri:
        url: "https://api.github.com/app/installations/{{ github_runner_arc_mint_app.installation_id }}/access_tokens"
        method: POST
        headers:
          Authorization: "Bearer {{ github_runner_arc_mint_jwt.stdout | trim }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        body_format: json
        body:
          permissions:
            packages: read
        status_code: [201, 401, 403, 404, 422]
      no_log: true
      register: github_runner_arc_mint_response
  always:
    - name: Remove the private key temporary file for {{ org.name }}
      ansible.builtin.file:
        path: "{{ github_runner_arc_mint_private_key_tempfile.path }}"
        state: absent
      when: github_runner_arc_mint_private_key_tempfile.path is defined

- name: Fail when GitHub refused the token for {{ org.name }}
  ansible.builtin.fail:
    msg: >-
      GitHub refused to mint a packages: read installation token from the App of {{ org.name }}
      (HTTP {{ github_runner_arc_mint_response.status }}: {{ github_runner_arc_mint_response.json.message | default('no message') }}).
      The App needs the packages: read permission, and the organisation must approve it on the App's installation.
  when: github_runner_arc_mint_response.status != 201

- name: Record the pull token of {{ org.name }}
  ansible.builtin.set_fact:
    github_runner_arc_app_pull_tokens: "{{ github_runner_arc_app_pull_tokens | default({}) | combine({org.name: {'token': github_runner_arc_mint_response.json.token, 'expires_at': github_runner_arc_mint_response.json.expires_at}}) }}"
  no_log: true

- name: Prove the token can read the image of {{ org.name }}
  ansible.builtin.include_tasks: verify_image_pull_one.yml
  when: github_runner_arc_verify_image_pull | bool
  loop: "{{ [org.image] | map('exadev.github_runner.arc_image_ref') | selectattr('registry', 'equalto', github_runner_arc_image_pull_registry) | list }}"
  loop_control:
    loop_var: image
    label: "{{ image.registry }}/{{ image.repository }}:{{ image.reference }}"
  vars:
    github_runner_arc_pull_username: "{{ github_runner_arc_app_pull_token_username }}"
    github_runner_arc_pull_password: "{{ github_runner_arc_app_pull_tokens[org.name].token }}"
    github_runner_arc_pull_credential: "the packages: read token from the App of {{ org.name }}"
    github_runner_arc_pull_credential_hint: "Check the App has the packages: read permission, approved on its installation, and that the package is visible to it."
