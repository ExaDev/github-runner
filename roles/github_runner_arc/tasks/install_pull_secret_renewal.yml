---
# Included once per scale-set profile from install_scale_set_profile.yml, with `org` and `profile` set. With github_runner_arc_image_pull_secret_source app (and the role managing the pull Secret) it installs a CronJob in the profile's namespace that renews the pull Secret from the org's GitHub App before its installation token expires, running scripts/renew-pull-secret.sh in the pull-secret-renewer image. Otherwise it removes that CronJob and its RBAC, so a profile moved back to a static credential is not overwritten by a renewal left behind.
#
# The job reads the App Secret through a volume, which the kubelet mounts for it, so its ServiceAccount needs no access to that Secret; its one Role grants get and patch on the pull Secret alone, by name. It cannot create the Secret, which is why the role writes the first token itself. It pulls its own image without a pull Secret, so an expired token cannot stop the job that replaces it.

- name: Describe the pull Secret renewal for {{ profile.label }}
  ansible.builtin.set_fact:
    github_runner_arc_renewal_enabled: "{{ github_runner_arc_manage_image_pull_secret | bool and github_runner_arc_image_pull_secret_source == 'app' }}"
    github_runner_arc_renewal_resources: "{{ lookup('ansible.builtin.template', 'pull-secret-renewal.yaml.j2') | from_yaml_all | list }}"

- name: Install the pull Secret renewal for {{ profile.label }}
  kubernetes.core.k8s:
    definition: "{{ item }}"
  loop: "{{ github_runner_arc_renewal_resources }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: github_runner_arc_renewal_enabled | bool

# Deleted in the reverse order, so the CronJob goes before the permissions it runs with.
- name: Remove any pull Secret renewal for {{ profile.label }}
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.apiVersion }}"
    kind: "{{ item.kind }}"
    namespace: "{{ item.metadata.namespace }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ github_runner_arc_renewal_resources | reverse | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"
  when: not (github_runner_arc_renewal_enabled | bool)
