---
# The node cache pruner (scripts/node-cache-pruner.sh, manifests in templates/node-cache-pruner.yaml.j2): a DaemonSet that keeps each profile's node cache under github_runner_arc_node_cache_size_limit_gib and clears the directories of profiles that no longer have a cache. See decide_node_cache_pruner.yml for when it runs.

# Release 1.31.0 installed the pruner with a cluster-wide grant to list pods, under this name; nothing of it is wanted any more, so it is removed on every run, whether or not the pruner is, binding before role. This cleanup is kept only for fleets that may still be upgrading from 1.31.0, and goes once none can be (tracked in ExaDev/github-runner#92, with the test that asserts it).
- name: "Node cache: remove the cluster-wide pod access an earlier release granted"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
    name: node-cache-pruner
  loop:
    - ClusterRoleBinding
    - ClusterRole

- name: "Node cache: decide what the pruner needs"
  ansible.builtin.include_tasks: decide_node_cache_pruner.yml

- name: "Node cache: the pruner needs the nodes runner pods may use to be labelled"
  ansible.builtin.assert:
    that: github_runner_arc_node_label_key | length > 0
    fail_msg: The node cache pruner runs on the nodes runner pods may use, so github_runner_arc_node_label_key must be set; without it the pruner would run on every node of the cluster.
    quiet: true
  when: github_runner_arc_node_cache_pruner_wanted | bool

- name: "Node cache: install the pruner"
  when: github_runner_arc_node_cache_pruner_wanted | bool
  block:
    - name: "Node cache: choose the pull Secret its DaemonSet uses"
      ansible.builtin.include_tasks: choose_platform_pull_secrets.yml

    - name: "Node cache: the namespaces its RBAC lives in"
      kubernetes.core.k8s:
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ item }}"
      loop: "{{ ([github_runner_arc_platform_namespace] + (github_runner_arc_fleet.profiles | map(attribute='namespace') | list)) | unique }}"

    - name: "Node cache: the pruner's manifests"
      ansible.builtin.set_fact:
        github_runner_arc_node_cache_pruner_resources: "{{ lookup('ansible.builtin.template', 'node-cache-pruner.yaml.j2') | from_yaml_all | list }}"

    - name: "Node cache: install/upgrade the pruner"
      kubernetes.core.k8s:
        definition: "{{ item }}"
      loop: "{{ github_runner_arc_node_cache_pruner_resources }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name }}"

# The DaemonSet goes before the account and permissions it runs with.
- name: "Node cache: remove the pruner when it is not wanted"
  when: not (github_runner_arc_node_cache_pruner_wanted | bool)
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api_version }}"
    kind: "{{ item.kind }}"
    namespace: "{{ github_runner_arc_platform_namespace }}"
    name: node-cache-pruner
  loop:
    - {api_version: apps/v1, kind: DaemonSet}
    - {api_version: v1, kind: ServiceAccount}
  loop_control:
    label: "{{ item.kind }}/node-cache-pruner"

# The pruner's Roles and RoleBindings are found by the labels the role puts on them (all of them, so another software's objects are left alone) in every namespace. They are removed only when the pruner is. While it is installed a profile that has left the fleet keeps its grant, which is read-only (it lists pods and nothing else) and confined to that profile's own namespace, so staying is harmless, and it lets the pruner still check, and so clear, a directory the profile left. Bindings go before the roles they bind.
- name: "Node cache: find the pruner's Roles and RoleBindings"
  kubernetes.core.k8s_info:
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item }}"
    label_selectors: "{{ github_runner_arc_node_cache_pruner_labels | exadev.github_runner.arc_label_selectors }}"
  loop:
    - Role
    - RoleBinding
  register: github_runner_arc_node_cache_pruner_access

- name: "Node cache: remove the pruner's access when the pruner is not wanted"
  kubernetes.core.k8s:
    state: absent
    api_version: rbac.authorization.k8s.io/v1
    kind: "{{ item.kind }}"
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
  loop: "{{ github_runner_arc_node_cache_pruner_access.results | map(attribute='resources') | flatten | exadev.github_runner.arc_node_cache_access_to_remove(github_runner_arc_node_cache_pruner_labels, github_runner_arc_node_cache_pruner_wanted | bool) }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.name }} in {{ item.namespace }}"
