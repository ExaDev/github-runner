---
# Included once per org whose installation_id is not set (see install_org.yml). Signs a short-lived App JWT with files/generate_app_jwt.py and finds this org's installation in GET /app/installations, using the org's own private_key.
#
# Runs entirely on the control node: nothing here needs the target host, and delegating keeps the temporary key file off it.
#
# No delegate_facts anywhere, deliberately: with it unset, a delegated task's facts attach to inventory_hostname, which is what install_org.yml reads. delegate_facts: true would send them to localhost instead, which once left the deployed App Secret's installation_id empty.
- name: Resolve the installation ID via a signed App JWT
  delegate_to: localhost
  # Read-only apart from a temp file it removes again, and the org's secrets need the result, so it runs under --check too.
  check_mode: false
  block:
    - name: Create a temporary file for the private key of {{ org.name }}
      ansible.builtin.tempfile:
        state: file
        suffix: ".pem"
      register: github_runner_arc_resolve_private_key_tempfile

    - name: Write the private key to the temporary file for {{ org.name }}
      ansible.builtin.copy:
        content: "{{ org.private_key }}"
        dest: "{{ github_runner_arc_resolve_private_key_tempfile.path }}"
        mode: "0600"
      no_log: true

    - name: Sign an App JWT for {{ org.name }}
      ansible.builtin.script:
        cmd: "generate_app_jwt.py {{ org.app_id | quote }} {{ github_runner_arc_resolve_private_key_tempfile.path | quote }}"
        executable: python3
      changed_when: false
      no_log: true
      register: github_runner_arc_resolve_jwt

    - name: List the App's installations for {{ org.name }}
      ansible.builtin.uri:
        url: https://api.github.com/app/installations?per_page=100
        headers:
          Authorization: "Bearer {{ github_runner_arc_resolve_jwt.stdout | trim }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
      no_log: true
      register: github_runner_arc_resolve_installations

    - name: Record the installation ID of {{ org.name }}
      ansible.builtin.set_fact:
        github_runner_arc_resolved_installation_id: "{{ github_runner_arc_resolve_installations.json | selectattr('account.login', 'equalto', org.name) | map(attribute='id') | map('string') | first | default('') }}"

    - name: Fail if the App has no installation on {{ org.name }}
      ansible.builtin.fail:
        msg: "Could not resolve an installation id for {{ org.name }}. Is the GitHub App installed on that org?"
      when: github_runner_arc_resolved_installation_id | length == 0
  always:
    - name: Remove the private key temporary file for {{ org.name }}
      ansible.builtin.file:
        path: "{{ github_runner_arc_resolve_private_key_tempfile.path }}"
        state: absent
      when: github_runner_arc_resolve_private_key_tempfile.path is defined
