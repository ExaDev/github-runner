---
# Included from check_existing_secrets.yml with github_runner_arc_existing_secrets registered: fails on a referenced Secret that does not exist, or an App Secret the controller could not use.

# Reduced to names, key names and the App's id, as JSON, which is all the checks below need, so that no task loops over the Secrets' data: a loop prints its items when it fails, and under -v when it skips.
- name: Reduce the Secrets to what the checks need
  ansible.builtin.set_fact:
    github_runner_arc_existing_secret_checks: >-
      {%- set checks = namespace(entries=[]) -%}
      {%- for result in github_runner_arc_existing_secrets.results -%}
      {%- set data = (result.resources | first | default({})).data | default({}, true) -%}
      {%- set checks.entries = checks.entries + [{'namespace': result.item.0, 'name': result.item.1, 'exists': result.resources | length > 0,
                                              'key_names': data.keys() | list, 'app_id': data.github_app_id | default('') | b64decode | trim}] -%}
      {%- endfor -%}
      {{ checks.entries | to_json }}
  no_log: true

- name: Fail when a referenced Secret does not exist
  ansible.builtin.fail:
    msg: >-
      Secret {{ item.name }} does not exist in namespace {{ item.namespace }}.
      The role is not managing it (github_runner_arc_manage_secrets or github_runner_arc_manage_image_pull_secret is false), so create it first: an App Secret holds github_app_id, github_app_installation_id and github_app_private_key;
      a pull Secret has type kubernetes.io/dockerconfigjson; heartbeat-gh-token holds a gist-scoped GitHub token under the key token.
  loop: "{{ github_runner_arc_existing_secret_checks | from_json }}"
  loop_control:
    label: "{{ item.namespace }}/{{ item.name }}"
  when: not item.exists

# The App Secrets this host does not write come first, one per profile. The role reads the App's id from them rather than requiring the org's app_id, so a Secret missing a key, or disagreeing with an app_id that is set, fails now rather than as a listener that cannot authenticate.
- name: Check each existing App Secret holds what the controller reads
  ansible.builtin.fail:
    msg: >-
      App Secret {{ item.0.namespace }}/{{ item.0.name }} of {{ item.1.org_name }}
      {{ ('has no ' ~ (github_runner_arc_missing_keys | join(', ')) ~ '; it needs github_app_id, github_app_installation_id and github_app_private_key.')
         if github_runner_arc_missing_keys | length > 0 else
         ('holds github_app_id ' ~ item.0.app_id ~ ', but the org sets app_id ' ~ github_runner_arc_org_app_id ~ ". Correct or remove the org's app_id.") }}
  loop: "{{ github_runner_arc_existing_secret_checks | from_json | zip(github_runner_arc_local.profiles) | list if not (github_runner_arc_manage_secrets | bool) else [] }}"
  loop_control:
    label: "{{ item.0.namespace }}/{{ item.0.name }}"
  vars:
    github_runner_arc_missing_keys: "{{ ['github_app_id', 'github_app_installation_id', 'github_app_private_key'] | reject('in', item.0.key_names) | list }}"
    github_runner_arc_org_app_id: "{{ (github_runner_arc_orgs | selectattr('name', 'equalto', item.1.org_name) | first).app_id | default('', true) | string }}"
  when:
    - item.0.exists
    - github_runner_arc_missing_keys | length > 0 or (github_runner_arc_org_app_id | length > 0 and github_runner_arc_org_app_id != item.0.app_id)
