---
# Installs the ARC controller, the fleet-health platform, and each org's runner scale sets into the cluster github_runner_arc_kubeconfig_path reaches. Safe to rerun: every mutating task uses kubernetes.core.k8s (server-side apply) or helm upgrade --install semantics, never a plain create.

# playbooks/site.yml and playbooks/arc.yml run validate.yml in an earlier play so that bad input fails before anything changes; this covers a play that includes the role on its own.
- name: Validate the ARC configuration
  ansible.builtin.include_tasks: validate.yml
  when: not (github_runner_arc_validated | default(false))

# github_runner_cluster_effective_node_role is published by the github_runner_cluster role; a host that role made an agent has no kubeconfig of its own and installs nothing, whatever its own orgs or gist id say.
- name: End the role here on an agent host
  ansible.builtin.meta: end_role
  when: (github_runner_cluster_effective_node_role | default('server')) == 'agent'

- name: End the role here on a host that installs nothing
  ansible.builtin.meta: end_role
  when: github_runner_arc_orgs | length == 0 and github_runner_arc_heartbeat_gist_id | length == 0

- name: Check this host's secrets are present before changing anything
  ansible.builtin.include_tasks: check_secrets.yml
  when: github_runner_arc_manage_secrets | bool or github_runner_arc_manage_image_pull_secret | bool

- name: Prove the pull credential can read every image this host installs
  ansible.builtin.include_tasks: verify_image_pull.yml
  when: github_runner_arc_manage_image_pull_secret | bool and github_runner_arc_verify_image_pull | bool

- name: Give this host the kubernetes Python client
  ansible.builtin.include_role:
    name: github_runner_k8s_client

- name: Install into the cluster
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ github_runner_arc_kubeconfig_path or omit }}"
    group/kubernetes.core.helm:
      kubeconfig: "{{ github_runner_arc_kubeconfig_path or omit }}"
  block:
    - name: Check the Secrets this host relies on already exist in the cluster
      ansible.builtin.include_tasks: check_existing_secrets.yml
      when: not (github_runner_arc_manage_secrets | bool and github_runner_arc_manage_image_pull_secret | bool)

    - name: Label the eligible nodes
      ansible.builtin.include_tasks: label_nodes.yml
      when: github_runner_arc_node_label_key | length > 0 and github_runner_arc_labelled_nodes | length > 0

    - name: Ensure the fleet-health platform (heartbeat and autoscaler) is installed
      ansible.builtin.include_tasks: install_platform.yml
      when: github_runner_arc_heartbeat_gist_id | length > 0

    - name: Install/upgrade the ARC controller (shared by every org on this host)
      ansible.builtin.include_tasks: install_controller.yml
      when: github_runner_arc_orgs | length > 0

    - name: Install/upgrade each org's runner scale sets
      ansible.builtin.include_tasks: install_org.yml
      loop: "{{ github_runner_arc_orgs }}"
      loop_control:
        loop_var: org
        label: "{{ org.name }}"
