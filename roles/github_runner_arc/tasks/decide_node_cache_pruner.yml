---
# Decides which profiles have a node cache and whether the pruner runs, from the fleet, the capability catalogue and github_runner_arc_node_cache_existing_pruners (the pruner DaemonSets already in the cluster, from the includer). The pruner runs while the size limit is above zero and some profile has a node cache, and also while it is already installed, so it can empty the directories a removed capability or profile left behind; 0 removes it.

- name: "Node cache: find the profiles that carry a node-cache capability"
  ansible.builtin.set_fact:
    github_runner_arc_node_cache_profiles: "{{ github_runner_arc_fleet.profiles | exadev.github_runner.arc_node_cache_profiles(github_runner_arc_capabilities) }}"

- name: "Node cache: decide whether the pruner is wanted"
  ansible.builtin.set_fact:
    github_runner_arc_node_cache_pruner_wanted: >-
      {{
        github_runner_arc_node_cache_size_limit_gib | int > 0
        and (github_runner_arc_node_cache_profiles | length > 0 or github_runner_arc_node_cache_existing_pruners | length > 0)
      }}
