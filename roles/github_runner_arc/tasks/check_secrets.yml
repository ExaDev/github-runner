---
# Fails before anything changes when a secret this host is about to write is missing, rather than letting it surface later as a listener that cannot authenticate or a pod stuck in ImagePullBackOff.

- name: Fail when an org's GitHub App private key is missing or is not a PEM key
  ansible.builtin.fail:
    msg: >-
      No usable GitHub App private key for org {{ org.name }}: its private_key must hold the PEM key.
      {{ 'Its private_key_op_reference is only read by the github_runner_secrets_onepassword adapter (github_runner_secrets_source: onepassword); use it, or replace the reference with private_key.'
         if org.private_key_op_reference is defined else
         'Set it from any source Ansible reads, e.g. an ansible-vault string or a lookup.' }}
  loop: "{{ github_runner_arc_orgs }}"
  loop_control:
    loop_var: org
    label: "{{ org.name }}"
  when: org.private_key | default('') is not search('-----BEGIN [A-Z ]*PRIVATE KEY-----')

- name: Fail when the image pull credential is missing
  ansible.builtin.fail:
    msg: github_runner_arc_ghcr_username and github_runner_arc_ghcr_token must both be set to write the {{ github_runner_arc_image_pull_secret_name }} pull Secret.
  when: (github_runner_arc_ghcr_username | default('')) | length == 0 or (github_runner_arc_ghcr_token | default('')) | length == 0

- name: Fail when the heartbeat's GitHub token is missing
  ansible.builtin.fail:
    msg: github_runner_arc_heartbeat_gh_token (a GitHub token with gist scope) must be set to install the fleet-health platform.
  when:
    - github_runner_arc_heartbeat_gist_id | length > 0
    - (github_runner_arc_heartbeat_gh_token | default('')) | length == 0
