---
# Included once per org from main.yml, with `org` set to its github_runner_arc_orgs entry. Resolves the installation id once per org, then installs each of the org's scale-set profiles through install_scale_set_profile.yml.

- name: Resolve the installation ID of {{ org.name }}
  ansible.builtin.include_tasks: resolve_installation_id.yml
  when: (org.installation_id | default('')) | length == 0

- name: Set the effective installation ID of {{ org.name }}
  # Read directly by name: resolve_installation_id.yml sets this with a plain set_fact and no delegate_facts, so it attaches to this host, not to the localhost it delegated to.
  ansible.builtin.set_fact:
    github_runner_arc_installation_id: "{{ github_runner_arc_resolved_installation_id | default(org.installation_id) }}"

- name: Install/upgrade each scale-set profile of {{ org.name }}
  ansible.builtin.include_tasks: install_scale_set_profile.yml
  loop: "{{ github_runner_arc_local.profiles | selectattr('org_name', 'equalto', org.name) }}"
  loop_control:
    loop_var: profile
    label: "{{ profile.label }}"

- name: Trigger an immediate autoscaler reconcile after upgrading {{ org.name }}
  # Every Helm upgrade above reverts maxRunners to its values file's floor; this shrinks that window to seconds instead of waiting for the autoscaler's next poll. Goes through the API server (kubectl exec) because the autoscaler is an unpinned in-cluster Deployment. Best-effort: the poll loop catches up regardless, including when the Deployment does not exist yet.
  ansible.builtin.command: kubectl exec deploy/autoscaler -n {{ github_runner_arc_platform_namespace }} -- /app/scripts/autoscaler.sh
  environment: "{{ {'KUBECONFIG': github_runner_arc_kubeconfig_path} if github_runner_arc_kubeconfig_path | length > 0 else {} }}"
  changed_when: false
  failed_when: false
  when: github_runner_arc_fleet.autoscaled is not none and github_runner_arc_fleet.autoscaled.org_name == org.name
