---
# Included once per scale-set profile, with `org` and `profile` (the expanded profile from plugins/filter/arc.py) set by install_org.yml. Each profile gets its own namespace: the chart names some resources (the ServiceAccount, for one) after runnerScaleSetName rather than the release, so two releases in one namespace collide. Secrets are namespace-scoped, so each namespace needs its own copy of the org's.

- name: Create the namespace for {{ profile.label }}
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ profile.namespace }}"

- name: Create/update the GitHub App secret for {{ profile.label }}
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ profile.app_secret }}"
        namespace: "{{ profile.namespace }}"
      stringData:
        github_app_id: "{{ org.app_id | string }}"
        github_app_installation_id: "{{ github_runner_arc_installation_id }}"
        github_app_private_key: "{{ org.private_key }}"
  no_log: true
  when: github_runner_arc_manage_secrets | bool

- name: Create/update the image pull secret for {{ profile.label }}
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'image-pull-secret.yaml.j2', template_vars={'namespace': profile.namespace}) | from_yaml }}"
  no_log: true
  when: github_runner_arc_manage_secrets | bool

- name: Install/upgrade the scale-set release for {{ profile.label }}
  # runnerScaleSetName is left to default to the release name: it is the scale set's registration identity on GitHub, so two releases sharing it make the second one's listener crash-loop registering a duplicate. scaleSetLabels is the pooling mechanism instead: an extra label every profile's runners carry alongside their own unique one, so runs-on: <label> matches every profile sharing it. A profile sets its own runs_on_label to stay out of the shared pool.
  kubernetes.core.helm:
    name: "{{ profile.release }}"
    chart_ref: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    chart_version: "{{ github_runner_arc_scaleset_chart_version | default(omit) }}"
    release_namespace: "{{ profile.namespace }}"
    # Rendered on the control node: the profile's values file (or the role's default template), with the role's own overlay merged over it. Helm merges nested mappings the same way, so this is the same as passing the two as separate values files.
    values: >-
      {{
        (lookup('ansible.builtin.template', github_runner_arc_values_source) | from_yaml | default({}, true))
        | combine(lookup('ansible.builtin.template', 'scale-set-overlay.yaml.j2') | from_yaml, recursive=true)
      }}
    # --set rather than values for containers[]: Helm replaces lists wholesale, so a values mapping naming containers would drop the values file's own command and resources for that container.
    set_values:
      - value: "githubConfigUrl=https://github.com/{{ org.name }}"
      - value: "githubConfigSecret={{ profile.app_secret }}"
      - value: "template.spec.imagePullSecrets[0].name={{ github_runner_arc_image_pull_secret_name }}"
      - value: "template.spec.containers[0].image={{ org.image }}"
      - value: "scaleSetLabels[0]={{ profile.runs_on_label }}"
  vars:
    github_runner_arc_values_source: >-
      {{
        'runner-scale-set-values.yaml.j2' if profile.values_file | length == 0
        else profile.values_file if profile.values_file is abs
        else github_runner_arc_values_dir ~ '/' ~ profile.values_file
      }}

# A Helm upgrade that changes the pod template renames the EphemeralRunnerSet the release owns (it carries a spec-hash suffix). The AutoscalingListener should follow the rename but can be left pointing at the deleted name, crash-looping on every patch while the scale set's queue goes unserviced; see the README's Non-obvious behaviour section. Deleting the stale listener makes the controller recreate it against the EphemeralRunnerSet that exists now.
- name: Find the AutoscalingListener for {{ profile.label }}
  kubernetes.core.k8s_info:
    api_version: actions.github.com/v1alpha1
    kind: AutoscalingListener
    namespace: "{{ github_runner_arc_controller_namespace }}"
    label_selectors:
      - "actions.github.com/scale-set-name={{ profile.release }}"
  register: github_runner_arc_listener

- name: Check the EphemeralRunnerSet the listener points at still exists for {{ profile.label }}
  kubernetes.core.k8s_info:
    api_version: actions.github.com/v1alpha1
    kind: EphemeralRunnerSet
    namespace: "{{ profile.namespace }}"
    name: "{{ github_runner_arc_listener.resources[0].spec.ephemeralRunnerSetName }}"
  register: github_runner_arc_ephemeral_runner_set
  when: github_runner_arc_listener.resources | length > 0

- name: Delete a stale listener so the controller recreates it for {{ profile.label }}
  kubernetes.core.k8s:
    state: absent
    api_version: actions.github.com/v1alpha1
    kind: AutoscalingListener
    namespace: "{{ github_runner_arc_controller_namespace }}"
    name: "{{ github_runner_arc_listener.resources[0].metadata.name }}"
  when:
    - github_runner_arc_listener.resources | length > 0
    - github_runner_arc_ephemeral_runner_set.resources | length == 0
