---
# Included once per image, with `image` set to its registry, repository and reference, and the credential to prove in github_runner_arc_pull_username and github_runner_arc_pull_password, described for the failure message by github_runner_arc_pull_credential and github_runner_arc_pull_credential_hint. verify_image_pull.yml passes the static credential and mint_app_pull_token.yml an App's token.

- name: Exchange the pull credential for a registry token scoped to the image
  ansible.builtin.uri:
    url: "https://{{ image.registry }}/token?scope=repository:{{ image.repository }}:pull&service={{ image.registry }}"
    url_username: "{{ github_runner_arc_pull_username }}"
    url_password: "{{ github_runner_arc_pull_password }}"
    force_basic_auth: true
    return_content: true
    status_code: [200, 401, 403]
  delegate_to: localhost
  check_mode: false
  register: github_runner_arc_registry_token
  no_log: true

- name: Read the image manifest with that token
  ansible.builtin.uri:
    url: "https://{{ image.registry }}/v2/{{ image.repository }}/manifests/{{ image.reference }}"
    method: HEAD
    headers:
      Authorization: "Bearer {{ (github_runner_arc_registry_token.content | from_json).token | default('') }}"
      Accept: "application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
    status_code: [200, 401, 403, 404]
  delegate_to: localhost
  check_mode: false
  register: github_runner_arc_manifest
  when: github_runner_arc_registry_token.status == 200
  no_log: true

- name: Fail when the credential cannot pull the image
  ansible.builtin.fail:
    msg: >-
      {{ github_runner_arc_pull_credential }} cannot read
      {{ image.registry }}/{{ image.repository }}:{{ image.reference }}
      ({{ 'the registry refused the credential, HTTP ' ~ github_runner_arc_registry_token.status if github_runner_arc_registry_token.status != 200
          else 'reading the manifest returned HTTP ' ~ github_runner_arc_manifest.status }}).
      {{ github_runner_arc_pull_credential_hint }}
      Refusing to write it into the cluster's pull Secret.
  when: github_runner_arc_registry_token.status != 200 or github_runner_arc_manifest.status != 200
