---
# Creates the PriorityClass the platform's own pods run under (templates/platform-priority-class.yaml.j2; see github_runner_arc_platform_priority_value in defaults/main.yml for why it exists and how its value is chosen). Included before the node recovery watcher and the fleet-health platform, which both reference it.

- name: "Platform: create the priority class for the platform's own pods"
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'platform-priority-class.yaml.j2') | from_yaml }}"
