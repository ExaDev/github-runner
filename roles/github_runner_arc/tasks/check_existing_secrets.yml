---
# With github_runner_arc_manage_secrets false the role writes no App or heartbeat Secrets, and with github_runner_arc_manage_image_pull_secret false no pull Secret, so each one the releases and Deployments reference that the role does not write must already exist. Checked before anything is installed: a missing App Secret otherwise shows up as a listener that never registers, and a missing pull Secret as pods in ImagePullBackOff with a registry "denied" that reads like a wrong image tag.

- name: Look up each Secret this host's releases and Deployments reference
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ item.0 }}"
    name: "{{ item.1 }}"
  loop: >-
    {{
      (github_runner_arc_local.profiles | map(attribute='namespace') | zip(github_runner_arc_local.profiles | map(attribute='app_secret')) | list
       if not (github_runner_arc_manage_secrets | bool) else [])
      + (github_runner_arc_local.profiles | map(attribute='namespace') | product([github_runner_arc_image_pull_secret_name]) | list
         if not (github_runner_arc_manage_image_pull_secret | bool) else [])
      + ([github_runner_arc_platform_namespace] | product([github_runner_arc_image_pull_secret_name]) | list
         if github_runner_arc_heartbeat_gist_id | length > 0 and not (github_runner_arc_manage_image_pull_secret | bool) else [])
      + ([github_runner_arc_platform_namespace] | product(['heartbeat-gh-token']) | list
         if github_runner_arc_heartbeat_gist_id | length > 0 and not (github_runner_arc_manage_secrets | bool) else [])
    }}
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  register: github_runner_arc_existing_secrets
  # The results hold the Secrets' data.
  no_log: true

- name: Check the Secrets found
  ansible.builtin.include_tasks: check_existing_secret_contents.yml
