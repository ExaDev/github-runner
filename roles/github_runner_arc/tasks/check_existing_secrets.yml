---
# With github_runner_arc_manage_secrets false the role writes no Secrets, so each one the releases and Deployments reference must already exist. Checked before anything is installed: a missing App Secret otherwise shows up as a listener that never registers, and a missing pull Secret as pods in ImagePullBackOff with a registry "denied" that reads like a wrong image tag.

- name: Look up each Secret this host's releases and Deployments reference
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ item.0 }}"
    name: "{{ item.1 }}"
  loop: >-
    {{
      github_runner_arc_local.profiles | map(attribute='namespace') | zip(github_runner_arc_local.profiles | map(attribute='app_secret')) | list
      + github_runner_arc_local.profiles | map(attribute='namespace') | product([github_runner_arc_image_pull_secret_name]) | list
      + ([github_runner_arc_platform_namespace] | product([github_runner_arc_image_pull_secret_name, 'heartbeat-gh-token']) | list
         if github_runner_arc_heartbeat_gist_id | length > 0 else [])
    }}
  loop_control:
    label: "{{ item.0 }}/{{ item.1 }}"
  register: github_runner_arc_existing_secrets

- name: Fail when a referenced Secret does not exist
  ansible.builtin.fail:
    msg: >-
      Secret {{ item.item.1 }} does not exist in namespace {{ item.item.0 }}.
      github_runner_arc_manage_secrets is false, so create it first: an App Secret holds github_app_id, github_app_installation_id and github_app_private_key;
      a pull Secret has type kubernetes.io/dockerconfigjson; heartbeat-gh-token holds a gist-scoped GitHub token under the key token.
  loop: "{{ github_runner_arc_existing_secrets.results }}"
  loop_control:
    label: "{{ item.item.0 }}/{{ item.item.1 }}"
  when: item.resources | length == 0
