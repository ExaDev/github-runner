---
# Installs the fleet-health platform (heartbeat, and the autoscaler when a scale-set profile sets autoscale: true) as unpinned in-cluster Deployments, the same way ARC's own controller runs. Included from main.yml when github_runner_arc_heartbeat_gist_id is set on this host. See scripts/heartbeat.sh and scripts/autoscaler.sh for what each container does; the RBAC below grants exactly what each one reads and writes, with no wildcards.

# The RBAC below also puts a Role in the controller's namespace and, for the autoscaler, in the autoscaled profile's namespace. Either may not exist yet on a fresh cluster, when the platform installs before (or from a different host than) the controller and scale sets, so both are ensured here; applying an existing Namespace changes nothing.
- name: "Platform: create the namespaces its RBAC lives in"
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop: "{{ ([github_runner_arc_platform_namespace, github_runner_arc_controller_namespace] + (github_runner_arc_fleet.autoscaled | map(attribute='namespace') | list)) | unique }}"

- name: "Platform: create heartbeat/autoscaler service accounts"
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ item }}"
        namespace: "{{ github_runner_arc_platform_namespace }}"
  loop: "{{ ['heartbeat'] + (['autoscaler'] if github_runner_arc_fleet.autoscaled else []) }}"

# heartbeat: read node Ready status (cluster-wide, so a ClusterRole - Nodes are not namespaced).
- name: "Platform: heartbeat RBAC - read nodes"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: github-runner-heartbeat-nodes-reader
      rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list"]

- name: "Platform: heartbeat RBAC - bind node-reader"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: github-runner-heartbeat-nodes-reader
      subjects:
        - kind: ServiceAccount
          name: heartbeat
          namespace: "{{ github_runner_arc_platform_namespace }}"
      roleRef:
        kind: ClusterRole
        name: github-runner-heartbeat-nodes-reader
        apiGroup: rbac.authorization.k8s.io

# heartbeat: list runner pods in every scale-set namespace, to spot ones the scheduler cannot place (cluster-wide, since each profile has its own namespace).
- name: "Platform: heartbeat RBAC - read runner pods"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: github-runner-heartbeat-pods-reader
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]

- name: "Platform: heartbeat RBAC - bind pods-reader"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: github-runner-heartbeat-pods-reader
      subjects:
        - kind: ServiceAccount
          name: heartbeat
          namespace: "{{ github_runner_arc_platform_namespace }}"
      roleRef:
        kind: ClusterRole
        name: github-runner-heartbeat-pods-reader
        apiGroup: rbac.authorization.k8s.io

# heartbeat: read each scale set's AutoscalingRunnerSet, to confirm every configured one exists (cluster-wide, since each profile has its own namespace).
- name: "Platform: heartbeat RBAC - read scale sets"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: github-runner-heartbeat-scale-sets-reader
      rules:
        - apiGroups: ["actions.github.com"]
          resources: ["autoscalingrunnersets"]
          verbs: ["get", "list"]

- name: "Platform: heartbeat RBAC - bind scale-sets-reader"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: github-runner-heartbeat-scale-sets-reader
      subjects:
        - kind: ServiceAccount
          name: heartbeat
          namespace: "{{ github_runner_arc_platform_namespace }}"
      roleRef:
        kind: ClusterRole
        name: github-runner-heartbeat-scale-sets-reader
        apiGroup: rbac.authorization.k8s.io

# heartbeat: read the ARC controller's own Deployment readiness, in its own namespace.
- name: "Platform: heartbeat RBAC - read the ARC controller Deployment"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: github-runner-heartbeat-controller-reader
        namespace: "{{ github_runner_arc_controller_namespace }}"
      rules:
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list"]

- name: "Platform: heartbeat RBAC - bind controller-reader"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: github-runner-heartbeat-controller-reader
        namespace: "{{ github_runner_arc_controller_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: heartbeat
          namespace: "{{ github_runner_arc_platform_namespace }}"
      roleRef:
        kind: Role
        name: github-runner-heartbeat-controller-reader
        apiGroup: rbac.authorization.k8s.io

# heartbeat: read the autoscaler's own shared status ConfigMap and the deployed-state ConfigMap, scoped by resourceNames to the two objects it actually touches.
- name: "Platform: heartbeat RBAC - read the autoscaler status ConfigMap"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: github-runner-heartbeat-status-reader
        namespace: "{{ github_runner_arc_platform_namespace }}"
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          resourceNames: ["autoscaler-status", "{{ github_runner_arc_deployed_state_configmap }}"]
          verbs: ["get"]

- name: "Platform: heartbeat RBAC - bind status-reader"
  kubernetes.core.k8s:
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: github-runner-heartbeat-status-reader
        namespace: "{{ github_runner_arc_platform_namespace }}"
      subjects:
        - kind: ServiceAccount
          name: heartbeat
          namespace: "{{ github_runner_arc_platform_namespace }}"
      roleRef:
        kind: Role
        name: github-runner-heartbeat-status-reader
        apiGroup: rbac.authorization.k8s.io

- name: "Platform: autoscaler RBAC"
  when: github_runner_arc_fleet.autoscaled | length > 0
  block:
    # autoscaler: read per-node memory usage via metrics-server (cluster-wide, so a ClusterRole). Needs both rules, not metrics.k8s.io alone - confirmed live, kubectl top nodes fails outright with "nodes is forbidden ... at the cluster scope" without the plain core grant too, the same gap as kubectl top pod needing core pods alongside pods.metrics.k8s.io below.
    - name: "Platform: autoscaler RBAC - read node metrics"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: github-runner-autoscaler-node-metrics-reader
          rules:
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["nodes"]
              verbs: ["get", "list"]

    - name: "Platform: autoscaler RBAC - bind node-metrics-reader"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: github-runner-autoscaler-node-metrics-reader
          subjects:
            - kind: ServiceAccount
              name: autoscaler
              namespace: "{{ github_runner_arc_platform_namespace }}"
          roleRef:
            kind: ClusterRole
            name: github-runner-autoscaler-node-metrics-reader
            apiGroup: rbac.authorization.k8s.io

    # autoscaler: read and patch each pooled profile's own AutoscalingRunnerSet (scoped to that one object by resourceNames), and read pod metrics in its namespace. One Role/RoleBinding pair per pooled profile, since each lives in its own namespace.
    - name: "Platform: autoscaler RBAC - manage each pooled AutoscalingRunnerSet and read pod metrics"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: github-runner-autoscaler-runnerset-manager
            namespace: "{{ item.namespace }}"
          rules:
            - apiGroups: ["actions.github.com"]
              resources: ["autoscalingrunnersets"]
              resourceNames: ["{{ item.release }}"]
              verbs: ["get", "patch"]
            # The Events the runners' job-completed hook posts, read to keep each job's measured peak memory (scripts/autoscaler.sh, record_measured_peaks).
            - apiGroups: [""]
              resources: ["events"]
              verbs: ["get", "list"]
            # The runner pod running a job is an EphemeralRunner of the same name, whose status names the job; read to record each job's observed memory (scripts/autoscaler.sh, record_job_peaks), and listed to count the runners a scale set holds (the AutoscalingRunnerSet's own status carries no count in the pinned ARC release). Not limited by name, since runner names are generated. `list` is needed by a script that counts them, so apply this role before rolling out an autoscaler image that does.
            - apiGroups: ["actions.github.com"]
              resources: ["ephemeralrunners"]
              verbs: ["get", "list"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["pods"]
              verbs: ["get", "list"]
            # kubectl top pod needs this too, not just pods.metrics.k8s.io above - confirmed live: without it, `kubectl top pod` fails outright with "pods is forbidden... in API group \"\"" even though the metrics.k8s.io grant alone looks sufficient. It resolves/cross-references the plain Pod objects alongside their metrics, not metrics data on its own.
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list"]
      loop: "{{ github_runner_arc_fleet.autoscaled }}"
      loop_control:
        label: "{{ item.label }}"

    - name: "Platform: autoscaler RBAC - bind runnerset-manager"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: github-runner-autoscaler-runnerset-manager
            namespace: "{{ item.namespace }}"
          subjects:
            - kind: ServiceAccount
              name: autoscaler
              namespace: "{{ github_runner_arc_platform_namespace }}"
          roleRef:
            kind: Role
            name: github-runner-autoscaler-runnerset-manager
            apiGroup: rbac.authorization.k8s.io
      loop: "{{ github_runner_arc_fleet.autoscaled }}"
      loop_control:
        label: "{{ item.label }}"

    # autoscaler: read/patch the shared status ConfigMap, scoped by resourceNames.
    - name: "Platform: autoscaler RBAC - manage the status ConfigMap"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: github-runner-autoscaler-status-writer
            namespace: "{{ github_runner_arc_platform_namespace }}"
          rules:
            - apiGroups: [""]
              resources: ["configmaps"]
              resourceNames: ["autoscaler-status"]
              verbs: ["get", "patch"]

    - name: "Platform: autoscaler RBAC - bind status-writer"
      kubernetes.core.k8s:
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: github-runner-autoscaler-status-writer
            namespace: "{{ github_runner_arc_platform_namespace }}"
          subjects:
            - kind: ServiceAccount
              name: autoscaler
              namespace: "{{ github_runner_arc_platform_namespace }}"
          roleRef:
            kind: Role
            name: github-runner-autoscaler-status-writer
            apiGroup: rbac.authorization.k8s.io

# Pre-created empty rather than left for the autoscaler to create on first poll: neither ServiceAccount above is granted `create` on configmaps, only get/patch - a deliberate minimal-permission choice. If this ConfigMap is ever deleted by hand, both pods fail loud (RBAC Forbidden on create) rather than silently recreating it, and it self-heals the next time this task runs. Created only when absent: once the autoscaler owns its contents, applying the empty definition again would wipe its live status and raise-confirm counter on every run.
- name: "Platform: check whether the shared autoscaler-status ConfigMap exists"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    namespace: "{{ github_runner_arc_platform_namespace }}"
    name: autoscaler-status
  register: github_runner_arc_autoscaler_status_configmap

- name: "Platform: pre-create the shared autoscaler-status ConfigMap"
  when: github_runner_arc_autoscaler_status_configmap.resources | length == 0
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: autoscaler-status
        namespace: "{{ github_runner_arc_platform_namespace }}"
      data:
        status.json: ""
        raise-confirm-count: "0"
        rebalance-confirm-count: "0"

- name: "Platform: create/update heartbeat's GitHub PAT secret"
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: heartbeat-gh-token
        namespace: "{{ github_runner_arc_platform_namespace }}"
      stringData:
        token: "{{ github_runner_arc_heartbeat_gh_token }}"
  no_log: true
  when: github_runner_arc_manage_secrets | bool

- name: "Platform: create/update the image pull secret"
  kubernetes.core.k8s:
    definition: "{{ lookup('ansible.builtin.template', 'image-pull-secret.yaml.j2', template_vars=github_runner_arc_platform_pull_secret_vars) | from_yaml }}"
  no_log: true
  when: github_runner_arc_manage_image_pull_secret | bool and github_runner_arc_image_pull_secret_source == 'static'
  vars:
    github_runner_arc_platform_pull_secret_vars:
      namespace: "{{ github_runner_arc_platform_namespace }}"
      username: "{{ github_runner_arc_ghcr_username }}"
      password: "{{ github_runner_arc_ghcr_token }}"
      annotations: {}

- name: "Platform: remove any pull Secret no longer in use"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: "{{ github_runner_arc_platform_namespace }}"
    name: "{{ github_runner_arc_image_pull_secret_name }}"
  # The deleted Secret's data is the credential, and a --diff shows it.
  no_log: true
  when: not (github_runner_arc_pull_secret_in_use | bool)

# An App's installation token reads only its own organisation's packages, and the platform belongs to no one org, so with an App-sourced pull Secret the platform's Deployments pull without one, as they do with none. The role's default platform images are public.
- name: "Platform: choose the pull Secret its Deployments use"
  ansible.builtin.set_fact:
    github_runner_arc_platform_image_pull_secrets: >-
      {{
        [] if not (github_runner_arc_pull_secret_in_use | bool)
              or (github_runner_arc_manage_image_pull_secret | bool and github_runner_arc_image_pull_secret_source == 'app')
        else [{'name': github_runner_arc_image_pull_secret_name}]
      }}

- name: "Platform: install/upgrade the heartbeat Deployment"
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: heartbeat
        namespace: "{{ github_runner_arc_platform_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: heartbeat
        template:
          metadata:
            labels:
              app: heartbeat
          spec:
            serviceAccountName: heartbeat
            priorityClassName: "{{ github_runner_arc_platform_priority_class_name }}"
            imagePullSecrets: "{{ github_runner_arc_platform_image_pull_secrets }}"
            containers:
              - name: heartbeat
                image: "{{ github_runner_arc_heartbeat_image }}"
                env: "{{ github_runner_arc_heartbeat_env + github_runner_arc_heartbeat_controller_env }}"
                resources:
                  requests:
                    cpu: "50m"
                    memory: "32Mi"
                    ephemeral-storage: "{{ github_runner_arc_platform_ephemeral_storage_request }}"
                  limits:
                    cpu: "200m"
                    memory: "64Mi"
                    ephemeral-storage: "{{ github_runner_arc_platform_ephemeral_storage_limit }}"
  vars:
    github_runner_arc_heartbeat_env:
      - name: HEARTBEAT_GIST_ID
        value: "{{ github_runner_arc_heartbeat_gist_id }}"
      - name: HEARTBEAT_WINDOW_SECONDS
        value: "{{ github_runner_arc_heartbeat_window_seconds | string }}"
      - name: HEARTBEAT_INTERVAL_SECONDS
        value: "{{ github_runner_arc_heartbeat_interval_seconds | string }}"
      - name: HEARTBEAT_STATE_NAMESPACE
        value: "{{ github_runner_arc_platform_namespace }}"
      - name: HEARTBEAT_EXPECTED_SCALE_SETS
        value: "{{ github_runner_arc_fleet.profiles | map(attribute='target') | join(' ') }}"
      - name: HEARTBEAT_GH_TOKEN
        valueFrom:
          secretKeyRef:
            name: heartbeat-gh-token
            key: token
    # Where the heartbeat looks for the controller's Deployment. Passed only when it differs from scripts/heartbeat.sh's own default, so that a heartbeat Deployment installed before this setting existed is not rolled by an unchanged configuration.
    github_runner_arc_heartbeat_controller_env: >-
      {{
        [{'name': 'HEARTBEAT_CONTROLLER_NAMESPACE', 'value': github_runner_arc_controller_namespace}]
        if github_runner_arc_controller_namespace != 'actions-runner-controller' else []
      }}

- name: "Platform: measure the autoscaled pool's ceiling from the eligible nodes"
  # arc_profiles already rejects more than one autoscaled profile setting sizing, so at most one iteration of this loop ever runs its task.
  ansible.builtin.include_tasks: measure_sizing.yml
  loop: "{{ github_runner_arc_fleet.autoscaled }}"
  loop_control:
    loop_var: github_runner_arc_measure
    label: "{{ github_runner_arc_measure.label }}"
  when: github_runner_arc_measure.sizing is not none and github_runner_arc_measure.sizing.measured

- name: "Platform: fail when the autoscaler's floor is above its measured ceiling"
  ansible.builtin.fail:
    msg: >-
      github_runner_arc_autoscaler_floor ({{ github_runner_arc_autoscaler_floor }}) is above the ceiling measured for
      {{ item.label }} ({{ github_runner_arc_measured_sizing[item.label].max_runners }}).
  loop: "{{ github_runner_arc_fleet.autoscaled }}"
  loop_control:
    label: "{{ item.label }}"
  when:
    - item.label in (github_runner_arc_measured_sizing | default({}))
    - (github_runner_arc_autoscaler_floor | int) > (github_runner_arc_measured_sizing[item.label].max_runners | int)

- name: "Platform: install/upgrade the autoscaler Deployment"
  when: github_runner_arc_fleet.autoscaled | length > 0
  vars:
    # arc_profiles already rejects more than one autoscaled profile setting sizing, so this is at most one profile.
    github_runner_arc_sized: "{{ github_runner_arc_fleet.autoscaled | selectattr('sizing', 'defined') | selectattr('sizing', 'ne', none) | list }}"
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: autoscaler
        namespace: "{{ github_runner_arc_platform_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: autoscaler
        template:
          metadata:
            labels:
              app: autoscaler
          spec:
            serviceAccountName: autoscaler
            priorityClassName: "{{ github_runner_arc_platform_priority_class_name }}"
            imagePullSecrets: "{{ github_runner_arc_platform_image_pull_secrets }}"
            containers:
              - name: autoscaler
                image: "{{ github_runner_arc_autoscaler_image }}"
                env:
                  - name: AUTOSCALER_DRY_RUN
                    value: "{{ github_runner_arc_autoscaler_dry_run | string | lower }}"
                  - name: AUTOSCALER_POLL_SECONDS
                    value: "{{ github_runner_arc_autoscaler_poll_seconds | string }}"
                  - name: AUTOSCALER_USABLE_BUDGET_GI
                    value: "{{ github_runner_arc_autoscaler_usable_budget_gi | string }}"
                  - name: AUTOSCALER_MAX_CEILING
                    value: >-
                      {{
                        (github_runner_arc_measured_sizing[(github_runner_arc_sized | first).label].max_runners
                         if github_runner_arc_sized | length > 0 and (github_runner_arc_sized | first).label in (github_runner_arc_measured_sizing | default({}))
                         else (github_runner_arc_sized | first).sizing.max_runners if github_runner_arc_sized | length > 0
                         else github_runner_arc_autoscaler_max_ceiling) | string
                      }}
                  - name: AUTOSCALER_FLOOR
                    value: "{{ github_runner_arc_autoscaler_floor | string }}"
                  - name: AUTOSCALER_RAISE_CONFIRM_POLLS
                    value: "{{ github_runner_arc_autoscaler_raise_confirm_polls | string }}"
                  - name: AUTOSCALER_MEM_AVAILABLE_PRESSURE_PCT
                    value: "{{ github_runner_arc_autoscaler_mem_available_pressure_pct | string }}"
                  - name: AUTOSCALER_STATE_NAMESPACE
                    value: "{{ github_runner_arc_platform_namespace }}"
                  # The pooled scale sets it manages, one namespace/release token per profile (see plugins/filter/arc.py's own target field), space-separated: the script splits on whitespace.
                  - name: AUTOSCALER_TARGETS
                    value: "{{ github_runner_arc_fleet.autoscaled | map(attribute='target') | join(' ') }}"
                  - name: AUTOSCALER_STATUS_CONFIGMAP
                    value: autoscaler-status
                resources:
                  requests:
                    cpu: "50m"
                    memory: "32Mi"
                    ephemeral-storage: "{{ github_runner_arc_platform_ephemeral_storage_request }}"
                  limits:
                    cpu: "200m"
                    memory: "64Mi"
                    ephemeral-storage: "{{ github_runner_arc_platform_ephemeral_storage_limit }}"
