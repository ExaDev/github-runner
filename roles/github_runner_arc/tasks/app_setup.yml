---
# Creates the GitHub App the runner scale sets authenticate as, through GitHub's App manifest flow, in two runs of playbooks/github_app_setup.yml on the control node. The App is for one scope: an organisation's runners, or with github_runner_arc_app_setup_repository one repository's, of an organisation or (github_runner_arc_app_setup_owner_type user) a personal account. Without github_runner_arc_app_manifest_code it renders a local HTML form that posts the manifest to GitHub's App settings of that account; a person submits it and copies the one-time code GitHub returns. With the code it exchanges it for the App's credentials, writes the private key to github_runner_arc_app_private_key_path, waits while the person installs the App on the account (where it reaches the repository, for a repository scope), and prints the values to record. With github_runner_arc_app_setup_write_secret it also writes the App Secret into the cluster and then removes the key file, unless github_runner_arc_app_setup_keep_private_key keeps it. The private key is never printed, including under -v.

- name: Fail when the account or App name is missing
  ansible.builtin.fail:
    msg: github_runner_arc_app_setup_org (the account login) and github_runner_arc_app_setup_name (the App's display name) are both required.
  when: github_runner_arc_app_setup_org | length == 0 or github_runner_arc_app_setup_name | length == 0

- name: Fail when the App's scope cannot exist
  ansible.builtin.fail:
    msg: >-
      {{ 'github_runner_arc_app_setup_owner_type must be organization or user.' if github_runner_arc_app_setup_owner_type not in ['organization', 'user']
         else 'github_runner_arc_app_setup_repository must be a repository name without its owner (no /).' if '/' in github_runner_arc_app_setup_repository
         else 'A personal account has no organisation runners: with github_runner_arc_app_setup_owner_type user, set github_runner_arc_app_setup_repository to the repository whose runners the App is for.' }}
  when: >-
    github_runner_arc_app_setup_owner_type not in ['organization', 'user']
    or '/' in github_runner_arc_app_setup_repository
    or (github_runner_arc_app_setup_owner_type == 'user' and github_runner_arc_app_setup_repository | length == 0)

# Where the App Secret goes: explicit namespaces and name, or the scale-set profiles of the github_runner_arc_orgs entry for the App's scope, whose namespaces and app_secret_name the role's install uses. Worked out in both phases, so that a phase 1 run already shows a configuration phase 2 could not use.
- name: Work out where the App Secret goes
  ansible.builtin.set_fact:
    github_runner_arc_app_setup_secret_targets: >-
      {{
        (github_runner_arc_app_setup_secret_namespaces or github_runner_arc_app_setup_org_profiles | map(attribute='namespace') | list)
        | product([github_runner_arc_app_setup_secret_name or (github_runner_arc_app_setup_org_profiles | map(attribute='app_secret') | first
                   | default({'name': github_runner_arc_app_setup_org, 'repository': github_runner_arc_app_setup_repository} | exadev.github_runner.arc_default_app_secret))])
        | list
      }}
  vars:
    # The login's entries are expanded on their own, so a missing app_id (the App does not exist yet) makes arc_profiles report an error without hiding the profiles; the scope then picks the entry this App is for.
    github_runner_arc_app_setup_org_profiles: >-
      {{ (github_runner_arc_orgs | selectattr('name', 'defined') | selectattr('name', 'equalto', github_runner_arc_app_setup_org) | list | exadev.github_runner.arc_profiles).profiles
         | selectattr('scope', 'equalto', github_runner_arc_app_setup_scope) | list }}
  when: github_runner_arc_app_setup_write_secret | bool

- name: Fail when there is nowhere to write the App Secret
  ansible.builtin.fail:
    msg: >-
      github_runner_arc_app_setup_write_secret needs the namespaces to write the App Secret into: set github_runner_arc_app_setup_secret_namespaces,
      or configure {{ github_runner_arc_app_setup_scope }} with its scale-set profiles in github_runner_arc_orgs.
  when: github_runner_arc_app_setup_write_secret | bool and github_runner_arc_app_setup_secret_targets | length == 0

- name: Build the App manifest
  ansible.builtin.set_fact:
    github_runner_arc_app_manifest:
      name: "{{ github_runner_arc_app_setup_name }}"
      url: "{{ github_runner_arc_app_setup_homepage_url or 'https://github.com/' ~ github_runner_arc_app_setup_org }}"
      # There is no server to receive GitHub's redirect: the person copies the code from the address bar, so any stable page will do.
      redirect_url: "{{ github_runner_arc_app_setup_homepage_url or 'https://github.com/' ~ github_runner_arc_app_setup_org }}"
      description: "{{ github_runner_arc_app_setup_description }}"
      public: false
      hook_attributes:
        url: "{{ github_runner_arc_app_setup_homepage_url or 'https://github.com/' ~ github_runner_arc_app_setup_org }}"
        active: false
      default_permissions: "{{ github_runner_arc_app_setup_scope_permissions }}"

- name: Render the manifest form (phase 1)
  when: github_runner_arc_app_manifest_code | length == 0
  block:
    - name: Generate a state token for the form
      ansible.builtin.set_fact:
        github_runner_arc_app_manifest_state: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"

    - name: Create a file for the form
      ansible.builtin.tempfile:
        state: file
        suffix: .html
      register: github_runner_arc_app_form

    - name: Render the form
      ansible.builtin.template:
        src: github-app-manifest-form.html.j2
        dest: "{{ github_runner_arc_app_form.path }}"
        mode: "0600"

    - name: Explain the remaining steps
      ansible.builtin.debug:
        msg:
          - "Open {{ github_runner_arc_app_form.path }} in a browser and follow its steps."
          - "{{ 'It posts the manifest to the App settings of your personal account; sign in to GitHub as ' ~ github_runner_arc_app_setup_org ~ '.' if github_runner_arc_app_setup_owner_type == 'user' else 'It posts the manifest to GitHub for ' ~ github_runner_arc_app_setup_org ~ '; you must be an owner of that organisation.' }}"
          - "Then run: {{ github_runner_arc_app_setup_command }} -e github_runner_arc_app_manifest_code=<code> -e github_runner_arc_app_private_key_path=<new file for the key>"

- name: Exchange the code and wait for the installation (phase 2)
  when: github_runner_arc_app_manifest_code | length > 0
  block:
    # Checked before the exchange: the code works once, and GitHub never shows the private key again, so a failure after the exchange would lose the key with it.
    - name: Check where the private key will be written
      ansible.builtin.stat:
        path: "{{ github_runner_arc_app_private_key_path | expanduser }}"
      register: github_runner_arc_app_key_stat
      when: github_runner_arc_app_private_key_path | length > 0

    - name: Check the private key's directory exists
      ansible.builtin.stat:
        path: "{{ github_runner_arc_app_private_key_path | expanduser | dirname }}"
      register: github_runner_arc_app_key_dir_stat
      when: github_runner_arc_app_private_key_path | length > 0

    - name: Fail unless the private key path is a new file in an existing directory
      ansible.builtin.fail:
        msg: github_runner_arc_app_private_key_path must name a file that does not exist yet, in a directory that does. It is checked before the one-time code is used.
      when: >-
        github_runner_arc_app_private_key_path | length == 0
        or github_runner_arc_app_key_stat.stat.exists
        or not (github_runner_arc_app_key_dir_stat.stat.isdir | default(false))

    # Also before the exchange, for the same reason: the cluster the App Secret goes to must be reachable, and its namespaces must exist, while a failure still costs only a rerun. Creating a namespace that exists changes nothing.
    - name: Reach the cluster and create the App Secret's namespaces
      when: github_runner_arc_app_setup_write_secret | bool
      module_defaults:
        group/kubernetes.core.k8s:
          kubeconfig: "{{ github_runner_arc_kubeconfig_path or omit }}"
      block:
        - name: Gather the environment the kubernetes client's virtualenv path comes from
          ansible.builtin.setup:
            gather_subset:
              - "!all"
              - "!min"
              - env

        - name: Give this host the kubernetes Python client
          ansible.builtin.include_role:
            name: github_runner_k8s_client

        - name: Create the App Secret's namespaces
          kubernetes.core.k8s:
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ item }}"
          loop: "{{ github_runner_arc_app_setup_secret_targets | map('first') | unique }}"

    # no_log because a successful response holds the private key, which -v would otherwise print. The next task reports GitHub's own error when the exchange fails.
    - name: Exchange the manifest code for the App's credentials
      ansible.builtin.uri:
        url: "https://api.github.com/app-manifests/{{ github_runner_arc_app_manifest_code | urlencode }}/conversions"
        method: POST
        headers:
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [201, 400, 401, 403, 404, 410, 422]
      register: github_runner_arc_app_conversion
      no_log: true

    - name: Fail when GitHub refused the code
      ansible.builtin.fail:
        msg: >-
          GitHub refused the manifest code (HTTP {{ github_runner_arc_app_conversion.status }}: {{ github_runner_arc_app_conversion.json.message | default('no message') }}).
          A code works once and expires within an hour; run phase 1 again for a new one.
      when: github_runner_arc_app_conversion.status != 201

    - name: Write the App's private key
      ansible.builtin.copy:
        content: "{{ github_runner_arc_app_conversion.json.pem }}"
        dest: "{{ github_runner_arc_app_private_key_path | expanduser }}"
        mode: "0600"
        force: false
      no_log: true

    - name: Sign an App JWT
      ansible.builtin.script:
        cmd: "generate_app_jwt.py {{ github_runner_arc_app_conversion.json.id | string | quote }} {{ github_runner_arc_app_private_key_path | expanduser | quote }}"
        executable: python3
      changed_when: false
      no_log: true
      register: github_runner_arc_app_jwt

    # A manifest with a redirect_url means GitHub skips its install prompt, so the new App has no installation yet. Waiting here lets the person install it now; running phase 2 again with a new code would register a second App instead.
    - name: Ask for the App to be installed
      ansible.builtin.debug:
        msg:
          - "App {{ github_runner_arc_app_setup_name }} (id {{ github_runner_arc_app_conversion.json.id }}) exists but is not installed."
          - "Install it on {{ github_runner_arc_app_setup_org }}, {{ 'with ' ~ github_runner_arc_app_setup_repository ~ ' among its repositories' if github_runner_arc_app_setup_repository | length > 0 else 'for all repositories' }}: {{ github_runner_arc_app_conversion.json.html_url }}/installations/new"
          - "Waiting up to {{ (github_runner_arc_app_setup_install_retries * github_runner_arc_app_setup_install_delay) // 60 }} minutes for the installation to appear."

    # As resolve_installation_id.yml finds it: an organisation's installation by account login, a repository's through GET /repos/{owner}/{repo}/installation, which answers only once an installation reaches the repository.
    - name: Wait for the App's installation on the organisation
      ansible.builtin.uri:
        url: https://api.github.com/app/installations?per_page=100
        headers:
          Authorization: "Bearer {{ github_runner_arc_app_jwt.stdout | trim }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
      register: github_runner_arc_app_installations
      until: github_runner_arc_app_installations.json | default([]) | selectattr('account.login', 'equalto', github_runner_arc_app_setup_org) | list | length > 0
      retries: "{{ github_runner_arc_app_setup_install_retries }}"
      delay: "{{ github_runner_arc_app_setup_install_delay }}"
      no_log: true
      when: github_runner_arc_app_setup_repository | length == 0

    - name: Wait for the App's installation to reach the repository
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_runner_arc_app_setup_org | urlencode }}/{{ github_runner_arc_app_setup_repository | urlencode }}/installation"
        headers:
          Authorization: "Bearer {{ github_runner_arc_app_jwt.stdout | trim }}"
          Accept: application/vnd.github+json
          X-GitHub-Api-Version: "2022-11-28"
        status_code: [200, 404]
      register: github_runner_arc_app_repository_installation
      until: github_runner_arc_app_repository_installation.status == 200
      retries: "{{ github_runner_arc_app_setup_install_retries }}"
      delay: "{{ github_runner_arc_app_setup_install_delay }}"
      no_log: true
      when: github_runner_arc_app_setup_repository | length > 0

    - name: Record the App's installation
      ansible.builtin.set_fact:
        github_runner_arc_app_installation_id: >-
          {{
            (github_runner_arc_app_repository_installation.json.id
             if github_runner_arc_app_setup_repository | length > 0 else
             (github_runner_arc_app_installations.json | selectattr('account.login', 'equalto', github_runner_arc_app_setup_org) | first).id) | string
          }}

    - name: Write the App Secret
      when: github_runner_arc_app_setup_write_secret | bool
      module_defaults:
        group/kubernetes.core.k8s:
          kubeconfig: "{{ github_runner_arc_kubeconfig_path or omit }}"
      block:
        # The three keys the ARC controller reads from githubConfigSecret, as the role's own install writes them.
        - name: Create or update the App Secret
          kubernetes.core.k8s:
            definition:
              apiVersion: v1
              kind: Secret
              type: Opaque
              metadata:
                name: "{{ item.1 }}"
                namespace: "{{ item.0 }}"
              stringData:
                github_app_id: "{{ github_runner_arc_app_conversion.json.id | string }}"
                github_app_installation_id: "{{ github_runner_arc_app_installation_id }}"
                github_app_private_key: "{{ github_runner_arc_app_conversion.json.pem }}"
          loop: "{{ github_runner_arc_app_setup_secret_targets }}"
          loop_control:
            label: "{{ item.0 }}/{{ item.1 }}"
          no_log: true

        - name: Remove the private key file now that the App Secret holds the key
          ansible.builtin.file:
            path: "{{ github_runner_arc_app_private_key_path | expanduser }}"
            state: absent
          when: not (github_runner_arc_app_setup_keep_private_key | bool)

    - name: Print the values to record
      ansible.builtin.debug:
        msg: >-
          {{
            (['App Secret ' ~ (github_runner_arc_app_setup_secret_targets | map('join', '/') | join(', ')) ~ ' written.']
             if github_runner_arc_app_setup_write_secret | bool else [])
            + (['Private key file removed; the App Secret holds the only copy.']
               if github_runner_arc_app_setup_write_secret | bool and not (github_runner_arc_app_setup_keep_private_key | bool) else
               ['Private key written to ' ~ github_runner_arc_app_private_key_path ~ "; store it in your secret store and set the org's private_key from it (or its private_key_op_reference, with the 1Password adapter)."])
            + ['github_runner_arc_orgs entry: name ' ~ github_runner_arc_app_setup_org
               ~ (', repository ' ~ github_runner_arc_app_setup_repository if github_runner_arc_app_setup_repository | length > 0 else '') ~ ', app_id ' ~ github_runner_arc_app_conversion.json.id ~ ', installation_id ' ~ github_runner_arc_app_installation_id]
          }}
