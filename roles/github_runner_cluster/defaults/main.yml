---
# A k3s cluster run under Docker Compose on each host, with embedded etcd and Tailscale inside each node's k3s container (k3s --vpn-auth).
#
# Server and agent selection is automatic. The hosts in github_runner_cluster_group, in inventory order, are the cluster: the first N are servers, where N is the largest odd number no greater than both the number of hosts and github_runner_cluster_max_servers (1 or 2 hosts give 1 server, 3 or 4 give 3, 5 or more give 5), since etcd needs a majority and an even member count tolerates no more failures than the odd count below it. The first server bootstraps the cluster (k3s --cluster-init, embedded etcd); every other server joins it as a further control-plane/etcd member, and the remaining hosts join it as agents (pure workers). The group rather than the play's hosts, because --limit narrows the play but must never change which host bootstraps or how many servers there are. See tasks/topology.yml and the collection's plugins/filter/cluster_topology.py.
github_runner_cluster_group: github_runner_cluster
github_runner_cluster_max_servers: 5
# The port every server's k3s API listens on inside its container, publishes on its Docker host and writes into its kubeconfig (https://127.0.0.1:<port>), and the port joining nodes dial. The default is k3s's own. Another value is for a second cluster on Docker hosts that already run one on the default port, alongside its own github_runner_cluster_container_name, github_runner_cluster_agent_container_name, github_runner_cluster_compose_project and github_runner_cluster_dir (see the role README's Several clusters on one host); on a Mac it must also differ from the port of any other VM there, since each VM's published ports are forwarded to the Mac's own loopback. A whole number from 1 to 65535, the same on every host of the group: it is part of every joining node's server URL.
github_runner_cluster_api_port: 6443
# k3s's own default for --https-listen-port, a constant: a server on this port needs no flag, so the role adds docker-compose.api-port.yml only for another port. Never set it.
github_runner_cluster_k3s_default_api_port: 6443
# The bootstrap server's datastore. etcd (the default) is embedded etcd, which any number of servers share. sqlite is k3s's default single-node datastore, lighter for a cluster with one server: the cluster then has exactly one server, whatever github_runner_cluster_max_servers says, and every other host joins it as an agent. Switching from sqlite to etcd later is k3s's own supported migration (the server restarts with --cluster-init); the reverse is not.
github_runner_cluster_datastore: etcd

# Per-host overrides, deliberately not defaulted here: they are read for every host in the group through hostvars, which only sees inventory, host and extra variables. github_runner_cluster_node_role ("server" or "agent") overrides the automatic choice for that host. github_runner_cluster_bootstrap: true makes that host the one that bootstraps the cluster (it becomes a server), and false stops it from being picked. github_runner_cluster_server_url (https://<address>:<port>) makes the host join that server instead, for joining a cluster whose servers are outside this inventory. github_runner_cluster_tls_sans replaces the automatic --tls-san list for that host. github_runner_cluster_node_address replaces the address the other nodes and the TLS SAN list use for that host.

# The tailnet's MagicDNS domain (e.g. example.ts.net). A node's address is its node name followed by this domain, which is the name Tailscale registers the node's own k3s container under; empty means the bare node name. Usually set once for the whole group in the inventory.
github_runner_cluster_tailnet_domain: ""

# This host's own k3s node name and Tailscale hostname. Empty (the default) means "use inventory_hostname"; set it only where a host needs a different name, e.g. to keep a pre-existing Tailscale device identity.
github_runner_cluster_node_name: ""
# Derived, never set directly: the name every template and check actually uses for this host (k3s node name, Tailscale device hostname, TLS SAN self-check).
github_runner_cluster_effective_node_name: "{{ github_runner_cluster_node_name if github_runner_cluster_node_name | length > 0 else inventory_hostname }}"

# Kubernetes taints this host's node registers with, as key=value:Effect strings (for example github-runner.example.com/excluded=true:NoExecute), none containing a space. A taint keeps pods without a matching toleration off the node; NoExecute also evicts the ones already there. They are applied by k3s each time the node registers, so they survive the node object being deleted and registering again, which a taint put on the node by hand does not. Per host, in its host_vars.
github_runner_cluster_node_taints: []

# etcd's heartbeat interval and election timeout, in milliseconds, for every k3s server (passed to k3s as --etcd-arg=heartbeat-interval=<ms> and --etcd-arg=election-timeout=<ms>). Empty, the default, leaves k3s's own timing in place (a 100 ms heartbeat and a 1000 ms election timeout), so nothing changes for an existing fleet. Raise them where the servers' peer traffic goes through a relay, whose round trips and jitter exceed what the defaults tolerate. Both are positive whole numbers, set together or not at all, the election timeout at least five times the heartbeat interval (etcd's own rule), and the same on every server of the group (tasks/etcd_timing.yml checks all three before the role changes anything). Agents run no etcd and ignore them.
github_runner_cluster_etcd_heartbeat_interval: ""
github_runner_cluster_etcd_election_timeout: ""

# Memory-pressure regrading (see the role README): a server steps down through three levels when memory runs short, and back up, without ever leaving etcd. full is the server as it runs; control-plane is still a server and an etcd voter, cordoned and drained; etcd-only has its API server, controller manager, scheduler and agent switched off, and holds the node's etcd seat and nothing else. Giving up the seat is never automatic. false (the default) installs and changes nothing. true runs the `regrade` Compose service beside this server's k3s container, a server host only, with the Docker socket mounted (the same permission cost as the docker-prune service). The run refuses it where a step down could not work: an agent, a cluster with no other server in the inventory to keep the API up, and the bootstrap server of a headscale_in_cluster mesh, whose Headscale server runs on the agent that etcd-only switches off.
github_runner_cluster_regrade: false
# Whether the service also steps up by itself. automatic (the default) goes back up one level at a time once the server has been calm, that is the pressure under the threshold and MemAvailable at or above the floor, for the sustain period, and the cooldown since the last step has passed; it takes the same Lease and checks the same peers as a step down. manual leaves stepping up to `fleet-regrade up`. Stepping down is always automatic, and giving up the etcd vote never is.
github_runner_cluster_regrade_step_up: automatic
# The window of the longest pressure average the kernel reports (avg300 in /proc/pressure/memory), in seconds. A fact about the kernel, not a setting: every default below that is a time is a multiple of it or of the sample period, so that a reading always spans the level it describes.
github_runner_cluster_regrade_pressure_window_seconds: 300
# The "some" avg300 of /proc/pressure/memory, in percent, at or above which the server counts as under pressure: for that share of the last five minutes some task was stalled waiting for memory, a rate at which etcd's heartbeat and election timers, which run in tenths of a second, are being missed. A reasoned starting point, not a measurement: read the service's log (`docker compose --profile regrade logs regrade`) on a real host and tune it.
github_runner_cluster_regrade_pressure_threshold: 10
# MemAvailable, as a percentage of MemTotal, below which a pressure reading counts. It guards against stepping down on pressure caused by reclaim while plenty is available, and, as a share rather than a number of bytes, is right for any host. Chosen, not measured.
github_runner_cluster_regrade_available_floor_percent: 15
# How often the pressure is read: a tenth of the pressure window, so a rising average is noticed well inside it and the watcher itself stays idle almost all the time.
github_runner_cluster_regrade_sample_seconds: "{{ (github_runner_cluster_regrade_pressure_window_seconds | int / 10) | int }}"
# How long the reading must stay over the limit before a step. The average already smooths five minutes, so this only has to ride out a single noisy sample: four consecutive samples.
github_runner_cluster_regrade_sustain_seconds: "{{ 4 * (github_runner_cluster_regrade_sample_seconds | int) }}"
# How long to wait after a step before another is allowed. It has to exceed the pressure window, or the next reading still holds data from before the step; three windows leave the whole of one to settle after the restart and another for the new level to be measured. The role refuses a value under one window.
github_runner_cluster_regrade_cooldown_seconds: "{{ 3 * (github_runner_cluster_regrade_pressure_window_seconds | int) }}"
# The longest a drain, a restart of the k3s container and the wait for it to serve again may each take before the step fails. A failed drain stops the step with the server where it was.
github_runner_cluster_regrade_operation_timeout_seconds: "{{ github_runner_cluster_regrade_pressure_window_seconds }}"
# How long the cluster-wide Lease that serialises steps lasts if its holder never gives it back. A step is a drain and then a restart that waits for etcd and the node, each bounded by the operation timeout, so a holder that is working never loses the Lease mid-step; a holder that crashed blocks the other servers for no longer than this.
github_runner_cluster_regrade_lease_duration_seconds: "{{ 3 * (github_runner_cluster_regrade_operation_timeout_seconds | int) }}"
# Derived, never set directly: the label a server's Node carries while regrading has it below full, with the level as its value. The role's wait for every node to be Ready leaves such a node out, since it runs no kubelet at etcd-only, and anything else that judges nodes by their readiness can do the same. The domain is the one the deployed-version annotation uses.
github_runner_cluster_regrade_level_label: "github-runner.exadev.com/regrade-level"
# Derived, never set directly: the standard control-plane taint a server carries while it runs no workloads. The core applies it with the cordon on the first step down and removes it on the way back to full; the NoSchedule effect is what it removes.
github_runner_cluster_regrade_taint: "node-role.kubernetes.io/control-plane=true:NoSchedule"

# The images every node's k3s container is built from: the rancher/k3s tag (k3s's version with "+" written as "-") and the tailscale/tailscale tag whose tailscale and tailscaled binaries are copied in. Pinned, never latest: Compose builds a node's image only when it is missing, so a floating tag would put whatever version is newest on the day a node is first built, rebuilt or moved into a running cluster, unannounced. Set both once for the whole cluster group, in inventory or group_vars (the check below reads every host's through hostvars). Before it changes anything on a host the role fails if either is not a pinned tag, if the group's hosts name different k3s minor versions, or if the k3s version would break k3s's upgrade path or Kubernetes' version skew policy from what this node and the cluster run now (see the role README's Versions section). Changing them changes no running node: its image is kept until it is rebuilt (see the role README's Versions section for upgrading).
github_runner_cluster_k3s_version: "{{ github_runner_cluster_k3s_tested_version }}"
github_runner_cluster_tailscale_version: "v1.102.4"
# The k3s version this collection's integration tests run, and what github_runner_cluster_k3s_version is for every host that sets none. A separate variable because the minor-version check compares every host of the group, and a host's hostvars never hold role defaults: the check takes this as the version of a host that sets nothing, the same on whichever host runs it. Set github_runner_cluster_k3s_version, never this.
github_runner_cluster_k3s_tested_version: "v1.34.1-k3s1"
# true skips the comparison with what this node and the cluster run, which the role otherwise makes before it changes anything: for a deliberate downgrade, rebuilding a cluster that is being replaced, or a cluster that cannot be read through any server of the inventory. Never needed for an upgrade of one minor at a time. Set it with -e for that run only.
github_runner_cluster_allow_k3s_version_jump: false
# The most seconds the version check spends reading what one server runs, a positive whole number: it bounds the whole read on that server's host (its Docker daemon, the docker exec and the API call, through the task's own timeout) and is also the API call's --request-timeout. Long enough for a busy API server to list the nodes, short enough that a server whose Docker daemon or API server hangs does not hold up every host's run; a server that does not answer in time counts as one that could not be read. 0 is refused, since kubectl reads it as no timeout at all. A read cut off this way can leave its docker process running on that host until the daemon answers.
github_runner_cluster_cluster_read_timeout: 30

# Secrets, as plain variables from any source Ansible reads (ansible-vault, a lookup, or a secrets adapter role such as github_runner_secrets_onepassword). github_runner_cluster_k3s_token is the shared node-join secret and has no default. github_runner_cluster_tailscale_join_key is, with the default tailscale mesh provider, what k3s's own --vpn-auth integration (see docker-compose.yml) uses on every host: it runs Tailscale INSIDE each node's own k3s container, joining the tailnet as its own device and using flannel's native "tailscale" backend for pod traffic. github_runner_cluster_tailscale_api_token, when set, lets tasks/mesh/tailscale_api.yml keep the tailnet's ACL grant and the join key itself provisioned; see that file's comments for what it manages and the one manual step (creating the API token) that has no API to automate.
github_runner_cluster_tailscale_join_key: ""
github_runner_cluster_tailscale_api_token: ""

# Where a join key the role creates is kept for the next run. Only the tailscale and headscale_existing providers need this: they can create a key through the API but have nowhere of their own to keep it (the providers that run Headscale keep theirs on its host). A new key is set as the fact github_runner_cluster_new_join_key ({mesh: tailscale or headscale, key: <key>}) and then kept in either or both of two ways. github_runner_cluster_join_key_path is a file on the control node: the role writes a new key there (mode 0600), and reads the key from it whenever github_runner_cluster_tailscale_join_key or github_runner_cluster_headscale_join_key is empty. github_runner_cluster_join_key_listener true means a secrets adapter in the play keeps it: the role notifies "github_runner_cluster join key created" and flushes handlers straight away, and the adapter's handler stores the key (the github_runner_secrets_onepassword role does this for 1Password). With neither, the role never creates a key, and fails asking for one to be supplied.
github_runner_cluster_join_key_path: ""
github_runner_cluster_join_key_listener: false
# Derived, never set directly: whether a new join key would be kept.
github_runner_cluster_may_create_join_key: "{{ github_runner_cluster_join_key_listener | bool or github_runner_cluster_join_key_path | length > 0 }}"

# The mesh every node's k3s joins through --vpn-auth, and so the control server its Tailscale client registers with. One of: tailscale (Tailscale's own control plane; the tailscale_* variables above), headscale_existing (a Headscale server someone already runs), headscale_hosted (a Headscale server this role runs under Docker Compose on one host, outside k3s) or headscale_in_cluster (a Headscale server this role runs inside the cluster itself, as a static pod on the bootstrap server). Every provider publishes the same facts, so nothing outside tasks/mesh/ depends on which one is in use: github_runner_cluster_mesh_join_key (the reusable join key), github_runner_cluster_mesh_control_server_url (empty for Tailscale), github_runner_cluster_mesh_vpn_auth (the resulting k3s --vpn-auth value) and github_runner_cluster_mesh_policy (the tailnet policy the route and tag check in tasks/mesh/check_policy.yml reads). See tasks/mesh/main.yml.
github_runner_cluster_mesh: tailscale
# The tag every node registers with, and that the policy must let register and auto-approve the pod routes for.
github_runner_cluster_mesh_tag: "tag:github-runner-node"
# k3s's own default cluster CIDR. Each node advertises its slice of it as a Tailscale subnet route (flannel's tailscale backend), so the policy has to auto-approve it. Only change it alongside k3s's own --cluster-cidr.
github_runner_cluster_pod_cidr: "10.42.0.0/16"

# Headscale, for every headscale_* provider. github_runner_cluster_headscale_url is the control server URL each node's Tailscale client registers with (it becomes controlServerURL in --vpn-auth), so every node must reach it. github_runner_cluster_headscale_api_url is where the control node reaches Headscale's REST API; empty means the same URL, and it only needs setting when the control node has a different route to the server.
github_runner_cluster_headscale_url: ""
github_runner_cluster_headscale_api_url: ""
# Secrets, as plain variables (the github_runner_secrets_onepassword role reads them from its headscale-api-key and headscale-join-key fields). headscale_existing needs the API key (headscale apikeys create --expiration 90d); the join key may start empty when a new one would be kept (see github_runner_cluster_join_key_path). A provider that runs its own Headscale server creates both and keeps them on that server's host, so there these only override the stored ones.
github_runner_cluster_headscale_api_key: ""
github_runner_cluster_headscale_join_key: ""
# The Headscale user new join keys belong to. Empty (the default) creates keys owned by the tag alone, which is what Headscale does for tagged keys; set it to a user name to own them by that user instead.
github_runner_cluster_headscale_user: ""
# Who may assign the node tag, as the tagOwners entry the policy check's suggested snippet names (a user such as admin@, or a group). Empty suggests an empty owner list: only the server itself, through its API and CLI, can then assign the tag, which is all this role needs to create tagged join keys.
github_runner_cluster_headscale_tag_owner: ""
# Derived, never set directly: the tag owner the policy check's snippet suggests for the mesh in use (tasks/mesh/tailscale_api.yml grants the tag to autogroup:admin).
github_runner_cluster_mesh_policy_tag_owner: "{{ 'autogroup:admin' if github_runner_cluster_mesh == 'tailscale' else github_runner_cluster_headscale_tag_owner }}"
# A new join key's lifetime, and how close to expiry an existing key is replaced. Replacing the key only changes what new nodes register with: nodes already on the mesh keep their registration.
github_runner_cluster_headscale_join_key_days: 90
github_runner_cluster_headscale_join_key_renew_days: 14

# The Headscale server the headscale_hosted and headscale_in_cluster providers run themselves: this release, pinned deliberately, since Headscale's configuration and API change between minor releases.
github_runner_cluster_headscale_version: "0.29.3"
# The inventory host headscale_hosted runs it on (headscale_in_cluster always runs it on the bootstrap server). Empty means the cluster's bootstrap server; any inventory host works, including one outside the cluster group (it needs Docker with Compose, and github_runner_cluster_headscale_dir).
github_runner_cluster_headscale_host: ""
# Where on that host the role keeps Headscale's configuration, policy, Compose project or static pod manifest and the API and join keys it creates (under secrets/, mode 0600). Empty means a headscale directory under the host's github_runner_cluster_dir, which a host outside the cluster group does not have (its facts are never gathered, so its default cannot be worked out).
github_runner_cluster_headscale_dir: ""
# How Headscale serves github_runner_cluster_headscale_url. letsencrypt has Headscale obtain its own certificate for the URL's host name (TLS-ALPN-01 on port 443, so that port must reach it from the internet). none serves plain HTTP on github_runner_cluster_headscale_port, for a reverse proxy that terminates TLS in front of it, or a private network every node shares.
github_runner_cluster_headscale_tls: letsencrypt
github_runner_cluster_headscale_acme_email: ""
github_runner_cluster_headscale_port: 8080
# Derived, never set directly: the port Headscale listens on and the host publishes.
github_runner_cluster_headscale_listen_port: "{{ 443 if github_runner_cluster_headscale_tls == 'letsencrypt' else github_runner_cluster_headscale_port }}"
# DERP relays, for nodes that cannot reach each other directly. public uses the maps in github_runner_cluster_headscale_derp_urls (Tailscale's public DERP map by default); embedded also runs Headscale's own DERP server, which needs the letsencrypt TLS mode and STUN (UDP 3478) reachable from every node.
github_runner_cluster_headscale_derp: public
# Upstream resolvers for the tailnet's DNS. Empty leaves each node's own resolver in place for every name outside the tailnet domain; a list overrides it with these servers.
github_runner_cluster_headscale_nameservers: []
# The policy the role writes for a Headscale server it runs: the node tag, auto-approval of the pod routes, and a grant between nodes and their pods (Tailscale and Headscale evaluate a subnet-routed packet by its real source address, so a grant between node tags alone would drop pod-to-pod traffic; see k3s-io/k3s#8372). Replace it to add rules; the policy check fails a replacement that drops the tag or the route approval.
github_runner_cluster_headscale_policy: >-
  {{
    {'tagOwners': {github_runner_cluster_mesh_tag: ([github_runner_cluster_headscale_tag_owner] if github_runner_cluster_headscale_tag_owner else [])},
     'autoApprovers': {'routes': {github_runner_cluster_pod_cidr: [github_runner_cluster_mesh_tag]}},
     'grants': [{'src': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'dst': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'ip': ['*']}]}
  }}
# Extra Compose files for the headscale_hosted Headscale project, merged after the role's own (e.g. to attach it to a Docker network), as paths on the Headscale host. Like the container name below, a value set on the Headscale host or the standby host itself applies to that host's project.
github_runner_cluster_headscale_compose_files: []
github_runner_cluster_headscale_container_name: github-runner-headscale
# The DERP map Headscale serves to nodes: the map URLs it fetches (Tailscale's public map by default) and, when github_runner_cluster_headscale_derp_map is non-empty, a DERP map of its own in Headscale's derp.paths format (a dict with a regions key), written beside the configuration.
github_runner_cluster_headscale_derp_urls: [https://controlplane.tailscale.com/derpmap/default]
github_runner_cluster_headscale_derp_map: {}

# Litestream, for the headscale_hosted and headscale_in_cluster providers: a sidecar that streams Headscale's SQLite database to github_runner_cluster_headscale_litestream_replica, plus a step before Headscale starts that restores the database from the replica when the host has none (a rebuilt host). The replica is Litestream's single replica block as a dict, e.g. {url: "s3://bucket/headscale", endpoint: "https://s3.example.com", region: auto} for S3 or anything S3-compatible, {type: sftp, host: "backup.example.com:22", user: litestream, path: /srv/headscale, key-path: /etc/github-runner-litestream/sftp_key} for another host, or {path: /mnt/backup/headscale} for a file replica on a mounted path (see github_runner_cluster_headscale_litestream_mounts). See https://litestream.io/reference/config for every field.
github_runner_cluster_headscale_litestream_replica: {}
# On whenever a replica is configured: a destination with no sidecar would leave a configured backup silently unused, and a sidecar with no destination has nothing to do, so turning it on without a replica fails.
github_runner_cluster_headscale_litestream: "{{ github_runner_cluster_headscale_litestream_replica | length > 0 }}"
# Pinned for the same reason as Headscale: Litestream's configuration and replica format changed between 0.3 and 0.5.
github_runner_cluster_headscale_litestream_version: "0.5.17"
# Environment for Litestream, typically the replica's credentials (LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY for S3), written to a file only root on the Headscale host can read. The replica dict can also refer to any of them as ${NAME}, which Litestream expands.
github_runner_cluster_headscale_litestream_env: {}
# Extra files Litestream needs, such as an SFTP private key, as {file name: content}; written next to its configuration (mode 0600) and readable inside the containers under /etc/github-runner-litestream/.
github_runner_cluster_headscale_litestream_files: {}
# Host paths mounted at the same path into Litestream's containers, for a file replica on storage the host mounts (NFS, another disk).
github_runner_cluster_headscale_litestream_mounts: []
# Headscale's Noise private key (the "privkey:..." text of noise_private.key), which identifies the control server to every node and is not in the database. With Litestream on, the role keeps a copy beside the configuration and a restored server starts with it; set this (from a secret store) so a server rebuilt on a new host, with no standby, keeps the identity its nodes know. When set, a running server whose key differs fails the run rather than being changed.
github_runner_cluster_headscale_noise_private_key: ""
# headscale_hosted only: an inventory host kept as a warm standby. It gets the same configuration, keys and a Compose project that follows the replica continuously but leaves Headscale stopped until playbooks/promote_headscale_standby.yml promotes it. Needs Litestream, and the same kind of host as github_runner_cluster_headscale_host.
github_runner_cluster_headscale_standby_host: ""
# headscale_in_cluster keeps Headscale's state on the bootstrap server's k3s data volume, which a static pod cannot replace with a replicated persistent volume (kubelet runs it with no API server, so it cannot bind a claim), so the provider requires Litestream. Set this to true to run without it and accept that losing that volume loses every registration.
github_runner_cluster_headscale_accept_node_local_state: false

# Extra Compose files merged after docker-compose.yml for this host's k3s project, as paths relative to github_runner_cluster_dir or absolute. Nothing needs them in normal use; the mesh integration tests use one to put several nodes on one Docker host.
github_runner_cluster_compose_files: []
# Derived, never set directly: every Compose file for this host's k3s project, in merge order: docker-compose.yml, then the override the headscale_in_cluster provider writes for the bootstrap server, then docker-compose.api-port.yml when github_runner_cluster_api_port is not the default, then github_runner_cluster_compose_files. With no files beyond docker-compose.yml the role passes none at all and Compose reads it by itself, exactly as a plain `docker compose up` in github_runner_cluster_dir would.
github_runner_cluster_compose_file_list: >-
  {{ ['docker-compose.yml']
     + (['docker-compose.mesh.yml'] if github_runner_cluster_mesh == 'headscale_in_cluster' and github_runner_cluster_effective_bootstrap | default(false) | bool else [])
     + (['docker-compose.api-port.yml'] if github_runner_cluster_api_port | int != github_runner_cluster_k3s_default_api_port | int else [])
     + github_runner_cluster_compose_files }}
# The Docker context this host's node runs in, pinned by name (for example "colima"). Empty, the default, follows the host's current Docker context, or DOCKER_HOST when that is set. When set, every community.docker module call in the role passes it as cli_context and every docker CLI command runs with DOCKER_CONTEXT set to it, so both always reach the same daemon, whatever the host's current context is at the time. The role fails before touching the host if the context does not exist there, or if DOCKER_HOST is set as well, and it never changes the host's current context. Set it on any host with more than one Docker engine installed: on a Mac running its node in Colima with Docker Desktop also installed, merely launching Docker Desktop makes desktop-linux the current context, and an unpinned run would then build a second, empty node in Docker Desktop instead of managing the real one. Per host, like every value here that names something on the host; the Headscale tasks read it from the inventory of the host they act on.
github_runner_cluster_docker_context: ""
# The names of this host's k3s server container and k3s agent container, which docker-compose.yml takes from .env. Container names are unique on a Docker daemon, so a second cluster on the same Docker hosts needs both set to names of its own (see github_runner_cluster_api_port); the defaults are the names every existing node runs under, so leaving them unset changes nothing. Changing one on a running host makes Compose recreate that container under the new name, on the same volumes, which a server's turn treats as any other recreate.
github_runner_cluster_container_name: github-runner-k3s
github_runner_cluster_agent_container_name: github-runner-k3s-agent
# The node's k3s container as this host runs it: the server's, or the agent's. Derived, never set directly.
github_runner_cluster_node_container: "{{ github_runner_cluster_container_name if github_runner_cluster_effective_node_role == 'server' else github_runner_cluster_agent_container_name }}"
# Derived, never set directly: the Compose service and the named volume that holds /etc/rancher/node (the node's password) for this host's role, as docker-compose.yml names them, and the volume's name in Docker, which Compose forms from the project and the volume's key. The role seeds the volume from the running container before the first recreate that mounts it (tasks/node_password.yml).
github_runner_cluster_node_service: "{{ 'k3s' if github_runner_cluster_effective_node_role == 'server' else 'k3s-agent' }}"
github_runner_cluster_node_password_volume_key: "{{ 'k3s-node' if github_runner_cluster_effective_node_role == 'server' else 'k3s-agent-node' }}"
github_runner_cluster_node_password_volume: "{{ github_runner_cluster_compose_project }}_{{ github_runner_cluster_node_password_volume_key }}"
# The most seconds the role waits, after it has recreated a server's container, for that server's node to report Ready again before it recreates the next server's. A recreated server restarts k3s, rejoins etcd, and registers its node and starts its kubelet, which can take minutes on a busy host; the wait ends as soon as the node is Ready on a heartbeat from the new container, so this only bounds a server that does not come back, which then fails the run with the other servers still untouched.
github_runner_cluster_server_ready_timeout: 600

# macOS hosts only (Linux hosts are never touched): whether the role makes the container runtime come back after a reboot. On a Colima host it installs a per-user launchd agent that starts the Colima profile at login, loads it, and starts the profile at once if it is stopped. true (the default) does that for Colima hosts and nothing for the others: the role cannot start Docker Desktop, whose start-at-login setting is documented in the README. false installs nothing and leaves an agent from an earlier run as it is. Either way the end checks fail unless the runtime is up and the node's container is running.
github_runner_cluster_runtime_autostart: true
# Which container runtime a macOS host runs: auto takes it from the Docker context the role drives (colima or colima-<profile> is Colima, desktop-linux is Docker Desktop, anything else is other), colima, docker_desktop and other say so for a host whose context does not tell (DOCKER_HOST set, a context with another name).
github_runner_cluster_runtime: auto
# The Colima profile to start. Empty takes it from the Docker context (colima is the default profile, colima-<profile> another) and falls back to the default profile when the context names none.
github_runner_cluster_colima_profile: ""
# The PATH the agent runs colima with, and the role runs colima and docker with on a macOS host: both Homebrew prefixes (Apple Silicon and Intel), since launchd gives an agent only the system PATH and colima starts limactl and docker from the one it is given.
github_runner_cluster_runtime_path: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
# Derived, never set directly: the agent's launchd label, one per Colima profile.
github_runner_cluster_runtime_launchd_label: "com.exadev.github-runner.colima.{{ github_runner_cluster_effective_runtime.colima_profile }}"
# Derived, never set directly: where the agent's property list lives, in the connecting user's own LaunchAgents directory.
github_runner_cluster_runtime_agent_plist: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ github_runner_cluster_runtime_launchd_label }}.plist"

# The directory on the target host the role manages as this host's Compose project: it copies the collection's docker-compose.yml and k3s/ build context there, templates .env there, and k3s writes the kubeconfig to its kubeconfig/ subdirectory. Needs no checkout of anything on the host. The default reads HOME from the target's gathered facts, so it is the connecting user's home on that host, not the control node's.
github_runner_cluster_dir: "{{ ansible_facts['env']['HOME'] }}/{{ github_runner_cluster_dir_name }}"
# The default directory's name under HOME. A constant, kept separate so the Headscale providers can work out another host's default directory through hostvars, which never sees role defaults.
github_runner_cluster_dir_name: ".github-runner"
# The Compose project name. Compose prefixes every named volume with it, and the k3s datastore and each node's mesh identity live in those volumes (github-runner_k3s-data, github-runner_k3s-tailscale-data and the agent equivalents), so changing it on a running host starts a new, empty node. Pinned rather than left to Compose, which would take it from the directory's name, so github_runner_cluster_dir can move without losing the cluster.
github_runner_cluster_compose_project: github-runner
github_runner_cluster_kubeconfig_path: "{{ github_runner_cluster_dir }}/kubeconfig/kubeconfig.yaml"

# Whether this host waits for every node to report Ready (self-healing stale node-password registrations on the way). Needs the kubernetes Python client, which this role installs through github_runner_k8s_client only when this is true, so it is off by default and turned on for the hosts that go on to talk to the Kubernetes API (see playbooks/site.yml).
github_runner_cluster_wait_for_nodes: false

# Whether a server host annotates its own node with the collection version it applied. It needs kubectl on the host and a kubeconfig whose API server the host can reach, which a host does not have when the cluster's API is published nowhere on it (tests/mesh runs every node in Docker with no host port).
github_runner_cluster_record_deployed_version: true

# The node annotation that records the collection version the last run applied on that node's host. scripts/heartbeat.sh reads it by this key (HEARTBEAT_DEPLOYED_VERSION_ANNOTATION).
github_runner_cluster_deployed_version_annotation: "github-runner.exadev.com/deployed-version"

# The collection version this role was released as, stamped by scripts/release/stamp_version.py. A server host records it as an annotation on its own node once the node has registered, and the heartbeat publishes it in fleet-health.json. It is what was applied, not what is running, and an agent host, which has no API of its own, records nothing.
github_runner_cluster_collection_version: "2.9.0"
