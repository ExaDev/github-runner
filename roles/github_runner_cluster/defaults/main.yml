---
# A k3s cluster run under Docker Compose on each host, with embedded etcd and Tailscale inside each node's k3s container (k3s --vpn-auth).
#
# Server and agent selection is automatic. The hosts in github_runner_cluster_group, in inventory order, are the cluster: the first N are servers, where N is the largest odd number no greater than both the number of hosts and github_runner_cluster_max_servers (1 or 2 hosts give 1 server, 3 or 4 give 3, 5 or more give 5), since etcd needs a majority and an even member count tolerates no more failures than the odd count below it. The first server bootstraps the cluster (k3s --cluster-init, embedded etcd); every other server joins it as a further control-plane/etcd member, and the remaining hosts join it as agents (pure workers). The group rather than the play's hosts, because --limit narrows the play but must never change which host bootstraps or how many servers there are. See tasks/topology.yml and the collection's plugins/filter/cluster_topology.py.
github_runner_cluster_group: github_runner_cluster
github_runner_cluster_max_servers: 5
# The port every server's k3s API listens on inside its container, publishes on its Docker host and writes into its kubeconfig (https://127.0.0.1:<port>), and the port joining nodes dial. The default is k3s's own. Another value is for a second cluster on Docker hosts that already run one on the default port, alongside its own github_runner_cluster_container_name, github_runner_cluster_agent_container_name, github_runner_cluster_compose_project and github_runner_cluster_dir (see the role README's Several clusters on one host); on a Mac it must also differ from the port of any other VM there, since each VM's published ports are forwarded to the Mac's own loopback. A whole number from 1 to 65535, the same on every host of the group: it is part of every joining node's server URL.
github_runner_cluster_api_port: 6443
# k3s's own default for --https-listen-port, a constant: a server on this port needs no flag, so the role adds docker-compose.api-port.yml only for another port. Never set it.
github_runner_cluster_k3s_default_api_port: 6443
# The bootstrap server's datastore. etcd (the default) is embedded etcd, which any number of servers share. sqlite is k3s's default single-node datastore, lighter for a cluster with one server: the cluster then has exactly one server, whatever github_runner_cluster_max_servers says, and every other host joins it as an agent. Switching from sqlite to etcd later is k3s's own supported migration (the server restarts with --cluster-init); the reverse is not.
github_runner_cluster_datastore: etcd

# Per-host overrides, deliberately not defaulted here: they are read for every host in the group through hostvars, which only sees inventory, host and extra variables. github_runner_cluster_node_role ("server" or "agent") overrides the automatic choice for that host. github_runner_cluster_bootstrap: true makes that host the one that bootstraps the cluster (it becomes a server), and false stops it from being picked. github_runner_cluster_server_url (https://<address>:<port>) makes the host join that server instead, for joining a cluster whose servers are outside this inventory. github_runner_cluster_tls_sans replaces the automatic --tls-san list for that host. github_runner_cluster_node_address replaces the address the other nodes and the TLS SAN list use for that host.

# The tailnet's MagicDNS domain (e.g. example.ts.net). A node's address is its node name followed by this domain, which is the name Tailscale registers the node's own k3s container under; empty means the bare node name. Usually set once for the whole group in the inventory.
github_runner_cluster_tailnet_domain: ""

# This host's own k3s node name and Tailscale hostname. Empty (the default) means "use inventory_hostname"; set it only where a host needs a different name, e.g. to keep a pre-existing Tailscale device identity.
github_runner_cluster_node_name: ""
# Derived, never set directly: the name every template and check actually uses for this host (k3s node name, Tailscale device hostname, TLS SAN self-check).
github_runner_cluster_effective_node_name: "{{ github_runner_cluster_node_name if github_runner_cluster_node_name | length > 0 else inventory_hostname }}"

# Kubernetes taints this host's node registers with, as key=value:Effect strings (for example github-runner.example.com/excluded=true:NoExecute), none containing a space. A taint keeps pods without a matching toleration off the node; NoExecute also evicts the ones already there. They are applied by k3s each time the node registers, so they survive the node object being deleted and registering again, which a taint put on the node by hand does not. Per host, in its host_vars.
github_runner_cluster_node_taints: []

# etcd's heartbeat interval and election timeout, in milliseconds, for every k3s server (passed to k3s as --etcd-arg=heartbeat-interval=<ms> and --etcd-arg=election-timeout=<ms>). Empty, the default, leaves k3s's own timing in place (a 100 ms heartbeat and a 1000 ms election timeout), so nothing changes for an existing fleet. Raise them where the servers' peer traffic goes through a relay, whose round trips and jitter exceed what the defaults tolerate. Both are positive whole numbers, set together or not at all, the election timeout at least five times the heartbeat interval (etcd's own rule), and the same on every server of the group (tasks/etcd_timing.yml checks all three before the role changes anything). Agents run no etcd and ignore them.
github_runner_cluster_etcd_heartbeat_interval: ""
github_runner_cluster_etcd_election_timeout: ""

# Memory-pressure regrading (see the role README): a server steps down through three levels when memory runs short, and back up, without ever leaving etcd. full is the server as it runs; control-plane is still a server and an etcd voter, cordoned and drained; etcd-only has its API server, controller manager, scheduler and agent switched off, and holds the node's etcd seat and nothing else. Giving up the seat is never automatic. false (the default) installs and changes nothing. true runs the `regrade` Compose service beside this server's k3s container, a server host only, with the Docker socket mounted (the same permission cost as the docker-prune service). The run refuses it where a step down could not work: an agent, a cluster with no other server in the inventory to keep the API up, and the bootstrap server of a headscale_in_cluster mesh, whose Headscale server runs on the agent that etcd-only switches off.
github_runner_cluster_regrade: false
# Whether the service also steps up by itself. automatic (the default) goes back up one level at a time once the server has been calm, that is the pressure under the threshold and MemAvailable at or above the floor, for the sustain period, and the cooldown since the last step has passed; it takes the same Lease and checks the same peers as a step down. manual leaves stepping up to `fleet-regrade up`. Stepping down is always automatic, and giving up the etcd vote never is.
github_runner_cluster_regrade_step_up: automatic
# The window of the longest pressure average the kernel reports (avg300 in /proc/pressure/memory), in seconds. A fact about the kernel, not a setting: every default below that is a time is a multiple of it or of the sample period, so that a reading always spans the level it describes.
github_runner_cluster_regrade_pressure_window_seconds: 300
# The "some" avg300 of /proc/pressure/memory, in percent, at or above which the server counts as under pressure: for that share of the last five minutes some task was stalled waiting for memory, a rate at which etcd's heartbeat and election timers, which run in tenths of a second, are being missed. A reasoned starting point, not a measurement: read the service's log (`docker compose --profile regrade logs regrade`) on a real host and tune it.
github_runner_cluster_regrade_pressure_threshold: 10
# MemAvailable, as a percentage of MemTotal, below which a pressure reading counts. It guards against stepping down on pressure caused by reclaim while plenty is available, and, as a share rather than a number of bytes, is right for any host. Chosen, not measured.
github_runner_cluster_regrade_available_floor_percent: 15
# How often the pressure is read: a tenth of the pressure window, so a rising average is noticed well inside it and the watcher itself stays idle almost all the time.
github_runner_cluster_regrade_sample_seconds: "{{ (github_runner_cluster_regrade_pressure_window_seconds | int / 10) | int }}"
# How long the reading must stay over the limit before a step. The average already smooths five minutes, so this only has to ride out a single noisy sample: four consecutive samples.
github_runner_cluster_regrade_sustain_seconds: "{{ 4 * (github_runner_cluster_regrade_sample_seconds | int) }}"
# How long to wait after a step before another is allowed. It has to exceed the pressure window, or the next reading still holds data from before the step; three windows leave the whole of one to settle after the restart and another for the new level to be measured. The role refuses a value under one window.
github_runner_cluster_regrade_cooldown_seconds: "{{ 3 * (github_runner_cluster_regrade_pressure_window_seconds | int) }}"
# The longest a drain, a restart of the k3s container and the wait for it to serve again may each take before the step fails. A failed drain stops the step with the server where it was.
github_runner_cluster_regrade_operation_timeout_seconds: "{{ github_runner_cluster_regrade_pressure_window_seconds }}"
# How long the cluster-wide Lease that serialises steps lasts if its holder never gives it back. A step is a drain and then a restart that waits for etcd and the node, each bounded by the operation timeout, so a holder that is working never loses the Lease mid-step; a holder that crashed blocks the other servers for no longer than this.
github_runner_cluster_regrade_lease_duration_seconds: "{{ 3 * (github_runner_cluster_regrade_operation_timeout_seconds | int) }}"
# Derived, never set directly: the label a server's Node carries while regrading has it below full, with the level as its value. The role's wait for every node to be Ready leaves such a node out, since it runs no kubelet at etcd-only, and anything else that judges nodes by their readiness can do the same. The domain is the one the deployed-version annotation uses.
github_runner_cluster_regrade_level_label: "github-runner.exadev.com/regrade-level"
# Derived, never set directly: the standard control-plane taint a server carries while it runs no workloads. The core applies it with the cordon on the first step down and removes it on the way back to full; the NoSchedule effect is what it removes.
github_runner_cluster_regrade_taint: "node-role.kubernetes.io/control-plane=true:NoSchedule"

# The role controller (see the ARC role's Role controller section): a probe on every node and a controller that report which hosts are fit to hold an etcd vote and the swap they would make, changing nothing. false, the default, installs nothing. The ARC role, which installs it, reads this variable (github_runner_arc_role_controller_enabled takes it as its default), so one setting in the inventory turns it on for the group.
github_runner_cluster_role_controller: false
# Which hosts the role controller may move an etcd vote between. github_runner_cluster_voter_eligible, per host, marks a host the controller may promote to a voter or demote from one, and github_runner_cluster_voter_pinned a voter it must never demote; neither is set by default, so no host is eligible or pinned and the controller only reports. github_runner_cluster_voters, for the group, is the number of voters the cluster is held at: odd, at least 3, and at most github_runner_cluster_max_servers minus one, which leaves a swap (the new voter joins before the old one leaves) one place of headroom. tasks/voters.yml refuses anything else while github_runner_cluster_role_controller is true, and refuses fewer eligible hosts than that once any host is marked eligible. A host that is eligible must be able to hold a vote: the role prepares no host for promotion by being marked.
github_runner_cluster_voter_eligible: false
github_runner_cluster_voter_pinned: false
github_runner_cluster_voters: 3
# Derived, never set directly: the Node labels the role publishes the two host settings under, with the value true or false on every node, so that turning a setting off writes false over the true a node registered with (a kubelet adds and overwrites the labels it is given and never removes one). The ARC role's role controller reads them (github_runner_arc_role_controller_eligible_label and github_runner_arc_role_controller_pinned_label default to these), as a label with the value true.
github_runner_cluster_voter_eligible_label: "github-runner.exadev.com/voter-eligible"
github_runner_cluster_voter_pinned_label: "github-runner.exadev.com/voter-pinned"
# The Node label the role publishes the medium of this host's link under, wired, wifi or unknown, which tasks/link.yml reads on the host: the medium of the interface a Mac's Colima VM is bridged to (or of the interface the Mac's default route leaves by, for a VM that is not bridged or a runtime that is not Colima), or of the interface a Linux host's default route leaves by. The role controller's probe reports it (github_runner_arc_role_controller_link_label defaults to this), since a node in a container or a VM cannot see the link beneath its own virtual interface.
github_runner_cluster_link_label: "github-runner.exadev.com/link"
# Derived, never set directly: whether this host publishes the labels above, which it does while the role controller is on or the host is marked eligible or pinned, so that a fleet that uses none of them keeps its nodes' configuration as it is (a Docker node is not recreated by an upgrade). The same hosts mount the role directory into a Docker node (docker-compose.fleet-role.yml).
github_runner_cluster_publishes_node_labels: >-
  {{ github_runner_cluster_role_controller | bool or github_runner_cluster_voter_eligible | bool or github_runner_cluster_voter_pinned | bool }}
# Derived, never set directly: this host's labels, as the key=value entries every runtime passes to k3s as --node-label, empty unless github_runner_cluster_publishes_node_labels. github_runner_cluster_link is the medium tasks/link.yml read on the host in this run.
github_runner_cluster_node_labels: >-
  {{ [github_runner_cluster_voter_eligible_label ~ '=' ~ ('true' if github_runner_cluster_voter_eligible | bool else 'false'),
      github_runner_cluster_voter_pinned_label ~ '=' ~ ('true' if github_runner_cluster_voter_pinned | bool else 'false'),
      github_runner_cluster_link_label ~ '=' ~ github_runner_cluster_link]
     if github_runner_cluster_publishes_node_labels | bool else [] }}

# The images every node's k3s container is built from: the rancher/k3s tag (k3s's version with "+" written as "-") and the tailscale/tailscale tag whose tailscale and tailscaled binaries are copied in. Pinned, never latest: Compose builds a node's image only when it is missing, so a floating tag would put whatever version is newest on the day a node is first built, rebuilt or moved into a running cluster, unannounced. Set both once for the whole cluster group, in inventory or group_vars (the check below reads every host's through hostvars). Before it changes anything on a host the role fails if either is not a pinned tag, if the group's hosts name different k3s minor versions, or if the k3s version would break k3s's upgrade path or Kubernetes' version skew policy from what this node and the cluster run now (see the role README's Versions section). Changing them changes no running node: its image is kept until it is rebuilt (see the role README's Versions section for upgrading).
github_runner_cluster_k3s_version: "{{ github_runner_cluster_k3s_tested_version }}"
github_runner_cluster_tailscale_version: "v1.102.4"
# The k3s version this collection's integration tests run, and what github_runner_cluster_k3s_version is for every host that sets none. A separate variable because the minor-version check compares every host of the group, and a host's hostvars never hold role defaults: the check takes this as the version of a host that sets nothing, the same on whichever host runs it. Set github_runner_cluster_k3s_version, never this.
github_runner_cluster_k3s_tested_version: "v1.34.1-k3s1"
# true skips the comparison with what this node and the cluster run, which the role otherwise makes before it changes anything: for a deliberate downgrade, rebuilding a cluster that is being replaced, or a cluster that cannot be read through any server of the inventory. Never needed for an upgrade of one minor at a time. Set it with -e for that run only.
github_runner_cluster_allow_k3s_version_jump: false
# The most seconds the version check spends reading what one server runs, a positive whole number: it bounds the whole read on that server's host (its Docker daemon, the docker exec and the API call, through the task's own timeout) and is also the API call's --request-timeout. Long enough for a busy API server to list the nodes, short enough that a server whose Docker daemon or API server hangs does not hold up every host's run; a server that does not answer in time counts as one that could not be read. 0 is refused, since kubectl reads it as no timeout at all. A read cut off this way can leave its docker process running on that host until the daemon answers.
github_runner_cluster_cluster_read_timeout: 30
# Derived, never set directly: true makes tasks/cluster_nodes_read.yml read the cluster through its servers even when github_runner_cluster_allow_k3s_version_jump skips the version comparison, for a read the role needs for another reason (whether a cluster exists for a native bootstrap host to join, tasks/native/role.yml). The task that needs it passes it as a variable of the include.
github_runner_cluster_running_read_always: false

# Secrets, as plain variables from any source Ansible reads (ansible-vault, a lookup, or a secrets adapter role such as github_runner_secrets_onepassword). github_runner_cluster_k3s_token is the shared node-join secret and has no default. github_runner_cluster_tailscale_join_key is, with the default tailscale mesh provider, what k3s's own --vpn-auth integration (see docker-compose.yml) uses on every host: it runs Tailscale INSIDE each node's own k3s container, joining the tailnet as its own device and using flannel's native "tailscale" backend for pod traffic. github_runner_cluster_tailscale_api_token, when set, lets tasks/mesh/tailscale_api.yml keep the tailnet's ACL grant and the join key itself provisioned; see that file's comments for what it manages and the one manual step (creating the API token) that has no API to automate.
github_runner_cluster_tailscale_join_key: ""
github_runner_cluster_tailscale_api_token: ""

# Where a join key the role creates is kept for the next run. Only the tailscale and headscale_existing providers need this: they can create a key through the API but have nowhere of their own to keep it (the providers that run Headscale keep theirs on its host). A new key is set as the fact github_runner_cluster_new_join_key ({mesh: tailscale or headscale, key: <key>}) and then kept in either or both of two ways. github_runner_cluster_join_key_path is a file on the control node: the role writes a new key there (mode 0600), and reads the key from it whenever github_runner_cluster_tailscale_join_key or github_runner_cluster_headscale_join_key is empty. github_runner_cluster_join_key_listener true means a secrets adapter in the play keeps it: the role notifies "github_runner_cluster join key created" and flushes handlers straight away, and the adapter's handler stores the key (the github_runner_secrets_onepassword role does this for 1Password). With neither, the role never creates a key, and fails asking for one to be supplied.
github_runner_cluster_join_key_path: ""
github_runner_cluster_join_key_listener: false
# Derived, never set directly: whether a new join key would be kept.
github_runner_cluster_may_create_join_key: "{{ github_runner_cluster_join_key_listener | bool or github_runner_cluster_join_key_path | length > 0 }}"

# The mesh every node's k3s joins through --vpn-auth, and so the control server its Tailscale client registers with. One of: tailscale (Tailscale's own control plane; the tailscale_* variables above), headscale_existing (a Headscale server someone already runs), headscale_hosted (a Headscale server this role runs under Docker Compose on one host, outside k3s) or headscale_in_cluster (a Headscale server this role runs inside the cluster itself, as a static pod on the bootstrap server). Every provider publishes the same facts, so nothing outside tasks/mesh/ depends on which one is in use: github_runner_cluster_mesh_join_key (the reusable join key), github_runner_cluster_mesh_control_server_url (empty for Tailscale), github_runner_cluster_mesh_vpn_auth (the resulting k3s --vpn-auth value) and github_runner_cluster_mesh_policy (the tailnet policy the route and tag check in tasks/mesh/check_policy.yml reads). See tasks/mesh/main.yml.
github_runner_cluster_mesh: tailscale
# The tag every node registers with, and that the policy must let register and auto-approve the pod routes for.
github_runner_cluster_mesh_tag: "tag:github-runner-node"
# k3s's own default cluster CIDR. Each node advertises its slice of it as a Tailscale subnet route (flannel's tailscale backend), so the policy has to auto-approve it. Only change it alongside k3s's own --cluster-cidr.
github_runner_cluster_pod_cidr: "10.42.0.0/16"

# Headscale, for every headscale_* provider. github_runner_cluster_headscale_url is the control server URL each node's Tailscale client registers with (it becomes controlServerURL in --vpn-auth), so every node must reach it. github_runner_cluster_headscale_api_url is where the control node reaches Headscale's REST API; empty means the same URL, and it only needs setting when the control node has a different route to the server.
github_runner_cluster_headscale_url: ""
github_runner_cluster_headscale_api_url: ""
# Secrets, as plain variables (the github_runner_secrets_onepassword role reads them from its headscale-api-key and headscale-join-key fields). headscale_existing needs the API key (headscale apikeys create --expiration 90d); the join key may start empty when a new one would be kept (see github_runner_cluster_join_key_path). A provider that runs its own Headscale server creates both and keeps them on that server's host, so there these only override the stored ones.
github_runner_cluster_headscale_api_key: ""
github_runner_cluster_headscale_join_key: ""
# The Headscale user new join keys belong to. Empty (the default) creates keys owned by the tag alone, which is what Headscale does for tagged keys; set it to a user name to own them by that user instead.
github_runner_cluster_headscale_user: ""
# Who may assign the node tag, as the tagOwners entry the policy check's suggested snippet names (a user such as admin@, or a group). Empty suggests an empty owner list: only the server itself, through its API and CLI, can then assign the tag, which is all this role needs to create tagged join keys.
github_runner_cluster_headscale_tag_owner: ""
# Derived, never set directly: the tag owner the policy check's snippet suggests for the mesh in use (tasks/mesh/tailscale_api.yml grants the tag to autogroup:admin).
github_runner_cluster_mesh_policy_tag_owner: "{{ 'autogroup:admin' if github_runner_cluster_mesh == 'tailscale' else github_runner_cluster_headscale_tag_owner }}"
# A new join key's lifetime, and how close to expiry an existing key is replaced. Replacing the key only changes what new nodes register with: nodes already on the mesh keep their registration.
github_runner_cluster_headscale_join_key_days: 90
github_runner_cluster_headscale_join_key_renew_days: 14

# The Headscale server the headscale_hosted and headscale_in_cluster providers run themselves: this release, pinned deliberately, since Headscale's configuration and API change between minor releases.
github_runner_cluster_headscale_version: "0.29.3"
# The inventory host headscale_hosted runs it on (headscale_in_cluster always runs it on the bootstrap server). Empty means the cluster's bootstrap server; any inventory host works, including one outside the cluster group (it needs Docker with Compose, and github_runner_cluster_headscale_dir).
github_runner_cluster_headscale_host: ""
# Where on that host the role keeps Headscale's configuration, policy, Compose project or static pod manifest and the API and join keys it creates (under secrets/, mode 0600). Empty means a headscale directory under the host's github_runner_cluster_dir, which a host outside the cluster group does not have (its facts are never gathered, so its default cannot be worked out).
github_runner_cluster_headscale_dir: ""
# How Headscale serves github_runner_cluster_headscale_url. letsencrypt has Headscale obtain its own certificate for the URL's host name (TLS-ALPN-01 on port 443, so that port must reach it from the internet). none serves plain HTTP on github_runner_cluster_headscale_port, for a reverse proxy that terminates TLS in front of it, or a private network every node shares.
github_runner_cluster_headscale_tls: letsencrypt
github_runner_cluster_headscale_acme_email: ""
github_runner_cluster_headscale_port: 8080
# Derived, never set directly: the port Headscale listens on and the host publishes.
github_runner_cluster_headscale_listen_port: "{{ 443 if github_runner_cluster_headscale_tls == 'letsencrypt' else github_runner_cluster_headscale_port }}"
# DERP relays, for nodes that cannot reach each other directly. public uses the maps in github_runner_cluster_headscale_derp_urls (Tailscale's public DERP map by default); embedded also runs Headscale's own DERP server, which needs the letsencrypt TLS mode and STUN (UDP 3478) reachable from every node.
github_runner_cluster_headscale_derp: public
# Upstream resolvers for the tailnet's DNS. Empty leaves each node's own resolver in place for every name outside the tailnet domain; a list overrides it with these servers.
github_runner_cluster_headscale_nameservers: []
# The policy the role writes for a Headscale server it runs: the node tag, auto-approval of the pod routes, and a grant between nodes and their pods (Tailscale and Headscale evaluate a subnet-routed packet by its real source address, so a grant between node tags alone would drop pod-to-pod traffic; see k3s-io/k3s#8372). Replace it to add rules; the policy check fails a replacement that drops the tag or the route approval.
github_runner_cluster_headscale_policy: >-
  {{
    {'tagOwners': {github_runner_cluster_mesh_tag: ([github_runner_cluster_headscale_tag_owner] if github_runner_cluster_headscale_tag_owner else [])},
     'autoApprovers': {'routes': {github_runner_cluster_pod_cidr: [github_runner_cluster_mesh_tag]}},
     'grants': [{'src': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'dst': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'ip': ['*']}]}
  }}
# Extra Compose files for the headscale_hosted Headscale project, merged after the role's own (e.g. to attach it to a Docker network), as paths on the Headscale host. Like the container name below, a value set on the Headscale host or the standby host itself applies to that host's project.
github_runner_cluster_headscale_compose_files: []
github_runner_cluster_headscale_container_name: github-runner-headscale
# The DERP map Headscale serves to nodes: the map URLs it fetches (Tailscale's public map by default) and, when github_runner_cluster_headscale_derp_map is non-empty, a DERP map of its own in Headscale's derp.paths format (a dict with a regions key), written beside the configuration.
github_runner_cluster_headscale_derp_urls: [https://controlplane.tailscale.com/derpmap/default]
github_runner_cluster_headscale_derp_map: {}

# Litestream, for the headscale_hosted and headscale_in_cluster providers: a sidecar that streams Headscale's SQLite database to github_runner_cluster_headscale_litestream_replica, plus a step before Headscale starts that restores the database from the replica when the host has none (a rebuilt host). The replica is Litestream's single replica block as a dict, e.g. {url: "s3://bucket/headscale", endpoint: "https://s3.example.com", region: auto} for S3 or anything S3-compatible, {type: sftp, host: "backup.example.com:22", user: litestream, path: /srv/headscale, key-path: /etc/github-runner-litestream/sftp_key} for another host, or {path: /mnt/backup/headscale} for a file replica on a mounted path (see github_runner_cluster_headscale_litestream_mounts). See https://litestream.io/reference/config for every field.
github_runner_cluster_headscale_litestream_replica: {}
# On whenever a replica is configured: a destination with no sidecar would leave a configured backup silently unused, and a sidecar with no destination has nothing to do, so turning it on without a replica fails.
github_runner_cluster_headscale_litestream: "{{ github_runner_cluster_headscale_litestream_replica | length > 0 }}"
# Pinned for the same reason as Headscale: Litestream's configuration and replica format changed between 0.3 and 0.5.
github_runner_cluster_headscale_litestream_version: "0.5.17"
# Environment for Litestream, typically the replica's credentials (LITESTREAM_ACCESS_KEY_ID and LITESTREAM_SECRET_ACCESS_KEY for S3), written to a file only root on the Headscale host can read. The replica dict can also refer to any of them as ${NAME}, which Litestream expands.
github_runner_cluster_headscale_litestream_env: {}
# Extra files Litestream needs, such as an SFTP private key, as {file name: content}; written next to its configuration (mode 0600) and readable inside the containers under /etc/github-runner-litestream/.
github_runner_cluster_headscale_litestream_files: {}
# Host paths mounted at the same path into Litestream's containers, for a file replica on storage the host mounts (NFS, another disk).
github_runner_cluster_headscale_litestream_mounts: []
# Headscale's Noise private key (the "privkey:..." text of noise_private.key), which identifies the control server to every node and is not in the database. With Litestream on, the role keeps a copy beside the configuration and a restored server starts with it; set this (from a secret store) so a server rebuilt on a new host, with no standby, keeps the identity its nodes know. When set, a running server whose key differs fails the run rather than being changed.
github_runner_cluster_headscale_noise_private_key: ""
# headscale_hosted only: an inventory host kept as a warm standby. It gets the same configuration, keys and a Compose project that follows the replica continuously but leaves Headscale stopped until playbooks/promote_headscale_standby.yml promotes it. Needs Litestream, and the same kind of host as github_runner_cluster_headscale_host.
github_runner_cluster_headscale_standby_host: ""
# headscale_in_cluster keeps Headscale's state on the bootstrap server's k3s data volume, which a static pod cannot replace with a replicated persistent volume (kubelet runs it with no API server, so it cannot bind a claim), so the provider requires Litestream. Set this to true to run without it and accept that losing that volume loses every registration.
github_runner_cluster_headscale_accept_node_local_state: false

# The network the node's k3s container runs on. bridge (the default) is Compose's own bridge network, behind the Docker host's NAT, with the API server's port published. host puts the container on the Docker host's own network (on macOS, the Docker VM's, which then needs an address of its own on the LAN; see the role README's Networking section): its Tailscale client then offers the host's own addresses to its peers, so nodes that share a network connect directly instead of through a relay, and fall back to a relay or a hole-punched path when they do not. Nothing k3s uses changes (node IP, etcd peer URLs and certificate names stay on the mesh), so a host can move between the two with a container recreate. With host, k3s's ports, routes and firewall rules (kube-proxy, flannel, Tailscale's own and the entrypoint's unreachable route for the mesh ranges) live in the Docker host's namespace, shared with every other container on the host network there, and the API server (6443) and kubelet (10250) answer on every address the host has, its LAN address included. One node per Docker host: the role refuses host mode where the host network already has a Tailscale device that is not the node's own, as on a Linux machine running its own Tailscale client with no VM between, or beside a second node on the same Docker host (see the role README's Networking section). It also refuses host mode while the Docker engine runs any container that is not part of the node's own Compose project, since each would get a route into the mesh: the engine must be dedicated to the node. Per host, in its host_vars.
github_runner_cluster_network_mode: bridge
# Required with github_runner_cluster_network_mode host: the LAN the nodes share, in CIDR notation (for example 192.0.2.0/24). Before starting the node the role checks that the Docker host's own network (on macOS, the Docker VM's) has an address in it, and fails without changing anything when it has none, since a node on the host network of a VM without a LAN address gains nothing and still loses its published port. The address is read with `ip` from a throwaway container on the host network, run from github_runner_cluster_network_probe_image.
github_runner_cluster_lan_cidr: ""
github_runner_cluster_network_probe_image: "busybox:1.37"

# Extra Compose files merged after docker-compose.yml for this host's k3s project, as paths relative to github_runner_cluster_dir or absolute. Nothing needs them in normal use; the mesh integration tests use one to put several nodes on one Docker host.
github_runner_cluster_compose_files: []
# Derived, never set directly: every Compose file for this host's k3s project, in merge order: docker-compose.yml, then the override the headscale_in_cluster provider writes for the bootstrap server, then docker-compose.api-port.yml when github_runner_cluster_api_port is not the default, then docker-compose.node-labels.yml when the host has node labels, then docker-compose.fleet-role.yml when the host takes part in the role controller (github_runner_cluster_publishes_node_labels, the same hosts), then github_runner_cluster_compose_files, then, with github_runner_cluster_network_mode host, docker-compose.host-network.yml, last so that its emptied port list wins over any file that publishes one. With no files beyond docker-compose.yml the role passes none at all and Compose reads it by itself, exactly as a plain `docker compose up` in github_runner_cluster_dir would.
github_runner_cluster_compose_file_list: >-
  {{ ['docker-compose.yml']
     + (['docker-compose.mesh.yml'] if github_runner_cluster_mesh == 'headscale_in_cluster' and github_runner_cluster_effective_bootstrap | default(false) | bool else [])
     + (['docker-compose.api-port.yml'] if github_runner_cluster_api_port | int != github_runner_cluster_k3s_default_api_port | int else [])
     + (['docker-compose.node-labels.yml'] if github_runner_cluster_node_labels | length > 0 else [])
     + (['docker-compose.fleet-role.yml'] if github_runner_cluster_publishes_node_labels | bool else [])
     + github_runner_cluster_compose_files
     + (['docker-compose.host-network.yml'] if github_runner_cluster_network_mode == 'host' else []) }}
# Derived, never set directly: the Compose files this role writes into github_runner_cluster_dir itself, by the name the list above gives them. A user's own entry in github_runner_cluster_compose_files is not among them, and a missing one of those is an error in a check run as in a real one.
github_runner_cluster_compose_files_written:
  - docker-compose.yml
  - docker-compose.api-port.yml
  - docker-compose.node-labels.yml
  - docker-compose.fleet-role.yml
  - docker-compose.host-network.yml
  - docker-compose.mesh.yml
# Derived, never set directly: the Compose files a Compose command run now can name. Every file in the list above in a real run, since the run has written the ones it owns before any Compose command; under --check, which writes nothing, tasks/compose_files_in_use.yml leaves out the ones this role would write and the host does not have yet. Compose refuses a command that names a file that is not there, and a check run that fails on one fails the README's promise that --check runs before every deploy.
github_runner_cluster_compose_files_in_use: "{{ github_runner_cluster_compose_file_list }}"
# Derived, never set directly: the files this role writes that a check run left out of the list above because the host does not have them yet; empty in a real run.
github_runner_cluster_compose_files_unwritten: []
# The Docker context this host's node runs in, pinned by name (for example "colima"). Empty, the default, follows the host's current Docker context, or DOCKER_HOST when that is set. When set, every community.docker module call in the role passes it as cli_context and every docker CLI command runs with DOCKER_CONTEXT set to it, so both always reach the same daemon, whatever the host's current context is at the time. The role fails before touching the host if the context does not exist there, or if DOCKER_HOST is set as well, and it never changes the host's current context. Set it on any host with more than one Docker engine installed: on a Mac running its node in Colima with Docker Desktop also installed, merely launching Docker Desktop makes desktop-linux the current context, and an unpinned run would then build a second, empty node in Docker Desktop instead of managing the real one. Per host, like every value here that names something on the host; the Headscale tasks read it from the inventory of the host they act on.
github_runner_cluster_docker_context: ""
# The names of this host's k3s server container and k3s agent container, which docker-compose.yml takes from .env. Container names are unique on a Docker daemon, so a second cluster on the same Docker hosts needs both set to names of its own (see github_runner_cluster_api_port); the defaults are the names every existing node runs under, so leaving them unset changes nothing. Changing one on a running host makes Compose recreate that container under the new name, on the same volumes, which a server's turn treats as any other recreate.
github_runner_cluster_container_name: github-runner-k3s
github_runner_cluster_agent_container_name: github-runner-k3s-agent
# Derived, never set directly: the file in the Compose project directory's role directory (fleet-role.d, which docker-compose.fleet-role.yml mounts into both services) that records the role a Docker host marked github_runner_cluster_voter_eligible runs, server or agent, so that the role outlives a run of the role. tasks/docker_role.yml reads it and tasks/docker_role_record.yml writes it only when it is absent; k3s/node-entrypoint.sh idles the service of the other role.
github_runner_cluster_docker_role_file: "{{ github_runner_cluster_dir }}/fleet-role.d/role"
# Derived, never set directly: the holderIdentity the role controller takes the regrade Lease (github_runner_cluster_regrade_lease_namespace and github_runner_cluster_regrade_lease_name) as for the whole of a voter swap, and the annotation on it that names the swap. While the controller holds it unexpired, every run of the role refuses before it changes a node (tasks/role_lease_guard.yml).
github_runner_cluster_role_lease_holder: fleet-role
github_runner_cluster_role_lease_swap_id_annotation: github-runner.exadev.com/swap-id
# Derived, never set directly: the other hosts of the inventory whose API this host's cluster-side helpers (the regrade service, the role actuator) may reach the cluster through, as the topology describes them: every other server, then every other host that may become one (github_runner_cluster_voter_eligible), each in inventory order. Never this host: a server stepped down to etcd-only has no API of its own, and the servers change at run time, so a helper uses the first of them whose /readyz answers, by the address the servers' certificates carry.
github_runner_cluster_api_candidates: >-
  {{ (github_runner_cluster_topology.hosts | dict2items | rejectattr('key', 'equalto', inventory_hostname) | selectattr('value.role', 'equalto', 'server') | list)
     + (github_runner_cluster_topology.hosts | dict2items | rejectattr('key', 'equalto', inventory_hostname) | rejectattr('value.role', 'equalto', 'server')
        | selectattr('value.eligible') | list) }}
# Derived, never set directly: the role actuator (files/role/fleet-role-actuator.sh), which switches a native host between its server and agent units for the role controller's voter swap, as the host's Node asks, and holds the host-local part of the role's own promotion and demotion. Its scripts and settings go in github_runner_cluster_role_actuator_dir on every native host; its watcher, the github_runner_cluster_role_actuator_service unit, runs on every server and every eligible host while github_runner_cluster_role_controller is true (tasks/role_actuator.yml), with a credential of its own (the ServiceAccount github_runner_cluster_role_actuator_name, which can read Nodes and the regrade Lease and patch its report, the ConfigMap github_runner_cluster_role_actuator_configmap in github_runner_cluster_role_actuator_namespace) in a kubeconfig only root reads.
github_runner_cluster_role_actuator_dir: "{{ github_runner_cluster_native_lib_dir }}/role"
github_runner_cluster_role_actuator_service: fleet-role-actuator
github_runner_cluster_role_actuator_name: fleet-role-actuator
github_runner_cluster_role_actuator_configmap: fleet-role-actuators
github_runner_cluster_role_actuator_kubeconfig: "{{ github_runner_cluster_native_config_dir }}/fleet-role-actuator.kubeconfig"
# The ARC role's platform namespace, where the role controller runs and reads the actuators' reports: its github_runner_arc_platform_namespace where the inventory sets that, and that variable's default otherwise (tests/unit/test_role_actuator.py holds the two together).
github_runner_cluster_role_actuator_namespace: "{{ github_runner_arc_platform_namespace | default('github-runner-platform') }}"
# Not a setting: the commands the actuator's watcher runs that a minimal host may lack, each with the Debian package that installs it. jq reads the cluster's answers, ps finds the pods left at etcd-only (as the regrade service does) and flock holds the host's switch lock.
github_runner_cluster_role_actuator_commands: {jq: jq, ps: procps, flock: util-linux}
# The node's k3s container as this host runs it: the server's, or the agent's, by the role tasks/docker_role.yml decided this host runs. Derived, never set directly.
github_runner_cluster_node_container: "{{ github_runner_cluster_container_name if github_runner_cluster_docker_role == 'server' else github_runner_cluster_agent_container_name }}"
# Derived, never set directly: the Compose service and the named volume that holds /etc/rancher/node (the node's password) for this host's role, as docker-compose.yml names them, and the volume's name in Docker, which Compose forms from the project and the volume's key. The role seeds the volume from the running container before the first recreate that mounts it (tasks/node_password.yml).
github_runner_cluster_node_service: "{{ 'k3s' if github_runner_cluster_docker_role == 'server' else 'k3s-agent' }}"
github_runner_cluster_node_password_volume_key: "{{ 'k3s-node' if github_runner_cluster_docker_role == 'server' else 'k3s-agent-node' }}"
github_runner_cluster_node_password_volume: "{{ github_runner_cluster_compose_project }}_{{ github_runner_cluster_node_password_volume_key }}"
# The most seconds the role waits, after it has recreated a server's container, for that server's node to report Ready again before it recreates the next server's. A recreated server restarts k3s, rejoins etcd, and registers its node and starts its kubelet, which can take minutes on a busy host; the wait ends as soon as the node is Ready on a heartbeat from the new container, so this only bounds a server that does not come back, which then fails the run with the other servers still untouched.
github_runner_cluster_server_ready_timeout: 600

# macOS hosts only (Linux hosts are never touched): whether the role makes the container runtime come back after a reboot. On a Colima host it installs a launchd job that starts the Colima profile, loads it, and starts the profile at once if it is stopped. Which kind of job is github_runner_cluster_runtime_autostart_at. true (the default) does that for Colima hosts and nothing for the others: the role cannot start Docker Desktop, whose start-at-login setting is documented in the README. false installs nothing and leaves an agent or daemon from an earlier run as it is. Either way the end checks fail unless the runtime is up and the node's container is running.
github_runner_cluster_runtime_autostart: true
# When the role starts a Colima profile: login installs a per-user launchd agent (a property list in the connecting user's ~/Library/LaunchAgents, loaded into the user's login session), which runs only once that user has logged in; boot installs a launchd daemon (/Library/LaunchDaemons, owned by root, loaded into the system domain, run as the connecting user through UserName), which runs when the Mac starts, with nobody logged in, so a node recovers from a power loss or a reboot at the login window; auto is boot for the profile named by github_runner_cluster_runtime_boot_profile and login for any other. Only one of the two exists for a profile at a time: installing either removes the other's property list, and unloads it, so the profile is not started twice. A daemon takes root (become) to write and to load, which the agent never does.
github_runner_cluster_runtime_autostart_at: auto
# The Colima profile that runs this collection's k3s node, which must come back with no one logged in: the one github_runner_cluster_runtime_autostart_at auto starts at boot. Any other profile on the host (the mini's default profile for its own workloads, say) keeps the login agent.
github_runner_cluster_runtime_boot_profile: node
# Which container runtime a macOS host runs: auto takes it from the Docker context the role drives (colima or colima-<profile> is Colima, desktop-linux is Docker Desktop, anything else is other), colima, docker_desktop and other say so for a host whose context does not tell (DOCKER_HOST set, a context with another name).
github_runner_cluster_runtime: auto
# The Colima profile to start. Empty takes it from the Docker context (colima is the default profile, colima-<profile> another) and falls back to the default profile when the context names none.
github_runner_cluster_colima_profile: ""
# The directory the Colima profile lives in, as COLIMA_HOME. Empty, the default, takes it from the endpoint of the profile's Docker context (Colima points the context at <COLIMA_HOME>/<profile>/docker.sock), which is empty for Colima's own default (~/.colima), so a host needs to set this only when its context does not say. A profile in a home of its own (a bridged profile beside another that runs in the default home, which would share its network daemon) needs the variable at colima and in the launchd agent, because Colima falls back to the default home when it is missing and would start a different profile there; the role passes it to both. The directory must exist: Colima falls back silently to the default home when it does not.
github_runner_cluster_colima_home: ""
# Derived by tasks/runtime.yml, never set directly: the Colima home the role starts the profile in, which is github_runner_cluster_colima_home when that is set and otherwise the one the profile's Docker context names.
# The PATH the agent runs colima with, and the role runs colima and docker with on a macOS host: both Homebrew prefixes (Apple Silicon and Intel), since launchd gives an agent only the system PATH and colima starts limactl and docker from the one it is given.
github_runner_cluster_runtime_path: "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
# Derived, never set directly: the agent's launchd label, one per Colima profile.
github_runner_cluster_runtime_launchd_label: "com.exadev.github-runner.colima.{{ github_runner_cluster_effective_runtime.colima_profile }}"
# Derived, never set directly: where the agent's property list lives, in the connecting user's own LaunchAgents directory.
github_runner_cluster_runtime_agent_plist: "{{ ansible_facts['env']['HOME'] }}/Library/LaunchAgents/{{ github_runner_cluster_runtime_launchd_label }}.plist"
# Derived, never set directly: whether the profile is started by a launchd daemon at boot (true) or a launchd agent at login (false); see github_runner_cluster_runtime_autostart_at.
github_runner_cluster_runtime_at_boot: "{{ github_runner_cluster_runtime_autostart_at == 'boot' or (github_runner_cluster_runtime_autostart_at == 'auto' and github_runner_cluster_effective_runtime.colima_profile == github_runner_cluster_runtime_boot_profile) }}"
# Derived, never set directly: where the daemon's property list lives, which launchd requires to be owned by root and writable by no one else.
github_runner_cluster_runtime_daemon_plist: "/Library/LaunchDaemons/{{ github_runner_cluster_runtime_launchd_label }}.plist"
# Constants, not settings: the owner and group launchd requires of a daemon's property list (root, with the group of /Library/LaunchDaemons); variables only so the tests, which cannot be root, can narrow them.
github_runner_cluster_runtime_daemon_owner: root
github_runner_cluster_runtime_daemon_group: wheel
# What the Colima VM's kernel needs for the node, loaded and set now and at every VM boot on every run (tasks/colima_kernel.yml). A pod that talks to a Service whose only backend is on the same node gets no reply unless bridged traffic passes through iptables, and that needs the br_netfilter module and the two sysctls below. Constants, not settings; variables only so the tests can narrow them.
github_runner_cluster_colima_kernel_module: br_netfilter
github_runner_cluster_colima_sysctl_settings:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
# Not settings: the directory that exists in the VM exactly while the module is loaded (the bridge sysctls live under it), and the files in the VM that load the module and set the sysctls at boot. The module file keeps the name the repository README's note has long told people to create by hand, so a host that has one is adopted, not duplicated.
github_runner_cluster_colima_bridge_proc_dir: /proc/sys/net/bridge
github_runner_cluster_colima_modules_load_file: /etc/modules-load.d/br_netfilter.conf
github_runner_cluster_colima_sysctl_file: /etc/sysctl.d/90-github-runner-br-netfilter.conf
# Derived, never set directly: the command that runs another command in the profile's VM as the VM's user, which has passwordless sudo.
github_runner_cluster_colima_vm_command: "{{ ['colima', 'ssh', '--profile', github_runner_cluster_effective_runtime.colima_profile, '--'] }}"
# The memory, in GiB, and the number of CPUs of this host's Colima VM: each a positive whole number, or empty (the default) to keep what the profile has, unless the memory is derived from github_runner_cluster_colima_memory_reserved_gib (below); a memory set here wins over the derivation. Colima hosts only: on a host whose runtime is anything else these and the reserves are ignored, so they can be set for a group that mixes runtimes. When a size differs from what the profile's VM runs (`colima list --json`), the role resizes the VM through the quorum guard, one node at a time (tasks/colima_size.yml): it refuses unless the cluster stays safe without the node, takes the fleet-regrade Lease, refusing while another step holds it, cordons the node, waits for its runner pods to finish and drains it, checks the cluster again, stops the profile and starts it with the new size, waits for the node to be Ready again (and an etcd voter, on a server), uncordons it and gives the Lease back. `colima start` writes the size to the profile's configuration, so every later start, the launchd job's at boot or login included, keeps it. A node whose container is not running takes nothing from the cluster, and its VM is only stopped and started.
github_runner_cluster_colima_memory_gib: ""
github_runner_cluster_colima_cpus: ""
# The memory, in GiB, this host's other workloads (everything on the Mac but macOS itself and the node VM) need, a number zero or more. Set, and github_runner_cluster_colima_memory_gib empty, the VM's memory is derived: the host's memory (memtotal_mb of its hardware facts, which tasks/colima_size.yml gathers) less this and github_runner_cluster_colima_memory_host_reserve_gib, rounded down to a whole GiB since colima takes whole GiB and rounding up would take memory a reserve keeps. Set alongside github_runner_cluster_colima_memory_gib, it is the budget that memory must fit: a memory above the host's memory less both reserves fails the run, naming the figures, before the VM is read or the node cordoned, so a workload whose reserve grows can never leave the VM larger than the host affords. A derived memory is never less than the node floor, github_runner_cluster_colima_guest_baseline_gib plus github_runner_cluster_colima_runner_memory_limit_gib rounded up to a whole GiB, since a node that cannot hold its own baseline and one runner pod is offered jobs it cannot finish; a derivation below the floor is sized at the floor and the run prints a warning that the host keeps less than its reserves. Empty, the default, derives and bounds nothing.
github_runner_cluster_colima_memory_reserved_gib: ""
# The memory, in GiB, a reserve keeps for macOS itself: the memory macOS has wired plus the resident memory of every process but the node VM's, as measured on two node hosts: 3.68 + 6.28 = 9.96 GiB on one of 64 GiB and 2.52 + 7.85 = 10.4 GiB on one of 32 GiB, within half a GiB of each other, so 10, the whole GiB nearest both. The compressor is left out: what it holds follows from the memory pressure at the time it is read, not from what macOS needs. A host whose own reading differs sets its own.
github_runner_cluster_colima_memory_host_reserve_gib: 10
# The memory, in GiB, a node VM uses with no runner pod on it (the guest kernel, containerd, k3s with its datastore on a server, and the cluster's system pods), as measured inside a Colima server node VM with `free -m` in its k3s container: 3396 MiB used by k3s, etcd, the system pods and two idle runner pods (https://github.com/ExaDev/github-runner/issues/208). The first part of the node floor.
github_runner_cluster_colima_guest_baseline_gib: 3.4
# One runner pod's memory limit, in GiB, as the scale set's values give it (the cluster role does not install the runners, so it cannot read it): the second part of the node floor. Required when the memory is derived; empty, the default, otherwise.
github_runner_cluster_colima_runner_memory_limit_gib: ""
# Derived, never set directly: how long the Lease a resize takes lasts if its holder never gives it back. It covers the holder's long steps, each bounded by its own timeout: the wait for the runner pods and the drain (github_runner_cluster_native_runner_wait_timeout each), and the stop, the start and the wait for the node to come back (github_runner_cluster_native_ready_timeout each). A holder that is working never loses it; one that crashed blocks other steps for no longer than this.
github_runner_cluster_colima_resize_lease_seconds: "{{ 2 * (github_runner_cluster_native_runner_wait_timeout | int) + 3 * (github_runner_cluster_native_ready_timeout | int) }}"
# Derived, never set directly: who a resize holds the Lease as. It names the node but is never a node name, so that the node's own regrade service, which holds it by node name, reads it as held by another and does not step meanwhile.
github_runner_cluster_colima_resize_lease_holder: "colima-resize/{{ github_runner_cluster_effective_node_name }}"
# Not settings: the Lease that serialises every step that takes a node away, as fleet-regrade's core names it (LEASE_NAME and LEASE_NAMESPACE in files/regrade/fleet-regrade-core.sh).
github_runner_cluster_regrade_lease_name: fleet-regrade
github_runner_cluster_regrade_lease_namespace: kube-system

# The directory on the target host the role manages as this host's Compose project: it copies the collection's docker-compose.yml and k3s/ build context there, templates .env there, and k3s writes the kubeconfig to its kubeconfig/ subdirectory. Needs no checkout of anything on the host. The default reads HOME from the target's gathered facts, so it is the connecting user's home on that host, not the control node's.
github_runner_cluster_dir: "{{ ansible_facts['env']['HOME'] }}/{{ github_runner_cluster_dir_name }}"
# The default directory's name under HOME. A constant, kept separate so the Headscale providers can work out another host's default directory through hostvars, which never sees role defaults.
github_runner_cluster_dir_name: ".github-runner"
# The Compose project name. Compose prefixes every named volume with it, and the k3s datastore and each node's mesh identity live in those volumes (github-runner_k3s-data, github-runner_k3s-tailscale-data and the agent equivalents), so changing it on a running host starts a new, empty node. Pinned rather than left to Compose, which would take it from the directory's name, so github_runner_cluster_dir can move without losing the cluster.
github_runner_cluster_compose_project: github-runner
github_runner_cluster_kubeconfig_path: "{{ github_runner_cluster_dir }}/kubeconfig/kubeconfig.yaml"

# Whether this host waits for every node to report Ready (self-healing stale node-password registrations on the way). Needs the kubernetes Python client, which this role installs through github_runner_k8s_client only when this is true, so it is off by default and turned on for the hosts that go on to talk to the Kubernetes API (see playbooks/site.yml).
github_runner_cluster_wait_for_nodes: false

# Whether a server host annotates its own node with the collection version it applied. It needs kubectl on the host and a kubeconfig whose API server the host can reach, which a host does not have when the cluster's API is published nowhere on it (tests/mesh runs every node in Docker with no host port).
github_runner_cluster_record_deployed_version: true

# The node annotation that records the collection version the last run applied on that node's host. scripts/heartbeat.sh reads it by this key (HEARTBEAT_DEPLOYED_VERSION_ANNOTATION).
github_runner_cluster_deployed_version_annotation: "github-runner.exadev.com/deployed-version"

# The collection version this role was released as, stamped by scripts/release/stamp_version.py. A server host records it as an annotation on its own node once the node has registered, and the heartbeat publishes it in fleet-health.json. It is what was applied, not what is running, and an agent host, which has no API of its own, records nothing.
github_runner_cluster_collection_version: "2.36.1"

# How this host runs its k3s node. compose (the default) is everything above: k3s in a container under Docker Compose, with Tailscale inside the container. native runs k3s directly on the host under systemd, as the service k3s-agent (an agent) or k3s (a server), with no Docker or Compose layer: the node's containerd then uses the host's filesystem and network instead of nesting inside a container's, and a server's etcd writes to the host's own disk. Per host, in its host_vars. native is for a Linux host that systemd runs. A native host is a server only when it sets github_runner_cluster_node_role: server or github_runner_cluster_bootstrap: true; it is never given a server place automatically and does not count towards the automatic number, so an inventory whose native hosts set neither keeps every one of them an agent. A host with github_runner_cluster_voter_eligible: true (a per-host inventory variable, like the other overrides) is also staged as a standby server, its configuration written and its name on every server's certificate, so that it can later be promoted. See the role README's Native nodes section, which also says what a native node gives up.
github_runner_cluster_node_mode: compose

# Native mode only, from here on. Whether the role enables and starts the node's service (k3s-agent or k3s), restarts it when its binary or configuration changed, switches the host between the server and the agent unit when its role changed, and then waits for the node to report Ready as a server sees it. false installs and configures everything and leaves the services as it finds them (a first install stays disabled and stopped, and a host whose role changed keeps running its old unit), for staging a host before the cluster is joined or before its role is switched.
github_runner_cluster_native_start: true
# The most seconds, about, the role waits for the started node to report Ready on a heartbeat from the k3s that was just started, a native node's or one whose Colima VM was resized, and the most each `colima stop` and `colima start` of a resize may take. The same bound as a recreated server's.
github_runner_cluster_native_ready_timeout: "{{ github_runner_cluster_server_ready_timeout }}"
# Where the k3s release binaries are downloaded from: <this>/<release tag, with "+" written %2B>/<asset>, as GitHub publishes them. The download is checked against the SHA-256 sum the same release lists for the asset, unless github_runner_cluster_native_k3s_sha256 is set. A variable so a mirror, or a test, can stand in.
github_runner_cluster_native_k3s_download_url: https://github.com/k3s-io/k3s/releases/download
# The SHA-256 of the k3s binary to install, for this host's architecture. Empty, the default, takes the sum from the release's own sum file, which catches a corrupt or cut-short download; a sum set here, from a source other than the download, also catches a release that was replaced. It has to be set per architecture, so per host or per group of hosts.
github_runner_cluster_native_k3s_sha256: ""
# Whether the role installs the pinned Tailscale package (github_runner_cluster_tailscale_version) from Tailscale's own apt repository, adding the repository when the host has none, and keeps the service running. false leaves the host's Tailscale client as it is (installed by other means, or already at the right version) and only checks its login. Debian and Ubuntu hosts only.
github_runner_cluster_native_tailscale_install: true
# Where Tailscale's package repository is, <this>/<ubuntu or debian>/<release>.noarmor.gpg and <release>.tailscale-keyring.list being the signing key and the repository's list file. A variable so a mirror, or a test, can stand in.
github_runner_cluster_native_tailscale_repository_url: https://pkgs.tailscale.com/stable
# The host's Tailscale client is the node's: k3s's --vpn-auth runs `tailscale up` against it, and the node's tailnet device is the host's. A client logged in to another tailnet would not join the cluster's, so the role refuses to carry on with the client in one, unless this is true, which logs the client out of it first (`tailscale logout`): the host leaves that tailnet, and anything reaching the host over it stops. Only for a host that is dedicated to the cluster.
github_runner_cluster_native_tailscale_leave_other_tailnet: false

# Derived, never set directly: the names k3s's own install script gives the units of an agent and a server, and the unit this host runs, from the role tasks/native/role.yml decided.
github_runner_cluster_native_agent_service: k3s-agent
github_runner_cluster_native_server_service: k3s
github_runner_cluster_native_service: "{{ github_runner_cluster_native_server_service if github_runner_cluster_native_role == 'server' else github_runner_cluster_native_agent_service }}"
# Derived, never set directly: the server this host's k3s joins, as https://<address>:<port>. A node that joins the bootstrap host dials it; the bootstrap host itself, when it runs as an agent or rejoins a cluster that already exists, dials the first other server of the inventory. Empty for a host with nothing to dial.
github_runner_cluster_native_join_url: "{{ github_runner_cluster_effective_server_url if github_runner_cluster_effective_server_url | length > 0 else (github_runner_cluster_topology.hosts[inventory_hostname].peer_server_urls | first | default('')) }}"
# Derived, never set directly: the host name in that URL, which the Tailscale wrapper waits for.
github_runner_cluster_native_join_host: "{{ github_runner_cluster_native_join_url | urlsplit('hostname') if github_runner_cluster_native_join_url | length > 0 else '' }}"
# Derived, never set directly: the file that names the role the host runs, server or agent, which each unit's ExecCondition reads (files/native/fleet-role-is.sh), so the host's role outlives a restart, a reboot and a run of the role.
github_runner_cluster_native_role_file: "{{ github_runner_cluster_native_data_dir }}/fleet-role"
# Not a setting: the fewest voters a demotion leaves, every one Ready. Three is the smallest etcd membership that keeps quorum through a failure (a majority of three is two; a majority of two is both, which etcd calls unsafe), so a demotion that would leave fewer is refused and the cluster gains a voter first.
github_runner_cluster_native_demotion_min_voters: 3
# Derived, never set directly: the prefix of the file, one per unit (<prefix>-k3s-agent, <prefix>-k3s), that says the unit's files changed since it last started, so a restart that a run refused or did not reach is made by the next run.
github_runner_cluster_native_restart_marker: "{{ github_runner_cluster_native_data_dir }}/fleet-restart-pending"
# How long, about, a planned restart of a node (a native node's role switch, a Colima VM resize) waits for the runner pods on the node to finish after it has cordoned it, in seconds, before it gives up, uncordons the node and fails, changing nothing else: a planned restart never cuts a job. Each poll lists the node's pods, so a job that finishes is seen on the next poll. The drain that follows is bounded by it too.
github_runner_cluster_native_runner_wait_timeout: "{{ github_runner_cluster_native_ready_timeout }}"
# Derived, never set directly: what tasks/native/drain.yml says was not done when it cannot empty the node, in words that follow "Not". A role switch's by default; another caller of drain.yml passes its own.
github_runner_cluster_native_drain_for: "switching {{ inventory_hostname }} from {{ github_runner_cluster_native_current_role }} to {{ github_runner_cluster_native_role }}"
# Not settings: where the native node's files live. Variables only so the tests can point them at a stand-in. The binary goes in bin_dir, the PATH wrapper and the helpers under lib_dir, the configurations and the two secrets (token, vpn-auth) in config_dir, the units in unit_dir, and data_dir is k3s's own data directory (a server's datastore is server/db under it, and the role file sits beside it); tailscale_cli is the Tailscale command the package installs.
github_runner_cluster_native_bin_dir: /usr/local/bin
github_runner_cluster_native_lib_dir: /usr/local/lib/github-runner-k3s
github_runner_cluster_native_config_dir: /etc/rancher/k3s
github_runner_cluster_native_unit_dir: /etc/systemd/system
github_runner_cluster_native_data_dir: /var/lib/rancher/k3s
github_runner_cluster_native_tailscale_cli: /usr/bin/tailscale
# Not settings, variables only so the tests can point them at a stand-in: run_dir is where systemd makes each unit's runtime directory (/run), and psi_file is the kernel's memory pressure, which the role reads to refuse regrading on a kernel that has none.
github_runner_cluster_native_run_dir: /run
github_runner_cluster_native_psi_file: /proc/pressure/memory
# Derived, never set directly: the runtime directory of each unit (RuntimeDirectory=, under run_dir), which systemd keeps across a restart of the unit and removes when the unit stops. One per unit, never shared: systemd removes a unit's runtime directory whenever that unit leaves the active state, which includes a start that the unit's ExecCondition skips, so a start of the agent unit on a server (by hand, or by anything that starts every unit it finds) would otherwise remove the running server's resolver file and regrading record.
github_runner_cluster_native_agent_runtime_dir: github-runner-k3s-agent
github_runner_cluster_native_server_runtime_dir: github-runner-k3s-server
# Derived, never set directly: the regrading level fleet-regrade last requested for a native server, on k3s's data directory so that it outlives a restart and a reboot, and the level its k3s started at, in the unit's runtime directory, so that it exists only while k3s runs. The server unit's ExecStartPre writes the second from the first (files/native/write-regrade-level.sh); the systemd actuator writes the first and reads the second (files/regrade/fleet-regrade-systemd.sh).
github_runner_cluster_native_regrade_level_file: "{{ github_runner_cluster_native_data_dir }}/regrade-level"
github_runner_cluster_native_regrade_started_file: "{{ github_runner_cluster_native_run_dir }}/{{ github_runner_cluster_native_server_runtime_dir }}/regrade-level"
# Derived, never set directly: where a native server's regrade scripts and settings go, and the name of the unit that runs them.
github_runner_cluster_native_regrade_dir: "{{ github_runner_cluster_native_lib_dir }}/regrade"
github_runner_cluster_native_regrade_service: fleet-regrade
# Not a setting: the commands a native server's regrading runs that a minimal host may lack, each with the Debian package that installs it.
github_runner_cluster_native_regrade_commands: {jq: jq, ps: procps}
# Not settings: where Tailscale's apt signing key and repository list file go, which are the paths Tailscale's own install instructions use. A host that has either already is left alone. Variables only so the tests can point them at a stand-in.
github_runner_cluster_native_apt_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
github_runner_cluster_native_apt_source: /etc/apt/sources.list.d/tailscale.list
