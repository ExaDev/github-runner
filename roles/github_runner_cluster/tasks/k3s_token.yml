---
# Fails unless the shared k3s token is set. Shared by the Docker path (main.yml) and the native node (native/main.yml). Needs no facts.

- name: Fail if the k3s token is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_k3s_token is not set. Set it from any source
      Ansible reads (ansible-vault, a lookup), or run a secrets adapter
      such as github_runner_secrets_onepassword first.
  when: github_runner_cluster_k3s_token | default('') | length == 0
