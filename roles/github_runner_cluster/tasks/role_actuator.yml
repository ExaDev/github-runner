---
# Runs the role actuator's watcher (files/role/fleet-role-actuator.sh watch, as the github_runner_cluster_role_actuator_service unit) on a native host the role controller may switch or take a snapshot on, a server or a host marked eligible, while github_runner_cluster_role_controller is true, and removes it otherwise; native/config.yml has placed its scripts and settings on every native host. The watcher gets a credential of its own: the role applies its ServiceAccount, its scoped rules and its token Secret (templates/role-actuator-rbac.yaml.j2) through another server's API, creates the report ConfigMap the controller reads when there is none, and writes a kubeconfig holding the token, mode 0600, by a task that logs nothing. A file maps every other server and eligible host's node name to the URL a promotion joins it at. Run after native/service.yml has run the host's unit. While github_runner_cluster_native_start is false the unit is left as it is found, running or not, as the k3s units are, and only its files are written. Under --check nothing is changed and each change a real run would make is reported.

- name: Work out whether the role actuator's watcher runs on this host
  ansible.builtin.set_fact:
    github_runner_cluster_role_actuator_on: "{{ github_runner_cluster_role_controller | bool and github_runner_cluster_native_stage_server | bool }}"

- name: Run the role actuator's watcher
  ansible.builtin.include_tasks: role_actuator_watcher.yml
  when: github_runner_cluster_role_actuator_on | bool

- name: Remove the role actuator's watcher, its credential and its join URLs from the host
  # The scripts and settings stay: the role's own promotion and demotion run them. What the role applied to the cluster stays too, shared by every host's watcher, and grants nothing to anyone without its token.
  when: not github_runner_cluster_role_actuator_on | bool
  block:
    - name: Read whether the watcher is installed
      ansible.builtin.stat:
        path: "{{ github_runner_cluster_native_unit_dir }}/{{ github_runner_cluster_role_actuator_service }}.service"
      register: github_runner_cluster_role_actuator_installed

    - name: Remove the watcher
      when: github_runner_cluster_role_actuator_installed.stat.exists
      block:
        - name: Stop and disable the watcher
          become: true
          ansible.builtin.command:
            argv: [systemctl, disable, --now, "{{ github_runner_cluster_role_actuator_service }}"]
          changed_when: true

        - name: Remove the watcher's unit, kubeconfig and join URLs
          become: true
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - "{{ github_runner_cluster_native_unit_dir }}/{{ github_runner_cluster_role_actuator_service }}.service"
            - "{{ github_runner_cluster_role_actuator_kubeconfig }}"
            - "{{ github_runner_cluster_role_actuator_dir }}/join-urls"

        - name: Reload systemd, which still knows the removed unit
          become: true
          ansible.builtin.command:
            argv: [systemctl, daemon-reload]
          changed_when: true
