---
# Reads, from the cluster itself, every node's Ready condition (github_runner_cluster_node_readiness, "<node>=<True|False|Unknown>" a line, the status empty for a node with no Ready condition yet) and the nodes memory-pressure regrading has stepped down (github_runner_cluster_nodes_stepped_down). Run when the answer is needed, never cached, since the rescue of tasks/wait_for_nodes.yml reads them after a wait that took a while. Both reads change nothing, so they run under --check too: the wait that follows depends on their output.

- name: Read which nodes are Ready
  ansible.builtin.command:
    argv: [kubectl, get, nodes, -o, 'jsonpath={range .items[*]}{.metadata.name}{"="}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}']
  environment:
    KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
  changed_when: false
  check_mode: false
  register: github_runner_cluster_node_readiness

- name: Read which nodes memory-pressure regrading has stepped down
  # Not Ready by design at etcd-only, and nothing a stale registration explains: clearing its node-password Secret would be a change nobody asked for.
  ansible.builtin.command:
    argv: [kubectl, get, nodes, --selector, "{{ github_runner_cluster_regrade_level_label }}", -o, 'jsonpath={range .items[*]}{.metadata.name}{"\n"}{end}']
  environment:
    KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
  changed_when: false
  check_mode: false
  register: github_runner_cluster_nodes_stepped_down
