---
# Runs the role actuator's watcher on a native host the role controller may switch, for tasks/role_actuator.yml, which includes this file only on such a host: an include skipped by its condition loads none of its tasks, whereas a task in a block skipped by its condition still has its delegate_to templated (ansible-core resolves delegate_to before when, _calculate_delegate_to in TaskExecutor._execute), and the delegated tasks of role_actuator_credential.yml name github_runner_cluster_native_api_host, which only role_actuator_api.yml sets. Installs the commands the watcher needs, applies its credential through another server's API, writes its kubeconfig, join URLs and unit, and starts or restarts it. Under --check nothing is changed and each change a real run would make is reported.

- name: Read which of the commands the watcher needs are installed
  # Read-only, so it runs under --check too.
  ansible.builtin.shell: |
    set -u
    for command in $commands; do
      if command -v "$command" >/dev/null; then echo "$command"; fi
    done
  environment:
    commands: "{{ github_runner_cluster_role_actuator_commands.keys() | join(' ') }}"
  register: github_runner_cluster_role_actuator_host
  changed_when: false
  check_mode: false

- name: Record the packages the watcher needs that are not installed
  ansible.builtin.set_fact:
    github_runner_cluster_role_actuator_packages: >-
      {{ github_runner_cluster_role_actuator_commands | dict2items
         | rejectattr('key', 'in', github_runner_cluster_role_actuator_host.stdout_lines) | map(attribute='value') | unique | list }}

- name: Fail if a command the watcher needs is missing on a host the role cannot install it on
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_role_controller is true, but {{ inventory_hostname }} lacks the packages
      {{ github_runner_cluster_role_actuator_packages | join(', ') }}, which the role actuator needs, and the role installs them from
      the distribution's packages on Debian and Ubuntu only. Install them and run again. Nothing was changed.
  when:
    - github_runner_cluster_role_actuator_packages | length > 0
    - ansible_facts['os_family'] != 'Debian'

- name: Install the packages the watcher needs that the host lacks
  # The index is refreshed first, since a host's lists can be missing or stale.
  when: github_runner_cluster_role_actuator_packages | length > 0
  block:
    - name: Refresh the package index
      become: true
      ansible.builtin.command:
        argv: [apt-get, update]
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: Install the packages
      become: true
      ansible.builtin.command:
        argv: "{{ ['apt-get', 'install', '--yes', '--no-install-recommends'] + github_runner_cluster_role_actuator_packages }}"
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

- name: Choose the server whose API sets up the watcher's credential
  ansible.builtin.include_tasks: role_actuator_api.yml

- name: Write the watcher's unit
  # Under --check too, as the regrade unit is (native/regrade_service.yml), so a check run reports a changed unit.
  become: true
  ansible.builtin.template:
    src: native/fleet-role-actuator.service.j2
    dest: "{{ github_runner_cluster_native_unit_dir }}/{{ github_runner_cluster_role_actuator_service }}.service"
    mode: "0644"
  register: github_runner_cluster_role_actuator_unit

- name: Reload systemd when the unit changed
  become: true
  ansible.builtin.command:
    argv: [systemctl, daemon-reload]
  changed_when: true
  when:
    - github_runner_cluster_role_actuator_unit is changed
    - not ansible_check_mode

- name: Report the credential and the watcher a real run would set up
  ansible.builtin.debug:
    msg: >-
      apply the role actuator's credential ({{ github_runner_cluster_role_actuator_name }} in {{ github_runner_cluster_role_actuator_namespace }}),
      write {{ github_runner_cluster_role_actuator_kubeconfig }} and run {{ github_runner_cluster_role_actuator_service }}
  changed_when: true
  when: ansible_check_mode

- name: Set up the watcher's credential and run it
  when: not ansible_check_mode
  block:
    - name: Give the watcher its credential and the URLs a promotion joins
      ansible.builtin.include_tasks: role_actuator_credential.yml

    - name: Read whether the watcher is enabled and running
      ansible.builtin.command:
        argv: [systemctl, "{{ item }}", "{{ github_runner_cluster_role_actuator_service }}"]
      loop: [is-enabled, is-active]
      register: github_runner_cluster_role_actuator_state
      changed_when: false
      failed_when: false

    - name: Enable the watcher
      become: true
      ansible.builtin.command:
        argv: [systemctl, enable, "{{ github_runner_cluster_role_actuator_service }}"]
      changed_when: true
      when:
        - github_runner_cluster_native_start | bool
        - github_runner_cluster_role_actuator_state.results[0].rc != 0

    - name: Start the watcher, or restart it since something it reads changed
      # The watcher reads its scripts and settings at its start, and its report and the host hold everything else, so a restart costs nothing; a watcher nothing changed for is left running.
      become: true
      ansible.builtin.command:
        argv:
          - systemctl
          - "{{ 'restart' if github_runner_cluster_role_actuator_state.results[1].rc == 0 else 'start' }}"
          - "{{ github_runner_cluster_role_actuator_service }}"
      changed_when: true
      when:
        - github_runner_cluster_native_start | bool
        - >-
          github_runner_cluster_role_actuator_state.results[1].rc != 0
          or github_runner_cluster_role_actuator_scripts is changed
          or github_runner_cluster_role_actuator_settings is changed
          or github_runner_cluster_role_actuator_kubeconfig_file is changed
          or github_runner_cluster_role_actuator_join_urls is changed
          or github_runner_cluster_role_actuator_unit is changed
