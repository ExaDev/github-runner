---
# Seeds the named volume that keeps this node's password (/etc/rancher/node, see docker-compose.yml) from the container that runs now, so that a recreated container keeps the password the cluster holds a Secret for, instead of generating a new one that the cluster rejects. Nothing to do on a host with no container yet (the first container then writes its password into the volume as it is made) or whose volume exists already. Goes before anything that can recreate the container: the mesh step and the Compose tasks below it.
#
# The copy is files/node-identity.sh's, which the role actuator also moves a node's identity between a Docker host's services with: from one docker cp straight into another, so the password is on no disk of this host, in no command line and in no output, into a throwaway container created from the node's own image and never started, so the volume gets the ownership and mode (root, 0600) the tar stream carries, on any engine. The volume carries the labels Compose puts on the volumes it creates, so Compose adopts it without warning. A failed copy removes both again, so the next run starts from the same state. Under --check nothing is created or copied; the run says it would.

- name: Read whether this node's password volume exists and whether its container does
  # Read-only, and every task after it depends on the result, so it runs under --check too. docker ps rather than docker inspect, so that a container that does not exist reads as absent while a daemon that cannot be reached fails the run.
  ansible.builtin.shell: |
    set -eu
    set -o pipefail
    if docker volume ls --quiet --filter "name=${volume}" | grep -Fx "${volume}" >/dev/null; then
      echo volume=present
    else
      echo volume=absent
    fi
    state=$(docker ps --all --filter "name=^/${container}\$" --format '{{ '{{' }}.State{{ '}}' }}')
    echo "container=${state:-absent}"
  args:
    executable: /bin/bash
  environment: "{{ github_runner_cluster_docker_cli_environment | combine({'volume': github_runner_cluster_node_password_volume, 'container': github_runner_cluster_node_container}) }}"
  register: github_runner_cluster_password_probe
  changed_when: false
  check_mode: false

- name: Work out whether the password volume has to be seeded
  ansible.builtin.set_fact:
    github_runner_cluster_password_seed: >-
      {{ 'volume=absent' in github_runner_cluster_password_probe.stdout_lines
         and 'container=absent' not in github_runner_cluster_password_probe.stdout_lines }}

- name: Report that the password volume would be seeded from the running container
  ansible.builtin.debug:
    msg: >-
      Would create the volume {{ github_runner_cluster_node_password_volume }} and copy /etc/rancher/node from
      {{ github_runner_cluster_node_container }} into it, so that the container keeps its node password when Compose recreates it.
  changed_when: true
  when:
    - github_runner_cluster_password_seed | bool
    - ansible_check_mode

- name: Seed the password volume from the running container
  # files/node-identity.sh makes the copy (see the comment at the top of this file). The password never leaves its two docker cp processes, but the task stays no_log, so that nothing it ever prints can reach the log; the failure below reports the exit status and docker's own message, which carry no file content.
  ansible.builtin.script:
    cmd: "node-identity.sh {{ [github_runner_cluster_node_container, '/etc/rancher/node', github_runner_cluster_node_password_volume, github_runner_cluster_compose_project, github_runner_cluster_node_password_volume_key] | map('quote') | join(' ') }}"
    executable: bash
  environment: "{{ github_runner_cluster_docker_cli_environment }}"
  register: github_runner_cluster_password_seeded
  changed_when: github_runner_cluster_password_seeded.rc == 0
  failed_when: false
  no_log: true
  when:
    - github_runner_cluster_password_seed | bool
    - not ansible_check_mode

- name: Fail if the password volume could not be seeded
  ansible.builtin.fail:
    msg: >-
      Could not copy /etc/rancher/node from {{ github_runner_cluster_node_container }} into the volume
      {{ github_runner_cluster_node_password_volume }} (exit status {{ github_runner_cluster_password_seeded.rc }}:
      {{ (github_runner_cluster_password_seeded.stderr | default('') | trim | replace('\n', ' / ')) or 'no message' }}).
      The container was left as it is and the volume was not kept, so a later run tries again. Without the copy, recreating the
      container would give the node a new password that the cluster rejects. If the container never started k3s, so that it has no
      /etc/rancher/node to keep, create the volume empty with `docker volume create
      --label com.docker.compose.project={{ github_runner_cluster_compose_project }}
      --label com.docker.compose.volume={{ github_runner_cluster_node_password_volume_key }}
      {{ github_runner_cluster_node_password_volume }}` and run again.
  when:
    - github_runner_cluster_password_seeded is not skipped
    - github_runner_cluster_password_seeded.rc != 0
