---
# Brings this host up as a k3s node under Docker Compose: a server (bootstrapping the cluster or joining it) or an agent, as tasks/topology.yml decides from the cluster group. Safe to rerun: the .env is templated and docker compose converges to it.

- name: Decide this host's part in the cluster
  ansible.builtin.include_tasks: topology.yml

- name: Fail if this host's repo root is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_repo_root is not set on this host. It must be the
      absolute path of the github-runner checkout on this target host
      itself (not the control node). Add it to
      host_vars/{{ inventory_hostname }}.yml.
  when: github_runner_cluster_repo_root is not defined

- name: Fail if the k3s token is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_k3s_token is not set. Run the
      github_runner_secrets role first, or set it directly.
  when: github_runner_cluster_k3s_token is not defined

- name: Set up the mesh the nodes join, and publish its join key and control server
  # Must complete before either branch below templates .env, since both env.j2 and env-agent.j2 read the mesh facts it publishes. See tasks/mesh/main.yml for the provider interface.
  ansible.builtin.include_tasks: mesh/main.yml

- name: Determine the active Docker CLI context
  # community.docker.docker_compose_v2 defaults to unix:///var/run/docker.sock when neither docker_host nor cli_context is given, ignoring whatever context `docker` itself is actually configured to use, so a host running Colima (whose docker.sock lives under ~/.colima/default/, not /var/run) fails outright without this. Read the host's own current context rather than hardcoding "colima", since a Docker Desktop host would need "desktop-linux" instead.
  ansible.builtin.command: docker context show
  changed_when: false
  # Read-only, and every docker_compose_v2 task below depends on its output, so it has to run under --check too: a skipped result leaves cli_context empty and the dry run targets the wrong daemon.
  check_mode: false
  register: github_runner_cluster_docker_context

- name: Set up and start this host as a k3s server, bootstrapping or joining
  when: github_runner_cluster_effective_node_role == "server"
  block:
    - name: Fail if this host isn't included in the fleet's own TLS SAN list
      # Only an overridden list can miss it, since the automatic one names every server. Checks the EFFECTIVE node name (github_runner_cluster_node_name if set, else inventory_hostname), not raw inventory_hostname: a host may deliberately override its own node name, and checking the wrong string here would incorrectly fail that host.
      ansible.builtin.fail:
        msg: >-
          This host's TLS SAN list does not include its own effective node
          name ({{ github_runner_cluster_effective_node_name }}). Every server
          needs every server's own hostname on its --tls-san list, including
          its own. Fix github_runner_cluster_tls_sans in
          host_vars/{{ inventory_hostname }}.yml, or remove it to use the
          automatic list.
      when: github_runner_cluster_effective_node_name not in (github_runner_cluster_effective_tls_sans | join(' '))

    - name: Template .env for this k3s server
      ansible.builtin.template:
        src: env.j2
        dest: "{{ github_runner_cluster_repo_root }}/.env"
        mode: "0600"
      no_log: true

    - name: Start k3s via docker compose (bootstrapping or joining, per this host's own .env)
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_repo_root }}"
        profiles: ["server"]
        cli_context: "{{ github_runner_cluster_docker_context.stdout | trim }}"
        files: "{{ github_runner_cluster_compose_file_list if github_runner_cluster_compose_file_list | length > 1 else omit }}"
        state: present

- name: Join as a k3s agent
  when: github_runner_cluster_effective_node_role == "agent"
  block:
    - name: Template .env for the k3s agent
      ansible.builtin.template:
        src: env-agent.j2
        dest: "{{ github_runner_cluster_repo_root }}/.env"
        mode: "0600"
      no_log: true

    - name: Join the cluster as an agent
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_repo_root }}"
        profiles: ["agent"]
        cli_context: "{{ github_runner_cluster_docker_context.stdout | trim }}"
        files: "{{ github_runner_cluster_compose_file_list if github_runner_cluster_compose_file_list | length > 1 else omit }}"
        state: present

    - name: End the role here, since an agent host has no API of its own to wait on
      ansible.builtin.meta: end_role

- name: Give this host the kubernetes Python client before waiting on the API
  ansible.builtin.include_role:
    name: github_runner_k8s_client
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for the k3s node to register (an empty node list is still a successful API response)
  # default([]) on resources, not just a bare .resources access: the very first poll can hit the API before it's actually listening yet (the container has only just started), and that attempt's own result dict has no `resources` key at all. A bare access throws "object of type 'dict' has no attribute 'resources'" and aborts the whole `until` loop outright instead of retrying, even though the exact same module call succeeds moments later once the API is up.
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
  register: github_runner_cluster_nodes
  until: github_runner_cluster_nodes.resources | default([]) | length > 0
  retries: 60
  delay: 2
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for every node to report Ready, self-healing a stale server/agent node-password registration if any node fails to rejoin
  # /etc/rancher/node/password lives inside the joining container's own writable filesystem, not a persisted volume, so a fresh container (e.g. after docker compose --force-recreate) generates a brand-new random password, but a server that already owns the node-password Secret store still holds the PREVIOUS container's password for that node name (a kube-system/<node>.node-password.k3s Secret) and rejects the mismatched rejoin. See README's Non-obvious behaviour section; the same failure mode applies to a joining server's own container recreation, since it's the same k3s node-password mechanism regardless of join mode. Keyed on each host's effective node name (its github_runner_cluster_node_name override if set, else its inventory name, as tasks/topology.yml recorded it), since that, not the inventory name, is what k3s names the Node and its node-password Secret after. Only ever touches cluster members that are NOT the bootstrap host (as tasks/topology.yml decided it): that host owns the Secret store itself and fails Ready for entirely different reasons a stale-password wipe wouldn't fix anyway.
  when: github_runner_cluster_wait_for_nodes | bool
  block:
    - name: Wait for every node to report Ready
      # --all, not a --limit-scoped single node: once a server/agent has joined, this must wait for it too, not just this host's own control-plane node.
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
  rescue:
    - name: Clear every non-bootstrap host's stale node-password secret
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Secret
        namespace: kube-system
        name: "{{ github_runner_cluster_topology.hosts[item].node_name }}.node-password.k3s"
      loop: "{{ github_runner_cluster_topology.hosts | dict2items | rejectattr('value.bootstrap') | map(attribute='key') | list }}"

    - name: Clear every non-bootstrap host's stale Node object to match
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Node
        name: "{{ github_runner_cluster_topology.hosts[item].node_name }}"
      loop: "{{ github_runner_cluster_topology.hosts | dict2items | rejectattr('value.bootstrap') | map(attribute='key') | list }}"

    - name: Retry waiting for every node to report Ready now that any stale registration is cleared
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
