---
# Brings this host up as a k3s node under Docker Compose: a server (bootstrapping the cluster or joining it) or an agent, per github_runner_cluster_node_role and github_runner_cluster_bootstrap. Safe to rerun: the .env is templated and docker compose converges to it.

- name: Fail if the node role is invalid
  ansible.builtin.fail:
    msg: "github_runner_cluster_node_role must be 'server' or 'agent' (got '{{ github_runner_cluster_node_role }}')."
  when: github_runner_cluster_node_role not in ['server', 'agent']

- name: Fail if this host's repo root is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_repo_root is not set on this host. It must be the
      absolute path of the github-runner checkout on this target host
      itself (not the control node). Add it to
      host_vars/{{ inventory_hostname }}.yml.
  when: github_runner_cluster_repo_root is not defined

- name: Fail if the k3s token is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_k3s_token is not set. Run the
      github_runner_secrets role first, or set it directly.
  when: github_runner_cluster_k3s_token is not defined

- name: Ensure the tailnet's ACL grants cross-node pod traffic and a reusable join key exists
  # run_once, not per-host: this is tailnet-wide, shared-account state (the ACL policy, one reusable join key), not per-host state. Must complete before either branch below templates .env, since both env.j2 and env-agent.j2 read github_runner_cluster_tailscale_join_key. Needs a Tailscale API token: without one, the ACL is left as it is and the join key must already be supplied.
  ansible.builtin.include_tasks: ensure_tailscale.yml
  run_once: true
  when: github_runner_cluster_tailscale_api_token | length > 0

- name: Fail if no Tailscale join key is available
  # Otherwise this only surfaces later, as docker compose's own :?required error on K3S_VPN_AUTH_JOIN_KEY.
  ansible.builtin.fail:
    msg: >-
      No Tailscale join key: supply github_runner_cluster_tailscale_join_key
      directly, or a github_runner_cluster_tailscale_api_token so
      ensure_tailscale.yml can create one.
  when: github_runner_cluster_tailscale_join_key | length == 0

- name: Determine the active Docker CLI context
  # community.docker.docker_compose_v2 defaults to unix:///var/run/docker.sock when neither docker_host nor cli_context is given, ignoring whatever context `docker` itself is actually configured to use, so a host running Colima (whose docker.sock lives under ~/.colima/default/, not /var/run) fails outright without this. Read the host's own current context rather than hardcoding "colima", since a Docker Desktop host would need "desktop-linux" instead.
  ansible.builtin.command: docker context show
  changed_when: false
  # Read-only, and every docker_compose_v2 task below depends on its output, so it has to run under --check too: a skipped result leaves cli_context empty and the dry run targets the wrong daemon.
  check_mode: false
  register: github_runner_cluster_docker_context

- name: Set up and start this host as a k3s server, bootstrapping or joining as configured
  when: github_runner_cluster_node_role == "server"
  block:
    - name: Fail if bootstrap and join-server-url are both set (contradictory - can't bootstrap AND join)
      ansible.builtin.fail:
        msg: >-
          github_runner_cluster_bootstrap is true AND
          github_runner_cluster_join_server_url is set on this host. A host
          either bootstraps the cluster or joins an existing one, not both.
          Fix host_vars/{{ inventory_hostname }}.yml.
      when: github_runner_cluster_bootstrap and github_runner_cluster_join_server_url | length > 0

    - name: Fail if neither bootstrapping nor a join-server-url is set (nothing for this host to do)
      ansible.builtin.fail:
        msg: >-
          Neither github_runner_cluster_bootstrap nor
          github_runner_cluster_join_server_url is set on this server host. It
          must either bootstrap the cluster or join an existing one. Add one
          of them to host_vars/{{ inventory_hostname }}.yml.
      when: not github_runner_cluster_bootstrap and github_runner_cluster_join_server_url | length == 0

    - name: Fail if this host isn't included in the fleet's own TLS SAN list
      # Checks the EFFECTIVE node name (github_runner_cluster_node_name if set, else inventory_hostname), not raw inventory_hostname: a host may deliberately override its own node name, and checking the wrong string here would incorrectly fail that host.
      ansible.builtin.fail:
        msg: >-
          github_runner_cluster_tls_sans does not include this host's own
          effective node name ({{ github_runner_cluster_effective_node_name }}).
          Every server needs every server's own hostname on its --tls-san
          list, including its own. Add it to github_runner_cluster_tls_sans in
          host_vars/{{ inventory_hostname }}.yml (and on every OTHER
          server's own host_vars too).
      when: github_runner_cluster_effective_node_name not in (github_runner_cluster_tls_sans | join(' '))

    - name: Template .env for this k3s server
      ansible.builtin.template:
        src: env.j2
        dest: "{{ github_runner_cluster_repo_root }}/.env"
        mode: "0600"
      no_log: true

    - name: Start k3s via docker compose (bootstrapping or joining, per this host's own .env)
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_repo_root }}"
        profiles: ["server"]
        cli_context: "{{ github_runner_cluster_docker_context.stdout | trim }}"
        state: present

- name: Join as a k3s agent
  when: github_runner_cluster_node_role == "agent"
  block:
    - name: Fail if the join server URL is not set
      ansible.builtin.fail:
        msg: >-
          github_runner_cluster_agent_server_url is not set on this agent
          host. It must be an existing server host's own
          https://<address>:6443. Add it to
          host_vars/{{ inventory_hostname }}.yml.
      when: github_runner_cluster_agent_server_url | length == 0

    - name: Template .env for the k3s agent
      ansible.builtin.template:
        src: env-agent.j2
        dest: "{{ github_runner_cluster_repo_root }}/.env"
        mode: "0600"
      no_log: true

    - name: Join the cluster as an agent
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_repo_root }}"
        profiles: ["agent"]
        cli_context: "{{ github_runner_cluster_docker_context.stdout | trim }}"
        state: present

    - name: End the role here, since an agent host has no API of its own to wait on
      ansible.builtin.meta: end_role

- name: Give this host the kubernetes Python client before waiting on the API
  ansible.builtin.include_role:
    name: github_runner_k8s_client
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for the k3s node to register (an empty node list is still a successful API response)
  # default([]) on resources, not just a bare .resources access: the very first poll can hit the API before it's actually listening yet (the container has only just started), and that attempt's own result dict has no `resources` key at all. A bare access throws "object of type 'dict' has no attribute 'resources'" and aborts the whole `until` loop outright instead of retrying, even though the exact same module call succeeds moments later once the API is up.
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
  register: github_runner_cluster_nodes
  until: github_runner_cluster_nodes.resources | default([]) | length > 0
  retries: 60
  delay: 2
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for every node to report Ready, self-healing a stale server/agent node-password registration if any node fails to rejoin
  # /etc/rancher/node/password lives inside the joining container's own writable filesystem, not a persisted volume, so a fresh container (e.g. after docker compose --force-recreate) generates a brand-new random password, but a server that already owns the node-password Secret store still holds the PREVIOUS container's password for that node name (a kube-system/<node>.node-password.k3s Secret) and rejects the mismatched rejoin. See README's Non-obvious behaviour section; the same failure mode applies to a joining server's own container recreation, since it's the same k3s node-password mechanism regardless of join mode. Keyed on each host's effective node name (its github_runner_cluster_node_name override if set, else its inventory name), since that, not the inventory name, is what k3s names the Node and its node-password Secret after; inlined rather than read from github_runner_cluster_effective_node_name, because another host's role defaults aren't reliably visible through hostvars. Only ever touches hosts that are NOT the etcd-bootstrap host: that host owns the Secret store itself and fails Ready for entirely different reasons a stale-password wipe wouldn't fix anyway.
  when: github_runner_cluster_wait_for_nodes | bool
  block:
    - name: Wait for every node to report Ready
      # --all, not a --limit-scoped single node: once a server/agent has joined, this must wait for it too, not just this host's own control-plane node.
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
  rescue:
    - name: Clear every non-bootstrap host's stale node-password secret
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Secret
        namespace: kube-system
        name: "{{ hostvars[item].github_runner_cluster_node_name | default('', true) or item }}.node-password.k3s"
      loop: "{{ groups['all'] }}"
      when: not (hostvars[item].github_runner_cluster_bootstrap | default(false))

    - name: Clear every non-bootstrap host's stale Node object to match
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Node
        name: "{{ hostvars[item].github_runner_cluster_node_name | default('', true) or item }}"
      loop: "{{ groups['all'] }}"
      when: not (hostvars[item].github_runner_cluster_bootstrap | default(false))

    - name: Retry waiting for every node to report Ready now that any stale registration is cleared
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
