---
# Brings this host up as a k3s node, natively under systemd (github_runner_cluster_node_mode: native, tasks/native/main.yml) or, by default, under Docker Compose: a server (bootstrapping the cluster or joining it) or an agent, as tasks/topology.yml decides from the cluster group, or, for a host marked eligible, as its role directory records (tasks/docker_role.yml). Safe to rerun: the .env is templated and docker compose converges to it.

- name: Bring this host up as a native k3s server or agent, with no Docker
  # github_runner_cluster_node_mode: native. Everything below drives Docker, which a native node does not have, so the role ends after this; see tasks/native/main.yml.
  ansible.builtin.include_tasks: native/main.yml
  when: github_runner_cluster_node_mode == "native"

- name: End the role here, since a native node has none of the Docker tasks below
  ansible.builtin.meta: end_role
  when: github_runner_cluster_node_mode == "native"

- name: Check which Docker daemon the role drives on this host
  # First, so that a pinned context that does not exist, or one set alongside DOCKER_HOST, stops the run before anything touches the host.
  ansible.builtin.include_tasks: docker_context.yml

- name: Read which operating system this host runs
  # Before the macOS conditions below, which cannot assume the caller gathered facts.
  ansible.builtin.include_tasks: host_os.yml

- name: Prepare the host for k3s, when its variables ask for it
  # After the platform is known and the Docker daemon is chosen, before anything starts or recreates the node. See tasks/host_prerequisites.yml.
  ansible.builtin.include_tasks: host_prerequisites.yml

- name: Make the container runtime come back after a reboot, and check it is up
  # macOS only: the runtime is Colima or Docker Desktop there, a Linux VM that stays stopped after a reboot until something starts it, while Linux hosts run Docker as a system service. Before anything reads the daemon, since the version checks below fail on one that is down. See tasks/runtime.yml.
  ansible.builtin.include_tasks: runtime.yml
  when: ansible_facts['system'] == 'Darwin'

- name: Read this host's Docker Compose version
  # Before anything that runs Compose (the mesh providers start Compose projects too), for the check below. The CLI plugin's own version, which no Docker context or daemon changes; it still runs with the pinned context, like every docker command in the role. Read-only, so it runs under --check as well.
  ansible.builtin.command: docker compose version --short
  environment: "{{ github_runner_cluster_docker_cli_environment }}"
  changed_when: false
  check_mode: false
  register: github_runner_cluster_compose_version

- name: Fail if this host's Docker Compose recreates the containers it has just built
  # Compose 2.37.1 to 2.38.x build a service's image through Bake, key the build result by service name instead of image name, and so create the service's container without the com.docker.compose.image label (docker/compose#13047, fixed in 2.39.0). The next `up` sees that label differ from the image and recreates the container: every node restarts, and k3s with it, on the run after the one that built the k3s image. Releases before and after that range keep the container. An output with no version number in it fails too, rather than letting the check pass by default.
  vars:
    github_runner_cluster_compose_faulty_from: "2.37.1"
    github_runner_cluster_compose_fixed_in: "2.39.0"
    github_runner_cluster_compose_version_number: "{{ github_runner_cluster_compose_version.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  ansible.builtin.fail:
    msg: >-
      Docker Compose on this host reports version "{{ github_runner_cluster_compose_version.stdout | trim }}".
      Compose releases from {{ github_runner_cluster_compose_faulty_from }} up to but not including
      {{ github_runner_cluster_compose_fixed_in }} recreate every node container, restarting k3s, on the run after the one
      that built the k3s image (docker/compose#13047). Upgrade the Docker Compose
      plugin on this host to {{ github_runner_cluster_compose_fixed_in }} or later and run again.
  when: >-
    github_runner_cluster_compose_version.stdout is not search('[0-9]+\\.[0-9]+\\.[0-9]+')
    or (github_runner_cluster_compose_version_number is version(github_runner_cluster_compose_faulty_from, '>=')
        and github_runner_cluster_compose_version_number is version(github_runner_cluster_compose_fixed_in, '<'))

- name: Decide this host's part in the cluster
  ansible.builtin.include_tasks: topology.yml

- name: Decide which role this host runs, from its role directory when it is eligible
  # Right after the topology, so that every check and task below follows the role the host runs, which for an eligible host is the one recorded on it rather than the inventory's. See tasks/docker_role.yml.
  ansible.builtin.include_tasks: docker_role.yml

- name: Refuse the run while the role controller holds the regrade Lease for a voter swap
  # Before anything is written to the host or any container is touched. See tasks/role_lease_guard.yml.
  ansible.builtin.include_tasks: role_lease_guard.yml

- name: Check the versions the node's image is built from
  ansible.builtin.include_tasks: versions.yml

- name: Check the k3s version against what this node and the cluster run now
  ansible.builtin.include_tasks: running_version.yml

- name: Check etcd's heartbeat interval and election timeout
  ansible.builtin.include_tasks: etcd_timing.yml

- name: Check the role controller's settings
  ansible.builtin.include_tasks: voters.yml

- name: Read the medium of this host's link, for its Node label
  ansible.builtin.include_tasks: link.yml
  when: github_runner_cluster_publishes_node_labels | bool

- name: Check the memory-pressure regrading settings
  ansible.builtin.include_tasks: regrade.yml

- name: Check the k3s token is set
  ansible.builtin.include_tasks: k3s_token.yml

- name: Check the node's network mode, the host network's preconditions, and that moving the node between networks is safe now
  # Before anything changes on the host, and so before the mesh step, which starts the bootstrap server's Compose project itself with the headscale_in_cluster provider.
  ansible.builtin.include_tasks: host_network.yml

- name: Size this host's Colima VM from the inventory, one node at a time through the quorum guard
  # After the runtime is up and the topology decided, both of which the resize reads. See tasks/colima_size.yml.
  ansible.builtin.include_tasks: colima_size.yml

- name: Check the Compose files the node's .env names
  ansible.builtin.include_tasks: compose_files.yml

- name: Check this cluster's container names, API port and directory are its own on this host's Docker daemon
  # Before anything is written to the host, so that a second cluster set up with a name, port or directory another Compose project already uses fails here rather than halfway through. See tasks/instance_check.yml.
  ansible.builtin.include_tasks: instance_check.yml

- name: Create this host's Compose project directory
  # The kubeconfig directory is the connecting user's alone: the kubeconfig k3s writes into it holds the cluster's admin credentials, and is readable by others so that this user can read it where the container writes it as root (see --write-kubeconfig-mode in k3s/node-entrypoint.sh). fleet-role.d is the host's role directory, created empty, which docker-compose.fleet-role.yml mounts read-only into both services: whatever changes the host's role writes `role` and `join-url` into it, and the entrypoint reads them (an absent file changes nothing). Created on every host, so that it exists before any Compose command that mounts it, which would otherwise have Docker create it as root.
  ansible.builtin.file:
    path: "{{ github_runner_cluster_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "", mode: "0755"}
    - {path: k3s, mode: "0755"}
    - {path: kubeconfig, mode: "0700"}
    - {path: fleet-role.d, mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Record the role an eligible host runs in its role directory
  # Right after the directory exists, so that the role is on the host before any Compose command starts a node that reads it.
  ansible.builtin.include_tasks: docker_role_record.yml

- name: Place the collection's Compose file and k3s build context in it
  # Before the mesh step, since the headscale_in_cluster provider starts the bootstrap server's Compose project itself. Copied on every run, so a collection upgrade reaches the host. The entrypoint is bind-mounted read-only and run through /bin/sh, so its mode only matters to someone running it by hand.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ github_runner_cluster_dir }}/{{ item.src }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: docker-compose.yml, mode: "0644"}
    - {src: docker-compose.api-port.yml, mode: "0644"}
    - {src: docker-compose.node-labels.yml, mode: "0644"}
    - {src: docker-compose.fleet-role.yml, mode: "0644"}
    - {src: docker-compose.host-network.yml, mode: "0644"}
    - {src: k3s/Dockerfile, mode: "0644"}
    - {src: k3s/node-entrypoint.sh, mode: "0755"}

- name: Work out which Compose files a Compose command can name
  # Right after the files are placed and before any Compose command: under --check the placement above writes nothing.
  ansible.builtin.include_tasks: compose_files_in_use.yml

- name: Keep this node's password across container recreation
  # Before the mesh step, which can start the bootstrap server's Compose project, and before any Compose task below: the first recreate that mounts the node's password volume must find the password in it. See tasks/node_password.yml.
  ansible.builtin.include_tasks: node_password.yml

- name: Set up the mesh the nodes join, and publish its join key and control server
  # Must complete before either branch below templates .env, since env.j2 reads the mesh facts it publishes. See tasks/mesh/main.yml for the provider interface.
  ansible.builtin.include_tasks: mesh/main.yml

- name: Resolve this host's Docker context again for the Compose tasks below
  # community.docker.docker_compose_v2 defaults to unix:///var/run/docker.sock when neither docker_host nor cli_context is given, ignoring whatever context `docker` itself is actually configured to use, so a host running Colima (whose docker.sock lives under ~/.colima/default/, not /var/run) fails outright without a context. docker_context.yml takes the pinned github_runner_cluster_docker_context, or else reads the host's own current context rather than hardcoding "colima", since a Docker Desktop host would need "desktop-linux" instead. Again here, because the mesh step above resolves it for the Headscale host it delegates to, which may be another host.
  ansible.builtin.include_tasks: docker_context.yml

- name: Set up and start this host as a k3s server, bootstrapping or joining
  # By the role tasks/docker_role.yml decided, which for an eligible host is the one recorded on the host.
  when: github_runner_cluster_docker_role == "server"
  block:
    - name: Fail if this host isn't included in the fleet's own TLS SAN list
      # Only an overridden list can miss it, since the automatic one names every server. Checks the EFFECTIVE node name (github_runner_cluster_node_name if set, else inventory_hostname), not raw inventory_hostname: a host may deliberately override its own node name, and checking the wrong string here would incorrectly fail that host.
      ansible.builtin.fail:
        msg: >-
          This host's TLS SAN list does not include its own effective node
          name ({{ github_runner_cluster_effective_node_name }}). Every server
          needs every server's own hostname on its --tls-san list, including
          its own. Fix github_runner_cluster_tls_sans in
          host_vars/{{ inventory_hostname }}.yml, or remove it to use the
          automatic list.
      when: github_runner_cluster_effective_node_name not in (github_runner_cluster_effective_tls_sans | join(' '))

    - name: Template .env for this node
      # One .env for either role, holding both services' variables, so that a host whose role changes at run time has what the other service reads already; each service reads only its own, so the other's never changes its configuration.
      ansible.builtin.template:
        src: env.j2
        dest: "{{ github_runner_cluster_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Start the servers one at a time
      # See tasks/start_servers.yml for why, and for what a server's turn checks before Compose may recreate its container.
      ansible.builtin.include_tasks: start_servers.yml

    - name: Run the regrade service beside this server, or remove it
      ansible.builtin.include_tasks: regrade_service.yml

    - name: Run the role actuator's service, which switches this host for the role controller, or remove it
      ansible.builtin.include_tasks: role_actuator.yml

    - name: Check the runtime and this node's container are up
      ansible.builtin.include_tasks: end_checks.yml
      when: ansible_facts['system'] == 'Darwin'

- name: Join as a k3s agent
  when: github_runner_cluster_docker_role == "agent"
  block:
    - name: Template .env for this node
      ansible.builtin.template:
        src: env.j2
        dest: "{{ github_runner_cluster_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Start this agent with Docker Compose
      ansible.builtin.include_tasks: start_agent.yml

    - name: Remove the regrade service, which runs beside a server only
      # A host whose recorded role became agent may still run the service it ran as a server.
      ansible.builtin.include_tasks: regrade_service.yml

    - name: Check the runtime and this node's container are up
      ansible.builtin.include_tasks: end_checks.yml
      when: ansible_facts['system'] == 'Darwin'

    - name: Run the role actuator's service on an eligible agent, which the role controller may promote, or remove it
      ansible.builtin.include_tasks: role_actuator.yml

    - name: End the role here, since an agent host has no API of its own to wait on
      ansible.builtin.meta: end_role

- name: Wait for the API server to answer on this host's loopback, with the node on the host network
  # With github_runner_cluster_network_mode host nothing publishes the API server's port: the kubeconfig k3s writes (https://127.0.0.1:<port>) reaches it only if the port is the host's own, or, on a Docker VM, if the VM forwards it to the host as Lima does for Colima. Checked only when the role goes on to use that kubeconfig from the host, so a failure names the cause instead of surfacing as an unreachable API in a later task.
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ github_runner_cluster_api_port }}"
    timeout: 300
    msg: >-
      Nothing answers on 127.0.0.1:{{ github_runner_cluster_api_port }} on {{ inventory_hostname }}, so the kubeconfig k3s writes
      cannot reach the API server. With github_runner_cluster_network_mode host the port is not published; on a Docker VM it
      must be forwarded from the VM to the host (Colima forwards a port a container on the VM's host network listens on). Check
      the VM's port forwarding, or set github_runner_cluster_network_mode back to bridge.
  when:
    - github_runner_cluster_network_mode == 'host'
    - github_runner_cluster_wait_for_nodes | bool or github_runner_cluster_record_deployed_version | bool

- name: Give this host the kubernetes Python client before waiting on the API
  ansible.builtin.include_role:
    name: github_runner_k8s_client
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for the k3s node to register (an empty node list is still a successful API response)
  # default([]) on resources, not just a bare .resources access: the very first poll can hit the API before it's actually listening yet (the container has only just started), and that attempt's own result dict has no `resources` key at all. A bare access throws "object of type 'dict' has no attribute 'resources'" and aborts the whole `until` loop outright instead of retrying, even though the exact same module call succeeds moments later once the API is up.
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
  register: github_runner_cluster_nodes
  until: github_runner_cluster_nodes.resources | default([]) | length > 0
  retries: 60
  delay: 2
  when: github_runner_cluster_wait_for_nodes | bool

- name: Record the collection version this run applied on this host's own node
  ansible.builtin.include_tasks: record_deployed_state.yml
  when: github_runner_cluster_record_deployed_version | bool

- name: Wait for every node this run manages to report Ready, self-healing a stale node-password registration if any fails to rejoin
  ansible.builtin.include_tasks: wait_for_nodes.yml
  when: github_runner_cluster_wait_for_nodes | bool
