---
# Brings this host up as a k3s node under Docker Compose: a server (bootstrapping the cluster or joining it) or an agent, as tasks/topology.yml decides from the cluster group. Safe to rerun: the .env is templated and docker compose converges to it.

- name: Read this host's Docker Compose version
  # First, before anything that runs Compose (the mesh providers start Compose projects too), for the check below. The CLI plugin's own version, which no Docker context or daemon changes. Read-only, so it runs under --check as well.
  ansible.builtin.command: docker compose version --short
  changed_when: false
  check_mode: false
  register: github_runner_cluster_compose_version

- name: Fail if this host's Docker Compose recreates the containers it has just built
  # Compose 2.37.1 to 2.38.x build a service's image through Bake, key the build result by service name instead of image name, and so create the service's container without the com.docker.compose.image label (docker/compose#13047, fixed in 2.39.0). The next `up` sees that label differ from the image and recreates the container: every node restarts, and k3s with it, on the run after the one that built the k3s image. Releases before and after that range keep the container. An output with no version number in it fails too, rather than letting the check pass by default.
  vars:
    github_runner_cluster_compose_faulty_from: "2.37.1"
    github_runner_cluster_compose_fixed_in: "2.39.0"
    github_runner_cluster_compose_version_number: "{{ github_runner_cluster_compose_version.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  ansible.builtin.fail:
    msg: >-
      Docker Compose on this host reports version "{{ github_runner_cluster_compose_version.stdout | trim }}".
      Compose releases from {{ github_runner_cluster_compose_faulty_from }} up to but not including
      {{ github_runner_cluster_compose_fixed_in }} recreate every node container, restarting k3s, on the run after the one
      that built the k3s image (docker/compose#13047). Upgrade the Docker Compose
      plugin on this host to {{ github_runner_cluster_compose_fixed_in }} or later and run again.
  when: >-
    github_runner_cluster_compose_version.stdout is not search('[0-9]+\\.[0-9]+\\.[0-9]+')
    or (github_runner_cluster_compose_version_number is version(github_runner_cluster_compose_faulty_from, '>=')
        and github_runner_cluster_compose_version_number is version(github_runner_cluster_compose_fixed_in, '<'))

- name: Decide this host's part in the cluster
  ansible.builtin.include_tasks: topology.yml

- name: Fail if the k3s token is not set
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_k3s_token is not set. Set it from any source
      Ansible reads (ansible-vault, a lookup), or run a secrets adapter
      such as github_runner_secrets_onepassword first.
  when: github_runner_cluster_k3s_token | default('') | length == 0

- name: Create this host's Compose project directory
  ansible.builtin.file:
    path: "{{ github_runner_cluster_dir }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: ["", k3s, kubeconfig]

- name: Place the collection's Compose file and k3s build context in it
  # Before the mesh step, since the headscale_in_cluster provider starts the bootstrap server's Compose project itself. Copied on every run, so a collection upgrade reaches the host. The entrypoint is bind-mounted read-only and run through /bin/sh, so its mode only matters to someone running it by hand.
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ github_runner_cluster_dir }}/{{ item.src }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: docker-compose.yml, mode: "0644"}
    - {src: k3s/Dockerfile, mode: "0644"}
    - {src: k3s/node-entrypoint.sh, mode: "0755"}

- name: Set up the mesh the nodes join, and publish its join key and control server
  # Must complete before either branch below templates .env, since both env.j2 and env-agent.j2 read the mesh facts it publishes. See tasks/mesh/main.yml for the provider interface.
  ansible.builtin.include_tasks: mesh/main.yml

- name: Determine the active Docker CLI context
  # community.docker.docker_compose_v2 defaults to unix:///var/run/docker.sock when neither docker_host nor cli_context is given, ignoring whatever context `docker` itself is actually configured to use, so a host running Colima (whose docker.sock lives under ~/.colima/default/, not /var/run) fails outright without this. Read the host's own current context rather than hardcoding "colima", since a Docker Desktop host would need "desktop-linux" instead.
  # Empty when DOCKER_HOST is set: the module then takes the daemon from DOCKER_HOST itself, and rejects cli_context alongside it ("parameters are mutually exclusive: docker_host|cli_context", as on a Docker-in-Docker CI runner).
  ansible.builtin.shell: if [ -z "${DOCKER_HOST:-}" ]; then docker context show; fi
  changed_when: false
  # Read-only, and every docker_compose_v2 task below depends on its output, so it has to run under --check too: a skipped result leaves cli_context empty and the dry run targets the wrong daemon.
  check_mode: false
  register: github_runner_cluster_docker_context

- name: Set up and start this host as a k3s server, bootstrapping or joining
  when: github_runner_cluster_effective_node_role == "server"
  block:
    - name: Fail if this host isn't included in the fleet's own TLS SAN list
      # Only an overridden list can miss it, since the automatic one names every server. Checks the EFFECTIVE node name (github_runner_cluster_node_name if set, else inventory_hostname), not raw inventory_hostname: a host may deliberately override its own node name, and checking the wrong string here would incorrectly fail that host.
      ansible.builtin.fail:
        msg: >-
          This host's TLS SAN list does not include its own effective node
          name ({{ github_runner_cluster_effective_node_name }}). Every server
          needs every server's own hostname on its --tls-san list, including
          its own. Fix github_runner_cluster_tls_sans in
          host_vars/{{ inventory_hostname }}.yml, or remove it to use the
          automatic list.
      when: github_runner_cluster_effective_node_name not in (github_runner_cluster_effective_tls_sans | join(' '))

    - name: Template .env for this k3s server
      ansible.builtin.template:
        src: env.j2
        dest: "{{ github_runner_cluster_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Start k3s via docker compose (bootstrapping or joining, per this host's own .env)
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_dir }}"
        project_name: "{{ github_runner_cluster_compose_project }}"
        profiles: ["server"]
        cli_context: "{{ (github_runner_cluster_docker_context.stdout | trim) or omit }}"
        files: "{{ github_runner_cluster_compose_file_list if github_runner_cluster_compose_file_list | length > 1 else omit }}"
        state: present

- name: Join as a k3s agent
  when: github_runner_cluster_effective_node_role == "agent"
  block:
    - name: Template .env for the k3s agent
      ansible.builtin.template:
        src: env-agent.j2
        dest: "{{ github_runner_cluster_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Join the cluster as an agent
      community.docker.docker_compose_v2:
        project_src: "{{ github_runner_cluster_dir }}"
        project_name: "{{ github_runner_cluster_compose_project }}"
        profiles: ["agent"]
        cli_context: "{{ (github_runner_cluster_docker_context.stdout | trim) or omit }}"
        files: "{{ github_runner_cluster_compose_file_list if github_runner_cluster_compose_file_list | length > 1 else omit }}"
        state: present

    - name: End the role here, since an agent host has no API of its own to wait on
      ansible.builtin.meta: end_role

- name: Give this host the kubernetes Python client before waiting on the API
  ansible.builtin.include_role:
    name: github_runner_k8s_client
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for the k3s node to register (an empty node list is still a successful API response)
  # default([]) on resources, not just a bare .resources access: the very first poll can hit the API before it's actually listening yet (the container has only just started), and that attempt's own result dict has no `resources` key at all. A bare access throws "object of type 'dict' has no attribute 'resources'" and aborts the whole `until` loop outright instead of retrying, even though the exact same module call succeeds moments later once the API is up.
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
  register: github_runner_cluster_nodes
  until: github_runner_cluster_nodes.resources | default([]) | length > 0
  retries: 60
  delay: 2
  when: github_runner_cluster_wait_for_nodes | bool

- name: Wait for every node to report Ready, self-healing a stale server/agent node-password registration if any node fails to rejoin
  # /etc/rancher/node/password lives inside the joining container's own writable filesystem, not a persisted volume, so a fresh container (e.g. after docker compose --force-recreate) generates a brand-new random password, but a server that already owns the node-password Secret store still holds the PREVIOUS container's password for that node name (a kube-system/<node>.node-password.k3s Secret) and rejects the mismatched rejoin. See README's Non-obvious behaviour section; the same failure mode applies to a joining server's own container recreation, since it's the same k3s node-password mechanism regardless of join mode. Keyed on each host's effective node name (its github_runner_cluster_node_name override if set, else its inventory name, as tasks/topology.yml recorded it), since that, not the inventory name, is what k3s names the Node and its node-password Secret after. Only ever touches cluster members that are NOT the bootstrap host (as tasks/topology.yml decided it), and of those only the ones whose node is missing or not Ready: the bootstrap host owns the Secret store itself and fails Ready for entirely different reasons a stale-password wipe wouldn't fix anyway, and a Ready node's registration is not stale.
  when: github_runner_cluster_wait_for_nodes | bool
  block:
    - name: Wait for every node to report Ready
      # --all, not a --limit-scoped single node: once a server/agent has joined, this must wait for it too, not just this host's own control-plane node.
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
  rescue:
    - name: Read which nodes are Ready
      ansible.builtin.command:
        argv: [kubectl, get, nodes, -o, 'jsonpath={range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}']
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
      register: github_runner_cluster_node_readiness

    # Only the hosts whose node is missing or not Ready: clearing a Ready node's Node object makes the cluster evict every pod on it, so a single unreachable host must not take the registrations of healthy ones with it.
    - name: Pick the non-bootstrap hosts whose node has not rejoined
      ansible.builtin.set_fact:
        github_runner_cluster_rejoin_hosts: >-
          {{ github_runner_cluster_topology.hosts | dict2items | rejectattr('value.bootstrap')
             | rejectattr('value.node_name', 'in', github_runner_cluster_node_readiness.stdout_lines | select('search', ' True$') | map('split', ' ') | map('first') | list)
             | map(attribute='key') | list }}

    - name: Clear the stale node-password secret of each host that has not rejoined
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Secret
        namespace: kube-system
        name: "{{ github_runner_cluster_topology.hosts[item].node_name }}.node-password.k3s"
      loop: "{{ github_runner_cluster_rejoin_hosts }}"

    # Agents only. Deleting a server's Node object makes k3s remove that server's etcd member, and a removed member cannot rejoin on its own: its etcd refuses to start until its local datastore is cleared. The node-password Secret above is what a password mismatch needs; an agent's stale Node object is cleared as well so it re-registers cleanly.
    - name: Clear the stale Node object of each agent that has not rejoined, to match
      kubernetes.core.k8s:
        kubeconfig: "{{ github_runner_cluster_kubeconfig_path }}"
        state: absent
        kind: Node
        name: "{{ github_runner_cluster_topology.hosts[item].node_name }}"
      loop: "{{ github_runner_cluster_rejoin_hosts | select('in', github_runner_cluster_topology.hosts | dict2items | selectattr('value.role', 'equalto', 'agent') | map(attribute='key') | list) | list }}"

    - name: Retry waiting for every node to report Ready now that any stale registration is cleared
      ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=120s
      environment:
        KUBECONFIG: "{{ github_runner_cluster_kubeconfig_path }}"
      changed_when: false
