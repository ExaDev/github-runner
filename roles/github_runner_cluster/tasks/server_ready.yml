---
# Waits, through this server's own container, until its node reports Ready on a heartbeat from the container that was just started, for about github_runner_cluster_server_ready_timeout seconds. Ready alone is not enough: the API keeps the old container's Ready condition until the node controller's grace period runs out, so a wait for it can pass at once on state the recreated container has not yet confirmed, and the next server's turn would then recreate a server beside one that is still coming back. The node's lease (kube-node-lease/<node>) is renewed by the running kubelet, so a renewal later than the container's start is proof the new kubelet is alive. Each attempt is one read of both, followed by a short delay, so a container whose API has not started listening yet (the read fails at once) is retried at the same pace as one whose node has not registered; the retries are the timeout divided by an attempt and its delay, and the first attempt is not a retry. The run fails when the node does not come back, before the next server is touched.

- name: Read when this server's container started
  # Both timestamps are UTC, so their first nineteen characters (to the second) order as text.
  ansible.builtin.command:
    argv: [docker, inspect, --format, "{{ '{{' }}.State.StartedAt{{ '}}' }}", "{{ github_runner_cluster_node_container }}"]
  environment: "{{ github_runner_cluster_docker_cli_environment }}"
  register: github_runner_cluster_server_started
  changed_when: false
  check_mode: false

- name: Wait for this server's node to report Ready on a heartbeat from the recreated container
  vars:
    github_runner_cluster_ready_poll: 5
    github_runner_cluster_ready_read: "{{ github_runner_cluster_server_ready.stdout | default('') | split }}"
  ansible.builtin.shell: |
    set -eu
    ready=$(docker exec "$container" kubectl get node "$node" -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}')
    renewed=$(docker exec "$container" kubectl get lease --namespace kube-node-lease "$node" -o 'jsonpath={.spec.renewTime}')
    echo "${ready:-unknown} ${renewed:-none}"
  environment: "{{ github_runner_cluster_docker_cli_environment | combine({'container': github_runner_cluster_node_container, 'node': github_runner_cluster_effective_node_name}) }}"
  register: github_runner_cluster_server_ready
  until:
    - github_runner_cluster_server_ready.rc == 0
    - github_runner_cluster_ready_read | length == 2
    - github_runner_cluster_ready_read[0] == 'True'
    - github_runner_cluster_ready_read[1] is match('[0-9]{4}-[0-9]{2}-[0-9]{2}T')
    - github_runner_cluster_ready_read[1][:19] > (github_runner_cluster_server_started.stdout | trim)[:19]
  retries: "{{ ((github_runner_cluster_server_ready_timeout | int) / (2 * github_runner_cluster_ready_poll)) | round(0, 'ceil') | int }}"
  delay: "{{ github_runner_cluster_ready_poll }}"
  changed_when: false
  # A server that does not come back ends the play for every host, not just its own: the other servers' turns would otherwise carry on, and their check can read the old container's Ready condition for a while.
  any_errors_fatal: true
