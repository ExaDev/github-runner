---
# Decides this host's part in the cluster from the cluster group's inventory order and any per-host overrides (see defaults/main.yml), and publishes it as facts: github_runner_cluster_effective_node_role, github_runner_cluster_effective_bootstrap, github_runner_cluster_effective_server_url and github_runner_cluster_effective_tls_sans, plus github_runner_cluster_topology for the whole group. Every host computes the same result, since it depends only on inventory variables, never on which hosts --limit leaves in the play.

- name: Fail if this host is not in the cluster group
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is not in the inventory group
      '{{ github_runner_cluster_group }}' (github_runner_cluster_group).
      Every node of the cluster must be in that group, in the order that
      decides which hosts are servers.
  when: inventory_hostname not in (groups[github_runner_cluster_group] | default([]))

- name: Fail if the datastore is unknown
  ansible.builtin.fail:
    msg: github_runner_cluster_datastore is '{{ github_runner_cluster_datastore }}'; it must be etcd or sqlite.
  when: github_runner_cluster_datastore not in ['etcd', 'sqlite']

- name: Work out every host's part in the cluster
  # SQLite serves exactly one server, so it caps the automatic server count at one.
  ansible.builtin.set_fact:
    github_runner_cluster_topology: "{{ groups[github_runner_cluster_group] | exadev.github_runner.cluster_topology(hostvars, github_runner_cluster_max_servers if github_runner_cluster_datastore == 'etcd' else 1, github_runner_cluster_api_port) }}"

- name: Fail if a SQLite cluster would have more than one server
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_datastore is sqlite, which serves one server, but {{ github_runner_cluster_topology.servers | join(', ') }}
      would all be servers. Make all but one of them agents (github_runner_cluster_node_role: agent), or use etcd.
  when:
    - github_runner_cluster_datastore == 'sqlite'
    - github_runner_cluster_topology.servers | length > 1

- name: Fail if the cluster's servers and bootstrap host don't add up
  ansible.builtin.fail:
    msg: "{{ github_runner_cluster_topology.errors | join(' ') }}"
  when: github_runner_cluster_topology.errors | length > 0

- name: Fail if a native host would bootstrap a cluster that runs its own Headscale server
  # headscale_in_cluster's bootstrap server is supervised by k3s/node-entrypoint.sh, which starts k3s off the mesh, waits for the Headscale static pod, then restarts k3s on the mesh; a native server runs k3s straight from systemd with --vpn-auth and has no such supervisor, so it could never reach a control server that only it runs. Every host computes the same answer from the inventory.
  ansible.builtin.fail:
    msg: >-
      {{ github_runner_cluster_topology.bootstrap }} sets github_runner_cluster_node_mode: native and would bootstrap the cluster, but
      github_runner_cluster_mesh is headscale_in_cluster, whose bootstrap server runs the Headscale server as a static pod under a
      supervisor that only the Docker node has. Bootstrap from a Docker host (github_runner_cluster_bootstrap: true on it), or use
      another mesh provider. Nothing was changed.
  when:
    - github_runner_cluster_mesh == 'headscale_in_cluster'
    - github_runner_cluster_topology.bootstrap | length > 0
    - github_runner_cluster_topology.hosts[github_runner_cluster_topology.bootstrap].native | bool

- name: Record this host's own part
  ansible.builtin.set_fact:
    github_runner_cluster_effective_node_role: "{{ github_runner_cluster_topology.hosts[inventory_hostname].role }}"
    github_runner_cluster_effective_bootstrap: "{{ github_runner_cluster_topology.hosts[inventory_hostname].bootstrap }}"
    github_runner_cluster_effective_server_url: "{{ github_runner_cluster_topology.hosts[inventory_hostname].server_url }}"
    github_runner_cluster_effective_tls_sans: "{{ github_runner_cluster_topology.hosts[inventory_hostname].tls_sans }}"
