---
# macOS hosts only (main.yml includes it nowhere else). Makes the container runtime come back after a reboot, and stops the run, with a message that says what to do, when the runtime is not up. The node's own container already restarts with the runtime (restart: unless-stopped in docker-compose.yml), so the runtime is the only thing a reboot leaves stopped.
#
# On a Colima host with github_runner_cluster_runtime_autostart on, it starts the profile if it is stopped and installs the launchd job that starts it again after a reboot, either a per-user agent that starts it at every login (runtime_agent.yml: a property list in the connecting user's ~/Library/LaunchAgents, loaded into the user's login session, no become since a LaunchAgent belongs to the user whose login session loads it) or, for the profile that runs the node (github_runner_cluster_runtime_at_boot), a daemon that starts it when the Mac starts with nobody logged in (runtime_daemon.yml: a property list in /Library/LaunchDaemons, loaded into the system domain with become, running as the connecting user), which retires the agent of an earlier run. Docker Desktop cannot be started by the role, so there it only checks.
#
# On a Colima host it also makes the VM load br_netfilter and set the bridge sysctls now and at every VM boot (tasks/colima_kernel.yml), whatever the autostart setting says.
#
# Publishes github_runner_cluster_effective_runtime ({kind, colima_profile}), github_runner_cluster_runtime_colima_home, github_runner_cluster_runtime_environment (what docker and colima run with), github_runner_cluster_runtime_down_message and github_runner_cluster_runtime_up, for end_checks.yml.

- name: Read the connecting user and its environment
  # The user id the launchd domain is named after and the home directory the agent lives in. A caller that gathered facts already has both; one that did not (host_os.yml reads only the platform) gets just these two subsets.
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "!min"
      - user
      - env
  when: "'user_uid' not in ansible_facts or 'env' not in ansible_facts"

- name: Check when the Colima profile is to be started
  # Before anything changes. Not in meta/argument_specs.yml, which declares the native node's variables only.
  ansible.builtin.assert:
    that: github_runner_cluster_runtime_autostart_at in ['auto', 'login', 'boot']
    fail_msg: "github_runner_cluster_runtime_autostart_at must be auto, login or boot, not {{ github_runner_cluster_runtime_autostart_at | quote }}."
    quiet: true

- name: Work out which container runtime this host runs
  ansible.builtin.set_fact:
    github_runner_cluster_effective_runtime: >-
      {{ github_runner_cluster_docker_cli_context
         | exadev.github_runner.cluster_container_runtime(github_runner_cluster_runtime, github_runner_cluster_colima_profile) }}

- name: Read the Docker host of the Colima profile's context
  # Where the profile lives: Colima points the context at <COLIMA_HOME>/<profile>/docker.sock. Needed for the Colima home when github_runner_cluster_colima_home does not say, and by runtime_wedged.yml to prove that a profile it would stop is the one the Docker probe measured. Read-only and answered by the context file alone, so it works with the VM stopped and under --check. It runs with the environment of every other docker call, so it reads the same context store.
  ansible.builtin.command:
    argv: [docker, context, inspect, --format, "{{ '{{' }}.Endpoints.docker.Host{{ '}}' }}", "{{ github_runner_cluster_docker_cli_context }}"]
  environment: "{{ github_runner_cluster_docker_cli_environment | combine({'PATH': github_runner_cluster_runtime_path}) }}"
  register: github_runner_cluster_runtime_context_host
  changed_when: false
  check_mode: false
  when:
    - github_runner_cluster_effective_runtime.kind == 'colima'

- name: Work out the Colima home the profile lives in
  # The variable when a host sets it, else the one its Docker context names, empty for Colima's own default. Nothing outside Colima has one.
  ansible.builtin.set_fact:
    github_runner_cluster_runtime_colima_home: >-
      {{ github_runner_cluster_colima_home
         if (github_runner_cluster_colima_home | length > 0 or github_runner_cluster_effective_runtime.kind != 'colima')
         else (github_runner_cluster_runtime_context_host.stdout | exadev.github_runner.cluster_colima_home(github_runner_cluster_effective_runtime.colima_profile, ansible_facts['env']['HOME'])) }}

- name: Publish the environment and the failure message the runtime tasks use
  ansible.builtin.set_fact:
    # The PATH is what the agent gets too, so a run that works here is the run the agent repeats at login.
    github_runner_cluster_runtime_environment: >-
      {{ github_runner_cluster_docker_cli_environment | combine({'PATH': github_runner_cluster_runtime_path}, ({'COLIMA_HOME': github_runner_cluster_runtime_colima_home} if github_runner_cluster_runtime_colima_home | length > 0 else {})) }}
    github_runner_cluster_runtime_down_message: >-
      {{
        {
          'colima': 'Colima profile ' ~ github_runner_cluster_effective_runtime.colima_profile ~ ' is not running on ' ~ inventory_hostname ~ '. Start it with `colima start --profile ' ~ github_runner_cluster_effective_runtime.colima_profile ~ '`, or leave github_runner_cluster_runtime_autostart on so this role starts it and keeps it starting at login.',
          'docker_desktop': 'Docker Desktop is not running on ' ~ inventory_hostname ~ ', and this role cannot start it. Open Docker Desktop, and turn on Settings > General > Start Docker Desktop when you sign in to your computer so that it comes back after a reboot.',
          'other': 'The container runtime is not running on ' ~ inventory_hostname ~ ' (`docker info` failed). Start it, and set it to start at login so that it comes back after a reboot.'
        }[github_runner_cluster_effective_runtime.kind]
      }}

- name: Read whether the container runtime is up
  ansible.builtin.include_tasks: runtime_probe.yml

- name: Keep a Colima profile running across reboots
  when:
    - github_runner_cluster_effective_runtime.kind == 'colima'
    - github_runner_cluster_runtime_autostart | bool
  block:
    - name: Deal with a profile Colima lists as running while its runtime does not answer
      # A start would find such a profile running and do nothing. See runtime_wedged.yml for what is required before the VM is stopped.
      ansible.builtin.include_tasks: runtime_wedged.yml
      when: not github_runner_cluster_runtime_up | bool

    - name: Start the Colima profile if it is stopped
      # --activate=false keeps the profile from making its Docker context the host's current one, which the role promises never to change (see Docker contexts in the README). Starting a profile that already runs would do nothing, but this only runs when the runtime did not answer. Skipped under --check, which reports the start as skipped, not as a failure.
      ansible.builtin.command:
        argv: [colima, start, --profile, "{{ github_runner_cluster_effective_runtime.colima_profile }}", --activate=false]
      environment: "{{ github_runner_cluster_runtime_environment }}"
      changed_when: true
      when: not github_runner_cluster_runtime_up | bool

    - name: Keep the Colima profile starting at login, with a launchd agent
      ansible.builtin.include_tasks: runtime_agent.yml
      when: not github_runner_cluster_runtime_at_boot | bool

    - name: Keep the Colima profile starting at boot, with a launchd daemon
      ansible.builtin.include_tasks: runtime_daemon.yml
      when: github_runner_cluster_runtime_at_boot | bool

    - name: Read whether the container runtime is up now
      ansible.builtin.include_tasks: runtime_probe.yml

- name: Fail unless the container runtime is up
  # Not under --check: a check run that would have started the runtime has not started it, so the runtime still being down is no verdict on the host.
  ansible.builtin.fail:
    msg: "{{ github_runner_cluster_runtime_down_message }}"
  when:
    - not github_runner_cluster_runtime_up | bool
    - not ansible_check_mode

- name: Make the Colima VM load br_netfilter and set the bridge sysctls
  # After the failure above, so the VM answers (or this is a check run that would have started it, which has no VM to read yet). Whatever the autostart setting says: the node needs the module in the VM however the VM was started. See tasks/colima_kernel.yml.
  ansible.builtin.include_tasks: colima_kernel.yml
  when:
    - github_runner_cluster_effective_runtime.kind == 'colima'
    - github_runner_cluster_runtime_up | bool

- name: Install the default route guard in the Colima VM
  # A bridged interface that loses its link keeps default routes with a lower metric than the working one, which cuts the VM off. See tasks/colima_route_guard.yml.
  ansible.builtin.include_tasks: colima_route_guard.yml
  when:
    - github_runner_cluster_effective_runtime.kind == 'colima'
    - github_runner_cluster_runtime_up | bool
