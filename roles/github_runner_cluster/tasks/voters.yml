---
# Checks the settings of the role controller (github_runner_cluster_role_controller, github_runner_cluster_voters, github_runner_cluster_voter_eligible) before the role changes anything on the host. Run after the topology is known, because the target is held against github_runner_cluster_max_servers. Nothing is checked while the controller is off.

- name: Check the role controller's settings
  when: github_runner_cluster_role_controller | bool
  vars:
    github_runner_cluster_eligible_hosts: >-
      {{ groups[github_runner_cluster_group] | map('extract', hostvars)
         | selectattr('github_runner_cluster_voter_eligible', 'defined') | selectattr('github_runner_cluster_voter_eligible', 'equalto', true)
         | map(attribute='inventory_hostname') | list }}
  block:
    - name: Fail if the cluster has no etcd for the controller to move votes in
      ansible.builtin.assert:
        that: github_runner_cluster_datastore == 'etcd'
        quiet: true
        fail_msg: >-
          github_runner_cluster_role_controller is true, but github_runner_cluster_datastore is {{ github_runner_cluster_datastore }}, which has
          no etcd votes to move. Nothing was changed.

    - name: Fail unless the voter count is a whole number
      ansible.builtin.assert:
        that: github_runner_cluster_voters | string is match('^[1-9][0-9]*\\Z')
        quiet: true
        fail_msg: >-
          github_runner_cluster_voters is '{{ github_runner_cluster_voters }}'; it must be a whole number, the number of etcd voters the
          cluster is held at. Nothing was changed.

    - name: Fail if the voter count is even
      # An even member count tolerates no more failures than the odd count below it, and a tie cannot be broken.
      ansible.builtin.assert:
        that: github_runner_cluster_voters | int is odd
        quiet: true
        fail_msg: >-
          github_runner_cluster_voters is {{ github_runner_cluster_voters }}; it must be odd, since an even count of etcd voters tolerates
          no more failures than the odd count below it. Nothing was changed.

    - name: Fail if the voter count is under three
      # With fewer, losing one voter loses the majority.
      ansible.builtin.assert:
        that: github_runner_cluster_voters | int >= 3
        quiet: true
        fail_msg: >-
          github_runner_cluster_voters is {{ github_runner_cluster_voters }}; it must be at least 3, since with fewer the loss of one voter
          loses etcd's majority. Nothing was changed.

    - name: Fail if the voter count leaves a swap no place of headroom
      # A swap adds the new voter before it removes the old one, so the cluster briefly has one voter more than the target and needs a place for it.
      ansible.builtin.assert:
        that: github_runner_cluster_voters | int <= github_runner_cluster_max_servers | int - 1
        quiet: true
        fail_msg: >-
          github_runner_cluster_voters is {{ github_runner_cluster_voters }} and github_runner_cluster_max_servers is
          {{ github_runner_cluster_max_servers }}. A swap adds the new voter before it removes the old one, so the target can be at most
          one less than the most servers allowed ({{ github_runner_cluster_max_servers | int - 1 }}). Lower the target or raise
          github_runner_cluster_max_servers. Nothing was changed.

    - name: Fail if some hosts are eligible but fewer than the voter count
      # With no host eligible the controller only reports, so that a cluster can run it before choosing any host; once some are chosen, fewer than the target could never be held at it.
      ansible.builtin.assert:
        that: github_runner_cluster_eligible_hosts | length == 0 or github_runner_cluster_eligible_hosts | length >= github_runner_cluster_voters | int
        quiet: true
        fail_msg: >-
          {{ github_runner_cluster_eligible_hosts | length }} host(s) of {{ github_runner_cluster_group }} set github_runner_cluster_voter_eligible
          ({{ github_runner_cluster_eligible_hosts | join(', ') }}), fewer than github_runner_cluster_voters ({{ github_runner_cluster_voters }}).
          Mark at least that many, or none to have the controller only report. Nothing was changed.
