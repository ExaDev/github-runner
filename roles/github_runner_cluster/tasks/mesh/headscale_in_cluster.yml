---
# The headscale_in_cluster mesh provider: the role runs Headscale inside the cluster itself, as a static pod on the bootstrap server, published on that host's port so every node reaches it at github_runner_cluster_headscale_url. The bootstrap server's k3s starts off the mesh until Headscale answers and then restarts on it (k3s/node-entrypoint.sh, K3S_MESH_SELF_HOSTED_HEALTH_URL), and every other node joins through it. The control server lives on one node of the cluster it serves: see the role README for what that means for recovery, and playbooks/recover_in_cluster_mesh.yml. Its database lives on that node's k3s data volume, so the provider requires a Litestream replica (or an explicit acknowledgement of the risk), which the pod streams to and a rebuilt node restores from.

- name: Fail unless Headscale's state survives losing the bootstrap server's data volume
  ansible.builtin.fail:
    msg: >-
      headscale_in_cluster keeps Headscale's database on the bootstrap server's k3s data volume, and a static pod cannot use a
      replicated persistent volume instead (kubelet runs it with no API server to bind a claim). Configure a Litestream replica
      (github_runner_cluster_headscale_litestream_replica), or set github_runner_cluster_headscale_accept_node_local_state: true
      to accept that losing that volume loses every registration.
  when:
    - not github_runner_cluster_headscale_litestream | bool
    - not github_runner_cluster_headscale_accept_node_local_state | bool

- name: Decide where Headscale's files live on the bootstrap server
  ansible.builtin.set_fact:
    github_runner_cluster_headscale_host_name: "{{ github_runner_cluster_topology.bootstrap }}"
    github_runner_cluster_headscale_host_dir: >-
      {{ github_runner_cluster_headscale_dir or ((hostvars[github_runner_cluster_topology.bootstrap].github_runner_cluster_dir
         if hostvars[github_runner_cluster_topology.bootstrap].github_runner_cluster_dir is defined
         else hostvars[github_runner_cluster_topology.bootstrap].ansible_facts.env.HOME ~ '/' ~ github_runner_cluster_dir_name) ~ '/headscale'
         if github_runner_cluster_topology.bootstrap else '') }}

- name: Fail if the cluster group has no bootstrap server
  ansible.builtin.fail:
    msg: >-
      headscale_in_cluster runs Headscale on the cluster's bootstrap server, but no host in the cluster group bootstraps the
      cluster (every host joins a server outside the inventory). Use headscale_hosted or headscale_existing instead.
  when: github_runner_cluster_topology.bootstrap | length == 0

- name: Check the settings a self-run Headscale server needs
  ansible.builtin.include_tasks: mesh/headscale_server_checks.yml

- name: Take the join key already known, for the bootstrap server's first start
  # Supplied, or stored on the bootstrap server by an earlier run. Empty on the very first run: the bootstrap server then starts without one, and the keys step below creates it once Headscale answers.
  ansible.builtin.set_fact:
    github_runner_cluster_mesh_join_key: "{{ github_runner_cluster_headscale_join_key }}"
    github_runner_cluster_mesh_control_server_url: "{{ github_runner_cluster_headscale_url }}"
  no_log: true

- name: Run Headscale on the bootstrap server
  when: github_runner_cluster_effective_bootstrap | bool
  block:
    - name: Create Headscale's directories
      ansible.builtin.file:
        path: "{{ github_runner_cluster_headscale_host_dir }}/{{ item }}"
        state: directory
        mode: "{{ '0700' if item in ['secrets', 'litestream', 'keys'] else '0755' }}"
      loop: "{{ ['', 'config', 'manifests', 'secrets'] + (['litestream', 'keys'] if github_runner_cluster_headscale_litestream | bool else []) }}"

    - name: Read the stored join key
      ansible.builtin.slurp:
        src: "{{ github_runner_cluster_headscale_host_dir }}/secrets/join-key"
      register: github_runner_cluster_headscale_stored_join_key
      failed_when: false
      no_log: true

    - name: Use the stored join key if none was supplied
      ansible.builtin.set_fact:
        github_runner_cluster_mesh_join_key: "{{ github_runner_cluster_mesh_join_key or (github_runner_cluster_headscale_stored_join_key.content | default('') | b64decode | trim) }}"
      no_log: true

    - name: Write Headscale's configuration and policy
      ansible.builtin.template:
        src: "headscale/{{ item }}.j2"
        dest: "{{ github_runner_cluster_headscale_host_dir }}/config/{{ item }}"
        mode: "0644"
      loop: "{{ ['config.yaml', 'policy.hujson'] + (['derp.yaml'] if github_runner_cluster_headscale_derp_map | length > 0 else []) }}"
      register: github_runner_cluster_headscale_config_files

    - name: Write Litestream's configuration, environment, script and the server's keys
      ansible.builtin.include_tasks: mesh/headscale_litestream_files.yml
      vars:
        github_runner_cluster_headscale_server_dir: "{{ github_runner_cluster_headscale_host_dir }}"
        github_runner_cluster_headscale_server_key_files: >-
          {{ {'noise_private.key': github_runner_cluster_headscale_noise_private_key} if github_runner_cluster_headscale_noise_private_key | length > 0 else {} }}
      when: github_runner_cluster_headscale_litestream | bool

    - name: Write the Headscale static pod
      ansible.builtin.template:
        src: headscale/static-pod.yaml.j2
        dest: "{{ github_runner_cluster_headscale_host_dir }}/manifests/github-runner-headscale.yaml"
        mode: "0644"
      vars:
        # Litestream's files count too, so a changed replica or credential restarts the pod; their checksums, never their content.
        github_runner_cluster_headscale_config_checksum: >-
          {{ (github_runner_cluster_headscale_config_files.results
              + (github_runner_cluster_headscale_litestream_config.results | default([]))
              + [github_runner_cluster_headscale_litestream_script | default({})]
              + (github_runner_cluster_headscale_litestream_extra.results | default([])))
             | map(attribute='checksum', default='') | join('') | hash('sha1') }}

    - name: Write the bootstrap server's Compose override
      ansible.builtin.template:
        src: headscale/compose-in-cluster.yml.j2
        dest: "{{ github_runner_cluster_dir }}/docker-compose.mesh.yml"
        mode: "0644"

    - name: Determine the active Docker CLI context
      ansible.builtin.command: docker context show
      changed_when: false
      check_mode: false
      register: github_runner_cluster_docker_context

    - name: Ask whether Headscale answers inside the bootstrap server's k3s container
      ansible.builtin.command:
        argv: [docker, exec, "{{ github_runner_cluster_container_name }}", wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:9090/metrics"]
      changed_when: false
      failed_when: false
      check_mode: false
      register: github_runner_cluster_headscale_answers

    - name: Start the bootstrap server so that it can run Headscale
      # Only when Headscale is not already answering: on a running cluster, the server block in tasks/main.yml applies any change to .env the usual way.
      when: github_runner_cluster_headscale_answers.rc != 0
      block:
        - name: Template .env for the bootstrap server
          ansible.builtin.template:
            src: env.j2
            dest: "{{ github_runner_cluster_dir }}/.env"
            mode: "0600"
          no_log: true

        - name: Start k3s on the bootstrap server
          community.docker.docker_compose_v2:
            project_src: "{{ github_runner_cluster_dir }}"
            project_name: "{{ github_runner_cluster_compose_project }}"
            profiles: ["server"]
            cli_context: "{{ github_runner_cluster_docker_context.stdout | trim }}"
            files: "{{ github_runner_cluster_compose_file_list }}"
            state: present

    - name: Wait for Headscale to answer inside the bootstrap server's k3s container
      # First start: k3s starts off the mesh, kubelet pulls the Headscale image and starts the static pod.
      ansible.builtin.command:
        argv: [docker, exec, "{{ github_runner_cluster_container_name }}", wget, -q, -T, "5", -O, /dev/null, "http://127.0.0.1:9090/metrics"]
      changed_when: false
      check_mode: false
      register: github_runner_cluster_headscale_wait
      until: github_runner_cluster_headscale_wait.rc == 0
      retries: 120
      delay: 5

    - name: Read the running server's keys through the Litestream sidecar
      # The Headscale image has no shell or cat; the sidecar mounts the same state.
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ github_runner_cluster_container_name }}"
          - sh
          - -c
          - exec crictl exec "$(crictl ps -q --name '^litestream$' --state running | head -n 1)" cat "/var/lib/headscale/$1"
          - read-key
          - "{{ item }}"
      loop: "{{ ['noise_private.key'] + (['derp_server_private.key'] if github_runner_cluster_headscale_derp == 'embedded' else []) }}"
      changed_when: false
      check_mode: false
      no_log: true
      register: github_runner_cluster_headscale_live_key_reads
      until: github_runner_cluster_headscale_live_key_reads.rc == 0
      retries: 30
      delay: 2
      when: github_runner_cluster_headscale_litestream | bool

    - name: Fail if the running server's Noise key is not the one supplied
      # Changing it would cut every node off from the server, so it is never replaced here.
      ansible.builtin.fail:
        msg: >-
          github_runner_cluster_headscale_noise_private_key does not match the Noise key the in-cluster Headscale server is running
          with. Set it to that server's key ({{ github_runner_cluster_headscale_host_dir }}/keys/noise_private.key) or leave it empty.
      when:
        - github_runner_cluster_headscale_live_key_reads is not skipped
        - github_runner_cluster_headscale_noise_private_key | length > 0
        - github_runner_cluster_headscale_live_key_reads.results[0].stdout | trim != github_runner_cluster_headscale_noise_private_key | trim

    - name: Keep a copy of the running server's keys beside its configuration, for a rebuilt node's restore
      ansible.builtin.copy:
        dest: "{{ github_runner_cluster_headscale_host_dir }}/keys/{{ item.item }}"
        content: "{{ item.stdout }}"
        mode: "0600"
      loop: "{{ github_runner_cluster_headscale_live_key_reads.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true
      when: github_runner_cluster_headscale_live_key_reads is not skipped

- name: Keep the API key and join key for the Headscale server in the cluster
  ansible.builtin.include_tasks: mesh/headscale_server_keys.yml
  vars:
    # Runs the Headscale CLI inside the static pod's container, through the k3s container's own crictl. The script's own arguments ("$@") are the headscale subcommand and its flags.
    github_runner_cluster_headscale_cli:
      - docker
      - exec
      - "{{ github_runner_cluster_container_name }}"
      - sh
      - -c
      - exec crictl exec "$(crictl ps -q --name '^headscale$' --state running | head -n 1)" headscale "$@"
      - headscale

- name: Publish the headscale_in_cluster provider's join key and control server
  ansible.builtin.set_fact:
    github_runner_cluster_mesh_join_key: "{{ github_runner_cluster_headscale_join_key }}"
    github_runner_cluster_mesh_control_server_url: "{{ github_runner_cluster_headscale_url }}"
    github_runner_cluster_mesh_missing_key_hint: The Headscale server in the cluster did not produce a join key; see the output above.
  no_log: true
