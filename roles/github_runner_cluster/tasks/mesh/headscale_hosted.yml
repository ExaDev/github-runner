---
# The headscale_hosted mesh provider: the role runs a Headscale server under Docker Compose on one host (github_runner_cluster_headscale_host, by default the bootstrap server), outside k3s, so the control server never depends on the cluster it serves. It writes the server's configuration and policy (role-owned, see github_runner_cluster_headscale_policy), starts the pinned image, creates an API key with the server's own CLI, then goes through the same API steps as headscale_existing. With a Litestream replica configured, a sidecar streams the database to it, and github_runner_cluster_headscale_standby_host gets a warm standby that playbooks/promote_headscale_standby.yml can promote.

- name: Decide which hosts run Headscale and its standby
  ansible.builtin.include_tasks: mesh/headscale_hosted_hosts.yml

- name: Check the settings a self-run Headscale server needs
  ansible.builtin.include_tasks: mesh/headscale_server_checks.yml

- name: Run Headscale on its host
  ansible.builtin.include_tasks: mesh/headscale_hosted_server.yml
  vars:
    github_runner_cluster_headscale_server_host: "{{ github_runner_cluster_headscale_host_name }}"
    github_runner_cluster_headscale_server_dir: "{{ github_runner_cluster_headscale_host_dir }}"
    github_runner_cluster_headscale_project: "{{ github_runner_cluster_headscale_host_project }}"
    github_runner_cluster_headscale_server_compose_files: "{{ github_runner_cluster_headscale_host_compose_files }}"
    github_runner_cluster_headscale_as_standby: false
    github_runner_cluster_headscale_server_key_files: >-
      {{ {'noise_private.key': github_runner_cluster_headscale_noise_private_key} if github_runner_cluster_headscale_noise_private_key | length > 0 else {} }}

- name: Keep the API key and join key for the server this role runs
  ansible.builtin.include_tasks: mesh/headscale_server_keys.yml
  vars:
    github_runner_cluster_headscale_cli: ["docker", "exec", "{{ github_runner_cluster_headscale_host_project }}", "headscale"]

- name: Keep the warm standby in step with the server
  when: github_runner_cluster_headscale_standby_name | length > 0
  block:
    - name: Read the server's stored API key and join key
      ansible.builtin.slurp:
        src: "{{ github_runner_cluster_headscale_host_dir }}/secrets/{{ item }}"
      delegate_to: "{{ github_runner_cluster_headscale_host_name }}"
      run_once: true
      loop: [api-key, join-key]
      register: github_runner_cluster_headscale_primary_secrets
      failed_when: false
      no_log: true

    - name: Write the standby's project, which follows the replica with Headscale stopped
      ansible.builtin.include_tasks: mesh/headscale_hosted_server.yml
      vars:
        github_runner_cluster_headscale_server_host: "{{ github_runner_cluster_headscale_standby_name }}"
        github_runner_cluster_headscale_server_dir: "{{ github_runner_cluster_headscale_standby_dir }}"
        github_runner_cluster_headscale_project: "{{ github_runner_cluster_headscale_standby_project }}"
        github_runner_cluster_headscale_server_compose_files: "{{ github_runner_cluster_headscale_standby_compose_files }}"
        github_runner_cluster_headscale_as_standby: true
        # The running server's own keys, so the promoted server is the same server to every node.
        github_runner_cluster_headscale_server_key_files: "{{ github_runner_cluster_headscale_live_keys }}"

    - name: Give the standby the server's API key and join key, which the promoted server's database still recognises
      ansible.builtin.copy:
        dest: "{{ github_runner_cluster_headscale_standby_dir }}/secrets/{{ item.item }}"
        content: "{{ item.content | b64decode }}"
        mode: "0600"
      delegate_to: "{{ github_runner_cluster_headscale_standby_name }}"
      run_once: true
      loop: "{{ github_runner_cluster_headscale_primary_secrets.results | selectattr('content', 'defined') }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

- name: Publish the headscale_hosted provider's join key and control server
  ansible.builtin.set_fact:
    github_runner_cluster_mesh_join_key: "{{ github_runner_cluster_headscale_join_key }}"
    github_runner_cluster_mesh_control_server_url: "{{ github_runner_cluster_headscale_url }}"
    github_runner_cluster_mesh_missing_key_hint: The Headscale server the role runs did not produce a join key; see the output above.
  no_log: true
