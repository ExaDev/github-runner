---
# The tailscale provider's API half, included from tailscale.yml when a Tailscale API token is available. Ensures the tailnet's ACL grants the github-runner fleet's own cross-node pod traffic (see k3s-io/k3s#8372 - Tailscale evaluates a subnet-routed packet's actual embedded source IP, so a grant scoped to the node tag alone silently blocks pod-to-pod traffic), and that a reusable, pre-authorized join key exists for k3s's own --vpn-auth integration (see docker-compose.yml). Runs once per playbook invocation (run_once, delegate_to localhost): this is tailnet-wide, shared-account state, not per-host state.
#
# Surgical, never wholesale: this tailnet also carries other, unrelated rules for the account's own personal devices and other projects (confirmed live - the policy already has an autogroup:member/self grant and an unrelated tagged project predating this fleet). Every check below only ever adds a missing entry to the existing policy and writes the whole policy back; it never replaces it outright, and no-ops entirely once the entries already exist.

- name: Fetch the tailnet's current ACL policy
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/acl"
    method: GET
    url_username: "{{ github_runner_cluster_tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Accept: application/json
    return_content: true
  delegate_to: localhost
  no_log: true
  # A read-only GET, so safe under --check - and without it uri skips in check mode, leaving the next task nothing to compute the desired policy from.
  check_mode: false
  register: github_runner_cluster_acl_current

- name: Compute the ACL policy with the node tag's grant/tagOwner/autoApprover ensured
  # combine() on tagOwners/autoApprovers is naturally idempotent - re-adding an identical key/value is a no-op. The grant itself has no natural key to combine on, so it's appended only when an identical entry isn't already present (exact-list-equality on `src`, since this task always constructs the same literal list in the same order).
  ansible.builtin.set_fact:
    github_runner_cluster_acl_desired: >-
      {{
        github_runner_cluster_acl_current.json
        | combine({'tagOwners': (github_runner_cluster_acl_current.json.tagOwners | default({}) | combine({github_runner_cluster_mesh_tag: ['autogroup:admin']}))})
        | combine({'autoApprovers': (github_runner_cluster_acl_current.json.autoApprovers | default({}) | combine({'routes': (github_runner_cluster_acl_current.json.autoApprovers.routes | default({}) | combine({github_runner_cluster_pod_cidr: [github_runner_cluster_mesh_tag]}))}, recursive=True))}, recursive=True)
        | combine({'grants': (github_runner_cluster_acl_current.json.grants | default([]) + ([{'src': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'dst': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'ip': ['*']}] if ([{'src': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'dst': [github_runner_cluster_mesh_tag, github_runner_cluster_pod_cidr], 'ip': ['*']}] | difference(github_runner_cluster_acl_current.json.grants | default([])) | length > 0) else []))})
      }}
  no_log: true

- name: Push the updated ACL policy if the grant/tagOwner/autoApprover weren't already present
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/acl"
    method: POST
    url_username: "{{ github_runner_cluster_tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body: "{{ github_runner_cluster_acl_desired }}"
    status_code: [200]
  delegate_to: localhost
  no_log: true
  when: github_runner_cluster_acl_desired != github_runner_cluster_acl_current.json

# The API token itself has no equivalent bootstrap: creating one requires the Tailscale admin console (Settings -> Keys -> API access tokens), a one-time manual step with no API to automate it (this is inherent to token-based auth - you need a credential to create a credential). Store it as this item's own tailscale-api-token field once created.
#
# Key rotation on expiry is likewise still a manual trigger: this task only creates a NEW key when tailscale_join_key is genuinely empty, not when an existing one has expired (an expired key is still a non-empty string in 1Password, so this check alone can't detect it). If k3s's own vpn-auth integration starts failing to authenticate on a working fleet, check the key's expiry in the Tailscale admin console first: if it's expired, clear it wherever it is kept (the file at github_runner_cluster_join_key_path, or the 1Password item's tailscale-join-key field) and rerun.
- name: Create a reusable, pre-authorized Tailscale join key if one isn't already known
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/-/keys"
    method: POST
    url_username: "{{ github_runner_cluster_tailscale_api_token }}"
    url_password: ""
    force_basic_auth: true
    headers:
      Content-Type: application/json
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: true
            ephemeral: false
            preauthorized: true
            tags: ["{{ github_runner_cluster_mesh_tag }}"]
      # 90 days: comfortably under this tailnet's own observed maxKeyDuration (180 days), and short enough that a compromised key doesn't stay valid indefinitely - rotation itself is the manual step documented above.
      expirySeconds: 7776000
      description: "github-runner fleet vpn-auth join key (Ansible-managed)"
    status_code: [200]
  delegate_to: localhost
  no_log: true
  register: github_runner_cluster_tailscale_created_key
  # Only where the new key will be kept for the next run (see github_runner_cluster_join_key_path in defaults/main.yml): otherwise the key has to be supplied instead, and mesh/main.yml fails fast if it isn't.
  when:
    - github_runner_cluster_may_create_join_key | bool
    - github_runner_cluster_tailscale_join_key | length == 0

- name: Keep the new join key for the next run
  ansible.builtin.include_tasks: mesh/store_join_key.yml
  vars:
    github_runner_cluster_store_join_key_mesh: tailscale
    github_runner_cluster_store_join_key: "{{ github_runner_cluster_tailscale_created_key.json.key }}"
  when: github_runner_cluster_tailscale_created_key is not skipped

- name: Use the new join key in this run
  ansible.builtin.set_fact:
    github_runner_cluster_tailscale_join_key: "{{ github_runner_cluster_tailscale_created_key.json.key }}"
  no_log: true
  when: github_runner_cluster_tailscale_created_key is not skipped
