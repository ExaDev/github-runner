---
# The checks that close a native node's run, so that a converge that leaves the node down or on the wrong tailnet fails here instead of reporting success: the unit of the host's role is running, the other one is not, and the host's Tailscale client is on the cluster's tailnet; for an agent that was started or restarted, a server sees its node Ready on a heartbeat from the k3s just started (a server's turn has already waited for that, and for its etcd vote). Needs service.yml. A failure changes nothing on the host.

- name: Check the units and the node
  vars:
    # Seconds between reads, as tasks/server_ready.yml polls.
    github_runner_cluster_native_poll: 5
    github_runner_cluster_native_other_service: >-
      {{ github_runner_cluster_native_agent_service if github_runner_cluster_native_role == 'server' else github_runner_cluster_native_server_service }}
  block:
    - name: Read whether the unit of the host's role is running
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ github_runner_cluster_native_service }}"]
      register: github_runner_cluster_native_running
      until: github_runner_cluster_native_running.rc == 0
      retries: 6
      delay: 5
      changed_when: false
      failed_when: false

    - name: Fail unless the unit of the host's role is running
      ansible.builtin.fail:
        msg: "{{ github_runner_cluster_native_service }} is {{ github_runner_cluster_native_running.stdout | trim }} on {{ inventory_hostname }}."
      when: github_runner_cluster_native_running.rc != 0

    - name: Read whether the other unit is running
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ github_runner_cluster_native_other_service }}"]
      register: github_runner_cluster_native_other_running
      changed_when: false
      failed_when: false

    - name: Fail if the other unit is running too
      # Both units' conditions read the one role file, so this means something started a unit around them.
      ansible.builtin.fail:
        msg: >-
          {{ github_runner_cluster_native_other_service }} is running on {{ inventory_hostname }} beside {{ github_runner_cluster_native_service }},
          though the host's role file names {{ github_runner_cluster_native_role }}. Stop it with `systemctl disable --now
          {{ github_runner_cluster_native_other_service }}`.
      when: github_runner_cluster_native_other_running.rc == 0

    - name: Read which tailnet the host's Tailscale client is logged in to now
      become: true
      ansible.builtin.command:
        argv: ["{{ github_runner_cluster_native_tailscale_cli }}", status, --json, --peers=false]
      register: github_runner_cluster_native_tailscale_after
      # k3s's own `tailscale up` runs as the unit starts, so the client reaches the cluster's tailnet a moment after the unit is active.
      until: >-
        github_runner_cluster_native_tailscale_after.rc == 0
        and (github_runner_cluster_native_tailscale_after.stdout | exadev.github_runner.cluster_native_tailnet_login(github_runner_cluster_tailnet_domain)).state == 'cluster'
      retries: "{{ ((github_runner_cluster_native_ready_timeout | int) / (2 * github_runner_cluster_native_poll)) | round(0, 'ceil') | int }}"
      delay: "{{ github_runner_cluster_native_poll }}"
      changed_when: false
      failed_when: false

    - name: Fail unless the client is on the cluster's tailnet
      vars:
        github_runner_cluster_native_tailnet_after: >-
          {{ github_runner_cluster_native_tailscale_after.stdout | exadev.github_runner.cluster_native_tailnet_login(github_runner_cluster_tailnet_domain)
             if github_runner_cluster_native_tailscale_after.rc == 0 else {'state': 'not answering', 'domain': ''} }}
      ansible.builtin.fail:
        msg: >-
          The Tailscale client on {{ inventory_hostname }} is not on the cluster's tailnet {{ github_runner_cluster_tailnet_domain }}
          ({{ github_runner_cluster_native_tailnet_after.state }}, in {{ github_runner_cluster_native_tailnet_after.domain | default('no tailnet', true) }}).
          k3s runs `tailscale up` with the join key as it starts.
      when: >-
        github_runner_cluster_native_tailscale_after.rc != 0
        or (github_runner_cluster_native_tailscale_after.stdout | exadev.github_runner.cluster_native_tailnet_login(github_runner_cluster_tailnet_domain)).state != 'cluster'

    - name: Reach the cluster through a server of the inventory
      ansible.builtin.include_tasks: native/api.yml
      vars:
        github_runner_cluster_native_api_self: false
      when:
        - github_runner_cluster_native_role == 'agent'
        - github_runner_cluster_native_agent_started | bool

    - name: Say that no server of this inventory can confirm the node
      ansible.builtin.debug:
        msg: >-
          {{ github_runner_cluster_group }} bootstraps no cluster of its own, so no server of this inventory can confirm that
          {{ github_runner_cluster_effective_node_name }} is Ready; check it from the cluster that owns the servers.
      when:
        - github_runner_cluster_native_role == 'agent'
        - github_runner_cluster_native_agent_started | bool
        - github_runner_cluster_native_api_host | length == 0

    - name: Wait for a server to see this node Ready on a heartbeat from the k3s just started
      ansible.builtin.include_tasks: native/server_ready.yml
      when:
        - github_runner_cluster_native_role == 'agent'
        - github_runner_cluster_native_agent_started | bool
        - github_runner_cluster_native_api_host | length > 0
  rescue:
    - name: Fail with where to look
      ansible.builtin.fail:
        msg: >-
          {{ github_runner_cluster_effective_node_name }} did not come up as a node of the cluster within about
          {{ github_runner_cluster_native_ready_timeout }} seconds: {{ ansible_failed_result.msg | default('the last check failed') }}
          Read `journalctl -u {{ github_runner_cluster_native_service }}` on {{ inventory_hostname }}, and `kubectl get nodes` on a server.
