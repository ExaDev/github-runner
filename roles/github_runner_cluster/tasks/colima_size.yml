---
# Sizes this host's Colima VM from github_runner_cluster_colima_memory_gib and github_runner_cluster_colima_cpus (see their defaults). With neither set it reads and changes nothing. With either set it checks the values and that the host's runtime is a Colima profile, before anything is read, then reads the size of the profile's VM with `colima list --json` and works out what differs; a VM that already has every size set is left as it is, so a second run changes nothing. The hosts whose VM differs are then resized one at a time, each in its own turn (tasks/colima_size_turn.yml), in the same way tasks/start_servers.yml gives each server its turn: Ansible's linear strategy runs every host's copy of a task together, except that the tasks one host includes dynamically are its own, so while one host's turn runs the others wait and no two nodes are ever away together. Needs runtime.yml (the runtime and its environment) and topology.yml to have run. Under --check the values are checked and the size, the Lease and the cluster are read, a resize is reported as a change and a refusal as a failure, and nothing is changed.

- name: Check the sizes set for the Colima VM
  # On every host, so that a value colima could not take fails here, before a VM is stopped for it. Empty values keep the profile's own size.
  ansible.builtin.set_fact:
    github_runner_cluster_colima_size_wanted: >-
      {{ github_runner_cluster_colima_memory_gib | exadev.github_runner.cluster_colima_size(github_runner_cluster_colima_cpus) }}

- name: Fail unless this host's runtime is a Colima profile
  # The role sizes only a VM it can stop and start with colima; a size set for any other host would otherwise be ignored without a word.
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} sets github_runner_cluster_colima_memory_gib or github_runner_cluster_colima_cpus, but only a Colima profile can
      be resized, and this host's container runtime is
      {{ github_runner_cluster_effective_runtime.kind if ansible_facts['system'] == 'Darwin' else 'the Docker of a ' ~ ansible_facts['system'] ~ ' host' }}.
      Remove both from this host's variables. Nothing was changed.
  when:
    - github_runner_cluster_colima_size_wanted.arguments | length > 0
    - ansible_facts['system'] != 'Darwin' or github_runner_cluster_effective_runtime.kind != 'colima'

- name: Read the size of the profile's VM
  # The VM Lima runs, not the profile's configuration file, since a `colima start` given sizes while the profile runs writes them to the file and leaves the VM as it is (RunE and PreRunE in abiosoft/colima cmd/start.go). Read-only, so it runs under --check too.
  ansible.builtin.command:
    argv: [colima, list, --profile, "{{ github_runner_cluster_effective_runtime.colima_profile }}", --json]
  environment: "{{ github_runner_cluster_runtime_environment }}"
  register: github_runner_cluster_colima_size_listing
  changed_when: false
  check_mode: false
  when: github_runner_cluster_colima_size_wanted.arguments | length > 0

- name: Work out how the VM's size differs from the one set
  ansible.builtin.set_fact:
    github_runner_cluster_colima_size_plan: >-
      {{ (github_runner_cluster_colima_size_listing.stdout
          | exadev.github_runner.cluster_colima_resize(github_runner_cluster_effective_runtime.colima_profile,
                                                      github_runner_cluster_colima_memory_gib, github_runner_cluster_colima_cpus))
         if github_runner_cluster_colima_size_wanted.arguments | length > 0 else {'changes': [], 'arguments': []} }}

- name: Resize each host's VM in its own turn
  ansible.builtin.include_tasks: colima_size_turn.yml
  loop: "{{ ansible_play_hosts_all }}"
  loop_control:
    loop_var: github_runner_cluster_colima_size_turn
  when:
    - github_runner_cluster_colima_size_turn == inventory_hostname
    - github_runner_cluster_colima_size_plan.changes | length > 0
