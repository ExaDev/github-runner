---
# Checks the API port k3s servers listen on and every joining node dials (github_runner_cluster_api_port): it is a port number, and every host of the cluster group uses the same one. Shared by the Docker path (instance_check.yml) and the native node (native/main.yml). Read-only, so it runs under --check too.

- name: Fail if the API port is not a port number
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_api_port is '{{ github_runner_cluster_api_port }}'; it must be a whole number from 1 to 65535.
      Nothing was changed.
  when: >-
    (github_runner_cluster_api_port | string) is not match('^[1-9][0-9]*\\Z')
    or github_runner_cluster_api_port | int > 65535

- name: Fail if the hosts of the cluster group do not all use the same API port
  # Every joining node dials the bootstrap server at the port in its own join URL, which tasks/topology.yml builds from this host's value, so a host with another value would dial a port nothing listens on. Read for every host through hostvars, which never sees role defaults, so a host that sets nothing counts as the default.
  vars:
    github_runner_cluster_group_api_ports: >-
      {{ groups[github_runner_cluster_group] | map('extract', hostvars)
         | map(attribute='github_runner_cluster_api_port', default=github_runner_cluster_k3s_default_api_port) | map('string') | list }}
  ansible.builtin.fail:
    msg: >-
      The hosts of {{ github_runner_cluster_group }} do not all use the same github_runner_cluster_api_port
      ({{ groups[github_runner_cluster_group] | zip(github_runner_cluster_group_api_ports) | map('join', ': ') | join('; ') }}).
      It is the port every server listens on and every joining node dials, so set it once for the whole group. Nothing was changed.
  when: github_runner_cluster_group_api_ports | unique | length > 1
