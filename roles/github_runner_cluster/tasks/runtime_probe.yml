---
# Reads whether the container runtime this host's Docker context points at answers, and publishes github_runner_cluster_runtime_up. Read-only, so it runs under --check too. Needs github_runner_cluster_runtime_environment from runtime.yml. A daemon that is down is an answer here, not a failure: the callers decide what to do about it.

- name: Read whether the container runtime answers
  # Bounded by files/run_bounded.pl: a daemon that accepts the connection and never replies counts as not answering after github_runner_cluster_runtime_probe_timeout seconds, instead of holding the run.
  ansible.builtin.command:
    argv:
      - perl
      - -e
      - "{{ lookup('ansible.builtin.file', 'run_bounded.pl') }}"
      - "{{ github_runner_cluster_runtime_probe_timeout }}"
      - "{{ github_runner_cluster_runtime_kill_grace }}"
      - docker
      - info
      - --format
      - "{{ '{{' }}.ServerVersion{{ '}}' }}"
  environment: "{{ github_runner_cluster_runtime_environment }}"
  register: github_runner_cluster_runtime_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check that the supervisor could run docker info
  # files/run_bounded.pl exits 127 when it cannot start the command and 255 when it is misused, and the command module reports a perl it cannot start (missing, not executable) with the message "Error executing command" and an rc that is an OS error number. exadev.github_runner.cluster_supervisor_failed says which of these a result is. None of those is the command failing, so none counts as evidence about the VM: the run fails and names the supervisor.
  ansible.builtin.assert:
    that: not (github_runner_cluster_runtime_probe | exadev.github_runner.cluster_supervisor_failed)
    fail_msg: >-
      files/run_bounded.pl could not run docker info on {{ inventory_hostname }} (exit {{ github_runner_cluster_runtime_probe.rc }}): {{ github_runner_cluster_runtime_probe.msg | default(github_runner_cluster_runtime_probe.stderr | default('')) | trim }}.
      This is not a verdict on the runtime. perl must be on the PATH the role uses (github_runner_cluster_runtime_path), and the command must exist.
    quiet: true

- name: Publish whether the container runtime answers
  ansible.builtin.set_fact:
    github_runner_cluster_runtime_up: "{{ github_runner_cluster_runtime_probe.rc == 0 }}"
