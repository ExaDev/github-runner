---
# Gives the role actuator's watcher its credential, for tasks/role_actuator_watcher.yml (a native host) and tasks/role_actuator_docker.yml (a Docker host), each of which includes it only on a host whose watcher runs and outside --check: waits for the other server's API that role_actuator_api.yml, which the caller runs first, chose to serve, then applies through it the watcher's ServiceAccount, its scoped rules and its token Secret (templates/role-actuator-rbac.yaml.j2), creates the report ConfigMap the controller reads when there is none, writes a kubeconfig holding the token, mode 0600, by a task that logs nothing, and a file mapping every other server and eligible host's node name to the URL a promotion joins it at. A native host's files are root's; a Docker host's are the connecting user's, in its Compose project, which the role-actuator service's container mounts. Registers github_runner_cluster_role_actuator_kubeconfig_file and github_runner_cluster_role_actuator_join_urls for the caller's restart decision.

- name: Wait for that server's API to serve
  # The servers of a first run start together, and a server's kubectl has no kubeconfig until its own k3s has written one, so the API is read until it serves, for as long as the role waits for a server to be Ready.
  become: "{{ github_runner_cluster_native_api_become }}"
  ansible.builtin.command:
    argv: "{{ github_runner_cluster_native_api_argv + ['get', '--raw', '/readyz', '--request-timeout=' ~ github_runner_cluster_cluster_read_timeout ~ 's'] }}"
  environment: "{{ github_runner_cluster_native_api_environment }}"
  delegate_to: "{{ github_runner_cluster_native_api_host }}"
  register: github_runner_cluster_role_actuator_api_ready
  until:
    - github_runner_cluster_role_actuator_api_ready.rc == 0
    - github_runner_cluster_role_actuator_api_ready.stdout | trim == 'ok'
  retries: "{{ ((github_runner_cluster_server_ready_timeout | int) / github_runner_cluster_native_poll) | round(0, 'ceil') | int }}"
  delay: "{{ github_runner_cluster_native_poll }}"
  vars:
    # Seconds between reads, the pace every native wait polls at (tasks/native/server_ready.yml).
    github_runner_cluster_native_poll: 5
  changed_when: false

- name: Apply the watcher's ServiceAccount, its rules and its token Secret
  become: "{{ github_runner_cluster_native_api_become }}"
  ansible.builtin.command:
    # docker exec passes its standard input to kubectl only with --interactive, as tasks/colima_size_turn.yml gives it; k3s kubectl reads its own.
    # Server-side, because every host whose watcher runs applies the same objects in the same play: a server-side apply creates or updates each object in one request, where a client-side apply reads it first and then creates it, so two hosts that both read it absent would both create it and one would be refused as AlreadyExists.
    argv: >-
      {{ ((github_runner_cluster_native_api_argv[:2] + ['--interactive'] + github_runner_cluster_native_api_argv[2:])
          if github_runner_cluster_native_api_argv[0] == 'docker' else github_runner_cluster_native_api_argv)
         + ['apply', '--server-side', '--field-manager=' ~ github_runner_cluster_role_actuator_name, '--filename', '-'] }}
    stdin: "{{ lookup('ansible.builtin.template', 'role-actuator-rbac.yaml.j2') }}"
  environment: "{{ github_runner_cluster_native_api_environment }}"
  delegate_to: "{{ github_runner_cluster_native_api_host }}"
  register: github_runner_cluster_role_actuator_applied
  changed_when: github_runner_cluster_role_actuator_applied.stdout_lines | reject('search', ' unchanged$') | list | length > 0

- name: Create the report ConfigMap the controller reads, when there is none
  # Created rather than applied, since applying an empty one again would wipe the reports. Every host whose watcher runs creates it in the same play, so all but the first find it there, which is the state wanted: that one refusal passes. kubectl create prints a refusal from the server as `error: failed to create configmap: configmaps "<name>" already exists` (the API's AlreadyExists, which this subcommand words without its reason), so the refusal is told by that text naming this ConfigMap, and any other failure fails the run.
  become: "{{ github_runner_cluster_native_api_become }}"
  ansible.builtin.command:
    argv: >-
      {{ github_runner_cluster_native_api_argv + ['create', 'configmap', github_runner_cluster_role_actuator_configmap,
         '--namespace', github_runner_cluster_role_actuator_namespace] }}
  environment: "{{ github_runner_cluster_native_api_environment }}"
  delegate_to: "{{ github_runner_cluster_native_api_host }}"
  register: github_runner_cluster_role_actuator_configmap_created
  changed_when: github_runner_cluster_role_actuator_configmap_created.rc == 0
  failed_when:
    - github_runner_cluster_role_actuator_configmap_created.rc != 0
    - >-
      ('configmaps "' ~ github_runner_cluster_role_actuator_configmap ~ '" already exists')
      not in github_runner_cluster_role_actuator_configmap_created.stderr

- name: Read the watcher's token and the cluster's CA, once the token controller has filled them
  # Both base64, as the Secret holds them; the token is a secret, so nothing of this task is logged.
  become: "{{ github_runner_cluster_native_api_become }}"
  ansible.builtin.command:
    argv: >-
      {{ github_runner_cluster_native_api_argv + ['get', 'secret', github_runner_cluster_role_actuator_name ~ '-token',
         '--namespace', github_runner_cluster_role_actuator_namespace, '--request-timeout=' ~ github_runner_cluster_cluster_read_timeout ~ 's',
         '--output', 'jsonpath={.data.token} {.data.ca\.crt}'] }}
  environment: "{{ github_runner_cluster_native_api_environment }}"
  delegate_to: "{{ github_runner_cluster_native_api_host }}"
  register: github_runner_cluster_role_actuator_secret
  until:
    - github_runner_cluster_role_actuator_secret.rc == 0
    - github_runner_cluster_role_actuator_secret.stdout | trim | split(' ') | length == 2
  retries: "{{ ((github_runner_cluster_cluster_read_timeout | int) / github_runner_cluster_native_poll) | round(0, 'ceil') | int }}"
  delay: "{{ github_runner_cluster_native_poll }}"
  vars:
    # Seconds between reads, the pace every native wait polls at (tasks/native/server_ready.yml).
    github_runner_cluster_native_poll: 5
  changed_when: false
  no_log: true

- name: Write the watcher's kubeconfig
  # Its server is the first API candidate; the watcher passes the one that answers (KUBE_SERVERS in its settings) on every call.
  become: "{{ github_runner_cluster_node_mode == 'native' }}"
  ansible.builtin.copy:
    content: >-
      {{ {'apiVersion': 'v1', 'kind': 'Config', 'current-context': 'fleet',
          'clusters': [{'name': 'fleet', 'cluster': {'server': 'https://' ~ (github_runner_cluster_api_candidates | first).value.address ~ ':' ~ github_runner_cluster_api_port,
                                                     'certificate-authority-data': (github_runner_cluster_role_actuator_secret.stdout | trim | split(' '))[1]}}],
          'users': [{'name': github_runner_cluster_role_actuator_name, 'user': {'token': (github_runner_cluster_role_actuator_secret.stdout | trim | split(' '))[0] | b64decode}}],
          'contexts': [{'name': 'fleet', 'context': {'cluster': 'fleet', 'user': github_runner_cluster_role_actuator_name}}]} | to_nice_yaml }}
    dest: "{{ github_runner_cluster_role_actuator_kubeconfig }}"
    mode: "0600"
  no_log: true
  register: github_runner_cluster_role_actuator_kubeconfig_file

- name: Write the URL a promotion joins each other server and eligible host at
  become: "{{ github_runner_cluster_node_mode == 'native' }}"
  ansible.builtin.copy:
    content: |
      {% for candidate in github_runner_cluster_api_candidates %}
      {{ candidate.value.node_name }} https://{{ candidate.value.address }}:{{ github_runner_cluster_api_port }}
      {% endfor %}
    dest: "{{ github_runner_cluster_role_actuator_dir }}/join-urls"
    mode: "0644"
  register: github_runner_cluster_role_actuator_join_urls
