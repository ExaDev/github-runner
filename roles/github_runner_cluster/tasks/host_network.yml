---
# Before the role changes anything on the host: github_runner_cluster_network_mode must be bridge or host; with host, the Docker host must have an address on the LAN the nodes share (github_runner_cluster_lan_cidr) and no Tailscale device of another client on its network; and whenever the node's running container is on the other kind of network, Compose is about to recreate it, so the role first refuses unless the cluster stays safe without this node (plugins/filter/cluster_guard.py's cluster_restart_blockers): the other servers with a Ready node and a healthy etcd must still be a majority of all servers, and no ARC runner pod may be on this node. Whatever cannot be read refuses the move. Every task here only reads (the probe pulls its small image if the host lacks it); a failure changes nothing on the host.

- name: Fail if the node's network mode is not one the role knows
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_network_mode is '{{ github_runner_cluster_network_mode }}'; it must be bridge (Compose's own
      network, the default) or host (the Docker host's network). See the role's defaults for what each does.
  when: github_runner_cluster_network_mode not in ['bridge', 'host']

- name: Fail if the host network is asked for without the LAN it should be on
  ansible.builtin.fail:
    msg: >-
      github_runner_cluster_network_mode is host for {{ inventory_hostname }}, but github_runner_cluster_lan_cidr is empty.
      Set it to the LAN the nodes share, in CIDR notation (for example 192.0.2.0/24), so the role can check the Docker host
      has an address on it.
  when:
    - github_runner_cluster_network_mode == 'host'
    - github_runner_cluster_lan_cidr | trim | length == 0

- name: Read whether the node's container runs, and on which network
  # docker ps rather than docker inspect, so that a container that does not exist (a first run) reads as absent while a daemon that cannot be reached fails the run.
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --filter
      - "name=^/{{ github_runner_cluster_network_container }}$"
      - --format
      - "{{ '{{' }}.State{{ '}}' }} {{ '{{' }}.Networks{{ '}}' }}"
  environment: "{{ github_runner_cluster_docker_cli_environment }}"
  vars:
    github_runner_cluster_network_container: >-
      {{ github_runner_cluster_container_name if github_runner_cluster_effective_node_role == 'server' else 'github-runner-k3s-agent' }}
  register: github_runner_cluster_node_container
  changed_when: false
  check_mode: false

- name: Note whether the node's container runs, and whether on the host network
  # A container on the host network lists exactly one network, "host".
  ansible.builtin.set_fact:
    github_runner_cluster_network_running: "{{ (github_runner_cluster_node_container.stdout.split() | first | default('')) == 'running' }}"
    github_runner_cluster_network_on_host: "{{ (github_runner_cluster_node_container.stdout.split()[1:] | join(' ')) == 'host' }}"

- name: Note whether Compose is about to move a running node to the other network
  # Only when the running container is on the other kind of network than the one asked for, which is when Compose recreates it.
  ansible.builtin.set_fact:
    github_runner_cluster_network_switching: >-
      {{ github_runner_cluster_network_running | bool
         and (github_runner_cluster_network_on_host | bool) != (github_runner_cluster_network_mode == 'host') }}

- name: Read the Docker host's own IPv4 addresses and network devices
  # From a throwaway container on the host network: on macOS that is the Docker VM's network, which is where the node's Tailscale client looks for addresses to offer. Runs under --check too, since the checks below depend on it.
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, host, "{{ github_runner_cluster_network_probe_image }}", sh, -c, "ip -4 -o addr show && echo -- && ip -o link show"]
  environment: "{{ github_runner_cluster_docker_cli_environment }}"
  register: github_runner_cluster_host_network
  changed_when: false
  check_mode: false
  when: github_runner_cluster_network_mode == 'host'

- name: Fail if the Docker host has no address on the LAN
  vars:
    github_runner_cluster_host_addresses: "{{ github_runner_cluster_host_network.stdout.split('\n--\n') | first | split('\n') }}"
  ansible.builtin.fail:
    msg: >-
      The Docker host {{ inventory_hostname }}'s node would run on has no address in {{ github_runner_cluster_lan_cidr }}
      (its addresses: {{ github_runner_cluster_host_addresses | map('regex_search', 'inet [0-9./]+') | select | map('regex_replace', '^inet ', '') | join(', ') }}),
      so on the host network its Tailscale client would have nothing to offer its peers on the LAN. On macOS the Docker VM
      needs an address of its own on the LAN, which a Colima profile has only when it was created bridged (see the role
      README's Networking section for moving a node to one). Nothing was changed.
  when:
    - github_runner_cluster_network_mode == 'host'
    - github_runner_cluster_host_addresses | exadev.github_runner.addresses_in_network(github_runner_cluster_lan_cidr) | length == 0

- name: Fail if another Tailscale client already owns a device on the Docker host's network
  # The node's tailscaled creates tailscale0 and Tailscale's routing table, rules and firewall chains in the namespace it runs in. On the host network that namespace is the Docker host's: on a Linux machine with no VM, the machine's own, where its own Tailscale client may already run; on any Docker host, where a second node on the host network already runs one. Two clients there fight over the device and the routes. The node's own device is expected once it runs on the host network.
  vars:
    github_runner_cluster_host_devices: "{{ github_runner_cluster_host_network.stdout.split('\n--\n') | last | split('\n') | select('search', '^[0-9]+: tailscale[0-9]+[:@]') | list }}"
  ansible.builtin.fail:
    msg: >-
      The Docker host {{ inventory_hostname }}'s node would run on already has a Tailscale device on its network
      ({{ github_runner_cluster_host_devices | map('regex_replace', '^[0-9]+: ([^:@]+).*$', '\1') | join(', ') }}), which belongs to
      another Tailscale client: the host's own (on a Linux machine with no VM, the host network is the machine's own) or
      another node on the host network of the same Docker host. A node there would fight it over the device and the routes,
      so host mode needs a Docker host (a VM) of its own for the node. Nothing was changed.
  when:
    - github_runner_cluster_network_mode == 'host'
    - not (github_runner_cluster_network_running | bool and github_runner_cluster_network_on_host | bool)
    - github_runner_cluster_host_devices | length > 0

- name: Check that recreating the node on the other network is safe now
  when: github_runner_cluster_network_switching | bool
  block:
    - name: Refuse to move more than one node between networks in one run
      # Each host's checks read the cluster before any node is recreated, so two hosts moving in the same run would each count the other as healthy and could be recreated together.
      vars:
        github_runner_cluster_network_movers: >-
          {% for host in ansible_play_hosts if hostvars[host].github_runner_cluster_network_switching | default(false) | bool %}{{ host }} {% endfor %}
      ansible.builtin.fail:
        msg: >-
          This run would move {{ github_runner_cluster_network_movers | trim | split | join(', ') }} to another network at once, each
          recreating its node. Move one node at a time (--limit to one host). Nothing was changed.
      when: github_runner_cluster_network_movers | trim | split | length > 1

    - name: Read the cluster's nodes and this node's pods through each server of the inventory
      # Through the image's kubectl in each server's own container (as running_version.yml reads the cluster), this one first, each on its own host with its pinned Docker context, so the read needs no kubeconfig or published port on the host and no particular server to be up; each read is bounded by github_runner_cluster_cluster_read_timeout as a whole and as kubectl's --request-timeout. The first server that answers is the one the checks below use; plugins/filter/cluster_guard.py's cluster_guard_state says why for each when none does.
      ansible.builtin.shell: |
        set -eu
        nodes=$(docker exec "$container" kubectl get nodes --request-timeout="${timeout}s" -o json)
        pods=$(docker exec "$container" kubectl get pods --all-namespaces --request-timeout="${timeout}s" --field-selector "spec.nodeName=${node}" -o json)
        printf '{"nodes": %s, "pods": %s}\n' "$nodes" "$pods"
      environment: >-
        {{ ({'DOCKER_CONTEXT': github_runner_cluster_guard_context} if github_runner_cluster_guard_context | length > 0 else {})
           | combine({'container': github_runner_cluster_guard_container, 'node': github_runner_cluster_effective_node_name,
                      'timeout': github_runner_cluster_cluster_read_timeout | string}) }}
      delegate_to: "{{ item }}"
      loop: >-
        {{ ([inventory_hostname] if github_runner_cluster_effective_node_role == 'server' else [])
           + (github_runner_cluster_topology.hosts | dict2items | selectattr('value.role', 'equalto', 'server')
              | map(attribute='key') | reject('equalto', inventory_hostname) | list) }}
      vars:
        github_runner_cluster_guard_container: >-
          {{ github_runner_cluster_container_name if item == inventory_hostname
             else hostvars[item].github_runner_cluster_container_name | default('github-runner-k3s') }}
        github_runner_cluster_guard_context: >-
          {{ (github_runner_cluster_docker_context | default('') if item == inventory_hostname
              else hostvars[item].github_runner_cluster_docker_context | default('')) | trim }}
      register: github_runner_cluster_guard_reads
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      timeout: "{{ github_runner_cluster_cluster_read_timeout | int }}"

    - name: Fail if no server of the inventory could be read
      vars:
        github_runner_cluster_guard_read: "{{ github_runner_cluster_guard_reads.results | exadev.github_runner.cluster_guard_state }}"
      ansible.builtin.fail:
        msg: >-
          Not moving {{ github_runner_cluster_effective_node_name }} to the {{ github_runner_cluster_network_mode }} network,
          which recreates its container: {{ github_runner_cluster_guard_read.problem }} Nothing was changed.
      when: github_runner_cluster_guard_read.state is none

    - name: Read etcd's health through every other server's own API server
      # kubectl inside each server's container asks that server's API server, whose /readyz/etcd answers "ok" only while its etcd serves; on that host, with its pinned Docker context. Bounded like the reads above by github_runner_cluster_cluster_read_timeout, as a whole and as the API call's --request-timeout. A host that cannot be reached, or a read that fails or runs out of time, counts as unhealthy rather than failing here, so the refusal below names it.
      ansible.builtin.command:
        argv: [docker, exec, "{{ hostvars[item.key].github_runner_cluster_container_name | default('github-runner-k3s') }}", kubectl, get, "--request-timeout={{ github_runner_cluster_cluster_read_timeout | int }}s", --raw, /readyz/etcd]
      environment: >-
        {{ {'DOCKER_CONTEXT': hostvars[item.key].github_runner_cluster_docker_context}
           if hostvars[item.key].github_runner_cluster_docker_context | default('') | length > 0 else {} }}
      delegate_to: "{{ item.key }}"
      loop: >-
        {{ github_runner_cluster_topology.hosts | dict2items | selectattr('value.role', 'equalto', 'server')
           | rejectattr('key', 'equalto', inventory_hostname) | list }}
      loop_control:
        label: "{{ item.value.node_name }}"
      register: github_runner_cluster_guard_etcd
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      timeout: "{{ github_runner_cluster_cluster_read_timeout | int }}"
      when: github_runner_cluster_effective_node_role == 'server'

    - name: Refuse to recreate the node on the other network while the cluster needs it
      vars:
        github_runner_cluster_guard: "{{ (github_runner_cluster_guard_reads.results | exadev.github_runner.cluster_guard_state).state }}"
        github_runner_cluster_guard_blockers: >-
          {{ github_runner_cluster_guard.nodes
             | exadev.github_runner.cluster_restart_blockers(github_runner_cluster_guard.pods,
                                                             github_runner_cluster_effective_node_name,
                                                             github_runner_cluster_topology.hosts | dict2items
                                                             | selectattr('value.role', 'equalto', 'server')
                                                             | map(attribute='value.node_name') | list,
                                                             github_runner_cluster_guard_etcd.results | default([])) }}
      ansible.builtin.fail:
        msg: >-
          Not moving {{ github_runner_cluster_effective_node_name }} to the {{ github_runner_cluster_network_mode }} network,
          which recreates its container: {{ github_runner_cluster_guard_blockers | join(' ') }} Nothing was changed; run again
          once that has cleared.
      when: github_runner_cluster_guard_blockers | length > 0
