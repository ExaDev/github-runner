---
# Reached on a Colima host whose container runtime did not answer. A profile that Colima lists as stopped is only started (runtime.yml). A profile it lists as running is either booting, slow, or stuck, and a start does nothing for it, so the VM could stay down for ever. This file ends such a VM with colima stop, and only when every one of these holds:
#
# 1. github_runner_cluster_runtime_force_stop_wedged is on;
# 2. docker info still fails on every one of github_runner_cluster_runtime_probe_attempts further tries, each given github_runner_cluster_runtime_probe_timeout seconds (files/run_bounded.pl ends one that has not finished, with TERM and then KILL after github_runner_cluster_runtime_kill_grace seconds, so a program that ignores signals cannot hold the run) and github_runner_cluster_runtime_probe_delay seconds apart, so a host that is only loaded or a dockerd that is restarting answers somewhere in that window and nothing is stopped;
# 3. a command run in the guest (colima ssh -- true) fails within github_runner_cluster_runtime_probe_timeout seconds, so a guest that works while its Docker daemon does not is left alone;
# 4. the VM's host agent has been running for more than github_runner_cluster_runtime_boot_grace seconds, read from the elapsed time of the live process the pid file in the profile's Lima instance directory names (and only if the program it runs is Lima's host agent, named by the basename limactl and the argument hostagent), so a VM that is still booting is left alone. A missing file, a dead pid, another program or an unreadable time means the agent's age is unknown and does not count as old, whatever the file's date;
# 5. the Docker context the probes used can be read and points at the socket of the profile that would be stopped (<colima home>/<profile>/docker.sock), so a failing probe of one runtime never stops another's VM and a context that cannot be read never proves anything.
#
# The stop is first a clean one (colima stop), given github_runner_cluster_runtime_clean_stop_timeout seconds, and a forced one (colima stop --force, which ends the VM without a graceful shutdown) only when that fails. Either way the VM's disk is kept and nothing is removed, so the start that follows boots it from the same disk. When any condition fails, or the switch is off, the run fails here and says which signals it saw and how to recover. Under --check every read is made and nothing is stopped; the report says what a real run would do.
#
# Needs github_runner_cluster_runtime_environment and github_runner_cluster_runtime_colima_home from runtime.yml; it reads the context's endpoint itself, because a host that names its Colima home may have no context to read.

- name: Read whether Colima lists the profile as running
  # colima list prints one JSON object per profile, whatever profile is asked for.
  ansible.builtin.command:
    argv: [colima, list, --json]
  environment: "{{ github_runner_cluster_runtime_environment }}"
  register: github_runner_cluster_runtime_colima_list
  changed_when: false
  check_mode: false

- name: Note whether the profile is listed as running
  ansible.builtin.set_fact:
    github_runner_cluster_runtime_listed_running: >-
      {{ github_runner_cluster_runtime_colima_list.stdout_lines | map('from_json')
         | selectattr('name', 'equalto', github_runner_cluster_effective_runtime.colima_profile)
         | selectattr('status', 'equalto', 'Running') | list | length > 0 }}

- name: Look into a profile that is listed as running
  when: github_runner_cluster_runtime_listed_running | bool
  block:
    - name: Ask the Docker daemon again, a bounded number of times
      # files/run_bounded.pl bounds each try: macOS has no timeout command, docker info has no timeout of its own, and a timer set before exec does not stop a Go program (docker, colima), which ignores SIGALRM.
      ansible.builtin.command:
        argv:
          - perl
          - -e
          - "{{ lookup('ansible.builtin.file', 'run_bounded.pl') }}"
          - "{{ github_runner_cluster_runtime_probe_timeout }}"
          - "{{ github_runner_cluster_runtime_kill_grace }}"
          - docker
          - info
          - --format
          - "{{ '{{' }}.ServerVersion{{ '}}' }}"
      environment: "{{ github_runner_cluster_runtime_environment }}"
      register: github_runner_cluster_runtime_reprobe
      changed_when: false
      failed_when: false
      check_mode: false
      # A supervisor that cannot run ends the loop at once: the check below fails the run.
      until: github_runner_cluster_runtime_reprobe.rc == 0 or github_runner_cluster_runtime_reprobe | exadev.github_runner.cluster_supervisor_failed
      retries: "{{ github_runner_cluster_runtime_probe_attempts | int - 1 }}"
      delay: "{{ github_runner_cluster_runtime_probe_delay }}"

    - name: Check that the supervisor could run docker info
      # files/run_bounded.pl exits 127 when it cannot start the command and 255 when it is misused, and the command module reports a perl it cannot start (missing, not executable) with the message "Error executing command" and an rc that is an OS error number. exadev.github_runner.cluster_supervisor_failed says which of these a result is. None of those is the command failing, so none counts as evidence about the VM: the run fails and names the supervisor.
      ansible.builtin.assert:
        that: not (github_runner_cluster_runtime_reprobe | exadev.github_runner.cluster_supervisor_failed)
        fail_msg: >-
          files/run_bounded.pl could not run docker info on {{ inventory_hostname }} (exit {{ github_runner_cluster_runtime_reprobe.rc }}): {{ github_runner_cluster_runtime_reprobe.msg | default(github_runner_cluster_runtime_reprobe.stderr | default('')) | trim }}.
          This is not a verdict on the runtime. perl must be on the PATH the role uses (github_runner_cluster_runtime_path), and the command must exist.
        quiet: true

    - name: Note that the runtime answered after all
      ansible.builtin.set_fact:
        github_runner_cluster_runtime_up: true
      when: github_runner_cluster_runtime_reprobe.rc == 0

    - name: Gather the other signals while the runtime stays silent
      when: github_runner_cluster_runtime_reprobe.rc != 0
      block:
        - name: Run a command in the guest
          ansible.builtin.command:
            argv:
              - perl
              - -e
              - "{{ lookup('ansible.builtin.file', 'run_bounded.pl') }}"
              - "{{ github_runner_cluster_runtime_probe_timeout }}"
              - "{{ github_runner_cluster_runtime_kill_grace }}"
              - colima
              - ssh
              - --profile
              - "{{ github_runner_cluster_effective_runtime.colima_profile }}"
              - --
              - "true"
          environment: "{{ github_runner_cluster_runtime_environment }}"
          register: github_runner_cluster_runtime_guest
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Check that the supervisor could run a command in the guest
          # files/run_bounded.pl exits 127 when it cannot start the command and 255 when it is misused, and the command module reports a perl it cannot start (missing, not executable) with the message "Error executing command" and an rc that is an OS error number. exadev.github_runner.cluster_supervisor_failed says which of these a result is. None of those is the command failing, so none counts as evidence about the VM: the run fails and names the supervisor.
          ansible.builtin.assert:
            that: not (github_runner_cluster_runtime_guest | exadev.github_runner.cluster_supervisor_failed)
            fail_msg: >-
              files/run_bounded.pl could not run a command in the guest on {{ inventory_hostname }} (exit {{ github_runner_cluster_runtime_guest.rc }}): {{ github_runner_cluster_runtime_guest.msg | default(github_runner_cluster_runtime_guest.stderr | default('')) | trim }}.
              This is not a verdict on the runtime. perl must be on the PATH the role uses (github_runner_cluster_runtime_path), and the command must exist.
            quiet: true

        - name: Read the Docker host of the context the probes used
          # On its own and allowed to fail: a host whose context says nothing about a Colima socket (DOCKER_HOST, an empty or unknown context) sets github_runner_cluster_colima_home and may have no context to read. An unreadable context means the socket is not proven to be this profile's, so nothing is stopped.
          ansible.builtin.command:
            argv: [docker, context, inspect, --format, "{{ '{{' }}.Endpoints.docker.Host{{ '}}' }}", "{{ github_runner_cluster_docker_cli_context }}"]
          environment: "{{ github_runner_cluster_docker_cli_environment | combine({'PATH': github_runner_cluster_runtime_path}) }}"
          register: github_runner_cluster_runtime_context_endpoint
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Find the VM's host agent pid file
          # Colima keeps one Lima instance per profile under <colima home>/_lima: colima for the default profile, colima-<profile> for another.
          ansible.builtin.slurp:
            src: >-
              {{ (github_runner_cluster_runtime_colima_home if github_runner_cluster_runtime_colima_home | length > 0 else ansible_facts['env']['HOME'] ~ '/.colima')
              ~ '/_lima/' ~ ('colima' if github_runner_cluster_effective_runtime.colima_profile == 'default' else 'colima-' ~ github_runner_cluster_effective_runtime.colima_profile)
              ~ '/ha.pid' }}
          register: github_runner_cluster_runtime_agent_pid
          failed_when: false

        - name: Read the live process the pid file names
          # A pid file can outlive the process (a reboot, a crash), so the age is the running process's own: its elapsed time, and only when its command is Lima's host agent.
          ansible.builtin.command:
            argv: [ps, -o, etime=, -o, command=, -p, "{{ (github_runner_cluster_runtime_agent_pid.content | b64decode | trim) if github_runner_cluster_runtime_agent_pid.content is defined else '0' }}"]
          register: github_runner_cluster_runtime_agent_process
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Work out what the signals say
          vars:
            # ps prints [[days-]hours:]minutes:seconds, then the command. Anything else, a dead pid or another program leaves the age unknown (-1).
            github_runner_cluster_runtime_agent_words: "{{ github_runner_cluster_runtime_agent_process.stdout | trim | split(None, 1) }}"
          ansible.builtin.set_fact:
            github_runner_cluster_runtime_agent_age: >-
              {%- set words = github_runner_cluster_runtime_agent_words -%}
              {%- if github_runner_cluster_runtime_agent_process.rc == 0 and words | length == 2 and words[1].split()[0].split('/')[-1] == 'limactl' and 'hostagent' in words[1].split()[1:] and words[0] is match('^([0-9]+-)?([0-9]+:)?[0-9]+:[0-9]+$') -%}
              {%- set days_and_rest = words[0].split('-') -%}
              {%- set days = days_and_rest[0] | int if days_and_rest | length > 1 else 0 -%}
              {%- set parts = (days_and_rest[-1].split(':') | map('int') | list) -%}
              {%- set clock = parts[-1] + 60 * parts[-2] + (3600 * parts[-3] if parts | length > 2 else 0) -%}
              {{ days * 86400 + clock }}
              {%- else -%}-1{%- endif -%}
            github_runner_cluster_runtime_context_socket_ok: >-
              {{ github_runner_cluster_runtime_context_endpoint.rc == 0
                 and github_runner_cluster_runtime_context_endpoint.stdout | trim
                 == 'unix://' ~ (github_runner_cluster_runtime_colima_home if github_runner_cluster_runtime_colima_home | length > 0 else ansible_facts['env']['HOME'] ~ '/.colima')
                    ~ '/' ~ github_runner_cluster_effective_runtime.colima_profile ~ '/docker.sock' }}

        - name: Decide whether the VM is wedged
          ansible.builtin.set_fact:
            github_runner_cluster_runtime_wedged: >-
              {{ github_runner_cluster_runtime_guest.rc != 0
                 and github_runner_cluster_runtime_agent_age | int > github_runner_cluster_runtime_boot_grace | int
                 and github_runner_cluster_runtime_context_socket_ok | bool }}
            github_runner_cluster_runtime_wedged_report: >-
              Colima lists profile {{ github_runner_cluster_effective_runtime.colima_profile }} as running, but docker info failed on {{ github_runner_cluster_runtime_probe_attempts }} tries
              {{ github_runner_cluster_runtime_probe_delay }} seconds apart; a command in the guest {{ 'failed' if github_runner_cluster_runtime_guest.rc != 0 else 'succeeded' }};
              the VM's host agent has been running {{ 'for more than ' ~ github_runner_cluster_runtime_boot_grace ~ ' seconds' if github_runner_cluster_runtime_agent_age | int > github_runner_cluster_runtime_boot_grace | int
              else ('for less than ' ~ github_runner_cluster_runtime_boot_grace ~ ' seconds' if github_runner_cluster_runtime_agent_age | int >= 0 else 'for a time that could not be read') }};
              the Docker context {{ 'points at the socket of the profile' if github_runner_cluster_runtime_context_socket_ok | bool else ('could not be read, so its socket is not proven to belong to the profile' if github_runner_cluster_runtime_context_endpoint.rc != 0 else 'does not point at the socket of the profile') }}.

        - name: Say what a real run would do
          ansible.builtin.debug:
            msg: >-
              {{ github_runner_cluster_runtime_wedged_report }}
              {{ 'A real run would stop the profile (colima stop, then colima stop --force if that fails) and start it again.'
                 if github_runner_cluster_runtime_wedged | bool and github_runner_cluster_runtime_force_stop_wedged | bool
                 else 'A real run would stop nothing and fail here.' }}
          changed_when: github_runner_cluster_runtime_wedged | bool and github_runner_cluster_runtime_force_stop_wedged | bool
          when: ansible_check_mode

        - name: Fail where the VM is not shown to be wedged or the stop is off
          ansible.builtin.fail:
            msg: >-
              {{ github_runner_cluster_runtime_wedged_report }}
              {{ 'Nothing was stopped, because ' ~ ('github_runner_cluster_runtime_force_stop_wedged is off.'
                 if github_runner_cluster_runtime_wedged | bool
                 else 'the signals do not show a wedged VM (a VM that is still booting, or whose guest works, is left alone).') }}
              To recover by hand: colima stop --profile {{ github_runner_cluster_effective_runtime.colima_profile }} --force, then colima start --profile {{ github_runner_cluster_effective_runtime.colima_profile }}.
          when:
            - not ansible_check_mode
            - not (github_runner_cluster_runtime_wedged | bool and github_runner_cluster_runtime_force_stop_wedged | bool)

        - name: Stop the wedged profile cleanly
          ansible.builtin.command:
            argv:
              - perl
              - -e
              - "{{ lookup('ansible.builtin.file', 'run_bounded.pl') }}"
              - "{{ github_runner_cluster_runtime_clean_stop_timeout }}"
              - "{{ github_runner_cluster_runtime_kill_grace }}"
              - colima
              - stop
              - --profile
              - "{{ github_runner_cluster_effective_runtime.colima_profile }}"
          environment: "{{ github_runner_cluster_runtime_environment }}"
          register: github_runner_cluster_runtime_clean_stop
          changed_when: true
          failed_when: false
          when: not ansible_check_mode

        - name: Check that the supervisor could run colima stop
          # files/run_bounded.pl exits 127 when it cannot start the command and 255 when it is misused, and the command module reports a perl it cannot start (missing, not executable) with the message "Error executing command" and an rc that is an OS error number. exadev.github_runner.cluster_supervisor_failed says which of these a result is. None of those is the command failing, so none counts as evidence about the VM: the run fails and names the supervisor.
          ansible.builtin.assert:
            that: not (github_runner_cluster_runtime_clean_stop | exadev.github_runner.cluster_supervisor_failed)
            fail_msg: >-
              files/run_bounded.pl could not run colima stop on {{ inventory_hostname }} (exit {{ github_runner_cluster_runtime_clean_stop.rc }}): {{ github_runner_cluster_runtime_clean_stop.msg | default(github_runner_cluster_runtime_clean_stop.stderr | default('')) | trim }}.
              This is not a verdict on the runtime. perl must be on the PATH the role uses (github_runner_cluster_runtime_path), and the command must exist.
            quiet: true
          when: not ansible_check_mode

        - name: Stop the wedged profile without a graceful shutdown, since the clean stop failed
          # colima stop --force ends the VM without a graceful shutdown (colima stop --help: "stop without graceful shutdown"): every process in the guest, k3s and etcd included, is killed. The VM's disk and everything on it are kept.
          ansible.builtin.command:
            argv: [colima, stop, --profile, "{{ github_runner_cluster_effective_runtime.colima_profile }}", --force]
          environment: "{{ github_runner_cluster_runtime_environment }}"
          changed_when: true
          when:
            - not ansible_check_mode
            - github_runner_cluster_runtime_clean_stop.rc != 0
