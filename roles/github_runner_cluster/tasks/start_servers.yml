---
# Starts this play's k3s servers (the hosts whose role is server, tasks/docker_role.yml) one at a time, from the server hosts' own runs, in no fixed order. A server's container is recreated when its Compose configuration changed, which stops its etcd member, so the servers take turns: each turn (tasks/start_server.yml) refuses to recreate a running server unless every other server reports Ready, and waits for a recreated server to be Ready again before the next one starts. This relies on Ansible's linear strategy, the default, where every host takes the same task together, except that tasks a host includes dynamically are its own copies: the tasks one turn includes run for that host alone while the others wait, so no two servers are ever away together. Which server goes first is the order the hosts' results arrive in, not the inventory's, and nothing here depends on it: a joining server's Compose start does not wait for the bootstrap server. Hosts outside the play (--limit) take no turn.

- name: Give each server its turn to start
  ansible.builtin.include_tasks: start_server.yml
  # Every host of the play whose role is server by tasks/docker_role.yml, which for an eligible host is the role recorded on it rather than the inventory's list of servers. A host that failed before deciding its role has none, and takes no turn, as it would not have run one.
  loop: >-
    {{ ansible_play_hosts_all
       | select('in', hostvars | dict2items | selectattr('value.github_runner_cluster_docker_role', 'defined')
                      | selectattr('value.github_runner_cluster_docker_role', 'equalto', 'server') | map(attribute='key') | list)
       | list }}
  loop_control:
    loop_var: github_runner_cluster_turn
  when: github_runner_cluster_turn == inventory_hostname
